# North star — potential future development
# Brainstormed 2026-09-11 in the discovery interview. Everything here is a CANDIDATE: logged so it is not
# lost, not committed to. None of it is v1. Ideas already recorded as north star elsewhere are cross-referenced
# rather than duplicated (taint tracing D10, layer rules D16, annotations X9, graph diff X2, HTTP transport X8,
# CFG / remaining PDG (CDG/DOMINATE) / expression tier in 10-graph-engine.yaml deferred_layers;
# sparse REACHING_DEF is in v1 as of 2026-09-12).
# Status vocabulary: candidate | endorsed (visionary picked it for the north-star statement) | rejected

meta:
  session_date: 2026-09-11
  parent: 00-vision.yaml
  proposed_north_star_statement: >
    The codebase's live structural memory, shared by humans and agents. v1 is "a graph agents can read";
    the evolved product is a place where agents and humans also write what they learned, where time and
    runtime are dimensions, and where the graph extends past source files to everything the code touches.
  statement_status: proposed   # awaiting visionary

themes:

  - id: NS-A
    name: The agent becomes a collaborator, not just a reader
    ideas:
      - id: NS-A1
        name: Pre-flight for changes
        text: >
          Agent submits a plan (the symbols it intends to touch); the graph returns blast radius, missing
          dependents, and rule violations before any code is written. Extended form: apply the agent's
          unsaved diff to a shadow graph and evaluate the result — impact analysis on a change that does not
          exist yet.
        builds_on: [X5, X12, GE-UC3]
        status: candidate
      - id: NS-A2
        name: Guardrails as a gate
        text: >
          Policies (no new cycles, no layer violations, no growth of the top-N god classes) evaluated on every
          proposed edit and wired into the host's tool hooks (e.g. a pre-edit hook that consults the graph).
          The graph can veto, not just advise.
        builds_on: [D16, NS-A1]
        status: candidate
      - id: NS-A3
        name: Context packs
        text: >
          Given a task description, assemble the minimal set of files and symbols by relevance and
          centrality, token-budgeted. The repo map coding agents build badly today, done properly.
        builds_on: [MC-UC1, GE-UC8]
        status: candidate
      - id: NS-A4
        name: Memory bound to symbols
        text: >
          Agents and humans record intent, rationale, and decisions on nodes. Architecture decision records
          live on the code they govern. Survives across sessions and across agents. This is the deferred
          annotation layer (X9) grown up.
        builds_on: [X9]
        status: candidate
      - id: NS-A5
        name: Multi-agent awareness
        text: >
          Parallel agents claim subgraphs so they do not collide, and see each other's in-flight changes as
          stale regions.
        builds_on: [PR8, D21]
        status: candidate
      - id: NS-A6
        name: Self-improving tool surface
        text: >
          Query History (D29) analysed to learn which questions agents actually ask; suggest new tools or
          retire unused ones. The visionary's "learn from the agent" idea, applied to the product itself.
        builds_on: [D29, MC-FR14]
        status: candidate
      - id: NS-A7
        name: Hybrid semantic search
        text: >
          Embed signatures and docstrings alongside the graph; "find code that does X" lands on a node, then
          traversal takes over. Local embeddings only (PR7).
        builds_on: [PR7]
        status: candidate

  - id: NS-B
    name: Time as a dimension
    ideas:
      - id: NS-B1
        name: Graph history
        text: >
          A snapshot per commit gives symbol evolution, churn hotspots, and "bisect by structure" (which
          commit introduced this cycle). Git blame merged with structure.
        builds_on: [X2, D31]
        status: candidate
      - id: NS-B2
        name: PR review mode
        text: >
          Graph diff for a pull request with a risk score and a reviewer focus list; reviewers see the impact
          overlay instead of reading the diff cold.
        builds_on: [X2]
        status: candidate
      - id: NS-B3
        name: Architectural health trends
        text: >
          Coupling growth, cycle introduction, complexity drift plotted over months. The dashboard a tech
          lead wants and never gets.
        builds_on: [GE-UC8, NS-B1]
        status: candidate

  - id: NS-C
    name: Runtime joins static
    ideas:
      - id: NS-C1
        name: Trace and profile overlays
        text: >
          Import OpenTelemetry traces, profiler output, or coverage. Dynamic call graph against the static
          one: confirmed dead code, hot paths, calls the static resolver missed.
        status: candidate
      - id: NS-C2
        name: Incident to code path
        text: >
          Paste a production stack trace; the graph lights the path and every dependent. Error correlation
          becomes navigation.
        status: candidate
      - id: NS-C3
        name: Test impact analysis
        text: >
          Map tests to the symbols they exercise (test call graph and/or coverage data) so an agent knows
          exactly which tests to run for a change, and which symbols have no coverage at all.
        builds_on: [X5]
        status: candidate

  - id: NS-D
    name: Beyond source files
    ideas:
      - id: NS-D1
        name: Cross-boundary edges
        text: >
          Frontend fetch calls resolved to backend route handlers; ORM models resolved to tables and
          migrations; OpenAPI contracts, message queues, infrastructure code, CI workflows as nodes. The
          endpoint-to-database-write taint trace (D10, V4) needs this to be honest.
        builds_on: [D10, V4]
        status: candidate
      - id: NS-D2
        name: Multi-repo federation
        text: >
          Link graphs across service repositories into an organisation graph. Microservice architectures are
          where "what depends on this" is hardest and most valuable.
        builds_on: [D14]
        status: candidate
      - id: NS-D3
        name: Third-party dependencies with vulnerability data
        text: >
          Package dependency graph with SBOM/CVE data; taint from a vulnerable package version to a
          user-facing endpoint becomes a query, not an audit.
        builds_on: [NS-D1]
        status: candidate
      - id: NS-D4
        name: Tickets and docs attached
        text: >
          Issues (e.g. Linear), ADRs, and README sections as nodes linked to code. Requirements
          traceability falls out.
        builds_on: [NS-A4]
        status: candidate

  - id: NS-E
    name: Quality and refactoring
    ideas:
      - id: NS-E1
        name: Refactor plans, not just smells
        text: >
          Community boundaries suggest module extractions; coupling analysis suggests which symbol to move
          and where. The graph hands an agent a concrete plan; the agent executes it.
        builds_on: [D15, GE-UC8]
        status: candidate
      - id: NS-E2
        name: Architecture fitness functions in CI
        text: >
          ArchUnit-style rules driven from the graph, gating pull requests via the headless CLI.
        builds_on: [D8, D16]
        status: candidate
      - id: NS-E3
        name: Classic metrics on every node
        text: >
          Fan-in, fan-out, instability, abstractness, cyclomatic complexity (once CFG exists). Robert
          Martin's main-sequence plot as a live view.
        builds_on: [deferred_layers CFG]
        status: candidate
      - id: NS-E4
        name: Near-duplicate and dead-export detection
        text: Structural-similarity clustering for duplicates; dead exports with confidence scores.
        status: candidate

  - id: NS-F
    name: Human experience
    ideas:
      - id: NS-F1
        name: Inline hints (CodeLens)
        text: >
          "Used by 42 callers", "no test covers this", "crosses a layer boundary" shown in the editor. The
          graph becomes ambient rather than a pane you visit.
        builds_on: [VZ-UC1]
        status: candidate
      - id: NS-F2
        name: Live architecture diagrams
        text: C4-style diagrams derived from communities and layers, exported as Mermaid, never stale.
        builds_on: [D15, VZ-UC5]
        status: candidate
      - id: NS-F3
        name: Natural language to view
        text: >
          Ask a question; an agent writes the Cypher; the pane renders the result. Query History then
          teaches humans the query language by example.
        builds_on: [D29, VZ-Q3]
        status: candidate
      - id: NS-F4
        name: Generated onboarding tours
        text: An agent walks a new hire through a subsystem using the graph as its map.
        builds_on: [MC-UC1]
        status: candidate

  - id: NS-G
    name: Reach
    ideas:
      - id: NS-G1
        name: More languages and schema languages
        text: Go, Rust, Java, C#; and SQL, GraphQL schemas, Protobuf as first-class node sources.
        builds_on: [GE-FR19]
        status: candidate
      - id: NS-G2
        name: Other hosts
        text: >
          JetBrains, Neovim, browser VS Code share the same daemon. The headless decision (D8) makes this
          nearly free.
        builds_on: [D8]
        status: candidate
      - id: NS-G3
        name: Plugin API and rule packs
        text: >
          Custom node types, analyzers, and rule packs. Framework-specific packs (Django, NestJS, FastAPI)
          could become an ecosystem.
        status: candidate
      - id: NS-G4
        name: Interop exports
        text: Export to SCIP/LSIF, Joern CPG, Neo4j; the graph as a data product for BI tooling.
        builds_on: [D34]
        status: candidate

# ------------------------------------------------------------------------------------------------------
tensions:
  - id: NS-T1
    name: Read-only MCP vs agent write-back
    text: >
      NS-A1, NS-A4, NS-A5 all need agents to write. Known shape of the answer: a narrow annotation layer
      persisted outside the cache (X9). Still the biggest philosophical shift from v1 (D15).
  - id: NS-T2
    name: Privacy and local compute vs team sharing
    text: >
      NS-B1, NS-D2, and shared annotations want a server the team shares. Self-hosted only, never cloud by
      default, keeps PR7 intact.
  - id: NS-T3
    name: Sparse graph vs runtime and history data
    text: >
      NS-C1 and NS-B1 are orders of magnitude more data than the structural graph. They must live as
      separate overlays keyed to stable node ids — one more reason D31 (id scheme) matters now.

open_questions:
  - id: NS-Q1
    q: Which two or three ideas belong in the north-star statement itself? Product lead's picks — NS-A1 pre-flight, NS-D1 cross-boundary edges, NS-A4 memory bound to symbols.
    status: open
  - id: NS-Q2
    q: Is agent write-back a direction the visionary wants, or does the graph stay a pure derived artifact forever?
    status: open
  - id: NS-Q3
    q: Is this ultimately a single-developer tool, or does the multi-repo, shared-annotation, team future matter?
    status: open
