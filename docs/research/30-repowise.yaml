# Architecture outside the 7 questions that bears on cpg-me-daddy's deferred/proposed items.
adjacent_findings:
  - topic: "git-history awareness as a first-class intelligence layer"
    claim: >
      GitIndexer mines up to 500 commits per file in parallel (semaphore of 20), producing ownership
      (via git blame, capped at 100KB files), bus factor (smallest author set covering 80% of commits),
      temporal-decayed hotspot scores, and co-change pairs (also temporal-decayed, min-count-3 threshold,
      computed from one `git log --name-only` call rather than one `git diff` per commit). All of this
      degrades gracefully to an empty summary on a non-git directory or GitPython failure.
    evidence: packages/core/src/repowise/core/ingestion/git_indexer.py:100-128,807-945
    confidence: verified
    ties_to: [X2]
    note: >
      This is a complete, shipping implementation of exactly what X2 proposes and cpg-me-daddy has not yet
      agreed to build. The single-git-log-call co-change technique (vs. one diff per commit) is a concrete
      performance lesson independent of whether X2 itself is adopted.
  - topic: "architectural-decision intelligence (inline markers + git archaeology + doc mining + staleness)"
    claim: >
      DecisionExtractor runs three capture sources in parallel — inline `# WHY:`/`# DECISION:`/`# TRADEOFF:`/
      `# ADR:`/`# RATIONALE:`/`# REJECTED:` comment markers (confidence 0.95, or 0.70 raw without an LLM),
      git-archaeology over commit messages matching a decision-signal keyword list (confidence 0.70-0.85),
      and README/docs mining (confidence 0.60) — each source degrades to a deterministic non-LLM fallback on
      provider failure. A separate compute_staleness() detects when a later commit's message contains a
      keyword (replace/remove/deprecate/...) that shares 2+ content words with the original decision text,
      boosting staleness — i.e. it tries to detect when code has since contradicted a recorded decision.
    evidence: packages/core/src/repowise/core/analysis/decision_extractor.py:1-9,61-153,379-398,629-719
    confidence: verified
    ties_to: [X2, D10]
    note: >
      The single most distinctive layer in this repo relative to the other tools in this comparative study,
      and the one with no analog anywhere in cpg-me-daddy's current or deferred design (D10's TAG/FINDING
      overlay is about taint, not decision provenance). The inline-marker convention in particular is cheap,
      deterministic, and has a zero-LLM fallback — worth evaluating on its own even independent of X2.
  - topic: "MCP tool-surface drift beyond what the project documents about itself"
    claim: "16 tools are registered; only 7 are documented in either README.md or docs/MCP_TOOLS.md — see q6 finding for the full list and evidence."
    evidence: "packages/server/src/repowise/server/mcp_server/tool_symbol.py:279 (get_symbol, undocumented example)"
    confidence: verified
    ties_to: [AM3]
    note: "Concrete cautionary evidence for keeping a machine-checked ceiling on MCP tool count rather than a doc claim alone — see lessons_for_cpg_me_daddy L7."
  - topic: "multi-repo workspace intelligence (cross-repo co-change + contract extraction)"
    claim: >
      Cross-repo co-change detection reuses the same exponential-decay formula as intra-repo co-change
      (same _CO_CHANGE_DECAY_TAU=180.0 constant) but is stored separately, outside the SQL schema, as
      .repowise-workspace/cross_repo_edges.json rather than as new DB tables or graph edges — an explicit
      design choice per the module's own docstring to avoid new tables for a workspace-only concern.
    evidence: packages/core/src/repowise/core/workspace/cross_repo.py:1-8,32-33
    confidence: verified
    ties_to: []
    ties_to_none_reason: "cpg-me-daddy has no multi-repo/workspace concept in its v1 scope and no decision id covers it; noting for completeness only."

schema_mapping:
  verdicts:
    joern_aligned:
      verdict: "no"
      why: "No CPG academic framing (AST+CFG+PDG) attempted anywhere; the graph is a plain NetworkX file+symbol dependency/call graph with attribute dicts, and the repo never once mentions Joern — confirmed by a whole-repo case-insensitive grep returning zero hits."
      evidence: packages/core/src/repowise/core/ingestion/graph.py:1-24
      confidence: verified
    density:
      verdict: sparse
      why: "LANGUAGE_CONFIGS' symbol_node_types dicts map only definition-level tree-sitter node types (function/class/method/etc., 2-15 entries per language) to symbols — no node per statement, identifier, or punctuation, converging with cpg-me-daddy's PR1 independently."
      evidence: packages/core/src/repowise/core/ingestion/parser.py:184-454
      confidence: verified
    identity_model:
      verdict: file_local
      why: "Symbol.id is '{file_path}::{name}' (or with a parent segment) — see q5_graph_representation.identity above for the full argument."
      evidence: packages/core/src/repowise/core/ingestion/models.py:143
      confidence: verified
    update_model:
      verdict: hybrid
      why: >
        `repowise update` fully re-walks and re-parses every file and fully rebuilds the in-memory graph
        on every run (its own comment: "Full re-ingest for graph (needed for cascade analysis)"), so the
        graph substrate itself is full_reindex, not incremental. Only two layers above it are genuinely
        incremental: wiki-page regeneration is capped by an adaptive cascade budget prioritized by PageRank
        (ChangeDetector.get_affected_pages), and git metadata re-indexing only re-mines changed files
        (GitIndexer.index_changed_files) rather than all 500 commits × all files again.
      evidence: packages/cli/src/repowise/cli/commands/update_cmd.py:213-236; packages/core/src/repowise/core/ingestion/change_detector.py:260-346; packages/core/src/repowise/core/ingestion/git_indexer.py:362-415
      confidence: verified
  node_vocabulary:
    - theirs: "file (node_type=file)"
      ours: FILE
      fit: exact
      note: "identical concept — the filesystem-entry node"
      evidence: packages/core/src/repowise/core/ingestion/graph.py:124-132
    - theirs: "symbol (kind=function/method)"
