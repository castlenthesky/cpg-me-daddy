q7_bad_code_analytics:
  detectors:
    - name: "Dead code (4 passes)"
      technique: "pure graph traversal: unreachable files (in-degree 0, not entry/test), unused exports, unused internals, zombie packages — each gated by a dynamic-import/framework-decorator allowlist to suppress false positives, plus a confidence-scored, config-adjustable safe_to_delete threshold (default 0.7)"
      output: "DeadCodeReport with per-finding confidence/lines/safe_to_delete, persisted to a dead_code_findings table with a resolve/acknowledge/false_positive workflow"
      evidence: packages/core/src/repowise/core/analysis/dead_code/analyzer.py:34-89; packages/core/src/repowise/core/persistence/models.py:468-499
      confidence: verified
    - name: "Git hotspots / churn"
      technique: "exponentially time-decayed per-commit churn score (half-life 180 days) combined with a percentile rank across all files; top-25th-percentile-by-churn-with-recent-activity = hotspot"
      output: "is_hotspot boolean + churn_percentile + temporal_hotspot_score columns per file"
      evidence: packages/core/src/repowise/core/ingestion/git_indexer.py:102-106,614-624,916-945
      confidence: verified
    - name: "Community detection"
      technique: "Leiden (graspologic) preferred, Louvain (networkx) fallback, with a second partition pass to split any community exceeding 30% of the graph, plus a heuristic cohesion score and directory/keyword-based labeling"
      output: "community_id per file/symbol node, CommunityInfo (label, members, size, cohesion, dominant_language) cached alongside the graph"
      evidence: packages/core/src/repowise/core/analysis/communities.py:1-8,30-31,66-76,104-150
      confidence: verified
    - name: "Security signal scan"
      technique: "line-by-line regex pattern match (eval/exec, pickle.loads, shell=True, hardcoded secrets, f-string SQL, weak hashes) plus a symbol-name keyword scan (auth/token/password/jwt/session/crypto) — explicitly not dataflow/taint tracking"
      output: "SecurityFinding rows (kind, severity, snippet, line)"
      evidence: packages/core/src/repowise/core/analysis/security_scan.py:1-9,20-37
      confidence: verified
    - name: "Execution flow tracing"
      technique: "composite entry-point scoring by name-pattern tier (main/run/start/... > handle_/on_/... > get_/create_/...) with test/fixture/demo path exclusion, then BFS from scored entry points classifying flows as intra- vs cross-community"
      output: "ExecutionFlowReport (per-flow trace, depth, crosses_community, communities_visited)"
      evidence: packages/core/src/repowise/core/analysis/execution_flows.py:1-6,19-46,54-83
      confidence: verified
  fix_support:
    verdict: surface_only
    claim: >
      No auto-fix / codemod capability found anywhere read — findings are surfaced with confidence,
      suggested action text ("safe to delete", "review first"), and a resolve/acknowledge/false-positive
      workflow, but the engineer applies the change by hand.
    evidence: README.md:389-406; packages/core/src/repowise/core/persistence/models.py:490-496
    confidence: inferred
  absent:
    - detector: "taint analysis / data-flow (PDG-equivalent, our REACHING_DEF)"
      looked_in: "whole-repo keyword grep for taint/dataflow/data-flow/cfg/control-flow-graph, plus a second grep restricted to docs/architecture/deep-dives.md"
