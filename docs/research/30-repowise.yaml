      fit: approx
      note: "no formal AST/CFG membership or resolution-status field on the node itself; our METHOD carries Joern-alignment and lives in a typed 14-label vocabulary rather than one open kind enum"
      evidence: packages/core/src/repowise/core/ingestion/models.py:78-93
    - theirs: "symbol (kind=class/struct/interface/enum/trait/impl)"
      ours: TYPE_DECL
      fit: approx
      evidence: packages/core/src/repowise/core/ingestion/models.py:78-93
    - theirs: "symbol (kind=constant/variable)"
      ours: MEMBER
      fit: approx
      note: "no distinction between a class-owned MEMBER and a free module-level constant/variable"
      evidence: packages/core/src/repowise/core/ingestion/models.py:78-93
    - theirs: "Import (dataclass folded into an 'imports' edge, never its own node)"
      ours: IMPORT
