lessons_for_cpg_me_daddy:
  - id: L1
    lesson: "Keep symbol-node cardinality confined to definition-level AST constructs (functions/classes/methods/etc.), never per-statement or per-identifier."
    stance: adopt
    ties_to: [PR1]
    why: "repowise's LANGUAGE_CONFIGS independently converges on the same choice across 14 languages — this is convergent industry practice, not an idiosyncrasy of our own design, and reinforces PR1's 'sparse by design' cardinality rule."
    cost: "None — this reinforces an existing decision rather than proposing new work."
    evidence: packages/core/src/repowise/core/ingestion/parser.py:184-196
    confidence: verified
  - id: L2
    lesson: "Never key symbol node identity on the file path the symbol currently lives in; keep the fqn-keyed SYMBOL indirection so a single-file replace can't cascade into every edge that touches a renamed/moved file."
    stance: reject
    ties_to: [D5, PR3]
    why: >
      repowise does exactly the file-path-keyed identity D5 rejects (Symbol.id = '{file_path}::{name}'),
      and pays for it with whole-repo index rebuilds in CallResolver/HeritageResolver on every
      GraphBuilder.build() call — the concrete cost D5's reasoning predicted in the abstract.
    cost: "We already pay this cost by having built D5/PR3; this is confirming evidence, not new work."
    evidence: packages/core/src/repowise/core/ingestion/models.py:143
    confidence: verified
  - id: L3
    lesson: "Make sure `cpg index`'s incremental path never silently falls back to a full re-parse + full graph rebuild while still being marketed as an incremental update — add a test that asserts single-file-changed indexing touches O(1) files, not O(repo size)."
    stance: reject
    ties_to: [D17, PR3, X12]
    why: >
      repowise's own `update` command comment says "Full re-ingest for graph (needed for cascade
      analysis)" and then re-walks and re-parses every file in the repo on every update, regardless of
      how many files actually changed — the update time is bounded by total repo size, not diff size,
      which is the opposite of PR3's "graph is a cache" philosophy and would blow past D17's 2s/5s ceiling
      on any repo bigger than a toy one.
    cost: "A CI/interface-hash test (X12) that fails if `cpg index` on a 1-file change touches more than a small, bounded set of files is cheap insurance against silently regressing into repowise's shape."
    evidence: packages/cli/src/repowise/cli/commands/update_cmd.py:213-236
    confidence: verified
  - id: L4
    lesson: "Keep (and consider borrowing) the discipline of an explicit cross-language rejection guard on any low-confidence, name-only call-resolution tier — a global-unique-name match should never fire across two different languages even when it's technically unambiguous."
    stance: adopt
    ties_to: [D26]
    why: "repowise's Tier-3 fallback explicitly checks caller/callee language and returns None on a mismatch rather than trusting a same-name coincidence across languages — a small, cheap guard against a plausible-looking wrong edge, directly applicable to our own adapter-native resolver's lowest-confidence tier."
    cost: "One extra language-equality check per low-confidence resolution attempt; negligible."
    evidence: packages/core/src/repowise/core/ingestion/call_resolver.py:236-243
    confidence: verified
  - id: L5
    lesson: "Do not persist community_id as a durable, un-versioned column on graph nodes across re-indexes without an explicit staleness/confidence field next to it."
    stance: reject
    ties_to: [D15, RK8]
    why: >
      repowise's GraphNode.community_id is a plain persisted integer column with no staleness or
      confidence field alongside it (contrast with its own DecisionRecord.staleness_score, which DOES
      track this for decisions) — exactly the RK8 risk of a community label being trusted after it has
      gone stale. D15's choice to expose communities read-only and never persist labels avoids this by
      construction.
    cost: "We give up nothing by rejecting this — D15 already avoids it; this is confirming evidence for staying the course."
    evidence: packages/core/src/repowise/core/persistence/models.py:167
    confidence: verified
  - id: L6
    lesson: "Watch for AGPL/SSPL-shaped dual-licensing in any future dependency or reference implementation, the same way RK4 already flags FalkorDB."
    stance: watch
    ties_to: [RK4]
    why: "repowise is AGPL-3.0-only with a separate paid commercial license for embedding — structurally identical to the FalkorDB SSPL/RSAL risk RK4 already tracks, just from a different vendor."
    cost: "Trigger: if we ever consider vendoring code or algorithms (not just reading for design ideas) from repowise or a similarly-licensed project into falkordb-service or engine."
    evidence: pyproject.toml:14
    confidence: verified
  - id: L7
    lesson: "Enforce AM3's ≤12 MCP tool cap with an automated count check (e.g. a test that counts registered tool functions), not a doc claim alone."
    stance: adopt
    ties_to: [AM3]
    why: "repowise's own docs market 7 tools while the server actually registers 16 — a real, observable case of tool-surface drift outrunning what a project says about itself, which is exactly the failure AM3's cap is meant to prevent."
    cost: "A small CI check (count @tool-equivalent registrations, fail above 12) — cheap relative to the alternative of silently drifting past our own stated cap."
    evidence: packages/server/src/repowise/server/mcp_server/tool_symbol.py:279
    confidence: verified
  - id: L8
    lesson: "If/when X2 (git awareness) is promoted from proposed to agreed, evaluate repowise's exponential-decay hotspot/co-change formulas (half-life ~180 days, single git-log-call co-change computation) as a starting point before designing our own from scratch."
    stance: watch
    ties_to: [X2]
    why: "It's a complete, working implementation of the exact feature X2 proposes, with a specific performance trick (one `git log --name-only` call instead of one `git diff` per commit) worth not re-deriving independently."
    cost: "Trigger: X2 moving from 'proposed' to 'agreed' in a planning session."
    evidence: packages/core/src/repowise/core/ingestion/git_indexer.py:807-847
    confidence: verified
  - id: L9
    lesson: "If a decision-provenance layer is ever considered for cpg-me-daddy, evaluate repowise's cheap, deterministic inline-marker convention (# WHY:/# DECISION:/# TRADEOFF:) with its zero-LLM fallback before assuming an LLM-only design."
    stance: watch
    ties_to: [X2, D10]
    why: "This is the single most distinctive layer in the repo and has no analog in cpg-me-daddy's design at all (D10's TAG/FINDING overlay targets taint, not decision provenance); its non-LLM fallback path means the core capability doesn't require an API key, which matches our own PR7 (privacy and local compute) posture better than repowise's LLM-first framing does."
    cost: "Trigger: a planning session proposing a decision/ADR-tracking layer as a new X-item."
    evidence: packages/core/src/repowise/core/analysis/decision_extractor.py:379-398
    confidence: verified
  - id: L10
    lesson: "Keep PARAM as an explicit node with a HAS_PARAM edge rather than collapsing a symbol's parameter list into an opaque signature string."
    stance: adopt
    ties_to: [D31]
    why: "repowise stores params as a flat, unparsed signature string (Symbol.signature/params_text), which means its own MCP tools can only pattern-match text to answer parameter-shaped questions ('does this call pass the right arity/type') rather than traverse structured nodes — a concrete cost of the choice we've already avoided by keeping PARAM first-class."
    cost: "We already pay the indexing cost of PARAM nodes; this is confirming evidence that the cost buys real query capability repowise's shortcut gives up."
    evidence: packages/core/src/repowise/core/ingestion/parser.py:635-636
    confidence: verified

