study_summary:
  thesis: >
    repowise is a mature, LLM-native "codebase intelligence" product: tree-sitter → NetworkX dependency/call
    graph, mined git history, LLM-generated wiki pages, and an architectural-decision layer, all exposed
    through an MCP server and a local web dashboard. The single most interesting thing relative to
    cpg-me-daddy is that it validates our central architectural bet by contradiction: its Symbol identity is
    a file-path-prefixed string (the "global load-time linker" shape D5 explicitly rejects), and its
    `update` command openly re-parses and rebuilds the *entire* graph on every run rather than patching it —
    exactly the two failure modes cpg-me-daddy's SYMBOL-indirection and planDelta designs were built to avoid.
  one_line_verdict: "A more mature, more marketed predecessor of the docs/analytics half of cpg-me-daddy's ambition, built on a structurally weaker graph substrate than the one we already committed to."
  most_useful_finding: L2
  sharpest_disagreement: >
    D5 (SYMBOL indirection, keyed by fqn, no `file` property, so a single-file replace can never break a
    cross-file edge) is directly contradicted by repowise's design: Symbol.id is literally
    "{file_path}::{name}" (models.py:143, parser.py:644-649), and CallResolver rebuilds global symbol/import
    indices for the WHOLE repo on every construction (call_resolver.py:60-152), while GraphBuilder.build()
    clears and re-resolves ALL import/heritage/call edges on every call (graph.py:184-249). `repowise update`
    then makes this visible end-to-end: its own comment says "Full re-ingest for graph (needed for cascade
    analysis)" (update_cmd.py:213-214) and it re-walks and re-parses every file in the repo, not just the
    git-diff'd ones, before doing anything incremental. This is not a hypothetical failure mode we guarded
    against speculatively — it is the concrete shape of a shipping product's design, which strengthens the
    case for D5/PR3 rather than weakening it.

# The seven questions, in the user's order and numbering. Never renumber, never drop, never merge.
q1_graph_construction:
  pipeline:
    traverse: "FileTraverser walks the repo tree, applies .gitignore/pathspec filters, builds FileInfo per file (parser.py imports FileInfo from .models; driven from orchestrator.py:378-416)"
    parse: "ASTParser.parse_file() runs per file in a ProcessPoolExecutor (one process-local parser per worker); tree-sitter Query capture → symbols/imports/calls/heritage/exports/docstring (orchestrator.py:40-59, 428-494; parser.py:480-532)"
    graph_build: "GraphBuilder.add_file() adds file+symbol nodes and DEFINES/HAS_METHOD edges per file (graph.py:117-182), then .build() resolves imports → heritage → calls in three explicit phases across the WHOLE parsed-file set (graph.py:184-249)"
    git_indexing: "GitIndexer mines up to 500 commits per file (ownership/hotspot/co-change) concurrently with ingestion via asyncio.gather (orchestrator.py:213-245; git_indexer.py:189-360)"
    post_graph_edges: "framework-aware synthetic edges (Django/FastAPI/etc.) and dynamic-hint edges (reflection/DI/plugins) are added after the static graph is built (orchestrator.py:511-530; graph.py:590-641)"
    analysis: "dead-code detection and architectural-decision extraction run as Phase 2, both pure-graph/git or LLM-assisted, no re-parsing (orchestrator.py:290-303)"
    generation: "optional Phase 3 LLM wiki-page generation over the finished graph (orchestrator.py:305-324)"
  entry_points:
    - claim: "CLI entry point is repowise.cli.main:cli, installed as the `repowise` console script"
      evidence: pyproject.toml:112-113
      confidence: verified
    - claim: "The programmatic/headless entry point is run_pipeline() in pipeline/orchestrator.py, used by both the CLI and (per its own docstring) a Modal worker and tests — explicitly zero imports from click/rich/cli"
      evidence: packages/core/src/repowise/core/pipeline/orchestrator.py:1-13,137-155
      confidence: verified
  build_model:
    verdict: multi_pass_pipeline
    claim: >
      Ingestion is itself multi-phase (traverse → parse → graph-build with three internal sub-phases →
      framework edges → dynamic-hint edges), run concurrently with a separate git-mining pipeline, followed
      by analysis and optional generation phases — not a single AST-to-graph pass and not a streaming/
      on-demand model.
    evidence: packages/core/src/repowise/core/pipeline/orchestrator.py:204-330
    confidence: verified
  findings:
    - claim: "Parsing is parallelized across CPU cores via ProcessPoolExecutor; the ASTParser itself is never pickled (only picklable FileInfo/ParsedFile dataclasses cross the process boundary), constructed lazily once per worker process"
      evidence: packages/core/src/repowise/core/pipeline/orchestrator.py:36-59,448-465
      confidence: verified
      note: "cpg-me-daddy's engine is single-process/WASM (web-tree-sitter); this is the kind of throughput lever that becomes available once parsing leaves the extension host."
    - claim: "Git-history indexing and AST ingestion run concurrently as two independent asyncio tasks joined with asyncio.gather — a deliberate pipelining choice, not an afterthought"
      evidence: packages/core/src/repowise/core/pipeline/orchestrator.py:208-245
      confidence: verified

q2_ast_to_cpg:
  mechanism:
    verdict: query_dsl
    claim: >
      Symbols, imports, and calls are extracted via compiled tree-sitter Query objects loaded from
      per-language .scm files using a fixed set of shared capture names (@symbol.def, @symbol.name,
      @import.statement, @call.site, etc.) — ASTParser itself "contains no if/elif language branches"
      per its own docstring; only heritage-parent-class detection and async-node detection fall back to
      a small manual ancestor walk.
    evidence: packages/core/src/repowise/core/ingestion/parser.py:1-23,538-563
    confidence: verified
  walk_strategy:
    claim: >
      One tree-sitter QueryCursor pass per file per concern (symbols, imports, calls), each iterating
      match/capture dicts rather than a recursive node-by-node walk; the one genuine AST walk is
      _find_parent(), which climbs def_node.parent chain looking for a class/impl ancestor to attach
      methods to their owning type.
    evidence: packages/core/src/repowise/core/ingestion/parser.py:671-698,861-882
    confidence: verified
  resolution:
    claim: >
      Resolution is a separate, later graph-build phase, not folded into the AST walk: CallResolver runs
      a three-tier fallback (same-file exact 0.95 → import-scoped 0.85-0.93 → global-unique 0.50, with an
      explicit cross-language rejection guard on tier 3) after the whole-repo symbol index is built;
      heritage (extends/implements) goes through a separate HeritageResolver in the same build() call.
    evidence: packages/core/src/repowise/core/ingestion/call_resolver.py:1-21,236-243; packages/core/src/repowise/core/ingestion/graph.py:274-330
    confidence: verified
  findings:
    - claim: "Barrel/re-export files (e.g. __init__.py that re-exports a name it doesn't define) are followed one hop during index-building so downstream imports resolve through them"
      evidence: packages/core/src/repowise/core/ingestion/call_resolver.py:98-110
      confidence: verified
      note: "Cheap, deterministic heuristic for a real pain point (Python package barrels, JS/TS index re-exports) that cpg-me-daddy's adapter-native resolver doesn't yet document a stance on."

q3_ast_tooling:
  parser:
    claim: "python tree-sitter bindings (tree_sitter.Language/Parser/Query/QueryCursor), CPython-native, not WASM"
    evidence: packages/core/src/repowise/core/ingestion/parser.py:32,508-509,553,865-867
    confidence: verified
  grammars:
    claim: >
      14 tree-sitter grammar PACKAGES pinned in the manifest (python, typescript, javascript, go, rust,
      java, cpp, kotlin, ruby, c-sharp, swift, scala, php, luau) producing 16 effective LANGUAGE TAGS in
      LANGUAGE_CONFIGS/parser.py, because "c" shares the cpp grammar object (parser.py:98-103) and "tsx"
      is loaded as a second entry point off the typescript package (parser.py:120-127). The triage note's
      "16 grammars" is the tag count, not the distinct-package count — worth flagging since the two numbers
      diverge and a reader could cite either.
    evidence: pyproject.toml:36-51; packages/core/src/repowise/core/ingestion/parser.py:97-129,184-454
    confidence: verified
  incrementality:
    verdict: full_reparse_per_run
    claim: >
      Nothing in ASTParser is incremental at the parse level — every parse_file() call constructs a fresh
      tree-sitter Parser and re-parses the full source from bytes; there is no tree-sitter edit()/reparse
      API usage anywhere in the module. Incrementality (such as it exists) is implemented one layer up, by
      ChangeDetector deciding WHICH files to re-run this same full-parse function on.
    evidence: packages/core/src/repowise/core/ingestion/parser.py:480-532
    confidence: verified
  findings:
    - claim: "Query compilation is cached per-language on the ASTParser instance (self._query_cache), not per-call, so repeated files in the same process amortize .scm compilation"
      evidence: packages/core/src/repowise/core/ingestion/parser.py:476-478,538-562
      confidence: verified

q4_language_server:
  verdict: no_lsp
  not_applicable:
    reason: >
      repowise does all name/type/call resolution itself via tree-sitter captures + heuristic tiers
      (CallResolver, HeritageResolver, per-language import resolvers) with zero language-server
      integration anywhere in the codebase or dependency manifest.
    confirmed_by:
      - probe: manifest
        command: "grep -in \"pyright\\|language.server\\|lsp\\|tsserver\" pyproject.toml"
        result: "no match (exit 1) — no LSP client/server package of any kind in the dependency list"
        evidence: pyproject.toml:33-90
        confidence: verified
      - probe: source
        command: 'rg -ni "language server|lsp|pyright|tsserver" packages/core/src/repowise/core/generation/__init__.py packages/core/src/repowise/core/generation/context_assembler.py'
        result: "only false-positive substring matches inside the identifier 'SymbolSpotlightContext'; no genuine LSP reference anywhere in the two files that matched the broader repo-wide grep"
        evidence: packages/core/src/repowise/core/generation/context_assembler.py:73,365,384
        confidence: verified
    what_fills_the_gap:
      - claim: "Three-tier heuristic CallResolver (same-file / import-scoped / global-unique, confidence-scored) stands in for what an LSP's go-to-definition/find-references would give for free, at the cost of the confidence ceiling topping out at 0.95 even for same-file matches"
        evidence: packages/core/src/repowise/core/ingestion/call_resolver.py:1-21
        confidence: verified
    confidence: verified

q5_graph_representation:
  storage:
    claim: >
      In-memory graph is a single networkx.DiGraph built and held by GraphBuilder for the duration of a
      run; it is then flattened into SQLAlchemy ORM rows (GraphNode/GraphEdge tables, SQLite by default via
      aiosqlite, optional Postgres+pgvector) for persistence across runs, and separately as node-link JSON
      via to_json(). There is a second, simpler ad hoc SQLite persist() path on GraphBuilder itself
      (raw executescript CREATE TABLE) that appears to be a leaner/older persistence route than the ORM one.
    evidence: packages/core/src/repowise/core/ingestion/graph.py:432-507; packages/core/src/repowise/core/persistence/models.py:150-207
    confidence: verified
  node_schema:
    claim: >
      Two node "tiers": node_type="file" (path, language, symbol_count, has_error, is_test, is_entry_point)
      and node_type="symbol" (kind, name, qualified_name, file_path, start_line/end_line, visibility,
      is_async, language, parent_name, signature) — kind is a 14-value SymbolKind enum (function, class,
      method, interface, enum, constant, type_alias, decorator, trait, impl, struct, module, macro,
      variable). A synthetic "__module__" symbol node is added per file to anchor top-level/module-scope
      calls. No node exists below symbol granularity — no PARAM, no per-statement, no per-identifier nodes.
    evidence: packages/core/src/repowise/core/ingestion/graph.py:117-182; packages/core/src/repowise/core/ingestion/models.py:78-93,140-157
    confidence: verified
  edge_schema:
    claim: >
      Runtime edge_type values observed in the builder: imports, defines, has_method, calls (+confidence),
      extends/implements/trait_impl/mixin (heritage, +confidence), co_changes (+weight, from git), dynamic_*
      (from per-language dynamic-hint extractors), and framework (synthetic, framework-mediated). The
      EdgeType Literal in models.py additionally declares has_property/method_overrides/method_implements
      that I did not find an emit site for in the files read — worth flagging as declared-but-possibly-
      unused, or implemented in the unread extractors/heritage/* modules.
    evidence: packages/core/src/repowise/core/ingestion/graph.py:14-19,152-608; packages/core/src/repowise/core/ingestion/models.py:222-235
    confidence: verified
    note: "cpg-me-daddy's CALLS.status enum (resolved/ambiguous/external/unresolved/dynamic + reason/confidence/resolvedBy) is a richer status taxonomy than repowise's bare float confidence on the same edge type."
  identity:
    verdict: file_local
    claim: >
      Symbol.id is literally "{file_path}::{name}" or "{file_path}::{parent_name}::{name}" — a
      file-path-prefixed composite key, the opposite of fqn/SCIP-style resolver-independent identity.
      A file rename or move therefore changes every symbol id it contains and every edge referencing
      them, and CallResolver/HeritageResolver rebuild whole-repo symbol/class indices fresh on every
      GraphBuilder.build() call rather than doing an incremental relink.
    evidence: packages/core/src/repowise/core/ingestion/models.py:143; packages/core/src/repowise/core/ingestion/parser.py:644-649; packages/core/src/repowise/core/ingestion/call_resolver.py:60-152
    confidence: verified
  findings:
    - claim: "No academic Code-Property-Graph framing anywhere — no AST/CFG/PDG layering, no reference to Joern or the Yamaguchi CPG paper found in the whole repo; the README itself only ever calls it a 'dependency graph', which is the more accurate label"
      evidence: packages/core/src/repowise/core/ingestion/graph.py:1-24
      confidence: verified
      note: "Worth noting since the triage brief and this comparative study both use 'code-graph tool' loosely — repowise is honest that it isn't attempting a CPG in the formal sense, unlike cpg-me-daddy's explicit Joern-alignment goal (D37)."

