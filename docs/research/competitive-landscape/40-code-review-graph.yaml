# Comparative study — code-review-graph · investigated 2026-09-14
# One of five third-party code-graph tools studied to pressure-test cpg-me-daddy's own design.
# House rules, enforced by schema shape, not by good intentions:
#   * Every claim is a {claim, evidence, confidence} record. evidence is a path:line INSIDE THIS REPO.
#   * confidence: verified = the cited lines were read. inferred = deduced from a manifest/doc/dep list.
#   * A "no" is a finding: use not_applicable{} with >= 2 confirmed_by probes, never an empty field.
# Sibling index: 00-index.yaml. Our schema under comparison: ../../.agent/knowledge/planning-sessions/
#   2026-09-11.project-outline/50-schema.md.

