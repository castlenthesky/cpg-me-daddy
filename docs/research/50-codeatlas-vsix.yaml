lessons_for_cpg_me_daddy:
  - id: L1
    lesson: "Never let node identity depend on a full-project index load that must complete before any node is addressable — keep identity generation (SYMBOL/fqn) independent of any single 'open the whole index' step."
    stance: reject
    ties_to: [D5, D17]
    why: "CodeAtlas's Entity.UniqueName() is literally doxygen's refid, only known after _ReadIndex() parses the entire index.xml (DoxygenDB.cs:1005-1060) — this is the whole-graph relinking D5 exists to avoid, and it directly causes the dead Analyze()/Reopen() stubs (DoxygenDB.cs:1801-1804): there is no cheaper alternative once identity itself requires a full reload."
    cost: "Rejecting this costs nothing extra — cpg-me-daddy already committed to SYMBOL/fqn indirection (D5) precisely to avoid this trap; the value here is confirmation, not a new requirement."
    evidence: DoxygenDB/DoxygenDB.cs:1005-1060
    confidence: verified
  - id: L2
    lesson: "Do not delegate the entire AST/graph extraction step to an external, unversioned GUI-oriented tool binary shelled out as a black box; keep parsing in-process where progress, cancellation, and incremental re-parse are controllable."
    stance: reject
    ties_to: [D32]
    why: "doxygen.exe is extracted from an embedded resource and invoked via System.Diagnostics.Process with WaitForExit() (DoxygenDB.cs:602-616,700-714) — CodeAtlas has zero visibility into doxygen's internal parse, no streaming/partial results, and no way to cancel or re-run just part of it. web-tree-sitter's in-process, per-file WASM parse is a direct structural improvement over this."
    cost: "cpg-me-daddy already pays this cost via web-tree-sitter (D32); the lesson is to keep resisting the temptation to shell out to an external analyzer even when it looks like a shortcut (e.g. for a future language)."
    evidence: DoxygenDB/DoxygenDB.cs:565-600
    confidence: verified
  - id: L3
    lesson: "Watch for any future external resolver (SCIP producer, LSP-backed enrichment) whose own id scheme is not guaranteed stable across independent re-runs — trigger: adopting a resolver whose ids are regenerated per-run and used as a key without cpg-me-daddy also owning a stable indirection layer over them."
    stance: watch
    ties_to: [D34]
    why: "CodeAtlas trusts doxygen's refid as if it were stable, but doxygen never documents refid stability across re-runs, and DoxygenDB has no mechanism to detect or repair drift if it isn't — a live example of what can go wrong when an external tool's transient id becomes your node's identity."
    cost: "Trigger: the day cpg-me-daddy wires up SCIP or another external resolver (D34), verify its ids are either content-stable or explicitly re-linked through SYMBOL/fqn rather than trusted directly."
    evidence: DoxygenDB/DoxygenDB.cs:403-406
    confidence: verified
  - id: L4
    lesson: "Keep user-curated overlay state (saved views, custom edges, annotations) in a structurally separate store from the generated graph, loaded and merged rather than mutating base facts."
    stance: adopt
    ties_to: [D15, D23]
    why: "CodeScene's JSON 'scene' file (positions, custom edges, comments) is loaded independently of the doxygen-derived graph and explicitly skipped from re-traversal for synthetic databases (CodeScene.cs:260-290) — a working precedent for keeping an overlay tier (COMMUNITY/TAG) cleanly separate from the base CPG rather than writing analysis results back onto base nodes."
    cost: "Low — this validates a design cpg-me-daddy already has (D23's layered graph, D15's non-persisted community labels); no new cost, just confirmation the separation is worth defending under pressure to 'just add a field.'"
    evidence: CodeAtlasVSIX/CodeScene.cs:260-290
    confidence: verified
  - id: L5
    lesson: "Do not treat call/use/derive graph navigation alone as 'analytics' — a full call graph with zero complexity, smell, cycle or taint detection on top of it is a cautionary example of value left on the table."
    stance: reject
    ties_to: [D6, D10]
    why: "CodeAtlas has a complete cross-file call/derive/use graph (RefKind, DoxygenDB.cs:55-66) but the only per-entity metric it ever computes is a line count used purely for node sizing (DoxygenDB.cs:1535); confirmed zero hits for cyclomatic/complexity/smell/hotspot/centrality/cycle/taint across the whole non-vendored codebase. Sixteen years after this tool's design, cpg-me-daddy is right not to stop at 'you can see the graph.'"
    cost: "Rejecting the 'graph viewer is enough' model costs cpg-me-daddy the analytics-on-projections work (D6) and taint modeling (D10) it has already scoped — this finding argues for keeping that scope, not cutting it."
    evidence: DoxygenDB/DoxygenDB.cs:1535
    confidence: verified
  - id: L6
    lesson: "Watch for the graph-vs-live-editor-state split that comes from reaching into the running editor process (EnvDTE) for 'current truth' alongside the graph — trigger: if MCP tools start querying live file/editor state directly instead of relying on the graph plus an explicit staleness status."
    stance: watch
    ties_to: [D8, D21]
    why: "CodeAtlas splits its notion of 'current' between the doxygen-derived graph and live EnvDTE calls (SolutionTraverser.cs:16-93 walks the live DTE.Solution tree every time it needs directories/defines) — truth is not owned solely by the graph, which is exactly the ambiguity D21's explicit-status model and D8's headless-engine boundary are meant to prevent."
    cost: "Trigger: any MCP tool implementation that bypasses graph state to read the editor/filesystem 'live' for freshness should instead surface graph staleness explicitly (D21) rather than silently interleaving two sources of truth."
    evidence: CodeAtlasVSIX/SolutionTraverser.cs:16-93
    confidence: verified
  - id: L7
    lesson: "Keep concrete file:line:column on every CALL/USE-shaped edge, not just on nodes — it is a cheap, high-value affordance for jump-to-code."
    stance: adopt
    ties_to: [D26, PR6]
    why: "CodeUIEdgeItem carries m_file/m_line/m_column sourced directly from doxygen's <references startline=> data (CodeUIEdgeItem.cs:54-56,69-77), which is what makes Alt+C/V (find callers/callees) directly actionable in the editor — a low-cost precedent worth explicitly preserving as cpg-me-daddy's CALLS edges get an MCP surface."
    cost: "Cheap — cpg-me-daddy's CALLS edges already carry resolution metadata; the cost is discipline to ensure file:line survives all the way to whatever consumes the edge (MCP tool, editor jump), not just to storage."
    evidence: CodeAtlasVSIX/CodeUIEdgeItem.cs:54-56,69-77
    confidence: verified
  - id: L8
    lesson: "Track the license of every vendored third-party extraction/layout tool individually, not just the primary graph database — a GPL-2.0 project here ships an MIT-licensed layout library (MSAGL) side by side with a GPL doxygen binary, and the two have different reuse implications."
    stance: reject
    ties_to: [RK4]
    why: "The whole CodeAtlasVsix repo is GPL-2.0 (LICENSE:1-2) while its vendored GraphLayout/MSAGL carries a separate MIT license (GraphLayout/LICENSE:1-6) — a reminder that 'the project's license' is not automatically 'every dependency's license,' the same class of risk RK4 already tracks for FalkorDB/SSPL, generalized to any bundled tool."
    cost: "Rejecting 'one license covers everything' costs a small amount of ongoing diligence (checking each vendored/bundled binary's license, not just the top-level LICENSE file) but avoids a real compliance surprise."
    evidence: LICENSE:1-2
    confidence: verified
  - id: L9
    lesson: "Watch for cases where adapter-native resolution proves insufficient for a language/interop-heavy corpus — CodeAtlas's opt-in CLANG_ASSISTED_PARSING flag is a precedent for a similar binary precision toggle rather than an all-or-nothing switch to a heavier resolver."
    stance: watch
    ties_to: [D26]
    why: "config.m_useClang lets a user trade extraction speed for libclang-grade accuracy per-run (DoxygenDB.cs:767, wired from MainUI.xaml.cs:902) without changing the rest of the pipeline — a cheap shape for D26's staged 'adapter-native first, precision path later' plan if a future language needs a similar opt-in toggle rather than a full resolver swap."
    cost: "Trigger: if adapter-native CALLS resolution quality (RK2) proves inadequate on a specific corpus (e.g. heavy C++/native interop, mirroring this very repo's own composition), consider a scoped opt-in precision toggle before committing to always-on LSP/SCIP."
    evidence: DoxygenDB/DoxygenDB.cs:767
    confidence: verified

