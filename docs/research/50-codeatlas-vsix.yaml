study_summary:
  thesis: >
    CodeAtlasVsix is a Visual Studio 2010-2015 call-graph navigator that builds no parser or AST of its
    own: it shells out to an embedded doxygen 1.8.6 binary, re-parses doxygen's own XML dump through a
    thin C# query layer (DoxygenDB, whose Entity/Reference/UniqueName API is a near-literal echo of
    SciTools Understand's ent/ref/db API), and lays the result out with a vendored copy of Microsoft's
    MSAGL for a custom WPF canvas. The single most interesting thing relative to cpg-me-daddy is what's
    missing: there is no incremental update path at all — DoxygenDB.Analyze()/Reopen() are empty TODO
    stubs, and the only way to reflect a code change is to regenerate a full Doxyfile and re-run doxygen
    from scratch, which is exactly the whole-graph-relink failure mode D5 was written to avoid.
  one_line_verdict: "A predecessor product wearing the same words: real call-graph navigation UX, but the extraction layer is someone else's black box and the update model is 'run the whole tool again.'"
  most_useful_finding: L1
  sharpest_disagreement: >
    CodeAtlas's identity model bakes doxygen's own globally-scoped, index-load-time refid directly into
    Entity.UniqueName() (DoxygenDB.cs:403-406), and that id space is only populated by re-reading the
    entire index.xml at DB Open (DoxygenDB.cs:1005-1060). That is structurally the Joern-style global
    relinking that D5 deliberately rejects in favor of SYMBOL/fqn indirection — CodeAtlas is a working
    example of the exact architecture D5's rationale argues against, right down to having no working
    incremental-refresh path (DoxygenDB.cs:1801-1804) as a direct consequence.

q1_graph_construction:
  pipeline:
    solution_traversal: "EnvDTE walks the open VS Solution/Project/ProjectItem tree to collect source directories, include paths, preprocessor defines and per-item comments (CodeAtlasVSIX/SolutionTraverser.cs:16-93)"
    doxyfile_generation: "DoxygenDBConfig is turned into a Doxygen config file via 'doxygen.exe -g', then ~20 keys are overridden (EXTRACT_ALL, GENERATE_XML, SOURCE_BROWSER, a ~35-extension FILE_PATTERNS list spanning C/C++/C#/Java/Python/PHP/Fortran/VHDL/etc.) (DoxygenDB/DoxygenDB.cs:602-616,737-798)"
    external_analysis: "doxygen.exe is invoked again as a child process against the generated Doxyfile; it does its own parse and writes an XML dump (index.xml plus one compound/member XML file per entity) (DoxygenDB/DoxygenDB.cs:700-714)"
    index_ingestion: "DoxygenDB.Open() re-reads the Doxyfile to find XML_OUTPUT, then _ReadIndex() walks index.xml with an XPathNavigator, building IndexItem (EntKind) and IndexRefItem (RefKind) dictionaries keyed by doxygen's own refid, eagerly, for the whole project (DoxygenDB/DoxygenDB.cs:1734-1757,1005-1060)"
    on_demand_detail_parse: "per-entity compound/member XML files are opened and parsed lazily (_GetXmlDocument/_ReadMemberRef) only when the UI asks for a given node's references or metrics, not upfront for the whole project (DoxygenDB/DoxygenDB.cs:809-813,1076-1160)"
    ui_materialization: "CodeScene turns Entity/Reference query results into WPF Shape-derived CodeUIItem/CodeUIEdgeItem objects; SceneUpdateThread lays them out with vendored MSAGL Sugiyama layered layout on a dedicated background thread (CodeAtlasVSIX/CodeUIItem.cs:78-104, CodeAtlasVSIX/SceneUpdateThread.cs:286-382)"
  entry_points:
    - claim: "The user-facing entry point is the 'Analyse' menu action in the main tool window, which builds a DoxygenDBConfig from the traversed solution and kicks off GenerateDB on a background .NET Thread"
      evidence: CodeAtlasVSIX/MainUI.xaml.cs:892-924
      confidence: verified
    - claim: "DoxygenDB also ships a standalone Main() harness (DoxygenDB.exe) that calls DoxygenDB.GenerateDB directly against a hardcoded path — a developer-only entry point, not the shipped plugin path"
      evidence: DoxygenDB/Program.cs:11-28
      confidence: verified
  build_model:
    verdict: on_demand_query
    claim: >
      The project-wide doxygen run is a single batch pass producing a static XML snapshot, but
      DoxygenDB itself does not materialize a full in-memory graph from it — its whole API (Entity,
      Reference, SearchRef, _ReadRef) is a query layer over that XML snapshot, resolving references and
      parsing per-entity detail files lazily as the UI navigates. The one eager step is the top-level
      index (id/name/kind for every entity), not the reference graph.
      evidence: DoxygenDB/DoxygenDB.cs:2046-2178 (SearchFromUniqueName / _SearchRef pull individual XML docs on demand)
    confidence: verified
  findings:
    - claim: "CodeAtlas never parses source itself — SolutionTraverser only collects directories/includes/defines for doxygen's INPUT list, never a token or AST"
      evidence: CodeAtlasVSIX/SolutionTraverser.cs:16-93
      confidence: verified
    - claim: "For solutions doxygen has already indexed once, MainUI reopens a previously generated Doxyfile+XML pair by path rather than always regenerating, but the reopen path still reads the entire XML index at Open(), not a delta"
      evidence: CodeAtlasVSIX/MainUI.xaml.cs:201-233
      confidence: verified
      note: "This is the closest thing to 'reuse prior work' in the pipeline, and it is still a full index re-read, not an incremental update — contrast with cpg-me-daddy's per-file planDelta()."

q2_ast_to_cpg:
  mechanism:
    verdict: external_tool_import
    claim: "AST/graph extraction is entirely doxygen's job; DoxygenDB only extracts an embedded doxygen.exe/doxywizard.exe pair from assembly resources at runtime and shells out to them, then consumes their XML output"
    evidence: DoxygenDB/DoxygenDB.cs:565-600
    confidence: verified
  walk_strategy:
    claim: "There is no walk of an AST inside this repo at all — DoxygenDB._ReadIndex/_ReadMemberRef walk doxygen's already-produced XML tree via System.Xml.XPath.XPathNavigator (Select/SelectChildren), which is a query over a documentation-oriented entity graph, not a compiler AST"
    evidence: DoxygenDB/DoxygenDB.cs:1012-1060
    confidence: verified
  resolution:
    claim: "Reference/call/derive resolution is entirely doxygen's internal black box; DoxygenDB trusts doxygen's refid linking and its string-literal ref-kind vocabulary (call/callby/base/derive/use/member/declare/define/override/...) wholesale, with no confidence, status, or ambiguity field of its own on IndexRefItem"
    evidence: DoxygenDB/DoxygenDB.cs:146-169
    confidence: verified
    note: "Sharp contrast with cpg-me-daddy's CALLS.status ∈ {resolved, ambiguous, external, unresolved, dynamic} plus reason/confidence/resolvedBy — CodeAtlas has no place to even represent 'doxygen guessed.'"
  findings:
    - claim: "doxygen is optionally run with CLANG_ASSISTED_PARSING=YES (config.m_useClang) as a precision upgrade for C++ resolution, mirroring the idea of a cheap default parser with an opt-in precision path"
      evidence: DoxygenDB/DoxygenDB.cs:767
      confidence: verified

q3_ast_tooling:
  parser:
    claim: "doxygen 1.8.6, embedded as a 21,493,760-byte Win32 binary resource inside DoxygenDB.dll and extracted to %TEMP%\\doxygen.exe on first use"
    evidence: DoxygenDB/doxygen.exe (binary; version string '1.8.6' and 'Doxygen version %s' confirmed via `strings DoxygenDB/doxygen.exe`), extraction logic at DoxygenDB/DoxygenDB.cs:565-600
    confidence: verified
  grammars:
    claim: "Not grammars in the tree-sitter sense — doxygen's own built-in multi-language parsers, selected by FILE_PATTERNS (c/cc/cxx/cpp/h/hpp/cs/java/py/php/f90/vhdl/... — ~35 extensions) and optionally libclang for C/C++ (CLANG_ASSISTED_PARSING)"
    evidence: DoxygenDB/DoxygenDB.cs:784-790
    confidence: verified
  incrementality:
    verdict: none
    claim: "DoxygenDB.Analyze() and DoxygenDB.Reopen() — the two methods a 're-run analysis' UI action would need — are empty method bodies with a '// TODO: Add code' comment; DBManager.AnalysisDB() calls the empty Analyze() and then just re-fires the UI refresh callback, so nothing actually re-parses"
    evidence: DoxygenDB/DoxygenDB.cs:1796-1804
    confidence: verified
    note: "CodeAtlasVSIX/DBManager.cs:87-92 (AnalysisDB) calls this stub directly — a genuinely dead code path in the shipped plugin."
  findings:
    - claim: "The only way to reflect a source change is the full 'Analyse' menu action, which regenerates a Doxyfile and re-runs doxygen.exe over the whole configured input set from scratch"
      evidence: CodeAtlasVSIX/MainUI.xaml.cs:892-924
      confidence: verified

q4_language_server:
  verdict: no_lsp
  not_applicable:
    reason: >
      CodeAtlas predates the Language Server Protocol (VS 2010-2015 target; LSP was introduced ~2016)
      and its editor integration is built entirely on Visual Studio's own EnvDTE automation model plus
      the doxygen-derived DoxygenDB query layer — there is no client/server protocol of any kind for
      parsing or navigation.
    confirmed_by:
      - probe: manifest
        command: "grep -n 'TargetFrameworkVersion\\|Language' CodeAtlasVSIX/packages.config"
        result: "packages.config lists only Microsoft.VisualStudio.* VS-SDK packages (Editor, Language.Intellisense, Language.StandardClassification — VS's own classification/IntelliSense APIs, not an LSP client); zero LSP-related packages"
        evidence: CodeAtlasVSIX/packages.config:1-30
        confidence: verified
      - probe: source
        command: "grep -rniE 'languageserver|language server|\\blsp\\b|LanguageClient' --include='*.cs' CodeAtlasVSIX DoxygenDB (excluding vendored GraphLayout)"
        result: "zero matches across both projects"
        evidence: CodeAtlasVSIX/CodeAtlasVSIX.csproj:0
        confidence: verified
    what_fills_the_gap:
      - claim: "EnvDTE (Visual Studio's COM automation object model) is used directly for solution traversal, cursor/editor navigation and reference lookups — confirmed present in MainUI.xaml.cs, ReferenceSearcher.cs, CodeAtlasPackage.cs, CodeScene.cs, CursorNavigator.cs and SolutionTraverser.cs"
        evidence: CodeAtlasVSIX/SolutionTraverser.cs:1-20
        confidence: verified
    confidence: verified

q5_graph_representation:
  storage:
    claim: >
      No database in the cpg-me-daddy sense. The base graph lives as doxygen's own XML files on disk
      (index.xml + per-compound/member XML under OUTPUT_DIRECTORY/xml), re-opened and re-queried each
      session; a separate hand-rolled JSON 'scene' file (via System.Web.Script.Serialization.
      JavaScriptSerializer) persists the user-curated overlay — saved relationship graphs, custom edges,
      node positions and comments — independent of the doxygen data.
    evidence: CodeAtlasVSIX/CodeScene.cs:260-307
    confidence: verified
  node_schema:
    claim: "A node (CodeUIItem, itself a WPF Shape) carries: m_uniqueName (doxygen refid), m_name, m_longName, m_kindName + m_kind (DoxygenDB.EntKind), a metric dictionary (e.g. CountLine), plus UI-only state (position, color, comment)"
    evidence: CodeAtlasVSIX/CodeUIItem.cs:31-42,78-104
    confidence: verified
  edge_schema:
    claim: "An edge (CodeUIEdgeItem, also a WPF Shape) carries: m_srcUniqueName, m_tarUniqueName, m_file/m_line/m_column (from doxygen's <references compoundref=/startline=>), and a m_customEdge flag distinguishing doxygen-derived edges from user-added ones"
    evidence: CodeAtlasVSIX/CodeUIEdgeItem.cs:40-95
    confidence: verified
  identity:
    claim: "Node identity is doxygen's own refid (a hash-like id doxygen assigns per compound/member during its internal parse), read once per session from index.xml and never generated or reconciled by CodeAtlas itself"
    evidence: DoxygenDB/DoxygenDB.cs:403-406,1030
    confidence: verified
    note: "This is the load-bearing divergence from D5: identity is not FQN/SCIP-based and carries no file-independence guarantee — it is whatever doxygen's internal symbol table produced on the last full run."
  findings:
    - claim: "The 26-value EntKind enum (CLASS/STRUCT/UNION/.../FUNCTION/VARIABLE/TYPEDEF/ENUM/...) is doxygen's own compound/member kind taxonomy, carried through verbatim rather than being CodeAtlas's own schema design"
      evidence: DoxygenDB/DoxygenDB.cs:22-53,70-83
      confidence: verified

