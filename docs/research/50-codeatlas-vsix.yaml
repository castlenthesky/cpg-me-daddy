  - topic: "Understand-API-shaped query layer over a different backend"
    claim: "DoxygenDB's public surface — classes literally named Entity and Reference, with UniqueName()/Name()/Longname()/Metric() and a RefKind-filtered SearchRef — mirrors SciTools Understand's ent/ref/db scripting API almost exactly, but is backed by doxygen's XML instead of Understand's proprietary database"
    evidence: DoxygenDB/DoxygenDB.cs:366-417,2114-2178
    confidence: inferred
    ties_to: []
    ties_to_none_reason: "No cpg-me-daddy decision id concerns API-shape provenance; this is a design-lineage observation, not a schema/architecture lesson on its own."
    note: "Suggests the author built this as a doxygen-backed clone of a commercial tool's query API rather than designing a schema from first principles — useful context for why EntKind/RefKind read like a documentation taxonomy, not a CPG vocabulary."
  - topic: "user-overlay state kept structurally separate from generated graph data"
    claim: "Saved 'relationship graphs' (custom edges, positions, comments) live in a hand-rolled JSON file loaded independently of the doxygen XML database, and are explicitly skipped from re-traversal for the two synthetic dummy/files databases"
    evidence: CodeAtlasVSIX/CodeScene.cs:260-290
    ties_to: [D15, D23]
    confidence: verified
  - topic: "opt-in precision toggle for a black-box extractor"
    claim: "CLANG_ASSISTED_PARSING is a single boolean (config.m_useClang) surfaced in the analysis UI, trading extraction speed for libclang-grade C++ resolution accuracy — a cheap default/precision-upgrade toggle pattern"
    evidence: DoxygenDB/DoxygenDB.cs:767
    ties_to: [D26]
    confidence: verified

schema_mapping:
  verdicts:
    joern_aligned:
      verdict: "no"
      why: "EntKind is doxygen's own compound/member documentation taxonomy (CLASS/STRUCT/FUNCTION/VARIABLE/GROUP/PAGE/...), not Joern's AST-derived node hierarchy; there is no CFG/DDG/AST_NODE concept anywhere, and RefKind's 8 relation kinds are far coarser than Joern's edge vocabulary"
      evidence: DoxygenDB/DoxygenDB.cs:22-66
      confidence: inferred
    density:
      verdict: sparse
      why: "doxygen's EXTRACT_ALL output models compounds and members only — no per-statement, per-expression or per-token node is ever created; if anything this is sparser than cpg-me-daddy's PR1 baseline since there is no CALL-argument or literal-level detail at all"
      evidence: DoxygenDB/DoxygenDB.cs:22-53 (26 kinds total, all compound- or member-level)
      confidence: inferred
    identity_model:
      verdict: global_relink
      why: "Node identity is doxygen's own refid, only knowable after a full index.xml read at DB Open — there is no per-file-local id and no separate symbol-indirection layer; changing one file requires re-establishing the whole id space"
      evidence: DoxygenDB/DoxygenDB.cs:1005-1060,403-406
      confidence: verified
    update_model:
      verdict: full_reindex
      why: "The only implemented refresh path is regenerating a Doxyfile and re-running doxygen.exe over the entire configured input set; the two methods that would be an incremental-refresh hook (Analyze, Reopen) are empty stubs"
      evidence: DoxygenDB/DoxygenDB.cs:1796-1804
      confidence: verified
  node_vocabulary:
    - { theirs: CLASS/STRUCT/UNION, ours: TYPE_DECL, fit: approx, note: "doxygen collapses class/struct/union into one compound-kind family; no separate INTERFACE/PROTOCOL distinction survives into ours", evidence: "DoxygenDB/DoxygenDB.cs:26-28" }
    - { theirs: FUNCTION/PROTOTYPE, ours: METHOD, fit: approx, note: "no PARAM child nodes are modeled at this layer (see ours_unmatched)", evidence: "DoxygenDB/DoxygenDB.cs:47,49" }
    - { theirs: VARIABLE, ours: MEMBER, fit: approx, note: "doxygen VARIABLE covers both class fields and free/global variables; cpg-me-daddy splits MEMBER (class-scoped) from SYMBOL", evidence: "DoxygenDB/DoxygenDB.cs:43" }
    - { theirs: FILE, ours: FILE, fit: exact, note: "both are filesystem-owned compound units", evidence: "DoxygenDB/DoxygenDB.cs:33" }
    - { theirs: DIR, ours: DIRECTORY, fit: exact, evidence: "DoxygenDB/DoxygenDB.cs:39" }
    - { theirs: NAMESPACE, ours: MODULE, fit: approx, note: "doxygen namespaces are a compound kind like any other; no ownership-class distinction", evidence: "DoxygenDB/DoxygenDB.cs:34" }
    - { theirs: TYPEDEF, ours: TYPE_DECL, fit: approx, note: "typedefs are folded into the same compound family rather than treated as an alias edge", evidence: "DoxygenDB/DoxygenDB.cs:44" }
  edge_vocabulary:
    - { theirs: "call / callby", ours: CALLS, fit: approx, note: "no resolution status/confidence field exists on their side", evidence: "DoxygenDB/DoxygenDB.cs:59,152-153" }
    - { theirs: "base / derive", ours: INHERITS_FROM, fit: exact, evidence: "DoxygenDB/DoxygenDB.cs:60,154-155" }
    - { theirs: "include / includedby", ours: IMPORTS, fit: approx, note: "modeled as a USE-kind reference between file compounds, not a dedicated IMPORT node+edge pair", evidence: "DoxygenDB/DoxygenDB.cs:158-159" }
    - { theirs: "member / memberin", ours: MEMBER_OF, fit: approx, evidence: "DoxygenDB/DoxygenDB.cs:160-161" }
    - { theirs: "declare / define", ours: DEFINES, fit: approx, evidence: "DoxygenDB/DoxygenDB.cs:162-165" }
    - { theirs: "override / overriddenby", ours: absent, fit: extra, note: "cpg-me-daddy's 15 edge types have no direct OVERRIDE relation", evidence: "DoxygenDB/DoxygenDB.cs:166-168" }
  ours_unmatched:
    - { ours: SYMBOL, why_absent_there: "identity is baked directly into Entity via doxygen's refid; there is no separate fqn-keyed indirection node", evidence: "DoxygenDB/DoxygenDB.cs:403-406" }
    - { ours: PARAM, why_absent_there: "doxygen's EntKind has no PARAM/PARAMETER kind — parameters are not indexed as first-class entities at the level DoxygenDB queries", evidence: "DoxygenDB/DoxygenDB.cs:22-53" }
    - { ours: IMPORT, why_absent_there: "modeled only as a USE-kind edge between file compounds (include/includedby), never materialized as its own node", evidence: "DoxygenDB/DoxygenDB.cs:158-159" }
    - { ours: COMMUNITY, why_absent_there: "no clustering/community-detection analytics exist anywhere in the repo (see q7)" }
    - { ours: TAG, why_absent_there: "the only per-symbol annotation mechanism is a free-text 'comment' string, not a structured tag/finding node", evidence: "CodeAtlasVSIX/CodeScene.cs:96,277" }
