study_summary:
  thesis: >
    codeprism is a Rust/tree-sitter MCP server that builds a language-agnostic AST graph
    (Node/Edge/NodeId, entirely in-process via a DashMap-backed GraphStore) and exposes 20 MCP tools
    over it. The single most interesting thing relative to cpg-me-daddy: despite marketing itself as
    "Graph-First Intelligence," its bad-code-analytics tools (complexity, security, duplicates) are
    implemented as regex/keyword scans over raw file text, not as traversals of the graph they build —
    the graph and the analytics are two separate, disconnected subsystems wired into the same server.
  one_line_verdict: "A predecessor pattern, not a peer: a real (if simplistic) AST graph exists, but the analytics layer bypasses it entirely, which is exactly the trap cpg-me-daddy's D6 is designed to avoid."
  most_useful_finding: L1
  sharpest_disagreement: >
    q7's detectors read raw source text via regex (crates/codeprism-analysis/src/security.rs:63-288,
    complexity.rs:114-131), invoked directly by the MCP server on file content
    (crates/codeprism-mcp-server/src/server.rs:1746,2171), never touching GraphStore. This directly
    contradicts D6 (analytics run on projections of the CPG, not raw text) and shows what "graph-based"
    branding looks like when the analytics never actually query the graph.

q1_graph_construction:
  pipeline:
    scan: "RepositoryScanner walks the filesystem and yields DiscoveredFile entries (crates/codeprism-core/src/scanner/mod.rs)"
    parse: "BulkIndexer runs LanguageParser::parse per file in parallel via rayon, producing per-file Node/Edge sets as AstPatch objects (crates/codeprism-core/src/indexer/mod.rs:143-150,210)"
    link: "SymbolResolver runs once over the whole assembled graph, adding cross-file Imports/Calls/Extends edges by name lookup (crates/codeprism-core/src/linkers/symbol_resolver.rs:36-56, invoked at crates/codeprism-core/src/indexer/mod.rs:478-479)"
    store: "Resulting nodes/edges land in an in-process GraphStore (DashMap-indexed by id/file/name/kind) held by the MCP server (crates/codeprism-core/src/graph.rs:16-30, crates/codeprism-mcp-server/src/server.rs:221,248)"
    watch: "A separate file-watcher pipeline (PipelineEventHandler) regenerates per-file AstPatch objects on change, but does not re-invoke SymbolResolver (crates/codeprism-core/src/pipeline/mod.rs:1-29; grep for SymbolResolver in patch/mod.rs returns nothing)"
  entry_points:
    - claim: "CLI binary `codeprism --mcp` is the sole entry point; it parses argv via clap and starts CodePrismMcpServer"
      evidence: crates/codeprism-mcp-server/src/main.rs:12-51
      confidence: verified
    - claim: "The server starts without a repository; the first tool call (e.g. repository_stats) triggers RepositoryManager to scan+index on demand"
      evidence: README.md:150-152
      confidence: inferred
      note: "Manifest/doc claim, not traced through server.rs's tool-dispatch match arms line by line."
  build_model:
    verdict: multi_pass_pipeline
    claim: "Per-file parse+extract runs in parallel (rayon), then one global cross-file linking pass runs over the assembled graph; a third, separate incremental-patch pass exists for the file watcher but skips the linking pass entirely"
    evidence: crates/codeprism-core/src/indexer/mod.rs:118-150,478-479
    confidence: verified
  findings:
    - claim: "BulkIndexer defaults to enable_cross_file_linking: true and batch_size 30, max_parallel = num_cpus"
      evidence: crates/codeprism-core/src/indexer/mod.rs:122-134
      confidence: verified
    - claim: "The incremental file-watch path (pipeline/mod.rs) builds AstPatch objects (nodes_add/edges_add/nodes_delete/edges_delete) but never calls SymbolResolver — cross-file edges from a changed file are not recomputed after a single-file edit unless a full BulkIndexer run happens again"
      evidence: crates/codeprism-core/src/pipeline/mod.rs:1-29
      confidence: verified
      note: >
        Confirmed by grep: `grep -n "SymbolResolver\|resolve" crates/codeprism-core/src/patch/mod.rs`
        returns zero matches. This is the opposite of cpg-me-daddy's D5 bet (SYMBOL indirection so a
        per-file replace never needs whole-graph relinking) — codeprism needs whole-graph relinking and
        simply doesn't run it on the incremental path, so it likely goes stale.

q2_ast_to_cpg:
  mechanism:
    verdict: direct_ast_walk
    claim: "AstMapper recursively walks the tree-sitter CST with a manual TreeCursor, dispatching on cursor.node().kind() string literals to per-construct handler methods (handle_function, handle_class, handle_call_expression, ...)"
    evidence: crates/codeprism-lang-js/src/ast_mapper.rs:76-136
    confidence: verified
  walk_strategy:
    claim: "walk_tree recurses into every child of every node (goto_first_child/goto_next_sibling/goto_parent) regardless of whether that node kind is handled; unhandled kinds fall through a catch-all `_ => {}` arm and produce no graph node"
    evidence: crates/codeprism-lang-js/src/ast_mapper.rs:77-136
    confidence: verified
  resolution:
    claim: "No target resolution happens at emit time. handle_call_expression creates a Call node carrying only the callee's textual name (function_name) and an edge from the enclosing function to that Call node — no attempt to look up the actual target during the AST walk"
    evidence: crates/codeprism-lang-js/src/ast_mapper.rs:267-296
    confidence: verified
  findings:
    - claim: "No tree-sitter Query/S-expression DSL is used anywhere in the repo; every extraction is imperative cursor-walk + string match, not `.scm` queries"
      evidence: 'grep -rln "tree_sitter::Query|QueryCursor" crates --include="*.rs" (no matches)'
      confidence: verified
    - claim: "The same EdgeKind::Calls variant is reused for three semantically different relationships: module→function containment, module→class containment, and caller→call-expression invocation"
      evidence: crates/codeprism-lang-js/src/ast_mapper.rs:177,207,291
      confidence: verified
      note: >
        Surprising relative to cpg-me-daddy, which keeps containment (DECLARES/HAS_ENTRY) and invocation
        (CALLS, with a resolution status enum) strictly separate. Here a query for "what does X call" and
        "what does X declare" would need to be disambiguated by node kind, not edge kind.

q3_ast_tooling:
  parser:
    claim: "tree-sitter 0.24 core crate; each language crate (codeprism-lang-{js,python,java,rust}) wraps its own grammar crate behind a LanguageParser trait implementation"
    evidence: Cargo.toml:32-38
    confidence: verified
  grammars:
    claim: "tree-sitter-javascript/typescript/python/java 0.23, tree-sitter-rust 0.23, pinned as workspace dependencies"
    evidence: Cargo.toml:33-38
    confidence: verified
  incrementality:
    verdict: plumbed_but_unused
    claim: "ParseContext carries an old_tree: Option<Tree> and ParserEngine caches trees per file path, and codeprism-lang-js's parser calls tree_sitter's incremental `parse(content, old_tree)` entry point — but no code anywhere calls Tree::edit()/InputEdit before reusing an old_tree, which tree-sitter's incremental API requires to correctly reuse unchanged subtrees"
    evidence: crates/codeprism-core/src/parser/mod.rs:10-38,140-150; crates/codeprism-lang-js/src/parser.rs:80
    confidence: verified
    note: >
      Confirmed by `grep -rn "\.edit(" crates --include="*.rs"` returning zero matches repo-wide. The
      types suggest incremental reparsing was designed for, but the load-bearing tree-sitter call
      (recording what changed) is missing, so passing old_tree without an edit is either silently
      ignored or produces undefined reuse — worth flagging since cpg-me-daddy's own web-tree-sitter
      (D32) incremental path should double-check it calls the equivalent edit step correctly.
  findings:
    - claim: "cargo build.rs exists per language crate (e.g. crates/codeprism-lang-js/build.rs) suggesting grammar codegen/build-time setup, consistent with tree-sitter's usual cc-based grammar compilation"
      evidence: crates/codeprism-lang-js/build.rs
      confidence: inferred
      note: "File located but not opened; inferred from filename convention only."

q4_language_server:
  verdict: no_lsp
  not_applicable:
    reason: >
      No Language Server Protocol client/server code exists anywhere; the only "LSP" hit in the whole
      codebase is an unrelated acronym collision (Liskov Substitution Principle in a code-smell
      detector).
    confirmed_by:
      - probe: manifest
        command: "cat Cargo.toml (workspace.dependencies list, full)"
        result: "No lsp-types, tower-lsp, lsp-server, or similar crate present among ~35 pinned workspace dependencies"
        evidence: Cargo.toml:24-77
        confidence: verified
      - probe: source
        command: 'grep -rIn "lsp|language_server|LanguageServer" crates --include="*.rs" -l | grep -v test'
        result: "One file matched, crates/codeprism-lang-java/src/analysis.rs — both hits are `evaluate_lsp`/Liskov Substitution Principle scoring, not Language Server Protocol"
        evidence: crates/codeprism-lang-java/src/analysis.rs:2288
        confidence: verified
    what_fills_the_gap:
      - claim: "tree-sitter CST walking (q2/q3) is the entire symbolic front end; cross-file name resolution is a bespoke post-pass (SymbolResolver), not an LSP-backed one"
        evidence: crates/codeprism-core/src/linkers/symbol_resolver.rs:25-56
        confidence: verified
    confidence: verified

q5_graph_representation:
  storage:
    claim: >
      The graph the MCP server actually serves is entirely in-process and ephemeral: GraphStore is a
      set of DashMap<NodeId,_> indices (nodes, outgoing_edges, incoming_edges, file_index,
      symbol_index, kind_index) held as `Arc<GraphStore>` inside the server struct, built fresh via
      GraphStore::new() at startup. A separate codeprism-storage crate implements
      InMemory/File/SqliteGraphStorage backends, but it is declared as a Cargo dependency of
      codeprism-mcp-server and never referenced by name anywhere in that crate's source.
    evidence: 'crates/codeprism-core/src/graph.rs:16-43; crates/codeprism-mcp-server/src/server.rs:221,248; crates/codeprism-mcp-server/Cargo.toml:48; grep -rn "codeprism_storage|GraphStorage" crates/codeprism-mcp-server/src (zero matches)'
    confidence: verified
    note: >
      No persistence of the graph itself exists on the path a user actually runs — restarting the MCP
      server means a full re-scan/re-parse/re-link from scratch. Contrast with cpg-me-daddy's FalkorDB
      backing (persistent, incrementally updated via planDelta()).
  node_schema:
    claim: >
      Node { id: NodeId, kind: NodeKind, name: String, lang: Language, file: PathBuf, span: Span,
      signature: Option<String>, metadata: serde_json::Value }. NodeKind is a 13-variant enum: Module,
      Class, Function, Method, Parameter, Variable, Call, Import, Literal, Route, SqlQuery, Event,
      Unknown.
    evidence: crates/codeprism-core/src/ast/mod.rs:61-91,269-287
    confidence: verified
  edge_schema:
    claim: "Edge { source: NodeId, target: NodeId, kind: EdgeKind }. EdgeKind is a 9-variant enum: Calls, Reads, Writes, Imports, Emits, RoutesTo, Raises, Extends, Implements. No properties on edges beyond the type."
    evidence: crates/codeprism-core/src/ast/mod.rs:113-151,440-449
    confidence: verified
  identity:
    claim: >
      NodeId is a 16-byte BLAKE3 hash of (repo_id, file_path, span.start_byte, span.end_byte,
      `{kind:?}`) — i.e., identity is file-local and byte-offset-dependent, not name/symbol-keyed.
      Because the hash includes absolute byte offsets, any edit earlier in the same file (even one that
      doesn't touch a given construct) shifts that construct's span and therefore changes its NodeId.
    evidence: crates/codeprism-core/src/ast/mod.rs:16-30
    confidence: verified
    note: >
      This is the inverse of D5/D31's bet: cpg-me-daddy deliberately keys SYMBOL by fqn (stable across
      unrelated edits) precisely to avoid this fragility. codeprism's own cross-file edges (built by
      SymbolResolver, which runs after all files are parsed and IDs assigned) would need to be
      entirely rebuilt any time an earlier node's span shifts, which is consistent with why linking is
      a separate, whole-graph pass rather than a per-file incremental one (see q1).
  findings:
    - claim: "Literal, Route, SqlQuery, and Event node kinds are declared in the enum but never constructed by any of the four language extractors"
      evidence: 'grep -rn "NodeKind::Parameter|NodeKind::Literal|NodeKind::Route|NodeKind::SqlQuery|NodeKind::Event" crates/codeprism-lang-*/src/*.rs — only NodeKind::Parameter appears, and only in codeprism-lang-rust/src/ast_mapper.rs:952'
      evidence_note: crates/codeprism-lang-rust/src/ast_mapper.rs:952
      confidence: verified
      note: "Schema vocabulary is aspirationally dense (route/SQL/event awareness suggests a framework-detection ambition) but practically unpopulated — the opposite failure mode from PR1's sparse-by-cardinality rule, which is deliberate rather than accidental here."

q6_presentation_layer:
  surfaces:
    - name: "MCP tool server"
      kind: mcp
      claim: "20 MCP tools (repository_stats, explain_symbol, search_symbols, analyze_complexity, analyze_security, find_duplicates, batch_analysis, ...) dispatched from one large match statement inside CodePrismMcpServer, in a single >7000-line crate"
      evidence: crates/codeprism-mcp-server/src/server.rs:2752 (analyze_complexity dispatch arm), README.md:196-227 (tool list)
      confidence: verified
    - name: "GraphViz / DOT export"
      kind: dev-tool-cli
      claim: "codeprism-dev-tools exposes a GraphVizExporter over the same core Node/Edge types, producing DOT-format diagrams for parser debugging, not for end-user MCP consumers"
      evidence: crates/codeprism-dev-tools/src/graphviz_export.rs:1-13
      confidence: verified
    - name: "moth (Mandrel MCP Test Harness)"
      kind: cli-testing
      claim: "A separate crate (mandrel-mcp-th) providing an MCP protocol-compliance test runner with YAML specs (moth test/validate), unrelated to graph presentation"
      evidence: README.md:103-126
      confidence: inferred
      note: "Located the crate (53 .rs files) but did not open its source; classification from README + file count only."
  findings:
    - claim: 'Tool dispatch logic lives inline in server.rs rather than in the separate tools/ module directory that exists alongside it (tools/{core,search,analysis,workflow}.rs contain zero ''"name":'' tool-registration literals when grepped)'
      evidence: 'grep -c ''"name":'' crates/codeprism-mcp-server/src/tools/*.rs → all zero'
      confidence: verified
      note: "The modular tools/ directory appears to be scaffolding; the actual 20-tool surface is one large match in server.rs, making per-tool testing/auditing harder than a registry pattern would."

q7_bad_code_analytics:
  detectors:
    - name: analyze_complexity
      technique: 'keyword/substring counting over raw file text (not the graph): cyclomatic = 1 + count of decision keywords like "if"/"while"/"&&"; cognitive = line-by-line brace/keyword heuristic with a manually tracked nesting_level counter'
      output: "JSON metrics + threshold_warnings (cyclomatic > 10)"
      evidence: crates/codeprism-analysis/src/complexity.rs:114-166
      confidence: verified
    - name: analyze_security
      technique: "~20+ hand-written regex patterns matched against raw file content (SQL injection, XSS via innerHTML, eval, hardcoded secrets, weak crypto, path traversal, etc.)"
      output: "JSON list of {type, severity, description, recommendation}"
      evidence: crates/codeprism-analysis/src/security.rs:4,63-288
      confidence: verified
    - name: find_duplicates
      technique: "Custom lightweight AST built by parse_file_ast(content: &str) via line classification (classify_line_type), then structural hashing/similarity comparison — a second, independent text-to-tree parser, not the tree-sitter-derived GraphStore"
      output: "duplicate blocks with similarity scores and refactoring suggestions"
      evidence: crates/codeprism-analysis/src/duplicates.rs:328-352,413,950
      confidence: verified
    - name: analyze_specialized_comprehensive
      technique: "Hardcoded/fabricated JSON — a fixed 'vulnerabilities_found: 3' security analysis with fixed line numbers and descriptions, constructed regardless of the `target` argument passed in"
      output: "JSON security/concurrency/architecture/performance report with static content"
      evidence: crates/codeprism-mcp-server/src/server.rs:4169-4211
      confidence: verified
      note: >
        This is not a stub clearly marked as such — it is wired live behind guidance/workflow tools and
        returns confident, specific-looking findings (line 3, line 14, "SQL Injection", "Race
        Condition") that are unconditional constants. A user calling this tool on any codebase gets the
        same fabricated result. Strong cautionary data point for RK8-style "confidently wrong" output.
  fix_support:
    verdict: recommendations_only
    claim: "Every detector emits a textual 'recommendation' string alongside findings (e.g. 'Use parameterized queries'); none of the analyzers examined produce an applicable patch/diff or codemod"
    evidence: crates/codeprism-analysis/src/security.rs:63-70 (pattern+message pairs), crates/codeprism-analysis/src/complexity.rs:50-56
    confidence: verified
  absent:
    - detector: "centrality / community detection (louvain, leiden, betweenness)"
      looked_in: 'grep -rln "louvain|leiden|centrality|community_detect|betweenness" crates --include="*.rs"'
      result: "zero matches across the entire workspace"
      confidence: verified
    - detector: "taint tracking (source/sink/sanitizer dataflow)"
      looked_in: 'grep -rln "taint" crates --include="*.rs" (source) + Cargo.toml dependency list (manifest)'
      result: "One hit, a hardcoded 'tainted_inputs: 1' constant inside the fabricated analyze_specialized_comprehensive output (server.rs:4210); no dataflow/reaching-definitions machinery anywhere; no taint-related crate in Cargo.toml"
      confidence: verified
      note: "Confirms there is no real taint analysis — the only 'taint' in the codebase is a hardcoded number in the same fabricated-output function noted above."
  findings:
    - claim: "None of the three examined detectors (complexity, security, duplicates) query GraphStore; grep for GraphStore/graph_store/codeprism_core inside crates/codeprism-analysis/src/*.rs returns nothing"
      evidence: 'grep -rn "GraphStore|graph_store|codeprism_core" crates/codeprism-analysis/src/*.rs (zero matches)'
      confidence: verified
      note: "This is the central finding of this study — see study_summary.sharpest_disagreement."

adjacent_findings:
  - topic: "multi-repository tracking"
    claim: "RepositoryManager already holds `repositories: HashMap<String, RepositoryInfo>` keyed by repo id, i.e. multiple repositories can be scanned/indexed into the process at once"
    evidence: crates/codeprism-core/src/repository/mod.rs:160-175
    confidence: verified
    ties_to: []
    note: "No X/D id in our list covers multi-repo workspace handling directly; flagged as prior art if that ever becomes a proposal."
  - topic: "git-history awareness"
    claim: "No git2, git-log parsing, or blame-derived features exist anywhere in the codebase"
    evidence: 'grep -rln "git2|git_log|git blame|GitHistory" crates --include="*.rs" (zero matches)'
    confidence: verified
    ties_to: [X2]
    note: "X2 (git awareness, proposed not agreed) has no analog or counter-example here — codeprism is a pure filesystem/AST-state snapshot tool."
  - topic: "MCP-protocol test harness vs. graph-invariant gating"
    claim: "mandrel-mcp-th (moth) is a generic MCP transport/protocol-compliance test runner (stdio/HTTP/SSE, JSON schema validation against YAML specs) — it validates that responses are well-formed MCP, not that the graph itself satisfies structural invariants"
    evidence: README.md:103-126
    confidence: inferred
    ties_to: [X10]
    note: 'grep -rln "invariant" crates/mandrel-mcp-th crates/codeprism-moth-specs returns zero matches — confirms there is nothing analogous to cpg-me-daddy''s assertGraphInvariants()/assertSchemaConformance() gates, only protocol-shape testing.'
  - topic: "MCP tool-surface sizing"
    claim: "20 tools shipped (vs. cpg-me-daddy's AM3 ceiling of ≤12), all dispatched from one file"
    evidence: README.md:196-227, crates/codeprism-mcp-server/src/server.rs:2752
    confidence: verified
    ties_to: [AM3]

schema_mapping:
  verdicts:
    joern_aligned:
      verdict: "no"
      why: "No reference to Joern, no METHOD_FULL_NAME-style global keys, no Joern node/edge naming conventions anywhere in the schema or docs"
      evidence: 'grep -rin "joern" . --include="*.rs" --include="*.md" --include="*.toml" (zero matches, repo-wide)'
      confidence: verified
    density:
      verdict: mixed
      why: >
        The walk visits every CST node (q2), but only ~7 constructs actually emit graph nodes
        (Module/Class/Function/Method/Variable/Call/Import, plus Parameter in the Rust adapter only) —
        sparse in practice. But the *declared* vocabulary (13 node kinds, including unused
        Literal/Route/SqlQuery/Event) is denser than what's built, an inconsistency PR1 doesn't have to
        contend with because cpg-me-daddy's schema is machine-checked against emit sites via test:schema.
      evidence: crates/codeprism-lang-js/src/ast_mapper.rs:93-135
      confidence: verified
    identity_model:
      verdict: file_local
      why: "NodeId hashes repo_id + file_path + byte-offset span + kind; there is no separate stable symbol-keyed identity layer — cross-file edges are computed post hoc by name lookup and point directly at these file-local, offset-fragile ids"
      evidence: crates/codeprism-core/src/ast/mod.rs:16-30
      confidence: verified
    update_model:
      verdict: hybrid
      why: >
