lessons_for_cpg_me_daddy:
  - id: L1
    lesson: "Never let cross-file resolution depend on a single whole-graph pass that only runs during full reindex — every incremental (single-file) update path must either re-run resolution scoped cheaply or must not need to, by construction."
    stance: reject
    ties_to: [D5, D26, RK2]
    why: >
      codeprism's SymbolResolver.resolve_all() is the only place cross-file Calls/Imports/Extends edges
      get created, and it is invoked exclusively from BulkIndexer (full reindex). Its own file-watcher
      incremental pipeline never calls it, so a single-file edit's new/changed calls are simply absent
      from cross-file query results until the next full reindex. This is precisely the failure mode
      D5's SYMBOL/fqn indirection is designed to make structurally impossible.
    cost: "We give up nothing — this confirms the design bet already made; the cost is the ongoing discipline of keeping SYMBOL keys stable so no analog pass is ever needed."
    evidence: crates/codeprism-core/src/indexer/mod.rs:478-479
    confidence: verified
  - id: L2
    lesson: "Never key a graph-wide stable identity (anything other identity depends on) off byte offsets — an unrelated edit earlier in the same file must not change a node's identity."
    stance: reject
    ties_to: [D5, D31, PR5]
    why: >
      NodeId::new hashes span.start_byte/end_byte alongside file+kind. Any edit before a construct in
      the same file shifts every subsequent byte offset, so identity churns even when the construct's
      own text is untouched. cpg-me-daddy's SYMBOL-by-fqn avoids this by design, but it's worth
      naming explicitly as a trap: it would be easy to reach for "hash of span" as a shortcut identity
      scheme for non-SYMBOL nodes (METHOD, CALL, etc.) and this repo shows exactly why that's fragile
      whenever cross-references (like codeprism's post-hoc edges) get built against those ids.
    cost: "Reject means: keep D31's node id scheme (path+content-derived, not just byte offsets) disciplined for every node kind that anything else references, not only SYMBOL."
    evidence: crates/codeprism-core/src/ast/mod.rs:16-30
    confidence: verified
  - id: L3
    lesson: "Keep the schema-to-emit-site machine check (test:schema) as a hard gate — a declared vocabulary silently drifts from what's actually built without one."
    stance: watch
    ties_to: []
    ties_to_none_reason: "General schema-hygiene observation; no single D/PR id names 'enforce emit-site coverage of declared labels' specifically, though D37's machine-checked alignment is adjacent."
    why: "NodeKind::{Literal,Route,SqlQuery,Event} and EdgeKind::{Emits,RoutesTo,Raises} exist in the type system but are never constructed by any extractor located — dead schema that a reader would reasonably assume is live."
    cost: "Watch trigger: if test:schema ever starts checking only 'label is declared' rather than 'label is reachable from at least one emit site under a fixture,' add the latter."
    evidence: crates/codeprism-core/src/ast/mod.rs:81-89
    confidence: verified
  - id: L4
    lesson: "Analytics must query the graph, not re-parse or re-scan raw source text under a different code path — otherwise 'graph-based analysis' is a marketing claim, not an architecture."
    stance: reject
    ties_to: [D6]
    why: >
      analyze_complexity, analyze_security, and find_duplicates all operate on raw file content via
      keyword counting, ~20+ hand-rolled regexes, and a second bespoke line-classifying parser,
      respectively — none of them touch GraphStore. The CPG that codeprism spends significant effort
      building (tree-sitter walk, cross-file linker, in-memory index) is simply unused by its headline
      "bad code" tools. This is the sharpest disagreement found in this study.
    cost: "Reject means: every future analytics tool (complexity metrics, taint, community detection) must be implemented as a query/projection over GraphStore/FalkorDB, never as a parallel text-scanning subsystem, even when text-scanning would ship faster."
    evidence: crates/codeprism-analysis/src/complexity.rs:114-131
    confidence: verified
  - id: L5
    lesson: "Never let a tool return statically fabricated findings dressed as analysis output, even as a stopgap — mark unimplemented analysis as unimplemented, not as plausible-looking constants."
    stance: reject
    ties_to: [RK8, D21]
    why: >
      analyze_specialized_comprehensive ignores its own `target` argument and returns a hardcoded JSON
      block ('vulnerabilities_found: 3', specific line numbers, specific CWE-sounding descriptions) for
      any input. A caller — human or agent — cannot distinguish this from a real finding without
      reading the source. D21's "readers never blocked, explicit status" principle is the direct
      counter-pattern: an explicit "not yet implemented" status is strictly better than a confident
      fabrication.
    cost: "Reject means paying the honesty cost of an explicit not-yet-available status for any MCP tool whose backing analysis isn't real, even when a filled-in JSON shape looks more complete to a demo."
    evidence: crates/codeprism-mcp-server/src/server.rs:4169-4211
    confidence: verified
  - id: L6
    lesson: "If we ever add tree-sitter old-tree reuse as a performance optimization, verify the InputEdit/Tree::edit() call is actually wired before trusting the 'incremental' label."
    stance: watch
    ties_to: [D32]
    why: "codeprism's ParseContext/ParserEngine plumb an old_tree through to tree-sitter's incremental parse() call, but no .edit() call exists anywhere in the repo to inform tree-sitter what changed, which is required for correct incremental reuse per tree-sitter's own API contract."
    cost: "Watch trigger: before or after adopting any old-tree-reuse optimization in the web-tree-sitter WASM path (D32), add a regression test asserting edit() (or the WASM equivalent) is called with the actual changed byte range prior to reparse."
    evidence: crates/codeprism-core/src/parser/mod.rs:140-150
    confidence: verified
  - id: L7
    lesson: "Keep the MCP tool surface both small and structurally modular — a large single-file dispatch match for every tool makes the ≤12-tool discipline (AM3) easy to violate unnoticed."
    stance: adopt
    ties_to: [AM3]
    why: "codeprism ships 20 tools, all dispatched inline inside one server.rs file (thousands of lines), while a parallel tools/ module directory exists but contains no actual tool-registration logic (grep for tool-name literals returns zero hits there). The structure invites tool-count creep because there's no single registry to eyeball."
    cost: "Adopt means keeping MCP tool registration in one small, enumerable place (not scattered across a large server file) so AM3's ≤12 ceiling stays visibly enforceable at a glance, not just by convention."
    evidence: crates/codeprism-mcp-server/src/server.rs:2752
    confidence: verified
  - id: L8
    lesson: "Persist the graph itself, not just cached analysis results — an in-process-only graph means every server restart pays a full rescan/reparse/relink cost."
    stance: adopt
    ties_to: [PR3]
    why: "codeprism's live graph (GraphStore) is pure in-memory DashMap state with no wiring to its own codeprism-storage crate (which does implement File/Sqlite persistence but is an unused dependency of the MCP server, per Cargo.toml + zero source references). Every server start is a cold full-repo index."
    cost: "Confirms the value of FalkorDB as durable backing store; the cost we already pay is the planDelta()/incremental-write discipline needed to keep that store fresh without full reindexes."
    evidence: crates/codeprism-mcp-server/Cargo.toml:48
    confidence: verified

