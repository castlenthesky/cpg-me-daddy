study_summary:
  thesis: >
    graphify is a two-engine hybrid: a deterministic, tree-sitter-based AST walker (graphify/extract.py)
    that builds a flat, untyped node/edge graph for code, fused with an LLM-driven semantic layer — either
    Claude Code subagents dispatched in parallel (the default, documented in skill.md) or a direct API call
    to Claude/Kimi (llm.py) — that extracts the same node/edge schema from docs, papers, and images and adds
    fuzzy relations like semantically_similar_to. The single most interesting thing relative to cpg-me-daddy
    is the identity model: node IDs are file-stem-qualified strings, but cross-file linking (both calls and
    imports) is resolved through a flat, whole-corpus label→id dictionary rebuilt on every extract() call
    (extract.py:3438-3455) — exactly the "global load-time linker" pattern that D5 explicitly rejects for
    cpg-me-daddy, and it is recomputed only over the files passed to that extract() call, so an incremental
    --update silently fails to create or refresh cross-file edges into files that did not change.
  one_line_verdict: "A different product wearing overlapping words — a Claude-Code-skill-first RAG/knowledge-graph tool for humans-and-agents-reading-a-graph, not an IDE-integrated incrementally-updated CPG; its code-graph layer is a fast, useful, but intentionally coarse building block, not the product's center of gravity."
  most_useful_finding: L2
  sharpest_disagreement: "graphify's cross-file symbol resolution is a single global {label.lower(): node_id} dict rebuilt from whatever files were just extracted (extract.py:3438-3455, extract.py:2664-2735) — the same whole-graph, name-based relinking that D5 names and rejects as incompatible with a fast single-file replace. graphify accepts the risk (name collisions silently overwrite in the dict; unresolved incremental relinks are just missed) because the AST layer is a means to a RAG-query end, not a precision-tracked graph in its own right."

# The seven questions, in the user's order and numbering. Never renumber, never drop, never merge.
q1_graph_construction:
  pipeline:
    detect: "detect.py: os.walk the tree once, classify each file by extension into code/document/paper/image/video, skip venvs/node_modules/build dirs and .graphifyignore matches, warn if the corpus is small enough to just paste into context (detect.py:337-435)"
    extract_ast: "extract.py: per-language tree-sitter parse -> single recursive walk() builds class/function/import nodes and 'contains' edges -> second recursive walk_calls() over saved function bodies resolves call edges in-file, defers cross-file callees to raw_calls (extract.py:707-1183)"
    extract_semantic: "skill.md dispatches Claude Code subagents (subagent_type=general-purpose) in parallel, one per file chunk, each independently emitting the same nodes/edges JSON for docs/papers/images and cross-domain relations; llm.py provides a non-Claude-Code direct-API alternative (skill.md:280-354, graphify/llm.py:14-165)"
    build: "build.py: merge all per-file/per-chunk extraction dicts into one NetworkX (Di)Graph; nodes added in order so later (semantic) extractions overwrite earlier (AST) ones on ID collision (build.py:42-127)"
    cluster: "cluster.py: Leiden (graspologic) if installed else Louvain (networkx) community detection, splits communities >25% of graph, stores community id back as a node attribute (cluster.py:21-105)"
    analyze: "analyze.py: degree-based god_nodes, composite-scored surprising_connections, heuristic suggest_questions, graph_diff for before/after snapshots (analyze.py:39-540)"
    report: "report.py: renders GRAPH_REPORT.md — confidence breakdown, community hubs, god nodes, surprising connections, ambiguous edges, a 'Knowledge Gaps' section (isolated nodes / thin communities / high ambiguity) (report.py:15-181)"
    export: "export.py: graph.json (node-link), interactive vis.js graph.html (capped at 5000 nodes), matplotlib SVG, Cypher script, Obsidian vault, Excalidraw-style canvas, optional Neo4j push, GraphML (export.py:25,297-1064)"
  entry_points:
    - { claim: "CLI entry point is `graphify` -> graphify.__main__:main, a hand-rolled sys.argv dispatcher (no argparse subparsers) with ~25 subcommands", evidence: "pyproject.toml:56-57, graphify/__main__.py:976-1030", confidence: verified }
    - { claim: "The documented/default entry point is not the CLI but a Claude Code skill (skill.md, installed via `graphify install` into the platform's skill directory) that the agent invokes as /graphify — the skill's markdown IS the pipeline orchestrator for the semantic half", evidence: "graphify/skill.md:59-360", confidence: verified }
  build_model:
    verdict: multi_pass_pipeline
    claim: "Strictly staged, non-interleaved: all detection, then all AST extraction (+ parallel semantic subagents), then one merge, then one clustering pass, then one analysis pass, then report/export. There is no on-demand/query-time graph construction — serve.py only reads an already-built graph.json."
    evidence: "ARCHITECTURE.md:6-9, graphify/serve.py:11-29"
    confidence: verified
  findings:
    - { claim: "AST extraction and semantic (subagent) extraction are explicitly parallelized within one run: 'Dispatch all semantic subagents AND start AST extraction in the same message'", evidence: "graphify/skill.md:210-212", confidence: verified, note: "Cross-cutting note: this is a batch-parallel pipeline, not a streaming/incremental one at the whole-run level — parallelism is across independent files/chunks within a single pass, not across pipeline stages." }
    - { claim: "detect() always re-scans the memory dir (graphify-out/memory/) for prior Q&A results and folds them back into the corpus as regular files", evidence: "graphify/detect.py:351-361", confidence: verified, note: "A self-reinforcing feedback loop (save-result -> re-detected as a document next run) that cpg-me-daddy has no analog for; ties to none of our decisions directly, filed as adjacent." }

q2_ast_to_cpg:
  mechanism:
    verdict: direct_ast_walk
    claim: "For code: a single recursive walk(node) over the tree-sitter parse tree, dispatched by node.type membership in per-language frozensets stored on a LanguageConfig dataclass (not a query language like tree-sitter's own S-expression query API) — this is closer to visitor_dispatch layered on direct_ast_walk than a query DSL. For docs/papers/images: llm_assisted, via Claude Code subagents or a direct Claude/Kimi API call, prompted to emit the identical nodes/edges JSON schema."
    evidence: "graphify/extract.py:65-107,766-774, graphify/llm.py:31-45"
    confidence: verified
  walk_strategy:
    claim: "Two full walks per file: walk(root) builds all nodes/imports/class-inherits/edges and collects function body subtrees into function_bodies; then walk_calls() re-walks only those saved bodies to build the call graph, using a label->id map built from all nodes just discovered in that same file. No incremental/partial re-walk of an existing tree — every extraction is a fresh full-file parse (subject to a file-content-hash cache, see q3/q1)."
    evidence: "graphify/extract.py:762-766,1023-1024"
    confidence: verified
  resolution:
    claim: "Resolution is pure string-label matching, not type- or scope-aware. In-file: label_to_nid keyed by lowercased, paren-stripped label. Cross-file calls: a single global_label_to_nid dict built from every node label in the current extract() batch (member-calls like obj.log() are explicitly excluded from cross-file resolution to avoid colliding with any top-level function named 'log' in the corpus). Cross-file Python imports: a second global map from file-stem -> {ClassName: node_id}, producing an INFERRED 'uses' edge from every class defined in the importing file to the imported name — not just the class that actually references it."
    evidence: "graphify/extract.py:1023-1024,1175-1182,3438-3455, graphify/extract.py:2664-2699,2758-2789"
    confidence: verified
    note: "cpg-me-daddy's CALLS.status enum (resolved/ambiguous/external/unresolved/dynamic) has no analog: graphify calls are either resolved (added directly, confidence EXTRACTED) or silently dropped from raw_calls into nothing if no label matches anywhere — there is no persisted 'we looked and could not resolve this' edge."
  findings:
    - { claim: "extract.py fabricates a placeholder/stub node for an unresolved base class in Python and Swift inheritance — an empty-source_file node carrying just the base-class name as its label, functionally similar to cpg-me-daddy's UNKNOWN node label", evidence: "graphify/extract.py:793-811,814-833", confidence: verified }
    - { claim: "A dangling-import exception is hard-coded into the edge-cleaning pass: an edge survives even when its target node was never created, as long as its relation is 'imports' or 'imports_from' (external/stdlib imports have no corresponding node)", evidence: "graphify/extract.py:1341", confidence: verified }

q3_ast_tooling:
  parser:
    claim: "python bindings for tree-sitter (the `tree-sitter` PyPI package, driving Language/Parser objects), version-gated by _check_tree_sitter_version() at the top of extract()"
    evidence: "graphify/extract.py:710-725,3271,3289-3303"
    confidence: verified
  grammars:
    claim: "22 pinned per-language tree-sitter grammar packages (python, javascript, typescript, go, rust, java, c, cpp, ruby, c-sharp, kotlin, scala, php, swift, lua, zig, powershell, elixir, objc, julia, verilog) as hard dependencies, plus a generic dispatch table mapping ~30 file extensions (including .vue/.svelte/.blade.php as JS/PHP variants) to one of 25 extract_<lang> functions"
    evidence: "pyproject.toml:15-36, graphify/extract.py:3323-3361"
    confidence: verified
  incrementality:
    verdict: hybrid
    claim: "Two independent incrementality mechanisms, neither of which is a true incremental tree-sitter re-parse (tree-sitter's edit()/incremental-parsing API is not used anywhere): (1) a SHA-256 content-hash file cache (graphify-out/cache/{ast,semantic}/<hash>.json) that skips re-extraction of unchanged files entirely; (2) an mtime-based manifest (detect_incremental) that classifies files as new/unchanged/deleted for --update runs. Every cache miss or new file is a fresh full-file tree-sitter parse."
    evidence: "graphify/cache.py:20-116, graphify/detect.py:448-511"
    confidence: verified
  findings:
    - { claim: "The file-hash cache strips YAML frontmatter before hashing Markdown files specifically, so metadata-only edits (e.g. a 'reviewed' tag) don't invalidate cached extraction", evidence: "graphify/cache.py:10-17,27-28", confidence: verified }
    - { claim: "Cache is namespaced by kind ('ast' vs 'semantic') with a documented migration fallback to a pre-0.5.3 flat directory layout, showing the project has already hit and fixed a real cache-collision bug in production (#582 referenced in comments)", evidence: "graphify/cache.py:46-54,77-85", confidence: verified }

q4_language_server:
  verdict: no_lsp
  not_applicable:
    reason: >
      graphify never talks to a language server. All name/type resolution is done by string-label matching
      over tree-sitter parse output (see q2 resolution); there is no LSP client, no pyright/tsserver/gopls
      dependency, and no protocol code (textDocument/definition, workspace/symbol, etc.) anywhere in the
      package.
    confirmed_by:
      - { probe: manifest, command: "grep -rni 'language server|\\blsp\\b|pyright|tsserver|gopls|rust-analyzer' pyproject.toml", result: "no matches", evidence: "pyproject.toml:1-70", confidence: verified }
      - { probe: source, command: "grep -rni 'language server|\\blsp\\b|pyright|tsserver|gopls|rust-analyzer' graphify/*.py README.md ARCHITECTURE.md", result: "zero hits in any .py file or architecture doc; one unrelated README hit for 'legal' text, not LSP", evidence: "graphify/extract.py:1-3547 (no match across whole file per grep)", confidence: verified }
    what_fills_the_gap:
      - { claim: "Name-based string matching over tree-sitter AST output (see q2 resolution) substitutes for type-aware resolution — cheap, language-agnostic across 22 grammars, but blind to shadowing, overloads, and same-named symbols in different scopes", evidence: "graphify/extract.py:3438-3455", confidence: verified }
    confidence: verified
  findings: []

q5_graph_representation:
  storage:
    claim: "In-memory/on-disk as a NetworkX Graph or DiGraph, serialized to graphify-out/graph.json via networkx's node_link_data/node_link_graph (with a compatibility shim for the NetworkX<=3.1 'links' key vs newer 'edges' key). No database — the MCP server (serve.py) loads the whole JSON file into memory per invocation."
    evidence: "graphify/build.py:74,193-201, graphify/serve.py:11-23"
    confidence: verified
  node_schema:
    claim: "A single flat, untyped node shape — no 'kind'/'type' discriminator field beyond the coarse file_type enum (code|document|paper|image|rationale|concept). {id, label, file_type, source_file, source_location} are AST-emitted; the LLM/semantic schema adds optional source_url, captured_at, author, contributor. Whether a code node represents a class vs. a function vs. a file is recoverable only by pattern-matching the label string (ends with '()' -> function/method; equals the source filename -> file node) — see analyze.py's _is_file_node heuristic."
    evidence: "graphify/extract.py:740-749, graphify/validate.py:4,6, graphify/llm.py:44, graphify/analyze.py:11-36"
    confidence: verified
    note: "Sharp contrast with cpg-me-daddy's 14 explicit typed node labels (TYPE_DECL vs METHOD vs MEMBER are distinct labels with distinct schemas) — graphify pays for its language-agnostic breadth by giving up node typing entirely; downstream code re-derives 'is this a function' from string shape rather than reading a field."
  edge_schema:
    claim: "{source, target, relation, confidence, source_file, source_location, weight}, with an optional confidence_score float alongside the EXTRACTED/INFERRED/AMBIGUOUS enum. 'relation' is a free-text string with no central registry — code relations (contains, inherits, calls, imports, imports_from, uses, uses_static_prop, references_constant, bound_to, listened_by, uses_<helper>) and semantic relations (calls, implements, references, cites, conceptually_related_to, shares_data_with, semantically_similar_to) are scattered string literals across extract.py and the skill.md/llm.py prompt text, not a schema.py enum."
    evidence: "graphify/extract.py:751-761, graphify/validate.py:5,7,54-58, graphify/llm.py:44"
    confidence: verified
  identity:
    claim: "Node IDs are deterministic slugs from _make_id(file_stem, entity_name) — file_stem includes the parent directory name specifically to reduce cross-file collisions (#550) — so IDs are file-local by construction. But cross-file EDGE resolution (calls and Python imports) is done through a single flat, whole-corpus {normalized_label: node_id} dictionary rebuilt from scratch on every extract() call, with last-write-wins on label collision and no namespace/type disambiguation."
    evidence: "graphify/extract.py:14-27, graphify/extract.py:3438-3443"
    confidence: verified
  findings:
    - { claim: "build.py defines deduplicate_by_label() — a whole-graph, cross-file node merge keyed on normalized label text — and its own docstring in build.py's module header claims it runs 'automatically' in build(), but it is never called anywhere in the package (grep across all of graphify/*.py finds only its own definition)", evidence: "graphify/build.py:1-22,135-178", confidence: verified, note: "A real discrepancy between documented and actual behavior — worth flagging because it means graphify's node identity is currently less merge-happy across files than its own architecture comment claims; if this were wired up it would be a much closer (and much riskier) analog to Joern's global relinker than the string-label edge resolution already is." }
    - { claim: "graph.json node-link data is round-tripped through a normalize-and-remap step so IDs that the LLM generates with slightly different punctuation/casing than the AST extractor still resolve to the same node (e.g. 'Session_ValidateToken' -> 'session_validatetoken')", evidence: "graphify/build.py:32-39,77-94", confidence: verified }

q6_presentation_layer:
  surfaces:
    - { name: "MCP stdio server (graphify serve)", kind: mcp, claim: "7 read-only tools: query_graph (BFS/DFS token-budgeted subgraph-to-text), get_node, get_neighbors, get_community, god_nodes, graph_stats, shortest_path", evidence: "graphify/serve.py:164-235,341-349", confidence: verified }
    - { name: "graph.html", kind: webview, claim: "Interactive vis.js physics-clustered HTML visualization; degree-scaled node size, confidence-styled edges, community coloring/filter, click-to-inspect panel, search box; hard node-count ceiling of 5000 (raises ValueError above it, caller falls back to --no-viz)", evidence: "graphify/export.py:25,378-399", confidence: verified }
    - { name: "graph.svg", kind: static_image, claim: "matplotlib spring-layout SVG export, solid/dashed edges by EXTRACTED vs INFERRED/AMBIGUOUS confidence — designed to embed in Obsidian/Notion/GitHub READMEs with no JS", evidence: "graphify/export.py:997-1064", confidence: verified }
    - { name: "GRAPH_REPORT.md", kind: cli_report, claim: "Human-readable audit trail: corpus check, community hubs, god nodes, surprising connections, ambiguous edges needing review, a dedicated Knowledge Gaps section, and suggested questions", evidence: "graphify/report.py:15-181", confidence: verified }
    - { name: "Obsidian vault export", kind: file_export, claim: "to_obsidian() generates a full wikilinked vault (one .md per node/community) so the graph is browsable in Obsidian's own graph view", evidence: "graphify/export.py:510", confidence: inferred, note: "Function signature and call site confirmed; body not read in depth." }
    - { name: "Cypher / Neo4j / GraphML export", kind: file_export, claim: "to_cypher() emits a CREATE-statement script; push_to_neo4j() writes directly to a live Neo4j instance; to_graphml() for interchange with Gephi/yEd-class tools", evidence: "graphify/export.py:351,356,914,980", confidence: inferred, note: "Function existence and names verified via grep + signature; bodies not read." }
    - { name: "Wiki export (to_wiki)", kind: file_export, claim: "wiki.py generates a community-article + god-node-article wiki structure with an index.md, separate from the Obsidian vault path", evidence: "graphify/wiki.py:25,92,128,168", confidence: inferred, note: "Signatures grepped; module body not read (see coverage.not_read)." }
  findings:
    - { claim: "The MCP token-budgeted text serializer truncates the *entire* rendered subgraph string at a fixed char budget (~3 chars/token) rather than ranking nodes to fit the budget then rendering edges within that set precisely — nodes are pre-sorted by degree first so truncation drops low-degree tail content, but there is no per-tool token accounting beyond this one function", evidence: "graphify/serve.py:92-109", confidence: verified }
    - { claim: "All MCP tool text output is run through sanitize_label() (HTML-escape, control-char strip, 256-char cap) before being handed to the calling agent — the presentation layer treats graph content as adversarial input, not just display text", evidence: "graphify/serve.py:98,104, graphify/security.py:228", confidence: inferred, note: "sanitize_label call sites verified; the function body itself (security.py:228) was not read (past the ~line-100 point covered)." }

q7_bad_code_analytics:
  detectors:
    - { name: god_nodes, technique: "raw NetworkX degree centrality, filtered to exclude file-hub and method-stub nodes", output: "ranked list of {id, label, degree}", evidence: "graphify/analyze.py:39-58", confidence: verified }
    - { name: surprising_connections, technique: "composite heuristic score (confidence tier + cross-file-type + cross-repo + cross-community + peripheral-to-hub degree gap + a 1.5x semantic-similarity multiplier), not a standard graph algorithm", output: "ranked cross-file/cross-community edges with a human-readable 'why' explanation per hit", evidence: "graphify/analyze.py:131-184,187-249", confidence: verified }
    - { name: suggest_questions, technique: "5 independent heuristic passes: AMBIGUOUS edges, betweenness-centrality bridge nodes (nx.betweenness_centrality, approximated via sampling above 1000 nodes), god nodes with >=2 INFERRED edges, isolated/weakly-connected nodes, low-cohesion (<0.15) communities", output: "list of {type, question, why} prompts for a human or agent to investigate", evidence: "graphify/analyze.py:337-451,364-368", confidence: verified }
    - { name: "Knowledge Gaps report section", technique: "isolated nodes (degree<=1) + thin communities (<3 real nodes) + high-ambiguity threshold (>20% AMBIGUOUS edges)", output: "a GRAPH_REPORT.md section flagging likely missing documentation/edges", evidence: "graphify/report.py:139-166", confidence: verified }
  fix_support:
    verdict: none
    claim: "No detector emits a proposed fix, diff, or refactor. Output is uniformly descriptive/diagnostic (a ranked list, a question, a report line) — the intended consumer is a human or an agent that reads the report/MCP output and decides what, if anything, to change."
    evidence: "graphify/report.py:1-181"
    confidence: verified
  absent:
    - { detector: "cyclomatic complexity / any per-function complexity metric", looked_in: "analyze.py, extract.py node schema, report.py", result: "no field or function computes it; node schema (q5) has no numeric metric properties at all", confidence: verified, note: "grep -rni 'cyclomatic|complexity' graphify/*.py matches only export.py cosmetic UI code (unrelated), not an analytics function." }
    - { detector: "taint analysis / source-sink tracking", looked_in: "analyze.py, security.py (which is about graphify's *own* input safety, not a user-code taint analyzer)", result: "no taint, source, sink, or sanitizer vocabulary anywhere in the package", confidence: verified }
    - { detector: "code smell / lint-style pattern detection", looked_in: "analyze.py, report.py", result: "none; the closest analog is the structural 'Knowledge Gaps' heuristics above, which flag graph-shape anomalies (isolation, low cohesion) rather than code smells", confidence: verified }
  findings:
    - { claim: "graph_diff() compares two graph snapshots (added/removed nodes and edges, keyed by (min(u,v),max(u,v),relation) for undirected graphs) purely as a NetworkX set-difference utility — it is not wired to git history anywhere in the package; nothing passes it two commits' worth of graphs automatically", evidence: "graphify/analyze.py:459-540", confidence: verified }

# Architecture outside the 7 questions that bears on cpg-me-daddy's deferred/proposed items.
adjacent_findings:
  - topic: "git-history awareness via hooks, not via a graph query"
    claim: "graphify installs real post-commit and post-checkout git hooks (graphify hook install) that auto-trigger an AST-only rebuild (_rebuild_code, no LLM) after every commit and every branch switch, with rebase/merge/cherry-pick guards to avoid firing mid-operation; core.hooksPath (Husky-style) is respected"
    evidence: "graphify/hooks.py:45-84,87-126,138-157"
    confidence: verified
    ties_to: [X2]
    note: "This is git-triggered incrementality, not git-history-aware analytics (no commit-frequency/co-change/blame signal feeds into any node/edge property) — X2 as proposed in cpg-me-daddy is about mining history for signal, which graphify does not do; graphify's hooks are purely a freshness mechanism."
  - topic: "LLM-in-the-loop extraction conflicts with local-compute privacy"
    claim: "The documented default pipeline (not just an opt-in flag) sends up to 20000 chars per file of doc/paper/image content to either Claude Code subagents or directly to the Anthropic/Moonshot API for semantic extraction — code files never leave the machine (AST-only), but any non-code corpus content does by design"
    evidence: "graphify/llm.py:48-61,113-134, graphify/skill.md:242-290"
    confidence: verified
    ties_to: [PR7]
