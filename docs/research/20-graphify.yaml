schema_mapping:
  verdicts:
    joern_aligned:
      verdict: "no"
      why: "graphify's node/edge vocabulary was designed from scratch for RAG/agent-query purposes (a flat, untyped node with a file_type enum; free-text edge relation strings), with no reference to Joern's CPG spec anywhere in the docs or code — there is no METHOD_FULL_NAME, no AST_NODE hierarchy, no analogous typed schema at all."
      evidence: "ARCHITECTURE.md:32-47"
      confidence: verified
    density:
      verdict: sparse
      why: "Like cpg-me-daddy, graphify does not emit a node per AST token — only classes, functions/methods, imports, and (for some languages) static-property/constant references become nodes. No per-statement, per-expression, or per-identifier nodes were found in any extractor read."
      evidence: "graphify/extract.py:766-857,928-999"
      confidence: verified
    identity_model:
      verdict: global_relink
      why: "Node IDs are file-local strings (D5-style local determinism), but the mechanism that actually connects the graph across files — calls and Python imports — is a single flat {label: id} dictionary rebuilt over the whole batch on every run, exactly the pattern D5 names as Joern's load-time linker and rejects. The difference from Joern is scope (only calls/imports use it, not full symbol tables) and cost (it's cheap because it's just a dict build, not a real linker pass) — but the failure mode (whole-corpus relink required for correctness, silent last-write-wins on name collision) is the same shape."
      evidence: "graphify/extract.py:3438-3455"
      confidence: verified
    update_model:
      verdict: hybrid
      why: "Code-only changes get a genuinely incremental AST-only rebuild (watch.py/hooks.py, no LLM, triggered per-file-change or per-commit). But cross-file resolution inside that incremental extract() call is scoped only to the files passed in that call — not the whole existing graph — so incremental updates cannot create or refresh cross-file call/uses edges that involve an unchanged file. Non-code (doc/paper/image) changes always require a full LLM re-extraction pass (needs_update flag, --update)."
      evidence: "graphify/watch.py:36-60, graphify/skill.md:860-897"
      confidence: verified
  node_vocabulary:
    - { theirs: "code node (untyped; label ends '()' => function/method)", ours: METHOD, fit: approx, note: "No dedicated METHOD label — same physical node shape as a class node, disambiguated only by label string pattern.", evidence: "graphify/extract.py:960-997" }
    - { theirs: "code node (class_types match; label = class name)", ours: TYPE_DECL, fit: approx, note: "Same generic node shape as functions; only the emitting call site differs.", evidence: "graphify/extract.py:776-790" }
    - { theirs: "file-level node (file_nid, label=filename)", ours: FILE, fit: approx, note: "One node per file, but also absorbs some MODULE-like role (no separate module concept).", evidence: "graphify/extract.py:763-764" }
    - { theirs: "stub/placeholder node for unresolved base class (empty source_file)", ours: UNKNOWN, fit: approx, note: "Functionally close: a synthetic node standing in for something the extractor could not locate.", evidence: "graphify/extract.py:803-810" }
    - { theirs: "node.community int attribute (not a graph node)", ours: COMMUNITY, fit: approx, note: "Same non-persisted-community philosophy as D15 (recomputed via cluster(), not stored as a first-class typed node) but materialized as an attribute rather than a node+MEMBER_OF edge pair.", evidence: "graphify/cluster.py:59-104, graphify/serve.py:32-39" }
    - { theirs: "(none)", ours: SYMBOL, fit: absent, note: "No fqn-keyed indirection layer of any kind — see identity_model verdict.", evidence: "graphify/extract.py:3438-3443" }
    - { theirs: "(none)", ours: PARAM, fit: absent, note: "No per-parameter node is emitted by any extractor read.", evidence: "graphify/extract.py:960-997" }
    - { theirs: "(none)", ours: MEMBER, fit: absent, note: "Class fields/members are not extracted as distinct nodes; only classes and methods are.", evidence: "graphify/extract.py:776-857" }
    - { theirs: "(none)", ours: TAG, fit: absent, note: "No triage/tagging node type or mechanism.", evidence: "graphify/validate.py:4" }
    - { theirs: "(none)", ours: DIRECTORY, fit: absent, note: "No directory-level node; files attach directly into the graph.", evidence: "graphify/extract.py:763-764" }
    - { theirs: "semantic 'concept' node (empty/non-file source_file, LLM-injected)", ours: "(none)", fit: extra, note: "cpg-me-daddy has no analog for a purely conceptual, non-source-backed node.", evidence: "graphify/analyze.py:93-109" }
  edge_vocabulary:
    - { theirs: calls, ours: CALLS, fit: approx, note: "Concept match, but graphify's calls carry only a confidence enum + optional weight, not cpg-me-daddy's richer status/reason/resolvedBy fields.", evidence: "graphify/extract.py:1163-1173" }
    - { theirs: inherits, ours: INHERITS_FROM, fit: exact, note: "Same relation, same direction (subclass -> base).", evidence: "graphify/extract.py:811,832,857" }
    - { theirs: "imports / imports_from", ours: IMPORTS, fit: approx, note: "graphify's import edges are file-to-file/module; ours may carry richer resolution status.", evidence: "graphify/extract.py:1341" }
    - { theirs: contains, ours: DECLARES, fit: approx, note: "file/class 'contains' function or class — same containment concept, different name.", evidence: "graphify/extract.py:790,977" }
    - { theirs: "uses (cross-file INFERRED, import-based)", ours: DEPENDS_ON, fit: approx, note: "Coarse cross-file dependency signal, same INFERRED-confidence spirit as our overlay-tier DEPENDS_ON.", evidence: "graphify/extract.py:2758-2789" }
    - { theirs: "uses_static_prop / references_constant / bound_to / listened_by / uses_<helper>", ours: "(none)", fit: extra, note: "A family of ad hoc, framework-specific (PHP/Laravel container binding, JS event listeners) relation strings with no central registry and no cpg-me-daddy analog.", evidence: "graphify/extract.py:1219-1298" }
    - { theirs: "semantically_similar_to / conceptually_related_to / shares_data_with / cites / references", ours: "(none)", fit: extra, note: "LLM-only relation vocabulary for the semantic layer; cpg-me-daddy has no fuzzy-similarity edge type.", evidence: "graphify/analyze.py:171-173, graphify/llm.py:44" }
  ours_unmatched:
    - { ours: SYMBOL, why_absent_there: "No indirection layer exists; identity is the flat file-local ID + global label-dict relink pattern (see identity_model).", evidence: "graphify/extract.py:3438-3455" }
    - { ours: PARAM, why_absent_there: "Extractors stop at function/method granularity; parameters are never walked into as nodes.", evidence: "graphify/extract.py:960-997" }
    - { ours: MEMBER, why_absent_there: "Class fields are not extracted; only class and method/function declarations become nodes.", evidence: "graphify/extract.py:776-857" }
    - { ours: TAG, why_absent_there: "No triage/labeling subsystem; the closest concept is the free-text 'relation' string on edges.", evidence: "graphify/validate.py:5" }
    - { ours: DIRECTORY, why_absent_there: "Filesystem hierarchy above the file level is not modeled as nodes at all.", evidence: "graphify/extract.py:763-764" }
    - { ours: META_DATA, why_absent_there: "No graph-singleton metadata node; run-level facts (token cost, corpus size) live only in the transient GRAPH_REPORT.md text, not in the graph itself.", evidence: "graphify/report.py:56-63" }
  theirs_unmatched:
    - { theirs: "semantically_similar_to / conceptually_related_to (LLM-fuzzy edges)", why_we_lack_it: "cpg-me-daddy's resolution model (D26, adapter-native/LSP/SCIP) is deliberately precision-first and structural; there is no place in the schema for a confidence-scored fuzzy-similarity edge between arbitrary node pairs.", would_we_want_it: "no" }
    - { theirs: "cross-domain (code<->doc<->paper<->image) graph unification", why_we_lack_it: "cpg-me-daddy is scoped to source code only; there is no ingestion path for documents, PDFs, or media.", would_we_want_it: "no" }
    - { theirs: "git hook-triggered auto-rebuild (post-commit/post-checkout)", why_we_lack_it: "cpg-me-daddy's update trigger is file-save inside the editor (D17's 2s/5s save-to-ready target), not a git event; X2 (git awareness) is about mining history for signal, not about triggering rebuilds off commits.", would_we_want_it: "maybe" }
    - { theirs: "multi-repo graph merge (merge-graphs)", why_we_lack_it: "cpg-me-daddy is a single-workspace VS Code extension with no recorded multi-repo story.", would_we_want_it: "maybe" }

lessons_for_cpg_me_daddy:
  - id: L1
    lesson: "Never let a name-based global dictionary (even a cheap one, even scoped to just calls/imports) stand in for symbol resolution — keep cross-file linking strictly behind the SYMBOL/fqn indirection layer, with no fallback path that resolves-by-label across the whole corpus."
    stance: reject
    ties_to: [D5]
    why: "graphify's global_label_to_nid (extract.py:3438-3455) is exactly the pattern D5 rejects, and it visibly produces two failure modes even in a system that doesn't pretend to be precise: silent last-write-wins on same-named symbols, and incremental updates that can't create/refresh cross-file edges touching unchanged files (see update_model). D5's SYMBOL indirection is the correct answer to both; this repo is the negative case study that justifies it."
    cost: "None — this is confirmation to hold the line already drawn, not a new cost."
    evidence: "graphify/extract.py:3438-3455"
    confidence: verified
  - id: L2
    lesson: "When an incremental update pass only re-derives edges from the files it was given, explicitly invalidate (or at minimum flag as stale) any previously-resolved cross-file edge whose target file changed — don't let a partial extraction silently leave old cross-file edges unrefreshed."
    stance: adopt
    ties_to: [D5, PR3]
    why: "graphify's --update path (skill.md:860-935) re-runs extract() only on changed files; its cross-file 'uses'/'calls' resolution dict is rebuilt from only those files, so a changed function's cross-file callers are never notified and never re-linked. cpg-me-daddy's planDelta()/CypherOps model (PR3, the graph is a cache) is exactly the right place to make this explicit — a per-file delta should be required to mark SYMBOL-adjacent edges for re-evaluation, not merely leave stale ones in place."
    cost: "Requires planDelta() to know which SYMBOL nodes a changed file's edges pointed at (or could point at) so it can flag them; some extra bookkeeping per delta, but far cheaper than a full relink."
    evidence: "graphify/skill.md:860-897, graphify/extract.py:3438-3443"
    confidence: verified
  - id: L3
    lesson: "Keep node schemas explicitly typed (a `label`/`kind` field, not a string-shape heuristic) even under pressure to support many languages cheaply — do not let downstream consumers (analytics, presentation) re-derive node type by pattern-matching a display label."
    stance: reject
    ties_to: [D37]
    why: "graphify's analyze.py:_is_file_node has to guess whether a node is a real entity, a file hub, or a method stub by checking if the label ends in '()' or equals the source filename (analyze.py:11-36) — a maintenance liability and a source of misclassification (e.g. any real function literally named the same as its file would misclassify). cpg-me-daddy's 14 explicit typed labels avoid this entirely by construction."
    cost: "None — this is a decision already made (D37, Joern alignment option (b)); this lesson is evidence it was the right one."
    evidence: "graphify/analyze.py:11-36"
    confidence: verified
  - id: L4
    lesson: "A cheap, file-hash-keyed extraction cache namespaced by extraction kind (ast vs semantic) is worth having even alongside a change-log-based update mechanism — it catches the 'file touched but content byte-identical' case and, for Markdown-like content, can be made metadata-blind (skip YAML frontmatter) to avoid churn on tag-only edits."
    stance: watch
    ties_to: [D17]
    why: "cpg-me-daddy's save-to-ready targets (D17: 2s/5s) are about editor-triggered single-file updates, where a content-hash cache adds little (the file obviously changed, that's why the event fired). It becomes valuable if/when cpg-me-daddy adds a bulk reindex path (e.g. after a branch switch or `cpg index` on a large workspace) where many 'touched' files are byte-identical to what's already indexed."
    cost: "Trigger: if a bulk/whole-workspace reindex path is added (branch switch, `cpg index --force`, or similar), add a content-hash short-circuit before re-parsing; until then, skip it."
    evidence: "graphify/cache.py:20-85"
    confidence: verified
  - id: L5
    lesson: "Expose a graph_diff-shaped 'what changed between two graph snapshots' primitive early, even before git-history awareness (X2) is agreed — it is useful on its own (regression/before-after comparison for `cpg index` runs) independent of whether history-mining ships."
    stance: adopt
    ties_to: [X2]
    why: "graph_diff() (analyze.py:459-540) is a small, self-contained NetworkX set-difference utility that graphify does NOT wire to git — proving the primitive is useful in isolation and cheap to build, decoupled from the much bigger X2 question of whether to mine commit history for signal."
    cost: "A few hours: two graph snapshots in, a diff dict out (added/removed nodes, added/removed edges by (source,target,relation) key). No dependency on X2 being agreed."
    evidence: "graphify/analyze.py:459-540"
    confidence: verified
  - id: L6
    lesson: "If cpg-me-daddy ever exposes an MCP tool that renders a subgraph as text for an agent, budget-truncate by pre-ranking nodes (e.g. by degree or resolution confidence) before serializing, not by truncating the rendered string — but go further than graphify and drop/re-render edges consistently with whatever nodes survive truncation, rather than leaving dangling edge lines."
    stance: watch
    ties_to: [D35, AM3]
    why: "graphify's _subgraph_to_text (serve.py:92-109) sorts nodes by degree first (good instinct) but then blindly char-truncates the joined output, which can cut a node's label mid-word or leave an EDGE line referencing a NODE line that got truncated away. AM3's ≤12-MCP-tools discipline means whichever tools we do ship need to get this right the first time."
    cost: "Trigger: when D35's MCP shim adds any tool that returns a bounded-size subgraph rendering (not just a query_graph-analog) — budget the token accounting per-tool at design time, not as an afterthought."
    evidence: "graphify/serve.py:92-109"
    confidence: verified
  - id: L7
    lesson: "Do not send source content to a third-party LLM API as a default (non-opt-in) step of a 'read my code' pipeline — keep any LLM-touching feature strictly opt-in and clearly separated from the local/offline path, the way D6 separates analytics from the raw CPG."
    stance: reject
    ties_to: [PR7]
    why: "graphify's documented default pipeline dispatches Claude Code subagents (or hits the Anthropic/Moonshot API directly via llm.py) for any non-code file in the corpus — not gated behind an explicit flag for that content type. cpg-me-daddy's PR7 (privacy and local compute) is the correct constraint to hold; this repo shows what happens when a project's core value prop (rich semantic relations) requires giving that up."
    cost: "We give up graphify's ability to produce fuzzy semantically_similar_to / conceptually_related_to edges across code and docs; acceptable, since cpg-me-daddy's scope is code-only structural/behavioral analysis, not a general knowledge graph."
    evidence: "graphify/llm.py:48-61, graphify/skill.md:242-290"
    confidence: verified
  - id: L8
    lesson: "A degree-based 'god nodes' + cohesion-scored community view is a legitimate, cheap first analytics surface — worth keeping in mind as a floor for what D6's projection-based analytics should beat, not just a strawman."
    stance: watch
    ties_to: [D6, D23]
    why: "graphify ships god_nodes/cohesion_score/suggest_questions with zero language-specific logic and gets genuinely actionable output (isolated nodes, low-cohesion communities, bridge nodes) purely from graph topology. cpg-me-daddy's overlay tier (COMMUNITY/MEMBER_OF/TARGETS/DEPENDS_ON) is aimed at richer things (import-cycle detection, centrality), but this is a reminder that even trivial topology metrics deliver value before any taint/complexity work lands."
    cost: "Trigger: when D6's first analytics-on-projections milestone is scoped, check whether pure-topology metrics (degree, cohesion) are already covered before investing in anything more complex."
    evidence: "graphify/analyze.py:39-58,125-133"
    confidence: verified

