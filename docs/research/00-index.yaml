# first.
matrix:
  columns:
    [
      repo,
      lang,
      parser,
      grammars,
      lsp,
      storage,
      node_model,
      edge_model,
      identity,
      update,
      joern_aligned,
      density,
      surfaces,
      analytics,
      license,
    ]
  rows:
    - repo: codeprism
      lang: Rust
      parser: "tree-sitter 0.24, native, in-process"
      grammars: 5
      lsp: none
      storage: "in-process DashMap GraphStore; no external DB"
      node_model: "typed Node{kind,name,...} + NodeId, one graph shared across languages"
      edge_model: "typed Edge{kind}, ~6 kinds observed"
      identity: file_local
      update: hybrid
      joern_aligned: no
      density: mixed
      surfaces: "MCP (20 tools)"
      analytics: "regex/keyword scans over raw text — NOT graph traversals (see convergent_findings)"
      license: "MIT OR Apache-2.0 (safe_to_borrow)"
      file: 10-codeprism.yaml
    - repo: graphify
      lang: Python
      parser: "py-tree-sitter >=0.23, native, in-process; plus an LLM extraction path (Claude/Kimi) for non-code content"
      grammars: 22
      lsp: none
      storage: "in-memory NetworkX -> graph.json (neo4j optional, unverified writer)"
      node_model: "one untyped node {id,label,file_type,source_file,source_location}"
      edge_model: "open-vocabulary `relation` string + {EXTRACTED,INFERRED,AMBIGUOUS} confidence"
      identity: global_relink
      update: hybrid
      joern_aligned: no
      density: sparse
      surfaces: "Claude Code skill, MCP (7 tools), GRAPH_REPORT.md, Obsidian/HTML/SVG export"
