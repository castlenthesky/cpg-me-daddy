# Comparative research index — five code-graph tools, investigated 2026-09-14
# Written by the orchestrator AFTER all five studies landed. Every number here is a rollup of a sibling
# file; nothing is asserted here that is not evidenced there. Follow the `file:` pointer for evidence.
# House rule carried over from the sibling files: this index ROLLS UP, it never ASSERTS. A claim that
# exists only here and not in a study file is unsourced and should be deleted.
# Parent: ../../.agent/knowledge/planning-sessions/2026-09-11.project-outline/40-research.yaml

meta:
  session_date: 2026-09-14
  purpose: >
    Pressure-test cpg-me-daddy's schema (50-schema.md), its SYMBOL-indirection bet (D5) and its
    incremental-update bet (PR2) against five third-party tools that build graphs from source, sitting
    alongside cpg-me-daddy in ~/projects/foss.
  method: >
    Keyword/dependency triage across all 16 sibling directories (tree-sitter, code property graph, joern,
    doxygen, AST, language-server terms) narrowed 16 to 5 candidates worth deep study. One subagent per
    repo, read-only, wrote one YAML file each — evidence as path:line inside the studied repo, verified vs
    inferred confidence, negative findings (not_applicable) requiring >= 2 independent probes. The
    orchestrator then spot-checked citations directly against each repo's source (see qa_pass below) and
    wrote this index.
  schema_under_test: ../../.agent/knowledge/planning-sessions/2026-09-11.project-outline/50-schema.md
  baseline_caveat: >
    cpg-me-daddy is mid-rewrite: the `discovery` branch's working tree has 306 files deleted and stub
    packages; the real engine every study file compares against is `packages/engine` at git HEAD (verified
    directly: HEAD f18ee71 on `discovery`, 340 uncommitted changes / 306 deletions; the default-branch
    worktree used for this sweep has the same 14-label/15-edge schema at its own HEAD 27361a3). Studies
    were instructed to cite this baseline as established fact, never to re-derive it from the working tree.
  studies:
    - {
        id: C1,
        file: 10-codeprism.yaml,
        repo: codeprism,
        commit: "8115b77 2025-08-11",
        relevance: in_scope,
      }
    - {
        id: C2,
        file: 20-graphify.yaml,
        repo: graphify,
        commit: "3755fdc 2026-04-30",
        relevance: in_scope,
      }
    - {
        id: C3,
        file: 30-repowise.yaml,
        repo: repowise,
        commit: "383c5db 2026-04-30",
        relevance: in_scope,
      }
    - {
        id: C4,
        file: 40-code-review-graph.yaml,
        repo: code-review-graph,
        commit: "0919071 2026-04-21",
        relevance: in_scope,
      }
    - {
        id: C5,
        file: 50-codeatlas-vsix.yaml,
        repo: CodeAtlasVsix,
        commit: "44f047d 2020-05-29",
        relevance: in_scope,
      }
  qa_pass: >
    The orchestrator independently re-verified 6 citations spanning all 5 files, chosen from claims the
    schema's own consistency check flagged as suspicious (a `confidence: verified` claim citing a file
    listed in that study's own `meta.coverage.not_read`). All 6 checked out as accurate — real file, real
    line, matching the claim — including a claim that code-review-graph's `resolve_bare_call_targets()`
    (graph.py:466) is implemented but never called, confirmed by grep finding no call site anywhere in the
    codebase. The flagged files were narrowly grepped for one function, not fully read, so citing them as
    `not_read` while citing a specific verified line from them is imprecise bookkeeping, not fabrication.
    No fabricated citation was found in this sample. Full audit not run to exhaustion; treat the corpus as
    spot-checked, not line-by-line certified.
  caveat: >
    Coverage ranged from graphify's 16/21 modules to CodeAtlasVsix's ~9/597 files (a 600-file C#/native
    repo with a vendored 561-file graph library that was reasonably left unread). Lower-coverage studies
    (CodeAtlasVsix, code-review-graph at 13/56) lean more on `inferred` claims and `skimmed` files; their
    `not_investigated` and `open_questions` sections say where. This is disclosed per-study in
    `meta.coverage`, not hidden.

# ------------------------------------------------------------------------------------------------------
# The side-by-side. One row per repo. Every cell traces to its study file — see qa_pass for spot-check
