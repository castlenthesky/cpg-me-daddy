      node_model: "typed Symbol nodes, file-path-prefixed id"
      edge_model: "typed edges incl. calls/imports; community_id persisted un-versioned on nodes"
      identity: file_local
      update: hybrid
      joern_aligned: no
      density: sparse
      surfaces: "MCP (docs say 7, code registers 16), local web dashboard, LLM-generated wiki"
      analytics: "git-history hotspot/co-change (exponential decay, half-life ~180d), architectural-decision mining, dependency graph"
