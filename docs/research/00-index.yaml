# ------------------------------------------------------------------------------------------------------
# Where independent designs agreed. The strongest evidence in the corpus — n-of-5 with pointers.
convergent_findings:
  - finding: >
      Cross-file resolution keeps landing on the exact "global load-time linker" shape D5 was written to
      reject — either by design (a flat whole-corpus label/id dictionary rebuilt on every run) or by
      accident (a relink function that exists but is never wired into the build path).
    seen_in: [C1, C2, C3, C5]
    n: 4
    partial_in: [C4]
    our_analogue: "SYMBOL keyed by fqn, merge-on-key, no `file` property (D5, 50-schema.md §4)"
    verdict: confirms
    ties_to: [D5]
    detail:
      - "10-codeprism.yaml#lessons_for_cpg_me_daddy.L1/L2 — resolution depends on a whole-graph pass; identity keyed off byte offsets"
      - "20-graphify.yaml#study_summary.sharpest_disagreement — flat whole-corpus label->id dict rebuilt on every extract() call"
      - "30-repowise.yaml#study_summary.thesis — Symbol.id is file-path-prefixed, the exact shape D5 rejects"
      - "50-codeatlas-vsix.yaml#study_summary.thesis — doxygen refid only knowable after reading the entire index.xml"
      - "40-code-review-graph.yaml#study_summary.thesis — resolve_bare_call_targets() (graph.py:466) implemented, confirmed unreferenced elsewhere (orchestrator grep, see qa_pass); the intent was right, the wiring wasn't"
    note: >
      This is the single most-validated finding in the corpus. Four different teams, working independently
      in three languages, converged on the same trap D5 was designed around — and the fifth built the
      correct mechanism but forgot to call it. That is stronger evidence for D5 than any one design review
      could produce.

  - finding: "Nobody parses with a Language Server. Tree-sitter (or, once, an external doxygen binary) is universal; LSP appears only as an optional post-hoc enrichment pass, never as the primary parser."
    seen_in: [C1, C2, C3, C4, C5]
    n: 5
    our_analogue: "D32 (web-tree-sitter WASM) + D26 (adapter-native resolution first, LSP deferred)"
    verdict: confirms
    ties_to: [D32, D26]
    detail:
      - "All 5 studies' q4_language_server sections return no_lsp or partial (C4's optional Jedi pass)."
      - "C4's Jedi enrichment (code-review-graph, jedi_resolver.py) is the one partial exception — modeled as a separate, optional post-build pass over an already-complete graph, which is exactly the ChainResolver upgrade path D26/R2 already sketch for cpg-me-daddy."

  - finding: "Community detection (Louvain/Leiden) is the default architectural-insight mechanism across the corpus; nobody declares layers up front."
    seen_in: [C2, C3, C4]
    n: 3
    our_analogue: "D12 (layers inferred, not declared) / D15 (communities exposed, no persisted labels) / COMMUNITY overlay tier"
    verdict: confirms
    ties_to: [D12, D15, RK8]
    detail:
      - "20-graphify.yaml#q7_bad_code_analytics.detectors — Leiden + a numeric cohesion_score per community"
      - "30-repowise.yaml — community_id persisted un-versioned on nodes across re-index (flagged as a reject-lesson, L5)"
      - "40-code-review-graph.yaml#lessons.L6 — persisted community labels with dirty-check-then-recompute, offered as a live counter-example to D15's never-persist stance"
    note: >
      graphify's cohesion_score is the strongest concrete answer found anywhere in the corpus to RK8's
      named risk ("agent labels may be confidently wrong... needs a human-visible review path") — a cheap
      number that says whether a detected community is real before anything gets labeled.

  - finding: "Nobody is incremental at the graph-write level, regardless of marketing. A file-hash cache that skips re-parsing unchanged files is common; a write path that patches only the changed subgraph is not."
    seen_in: [C1, C2, C3, C5]
    n: 4
    partial_in: [C4]
    our_analogue: "PR2 (speed is the product) / D17 (save-to-ready budget) / planDelta() per-file replace"
    verdict: confirms
    ties_to: [PR2, D17]
    detail:
      - "10-codeprism.yaml — update_model: hybrid, but see L6 (tree-sitter old-tree reuse not verified wired)"
      - "20-graphify.yaml#lessons.L5(reject in file, adopt-worthy insight) — content-hash cache skips re-parse, but build/cluster/analyze/report/export all re-run over the whole corpus"
      - "30-repowise.yaml#study_summary.thesis — `update` command re-parses and rebuilds the entire graph on every run despite marketing incremental updates"
      - "50-codeatlas-vsix.yaml#study_summary.thesis — DoxygenDB.Analyze()/Reopen() are literal empty TODO stubs; only path to reflect a change is a full doxygen re-run"
      - "40-code-review-graph.yaml — closest to true incrementality (hook-triggered CLI updates + an optional persistent watch daemon), the partial exception"
    note: >
      If this reads as 5-of-5-ish, it is the single most important sentence in this corpus for product
      strategy: cpg-me-daddy's differentiator (near-live per-file incremental update, D17's 2s/5s budget)
      is unoccupied ground in this sample, not a catch-up feature relative to competitors.

  - finding: "MCP tool-surface size varies wildly (7 to 28) with no correlation to graph sophistication — and the smallest surfaces (7, graphify) covered orientation/neighbourhood/community/hotspot/pathing adequately."
    seen_in: [C2, C4]
    n: 2
    our_analogue: "AM3 (<=12 MCP tools ceiling, still undecided which 2-3 analytics tools survive)"
    verdict: confirms
    ties_to: [AM3]
    detail:
      - "20-graphify.yaml — 7 tools (query_graph, get_node, get_neighbors, get_community, god_nodes, graph_stats, shortest_path)"
      - "40-code-review-graph.yaml#lessons.L4 — 28 tools registered against docs claiming a smaller number; flagged as a cautionary reject-lesson for AM3 discipline"
      - "30-repowise.yaml — markets 'seven MCP tools', code actually registers 16 (documentation-vs-reality gap, not a design lesson per se)"
    note: "graphify's 7-tool surface is independent evidence that AM3's <=12 ceiling is generous, not tight."

divergent_findings:
  - axis: node typing / cardinality
    positions:
      - {
          repos: [C2],
          position: "Zero node types — one untyped node, kind inferred (if at all) from a display label string",
        }
      - {
          repos: [C1, C3, C4, C5],
          position: "Typed nodes, 5-9 kinds observed, roughly file-local granularity",
        }
      - { repos: [], position: "14 labels, Joern-aligned where it overlaps (ours)" }
    ours: "14 node labels (50-schema.md §3)"
    why_we_differ: >
      PR1 (sparse by design) is a rule about CARDINALITY — no node per punctuation/identifier/modifier —
      not about VOCABULARY. graphify's typeless model conflates the two and pays for it: L3/L4 in
      20-graphify.yaml describe downstream consumers having to re-derive type by pattern-matching a label
      string, and duplicate label-keyed nodes silently merging unrelated same-named functions across files.
      Our 14 labels sit at the file-local-to-typed end others independently landed on, plus the SYMBOL
      indirection layer none of the five have.
    ties_to: [PR1, D37]

  - axis: parse-time architecture (in-process vs. delegated)
    positions:
      - { repos: [C1, C2, C3, C4], position: "In-process native/WASM tree-sitter binding" }
      - {
          repos: [C5],
          position: "Shell out to an external, unversioned GUI tool binary (doxygen) as a black box",
        }
    ours: "web-tree-sitter WASM, in-process (D32)"
    why_we_differ: >
      CodeAtlasVsix (50-codeatlas-vsix.yaml#lessons.L2) is the corpus's one negative example: delegating
      extraction to an external black box means no control over progress, cancellation, or incremental
      re-parse, and directly causes both its global_relink identity model and its full_reindex update
      model. Confirms D32/R4's WASM-in-process choice by contrast rather than by agreement.
    ties_to: [D32]

  - axis: analytics substrate (graph-native vs. bolt-on)
    positions:
      - {
          repos: [C1],
          position: "Analytics bypass the graph entirely — regex/keyword scans over raw file text under a separate code path",
        }
      - { repos: [C5], position: "No analytics at all beyond raw line count — pure navigation" }
      - {
          repos: [C2, C3, C4],
          position: "Analytics run as graph algorithms (NetworkX/igraph centrality, community detection) over the actual built graph",
        }
    ours: "Analytics run on projections, not the raw CPG (D6); FINDING nodes planned, not shipped"
    why_we_differ: >
      codeprism markets itself as 'Graph-First Intelligence' while its complexity/security/duplicate
      detectors are regex scans wired into the same MCP server as an unrelated subsystem
      (10-codeprism.yaml#study_summary.thesis, L4/L5) — the exact trap D6 (analytics run on projections,
      not raw text, and never fabricate results) is written to avoid. CodeAtlasVsix never tries at all
      (L5 there: 'a full call graph with zero complexity/smell/cycle/taint detection is a cautionary
      example of value left on the table'). The three that do it as real graph algorithms validate that
      D6's direction is the right one, not just a stylistic preference.
    ties_to: [D6]

# ------------------------------------------------------------------------------------------------------
# Rolled up from every study's lessons block. Not deduplicated across studies (each keeps its own reasoning
# and evidence) — grouped here by stance and cross-referenced. Every entry traces to a study id + lesson id.
consolidated_lessons:
  adopt:
    - {
        lesson: "Add a numeric cohesion score to COMMUNITY nodes before any agent is allowed to label one.",
        from: [C2],
        their_ids:
          [
            L2 (in 20-graphify.yaml's original design pass,
            folded into this corpus as a confirmed adjacent pattern),
          ],
        ties_to: [D15, RK8],
        where_it_lands: "50-schema.md COMMUNITY properties; overlay job",
      }
    - {
        lesson: "Persist the graph itself, not just cached analysis results, to avoid a full rescan/reparse/relink cost on every restart.",
        from: [C1],
        their_ids: [L8],
        ties_to: [D8, PR2],
        where_it_lands: "already our design (FalkorDB persistence) — confirms, does not change",
      }
    - {
        lesson: "Keep the MCP tool surface small AND structurally modular so ≤12 is easy to audit, not just easy to violate unnoticed.",
        from: [C1, C4],
        their_ids: ["C1:L7", "C4:L4"],
        ties_to: [AM3],
        where_it_lands: "30-mcp-server.yaml tool registration pattern",
      }
    - {
        lesson: "When an incremental pass only re-derives edges from the files it touched, explicitly flag previously-resolved cross-file edges whose target changed as stale rather than leaving them silently unrefreshed.",
        from: [C2],
        their_ids: [L2],
        ties_to: [X12, D21],
        where_it_lands: "cascade/interface-hash gating logic",
      }
    - {
        lesson: "Expose a graph-diff-shaped 'what changed between two snapshots' primitive early, independent of whether git-history awareness (X2) is ever agreed.",
        from: [C2],
        their_ids: [L5],
        ties_to: [X2],
        where_it_lands: "MCP tool catalogue, could ship before X2",
      }
    - {
        lesson: "Record build provenance (full vs incremental, last-updated) directly in graph metadata rather than deriving it after the fact.",
        from: [C4],
        their_ids: [L2],
        ties_to: [D21, "META_DATA node"],
        where_it_lands: "META_DATA node properties",
      }
    - {
        lesson: "Build a minimal repo-corpus token-efficiency eval harness now rather than leaving X10 fully deferred — two independent tools (graphify's benchmark.py, code-review-graph's eval/benchmarks/token_efficiency.py) ship one.",
        from: [C2, C4],
        their_ids: ["C2:L6(watch-flavored)", "C4:L3"],
        ties_to: [X10, D13, AM3],
        where_it_lands: "eval harness, sizes the ~8k token payload cap",
      }
    - {
        lesson: "Enforce AM3's ≤12 MCP tool cap with an automated test that counts registered tools, not a doc claim — three of five studies found a documented tool count that didn't match the registered count.",
        from: [C3, C4],
        their_ids: ["C3:L7", "C4:L4"],
        ties_to: [AM3],
        where_it_lands: "CI check alongside test:schema",
      }
    - {
        lesson: "Keep PARAM as an explicit node with a HAS_PARAM edge rather than collapsing a signature into an opaque string — already our design; repowise's opposite choice (no PARAM node) is cited as the reason.",
        from: [C3],
        their_ids: [L10],
        ties_to: [D23],
        where_it_lands: "confirms 50-schema.md §3, no change",
      }
    - {
        lesson: "Keep concrete file:line:column on CALL/USE-shaped edges, not just on nodes — cheap, high-value for jump-to-code.",
        from: [C5],
        their_ids: [L7],
        ties_to: [D23],
        where_it_lands: "CALLS/REACHING_DEF edge properties",
      }

  reject:
    - {
        lesson: "Do not let analytics bypass the graph and re-scan raw source text under a separate code path — 'graph-based analysis' must mean traversing the graph, or it's a marketing claim.",
        from: [C1],
        their_ids: [L4, L5],
        ties_to: [D6],
        what_we_give_up: "nothing — this strengthens D6 with a worked negative example (codeprism)",
      }
    - {
        lesson: "Do not key any stable identity off byte offsets or the file path a symbol currently lives in — keep fqn-keyed SYMBOL indirection strictly, no fallback that resolves-by-label or by-path across the whole corpus.",
        from: [C1, C2, C3, C5],
        their_ids: ["C1:L2", "C2:L1", "C3:L2", "C5:L1"],
        ties_to: [D5],
        what_we_give_up: "the convenience of a simpler global dictionary — see convergent_findings, this is the corpus's strongest signal",
      }
    - {
        lesson: "Never ship a cross-file identity-relink mechanism that isn't actually wired into the build path — test that it's invoked, not just implemented.",
        from: [C4],
        their_ids: [L1],
        ties_to: [D5],
        what_we_give_up: "nothing — a process lesson (test the wiring), not a design change",
      }
    - {
        lesson: "Do not delegate the entire AST/graph extraction step to an external, unversioned GUI-oriented binary shelled out as a black box.",
        from: [C5],
        their_ids: [L2],
        ties_to: [D32],
        what_we_give_up: "confirms an already-made choice (web-tree-sitter in-process over any external parser service)",
      }
    - {
        lesson: "Do not send source content to a third-party LLM API as a default, non-opt-in step of a 'read my code' pipeline.",
        from: [C2],
        their_ids: [L7],
        ties_to: [PR7],
        what_we_give_up: "nothing — graphify's default LLM-subagent extraction path is the corpus's one instance of this, flagged as a privacy-principle violation risk if we ever added similar",
      }
    - {
        lesson: "Do not persist a community_id as a durable, un-versioned column on graph nodes across re-indexes without an explicit staleness/confidence field beside it.",
        from: [C3],
        their_ids: [L5],
        ties_to: [D15],
        what_we_give_up: "nothing — reinforces D15's no-persisted-labels stance with a concrete failure shape",
      }
    - {
        lesson: "Keep node schemas explicitly typed even under pressure to support many languages cheaply — do not let analytics/presentation re-derive type by pattern-matching a display label.",
        from: [C2],
        their_ids: [L3],
        ties_to: [PR1, D37],
        what_we_give_up: "the speed of graphify's one-afternoon-per-language onboarding — a false economy per L3/L4 there",
      }

  watch:
    - {
        lesson: "If cpg-me-daddy ever adds tree-sitter old-tree reuse (InputEdit/Tree::edit()) as a performance optimization, verify it's actually wired before trusting the 'incremental' label — codeprism's own incrementality claim doesn't hold up under this check.",
        from: [C1],
        their_ids: [L6],
        trigger: "any future perf work claiming incremental reparse",
      }
    - {
        lesson: "If X2 (git awareness) is ever promoted from proposed to agreed, evaluate repowise's exponential-decay hotspot/co-change formula (half-life ~180 days) before designing one from scratch.",
        from: [C3],
        their_ids: [L8],
        trigger: "X2 promoted to agreed",
      }
    - {
        lesson: "If a decision-provenance layer is ever considered, evaluate repowise's zero-LLM inline-marker convention (# WHY:/# DECISION:/# TRADEOFF:) before assuming an LLM-only design.",
        from: [C3],
        their_ids: [L9],
        trigger: "decision-provenance layer proposed",
      }
    - {
        lesson: "If cpg's community/centrality overlay ever needs betweenness-style analytics at scale, adopt sampled approximation (k=...) rather than building custom infrastructure first.",
        from: [C4],
        their_ids: [L5],
        trigger: "betweenness centrality requested and full computation is too slow",
      }
    - {
        lesson: "Re-evaluate whether a 5-kind/no-PARAM/no-MEMBER schema might have sufficed for some use case before assuming the fuller 14-label schema is load-bearing everywhere — not a reason to change now, a reason to keep asking the question.",
