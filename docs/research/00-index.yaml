    - repo: code-review-graph
      lang: Python
      parser: "tree-sitter-language-pack, native, in-process"
      grammars: "pack-based, not individually enumerated"
      lsp: "optional Jedi enrichment pass, Python only, post-build"
      storage: SQLite
      node_model: "5 node kinds"
      edge_model: "8 edge kinds"
      identity: file_local
      update: hybrid
      joern_aligned: no
      density: sparse
      surfaces: "MCP (28 tools — well over AM3's <=12), companion read-only VS Code extension, D3.js visualization"
      analytics: "Leiden communities, blast-radius/impact, dead-code/refactor suggestions, execution-flow tracing, token-efficiency eval harness"
