  - { id: AM-4, text: "SCIP indexers are whole-project only and never single-file incremental: golden oracle and CI pass, not a live resolver. Live precise path: headless language server (Python: basedpyright over LSP; TS: tsserver or compiler API with Program reuse).", status: in-force as the PRIMARY path under HO-a }
  - { id: AM-5, text: "SYMBOL.fqn = SCIP descriptor only; scheme/manager/package/version as separate properties; no `local N` symbols in the graph.", status: in-force; plus the m0 divergence that EXTERNAL symbols carry scheme:package inside the fqn for UNIQUE safety }
  - { id: AM-6, text: "MCP spec 2026-07-28 removed initialize/sessions; shim must be dual-era; only the transport writes stdout; never process.exit on engine errors.", status: in-force, TIME-SENSITIVE (re-verify host survey before U10) }
