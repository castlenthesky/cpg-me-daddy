# 02 — Decisions in force
#
# One entry per decision. Ids are namespaced because two earlier series both used "D1..Dn":
#   DQ-nn  the 2026-09-16/17 decision queue, answered by the owner (binding, verbatim dispositions kept)
#   F-n    follow-up questions created by those answers
#   P-x    the three principles the answers established
#   HO-x   the two human overrides that outrank the older corpus
#   VD-nn  the 2026-09-11 vision-session decisions (status reconciled against everything since)
#   AM-n   research amendments from the 2026-09-11 spikes
#   DL-nn  delivery decisions from the first implementation ladder (kept where the principle survives)
#   T-n    tooling decisions
#   ND-n   NEW decisions this outline takes, with recommended defaults; `review: true` means the owner
#          has not yet explicitly ratified them (silence at the outline review ratifies).
#
# Status vocabulary: in-force | amended | superseded | reversed | deferred | rejected
# Every entry carries `reopen_when`: the observation that would justify reopening it. Reopening without
# such an observation is re-litigation and is refused (P-C).

principles:
  - id: P-A
    title: The producer always runs; every consumer is optional and configurable
    from: [DQ-09]
    statement: >
      There is exactly one graph producer and it always runs. The browser picture, the FalkorDB store,
      the MCP server and the VS Code panel are consumers you switch on. A terminal user who wants raw
      throughput runs the producer alone. The VS Code extension is the producer launched with a
      particular consumer set enabled.
    consequences:
      - the freshness budget is per enabled consumer set and is always reported with that set
      - a verify check that needs a renderer reports `unavailable` when no renderer is enabled; that is a correct answer
      - FalkorDB is a consumer like any other
      - the host may supply consumers and configuration; it may never supply input to the producer (no editor events as truth, no dirty buffers, no workspace-folder authority)
    owner_words: "some users don't use their IDE at all and have moved to a fully terminal-based experience … The graph producer should always run, but the consumers should be configurable and optional."
    reopen_when: never; this is the product definition

  - id: P-B
    title: Revision reconciliation is the correctness spine
    from: [DQ-06, DQ-01]
    statement: >
      Every :CPG node carries the revision_id (sha256 of bytes) of the file it was derived from; the FILE
      node carries the same hash. A node whose revision_id differs from its file's is stale, provably, by
      one indexed query. Every file on disk admitted by the walker has a FILE node. Edges carry no revision;
      a node whose revision changed has, by construction, edges that are up for re-evaluation.
    consequences:
      - "`cpg verify` is thin: it runs the reconciliation and reports"
      - staleness, dropped subtrees and duplicated files are caught by one mechanism
      - the freshness promise has something to measure against
      - a resolver that dies mid-save is NOT caught by this (the graph reconciles perfectly while missing edges); hence the separate `resolution-health` check
    owner_words: "Code decides. Every token and call and element of the AST and CPG related to a file carries the revision_id and that revision_id reconciles to the file node's revision id (content hash)."
    reopen_when: a defect class is found that reconciliation cannot see and no cheaper check exists

  - id: P-C
    title: The schema is versioned and evolvable, not frozen
    from: [DQ-01, F-3]
    statement: >
      The 14 node labels and 15 edge types are settled and protected from re-litigation. Properties on them
      are expected to grow continuously through implementation. Additive change is free; adding a type needs
      one paragraph; renaming, removing or changing meaning needs the reopening test.
    owner_words: "The nodes and edges are not the schema I am calling into question. The actual properties/attributes attached to those nodes for intelligence and analytics is. … the bones are good and I don't have a reason to throw it out."
    reopen_when: node or edge types are being added often (signal the ontology was wrong)

human_overrides:
  - id: HO-a
    date: 2026-09-16
    title: CLI purity is a hard invariant
    statement: Core packages run under plain node with zero `vscode` import, enforced by a build gate and a runtime proof.
    effect: puts the 2026-09-15 "executeDefinitionProvider is the primary resolver" decision OUT OF FORCE; restores VD-26 (adapter-native first) as primary; a VS Code-only resolver may be an optional chained link registered by the host, never primary.
  - id: HO-b
    date: 2026-09-16
    title: Constraint rank (lexicographic)
    statement: "1 CLI-first · 2 visual validation · 3 visual cache AND FalkorDB fresh < 2 s on a delta · 4 VS Code dependency hygiene · 5 sparse AST (prunable later)."
    effect: rank 3 puts the store inside the freshness budget, which reopened WHEN FalkorDB enters (answered by DQ-10/F-2), not WHETHER it can keep up (benchmarked, accepted).

decision_queue:
  - id: DQ-01
    title: What a change to the graph means (model semantics)
    status: in-force
    decided_on: 2026-09-16
    options_considered: [(a) shipped semantics — concatenate on re-add, no revision, (b) full proposal — revision/baseRevision, Read<T>, validatePayload, composeDeltas, edgeId, removedEdgeIds, (c) narrowed proposal with owner-discriminated merge]
    decision: (c) narrowed, with two amendments
    owner_words: "I want revision id for freshness fingerprints, not tracking revisions over time. Validation is important in the models and needs to evolve as discovery uncovers needs in data or structure of relationships in the graph. Approve on option C with narrowed version. Also want to leave the door open for schema evolution as we build/design the graph ontology."
    amendments:
      - revision is a FINGERPRINT (one value per file, overwritten each save, no history), not a version log; combined with DQ-06 it is the file's content hash
      - schema evolution stays open (P-C)
    consequences:
      - "@cpg/model keeps validation, gains revision_id on nodes; drops composeDeltas, edgeId, removedEdgeIds (no consumer among the nine contracts)"
      - "re-adding a node id is neither concat nor whole-node replace: it is a MERGE discriminated by producer/tier (filesystem tier vs code tier), so two producers describing one file cannot destroy each other's data (L-01)"
      - "the shipped characterization test that asserts duplicate-append is inverted in the same commit that lands the merge"
      - "5 of the 8 failing adversarial probes disappear because the machinery they test is not built"
    evidence: [M-LEGIBILITY-C3 (699 payload nodes render as 658 with duplicate ids), L-01]
    unit: U1
    reopen_when: a consumer needs delta composition or edge identity (then add it, additively)

  - id: DQ-02
    title: Path form
    status: in-force
    decided_on: 2026-09-16
    decision: relative wins
    owner_words: "Relative paths - FOR SURE."
    statement: >
      WorkspacePath (workspace-relative, POSIX separators, no leading ./) is the graph's identity form.
      AbsolutePath exists for exactly two adapters: FilesystemProbe (touches the disk) and SourceOpener
      (opens a file in an editor). The node id scheme is confirmed: path:kind:qualifiedScopePath[:ordinal|:bodyHash],
      no file content hash ever.
    consequences:
      - graphs are portable and diffable across machines and checkouts; goldens are possible
      - the store's scope-delete and every node's `file` property agree, closing CS-1 (every save silently doubled a file's node count while four checks stayed green)
      - the content hash lives on the node as revision_id and never in the id (same hash, opposite requirements)
    evidence: [CS-1, AM-1]
    unit: U1
    reopen_when: never after the first persisted write; changing path form invalidates every id in every graph anyone has built

  - id: DQ-03
    title: The missing contracts (the unowned middle)
    status: in-force
    decided_on: 2026-09-16
    options_considered: [(a) write C-PROJECT, C-FS, C-VERIFY as contracts 10–12, (b) fold responsibilities into existing contracts with named owners]
    decision: (b) fold, written properly as its own task; each stage owns its data explicitly
    owner_words: "We should write the contracts and assign a home. Go with option B. … I should have a clear vision of what data is captured and how the model is enriched as it moves through this engine. Each stage should have clear ownership boundaries of data. For example - the filewatcher clearly should own file-related data - that might include the path and filesize and sha hash for revision id?"
    consequences:
      - the stage-ownership table in 03-architecture.md §4 is the deliverable of this decision
      - toWriteOp(file) is required in C-STORE; applyResolutions is required in C-RESOLVE (rules 17/18 become invariants); the filesystem tier belongs to the engine/CLI; revision_id is minted by WATCH ("yes, and it should be the watcher's job")
      - "C-SCHEMA is written regardless: it is the U1 registry port"
      - each fold is a required function signature in a specific contract, not a sentence
    evidence: [CS-2, CS-3, L-27, L-28]
    unit: U1 (table), U2–U6 (implementations)
    reopen_when: a folded responsibility grows past ~300 LOC in its host contract (then split it out, which is cheap)

  - id: DQ-04
    title: Measure the resolver before committing the plan
    status: in-force, materially upgraded
    decided_on: 2026-09-16
    decision: yes, and far more than a half-day spike — a standing verification harness that lands early and grows with the resolver
    owner_words: "We should FOR SURE spend time testing every aspect of the parsing logic, measuring and proving it. This literally is the most critical element of the entire engine. If we can't parse and resolve across files, the CPG fails altogether. Half a day is probably not even close to enough time for the amount of rigor and care I hope we can apply to this layer of the application."
    consequences:
      - "epic E-VERIFY: golden corpus with known-correct answers per language; precision and recall against a language-server oracle; per-language ceilings; latency as a distribution per file size and ref-site count; degradation as a first-class reported number"
      - the freshness promise stops being derived from an estimate; we may learn 2 s wall-to-wall is not keepable at the current design, and learn it from the harness rather than a user
      - "the measured inputs replace derived ones everywhere: 0.5585 sites/LOC and 2.4788 ms/site, not 0.2 and best-case"
    evidence: [CS-7, M-RESOLVE-*]
    unit: U6c (v1), U8, U9
    reopen_when: never; this is a standing capability

  - id: DQ-05
    title: What "under 2 seconds" promises
    status: in-force
    decided_on: 2026-09-16
    decision: the human clock, end to end, covering both consumers
    owner_words: "From file save to resolved graph in falkordb and visual. Wall to wall save->interface layer."
    statement: >
      T0 = filesystem event (the human's clock, not the pipeline's; the debounce has a declared maxWaitMs
      so a burst cannot delay indefinitely). T3 = the change is visible in every enabled consumer, including
      the FalkorDB read-back and the rendered picture. One seq allocator; renderedSeq and confirmedSeq make
      both tiers measurable. The number is always stated with the enabled consumer set.
    consequences:
      - the assembled budget for a 1,068-LOC Python save is ~1,674 ms p50 against 2,000, with the resolver at 88%; it fits at the median and fails at any tail (06-measurements budget)
      - the real limit is ~725 ref sites ≈ ~1,300 changed Python LOC per save (3–5 files), not "~11 files"
      - "cross-file staleness: F-4 disposition applies"
      - "P-A softens this for terminal users: a headless run does not pay the render leg"
    evidence: [M-LATENCY-*, M-BUDGET]
    unit: U4 (file tier), U7 (code tier proven)
    reopen_when: the harness shows the budget is not keepable; then the promise is restated per measured budget, never silently relaxed

  - id: DQ-06
    title: The verify command
    status: in-force, elevated to P-B
    decided_on: 2026-09-16
    decision: code decides, via revision_id reconciliation from every node up to its file's content hash
    owner_words: see P-B
    consequences:
      - "`cpg verify` has six checks (filesystem-reconciliation, identity-invariants, id-uniqueness, render-reconciliation, revision-reconciliation, resolution-health) and four states (pass, fail, stale, unavailable): one shared enum replacing C-CLI's four and C-EXT's four (08-verification.md); `render-reconciliation` is `unavailable` without a renderer consumer; `--strict` fails on `unavailable`"
      - "`cpg verify` is a named deliverable of U2a, not an afterthought (CS-9: the word verify appeared zero times in the spine)"
      - a fifth check `resolution-health` fed from ResolveReport, because reconciliation cannot see a resolver that died (CS-5)
      - when both surfaces exist the VS Code view outranks the browser for daily use; neither is the gate
    evidence: [CS-5, CS-9, M-LEGIBILITY-*]
    unit: U2a
    reopen_when: never

  - id: DQ-07
    title: Fate of the old documentation
    status: amended by ND-7 (2026-09-17)
    decided_on: 2026-09-16
    decision: neither delete nor keep — neutralize
    owner_words: "I want a `superseded` or `archived` folder with an AGENTS.md that instructs agents to ignore all content within those folders. Similarly, each file should be updated so it includes a disclaimer and agent instructions at the beginning of it which instructs agents to ignore the file's contents and that the file exists PURELY for history."
    amendment_2026_09_17: the archived folder lives on a `docs/archive` BRANCH, not in the develop/master working tree, so greps in the working tree can never surface it (ND-7)
    consequences:
      - the success criterion changes from "docs/ is deletable" to "docs/ is inert and this outline is self-contained"
      - "three mechanical reinforcements: the citation gate refuses retired paths in live docs; the archive is read-only except for adding headers; every archived file begins with the exact header block (checked)"
      - the R2 cross-seam defects are transcribed into 05-contracts.yaml before archiving (done here)
    unit: follow-up task after this outline is reviewed (12-retirement.md)
    reopen_when: never

  - id: DQ-08
    title: Where the extension lives, and what packages/ is for
    status: in-force
    decided_on: 2026-09-17
    options_considered: [(a) src/ stays, (b) packages/extension with a gate exemption, (c) exemption declared in the package manifest, (d) separate layer from location — packages/ core, apps/ front doors]
    decision: (d)
    owner_words: "Yes. this is now making sense. Given our monorepo structure, your proposal to move the consumers into the apps/ layer makes complete sense. Let's go with your proposed option D"
    statement: >
      packages/** is core: host-free, portable, runs under plain node, no composition roots. apps/* are front
      doors: each owns a composition root and may import its own host SDK and only its own. The gate rule
      has no per-package exceptions.
    consequences:
      - src/extension.ts moves to apps/vscode/ now, while src/ holds one file (ND-4)
      - the CLI is classified honestly as apps/cli (it has a composition root); the browser inspector is apps/inspector; MCP later apps/mcp
      - U3's "zero new engine code" becomes a build failure when violated
      - packages/ is the producer; apps/ are the consumers — P-A visible in `ls`
      - "three small items settled with it: the plan states 10 units / 16 PRs in one row; cpg.config.yaml is adopted with its loader shipping with `cpg index` at U2; MCP stays at U10 with scope unchanged"
    evidence: [L-26, L-28, L-27]
    unit: U0.2
    reopen_when: never; an invariant with an exemption list is how the invariant dies

  - id: DQ-09
    title: Host-only edges (withhold receiver-type calls until the resolver is headless?)
    status: in-force, promoted to P-A
    decided_on: 2026-09-16
    decision: exactly one producer makes the graph and it runs under plain node; the extension does not write edges the CLI cannot
    owner_words: see P-A
    consequences:
      - EVAL_TYPE reserved by name and shape in the schema with producer none-yet; admitted at U8 gated on a re-run of S3 at >= 95% of ceiling; no schema change at admission
      - resolvedBy and confidence flip to golden exclude so one golden set is possible
      - TypeScript symmetrically held until U9's spike reports
      - the parser does NOT read unsaved editor buffers in v1 (a graph from dirty buffers is not reproducible by cpg index)
      - the VS Code host may register executeDefinitionProvider as an optional chain link behind the same seam, as an oracle or an extra link, never as the primary producer and never writing a second population under CALLS (L-01)
    evidence: [M-RESOLVE-ceiling 31.0%/32.6%, M-RESOLVE-receiver 59.3%, M-RESOLVE-precision 0/305]
    unit: U1 (reserve), U8 (admit)
    reopen_when: a measured TypeScript arm below ~80% of ceiling with no headless path found inside a timebox (then per-language producer tiers with a distinct edge label per tier, still never a host-variant CALLS)

  - id: DQ-10
    title: When FalkorDB enters, and what CI asserts
    status: in-force
    decided_on: 2026-09-16
    decision: FalkorStore is a SEAT until a live delta stream exists, promoted at U5; the CI gate asserts the write was exactly one statement, plus a runner-tolerant absolute ceiling; the latency band is a local benchmark
    owner_words: "I agree with your recommendation here. Wall clock is not a hard CI gate. Falkor enters ONLY AFTER we have the graph generation engine with streamed deltas functioning for incremental atomic updates."
    consequences:
      - CI asserts receipt.statementCount === 1 (free, deterministic, catches the 51x many-small regression) and a ~200 ms absolute ceiling
      - a torn-batch test lands with U5 (a round trip that dies halfway commits some files and not others)
      - p95 16 ms measured on Apple Silicon over loopback is NOT a CI gate; it would flake and a disabled gate is not a gate
    evidence: [M-FALKOR-atomic, M-FALKOR-51x]
    unit: U5
    reopen_when: a measurement above ~500k nodes shows the atomic replace degrading superlinearly (then U5 acquires a sharding decision)

follow_ups:
  - id: F-1
    title: Keep a transport sequence number alongside the revision fingerprint?
    status: in-force
    decision: keep both, named `revision_id` (content hash, on every node) and `seq` (monotonic per workspace, on the delta envelope only, never on a node)
    owner_words: "Keep both. Call them `revision_id` for the content hash and `seq` for the sequence id."
    rationale: revision_id detects staleness and is not ordered; seq detects lost or reordered deliveries and says nothing about currency. Six counters once shared these names across five granularities (CS-4); now there are exactly two with one allocator each (SINK owns seq; WATCH mints revision_id).
    unit: U1, U4

  - id: F-2
    title: Does FalkorDB move from U5 to after U6?
    status: in-force
    decision: NO — stays at U5
    owner_words: "Let's keep it on the file write and NOT move to U6. I like having falkor as a first-class consumer that lets us immediately start inspecting the output of our file-watcher. We can continue to evolve our interrogation of the graph as the graph itself evolves. We can also have agents interact with the FalkorDB via cypher early to check our processing logic with simple traces through the graph to ensure the graph is being built in such a way to answer REAL questions as it is being built."
    consequences: [U5 gates on a synthetic 450-node/449-edge replace so the write shape is proven at volume before U6 supplies real volume; agents may query the file-tier graph via Cypher from U5]
    unit: U5

  - id: F-3
    title: How does the schema stay evolvable without losing its protection?
    status: in-force (see P-C and 04-schema.yaml evolution_policy)
    decision: additive evolution is free; breaking changes need the reopening test; the schema carries a version and conformance tests are generated from it
    unit: U1

  - id: F-4
    title: Which revision does a cross-file edge belong to?
    status: in-force
    decision: edges carry NO revision_id; only nodes do
    owner_words: "Edges don't have revision_ids. Only Nodes. If a node is impacted by a file revision, the edges associated with that node, are, out of necessity, up for re-evaluation and likely invalid. Importantly, the revision is not an attribute of the edge and never should be. The language server will need to help determine how deep we go for establishing the changes' blast radius, not an attribute on the edge."
    consequences:
      - a cross-file edge A->B is re-evaluated when either endpoint's node is re-derived; blast radius is computed by the resolver/cascade (reverse-dependency invalidation, ND-9), not stored on edges
      - until U7 lands cascade, the freshness claim explicitly excludes cross-file staleness caused by a change to the TARGET file (stated in writing, per DQ-05)
    unit: U7

new_decisions:
  - id: ND-1
    review: true
    title: MCP reads through the store; no cpg daemon in v1
    statement: The MCP consumer (U10) reads the graph through GraphStore (FalkorDB when enabled, memory otherwise, in-process). No detached daemon, no .cpg/engine.json discovery, no shim-to-engine IPC in v1.
    rationale: Roughly fifteen must-priority requirements in the old corpus described attaching N shims to one engine process that no plan creates (LA3-05/06). Under P-A the store is already the shared, queryable surface. The daemon design (VD-36, X13, R5's attach algorithm) is preserved, not cancelled.
    reopen_when: a second process needs the PRODUCER live (for example, an MCP client that must observe deltas as they happen rather than query the store)
    supersedes_in_part: [VD-36]

  - id: ND-2
    review: true
    title: FalkorDB modes in v1 are remote and docker; spawned is deferred
    statement: The store connects to an existing instance (remote, default 127.0.0.1:6382 for dev) or runs the pinned image via docker. The spawned mode (download the module, run redis-server --loadmodule) is not built.
    rationale: FalkorDB publishes no standalone server binary; spawned mode cost ~1,100 LOC plus a hand-maintained checksum manifest to work around that and still required the user to install Redis. Docker is the fallback every remedy pointed at anyway. The archived acquire/checksum/cache code is kept in 11-salvage.yaml as ADAPT if this reverses.
    reopen_when: a zero-dependency local start becomes a stated distribution requirement (VD-24 marketplace story)
    supersedes_in_part: [VD-24, VD-36]

  - id: ND-3
    review: true
    title: The inspector picture uses the archived cosmos.gl renderer; layered layout is deferred
    statement: apps/inspector and the VS Code panel render with the discovery lineage's graph-visualizer (cosmos.gl, GPU force layout, radial seed) with a seed threaded through layoutPayload for determinism. The 2026-09-11 choice of sigma + ELK (layered layout for impact/path views) is deferred to the view that needs direction.
    rationale: The picture is a liveness check, not a correctness check (M-LEGIBILITY); it is one renderer serving both hosts; the code is 9 PORT / 7 ADAPT and already measured. LA3-01 recorded that the renderer decision was silently substituted; this makes it explicit.
    reopen_when: an impact or path view ships and needs a DAG layout (then ELK for that view only)
    supersedes: [VD-30 in part (rendering stack)]

  - id: ND-4
    review: true
    title: The apps/ split happens now (U0.2), while src/ holds one file
    statement: Move src/extension.ts to apps/vscode/src/extension.ts; extend check-deps with the two-tier rule; prove it fails both ways.
    rationale: DQ-08 said "in the unit that next touches it — U3 — or now, while it is one file." Every later unit makes the move more expensive; U2 creates apps/cli and apps/inspector and needs the tier rule in place.

  - id: ND-5
    review: true
    title: Schema version 2 -> 3 for the required revision_id property
    statement: Adding revision_id (cardinality one) to every :CPG label and to FILE is a required-property change and bumps meta.version to 3 at U1. META_DATA.schema_version mismatch triggers rebuild, which is the correct behaviour for a graph that is a cache.

  - id: ND-6
    review: true
    title: Python before TypeScript within U6
    statement: U6a lands the Python adapter and goldens; U6b lands TypeScript. Both ship in U6.
    rationale: VD-09 as amended 2026-09-15 (Python first). All resolution measurements are Python-only; TypeScript structural extraction was measured (S2) but TS resolution was not.

  - id: ND-7
    title: Retirement to a docs/archive branch
    decided_on: 2026-09-17
    decided_by: owner
    statement: >
      The retired documentation (everything formerly under the docs directory except this outline, plus
      the deliberation corpus that was never committed) is committed and pushed on a branch named
      `docs/archive` under one top-level folder with an AGENTS.md and per-file disclaimers, so it is
      recoverable but never present in the master or develop working trees.
    owner_words: "Commit and push a branch called `docs/archive` so the archived docs are recoverable if necessary, but also not in the `master` or `develop` working tree where it can and will pollute the agents' context when it inevitably greps the content."
    amends: DQ-07
    unit: follow-up task (12-retirement.md)

  - id: ND-8
    review: true
    title: render-reconciliation is `unavailable` without a renderer consumer
    statement: The verify check that compares rendered node count to payload node count reports `unavailable` (not `fail`, not `skipped`) whenever no renderer consumer is enabled; `--strict` treats `unavailable` as failure. This resolves CS-9 (the CLI could not compute its own mandatory check set) without weakening the check.

  - id: ND-9
    review: true
    title: Cascade is bounded by interface-hash gating, designed into extraction at U6 and enforced at U7
    statement: >
      EXTRACT emits FILE.interface_hash (normalized exported-declaration surface: names, kinds, signatures,
      re-exports). On save, if interface_hash is unchanged the cascade is zero files. If changed, dependents
      are the files with IMPORTS/CALLS/INHERITS_FROM edges into the changed SYMBOLs, not the whole importing
      file set. When the remaining cascade exceeds the per-save budget, the saved file is `ready`, dependents
      are marked `stale` with `stale_reason`, and the background drains them. Readers are never blocked.
    rationale: X12/VD-17/RK9 (severity high, "must be designed in from day one"); TypeScript's BuilderState does exactly this. Nothing in the nine contracts bounded cascade (CS-7 note).
    unit: U6 (emit), U7 (enforce)

  - id: ND-10
    review: true
    title: Statement-level identity non-foreclosure test
    statement: U1's identity tests mint and round-trip a synthetic statement-level id using the `:ordinal` slot of the id rule. If the test cannot be written, the CFG tier is genuinely foreclosed and the deferral (VD-23, VD-10) must be re-argued immediately.
    rationale: Reserved names alone are theatre; an executable test is not (motion M3).

vision_decisions:
  # 2026-09-11 session; status reconciled 2026-09-16 (LA1) and against DQ/F/ND above.
  - { id: VD-01, text: "Cypher is a hard requirement.", status: in-force, note: "Scope was narrowed to the FalkorDB tier; HO-b rank 3 restores its reach at U5." }
  - { id: VD-02, text: "FalkorDB primary store; LadybugDB fallback with a defined trigger (replace p95 <=150 ms @1e6, reader p95 <=150 ms under writes, no unbounded memory).", status: in-force, note: "Trigger never hit in benchmarks. Entry timing settled by DQ-10/F-2 at U5." }
  - { id: VD-03, text: "macOS + Linux now, Windows eventually.", status: in-force }
  - { id: VD-04, text: "Structural tier by default, expression tier opt-in.", status: in-force, note: "HO-b ranks sparseness 5th but measurement (S2) settled that the expression tier is never collected by default; 'collect now, prune later' is rejected." }
  - { id: VD-05, text: "SYMBOL indirection so per-file replace never breaks cross-file edges.", status: in-force, note: "Reaffirmed by the competitive study (4 of 5 tools hit the global-relink trap) and by L-38." }
  - { id: VD-06, text: "Analytics run on projections (call/import/type graphs), not the raw CPG.", status: in-force, note: "Unexercised until U10." }
