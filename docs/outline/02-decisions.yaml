settled_by_measurement_not_reopenable:
  # These are not decisions; they are facts with boundaries. Re-arguing them without a new measurement is refused.
  - single-file save latency does not threaten 2 s (one file, zero cascade, <= ~500k nodes)
  - the DB write dominates the save budget (66–82% at p50) and the write SHAPE is the lever (~6x available from one atomic statement), not the database
  - tree-sitter is not a cost; parser choice may not be argued on latency
  - structural sparsity is met with 3.5–4x headroom; the expression tier is 5.55–5.88x and "collect now, prune later" is rejected
  - the picture cannot verify correctness (self-noise 17.9%, best signal 1.35x)
  - CLI-only resolution reaches ~31–33% of achievable edges and the gap is one capability (receiver type inference, 59.3%); a language-server subprocess is legal under rank 1 and reaches the full host answer set
  - the headless resolver is never wrong where it answers (0/305 disagreements)
  - FalkorDB v4.20.4 semantics as tabulated in 06-measurements (RO_QUERY set, TIMEOUT syntax and 30000/60000 defaults, full rollback with ~1.7x overshoot, no settling window)
  - the unit ORDER U0..U10 (endorsed by every reviewer; real data at U2, cross-file edges at U6)
  - the 14 node labels and 15 edge types (P-C protects them)
