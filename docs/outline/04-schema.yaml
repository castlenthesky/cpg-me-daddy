    doc: "Cross-file identity anchor. Not :CPG, no `file`, no revision_id: a per-file delete cannot touch it. Descriptor grammar: `name/` namespace, `name#` type, `name.` term, `name().` method. `local N` symbols are never in the graph."

  - label: COMMUNITY
    cpg_co_label: false
    has_file_property: false
    ownership: overlay
