    doc: "One per import statement. Resolution status lives on the IMPORTS edge, not here."

  - label: SYMBOL
    cpg_co_label: false
    has_file_property: false
    ownership: identity
    write: merge-on-key
    key: [fqn]
    properties:
      - { name: fqn,      type: string, cardinality: one,       golden: include, doc: "Owner-prefixed SCIP descriptor grammar. Workspace-local: `<path>`/<descriptors>, e.g. `src/users.ts`/UserService#findById(). External: <scheme>:<package>`<descriptors>, e.g. site:node`console.log(). The external prefix is INSIDE the fqn because fqn has a UNIQUE constraint and two packages exporting Foo#bar(). must not collide onto one node. UNIQUE." }
