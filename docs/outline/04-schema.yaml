    joern: { verdict: adopt_as_is, joern_name: TAG, divergence_class: none }
    doc: "Generic classification hook. Classification metadata only; numeric metrics stay typed scalar properties elsewhere so range queries can use an index."

  - label: UNKNOWN
    cpg_co_label: true
    has_file_property: true
    ownership: file-owned
    write: delete-create
    key: [id]
    properties:
      - { name: reason,      type: string, cardinality: zeroOrOne, golden: include }
      - { name: file,        type: string, cardinality: one,       golden: include }
      - { name: revision_id, type: string, cardinality: one,       golden: exclude }
      - { name: range,       type: string, cardinality: zeroOrOne, golden: include }
      - { name: status,      type: string, cardinality: one,       enum: node_status, golden: include }
    joern: { verdict: adopt_as_is, joern_name: UNKNOWN, divergence_class: none, reason: "Escape hatch for unparseable content, paired with FILE{status:error}. Unified triage: UNKNOWN nodes, FILE{status:error} and unresolved CALLS/IMPORTS all surface through one needs_triage TAG (DL-11)." }
    doc: "An unparseable region of an otherwise-parsed file."

  - label: META_DATA
    cpg_co_label: false
    has_file_property: false
    ownership: graph-singleton
    write: merge-on-key
    key: []
    properties:
      - { name: schema_version, type: int,      cardinality: one,  golden: include, doc: "Mismatch on start -> full rebuild." }
      - { name: engine_version, type: string,   cardinality: one,  golden: redact }
      - { name: overlays,       type: "string[]", cardinality: list, golden: include }
      - { name: created_at,     type: string,   cardinality: one,  golden: redact }
    joern: { verdict: adopt_as_is, joern_name: META_DATA, divergence_class: none }
    doc: "The single graph-wide metadata node. Not :CPG; never touched by a per-file replace."

# ---------------------------------------------------------------------------------------------
# Edge types (15) + 1 reserved
# ---------------------------------------------------------------------------------------------
edges:
  - type: HAS_ENTRY
    from: [DIRECTORY]
    to: [DIRECTORY, FILE]
    ownership: filesystem
    write: move-rename-only
    properties: []
    joern: { verdict: adopt_renamed, joern_name: CONTAINS, divergence_class: name-only, reason: "Was CONTAINS. Joern's CONTAINS means METHOD -> CFG_NODE, a near-opposite meaning: a genuine collision. CONTAINS stays permanently reserved and unclaimed for Joern's meaning." }
    doc: "Filesystem nesting only. Code nesting is DECLARES; file membership is the `file` property plus SOURCE_FILE."

  - type: DECLARES
    from: [MODULE, TYPE_DECL, METHOD]
    to: [TYPE_DECL, METHOD, MEMBER, IMPORT]
    ownership: file-owned
    write: delete-create
    properties: []
    joern: { verdict: extend, joern_name: AST, divergence_class: semantic, reason: "Joern's AST edge is too generic; relationship-type-specific adjacency lets the planner prune by edge type. Extended to IMPORT so an import is reachable by edge, not only by `.file` scan." }
    doc: "Lexical nesting."

  - type: HAS_PARAM
    from: [METHOD]
    to: [PARAM]
    ownership: file-owned
    write: delete-create
    properties: []
    joern: { verdict: extend, divergence_class: semantic, reason: "Joern uses AST + PARAMETER_LINK; PARAMETER_LINK is unused without METHOD_PARAMETER_OUT." }

  - type: DEFINES
    from: [MODULE, TYPE_DECL, METHOD, MEMBER, PARAM]
    to: [SYMBOL]
    ownership: file-owned
    write: delete-create
    properties: []
    joern: { verdict: extend, joern_name: REF, divergence_class: semantic, reason: "Extended to PARAM so parameters have the same stable cross-reference identity as methods/types." }
    doc: "A declaration mints exactly one SYMBOL. Every CALLS/IMPORTS target must have a DEFINES edge or a recorded non-resolved status (verify check `resolution-health`)."

  - type: CALLS
    from: [CALL]
    to: [SYMBOL]
    ownership: file-owned
    write: delete-create
    properties:
      - { name: status,     type: string, cardinality: one,       enum: resolution_status, golden: include, doc: "Shared vocabulary with IMPORTS.status." }
      - { name: reason,     type: string, cardinality: zeroOrOne, golden: include, doc: "Closed enum of resolver reason codes (05-contracts C-RESOLVE)." }
      - { name: confidence, type: float,  cardinality: zeroOrOne, golden: exclude, doc: "EXCLUDED from goldens (DQ-09)." }
      - { name: resolvedBy, type: string, cardinality: zeroOrOne, golden: exclude, doc: "EXCLUDED from goldens (DQ-09)." }
    joern: { verdict: adopt_renamed, joern_name: CALL, divergence_class: name-only, reason: "Renamed to avoid Joern's node/edge label ambiguity (CALL is both). Unresolved rate = one GROUP BY over status." }

  - type: IN_SCOPE
    from: [CALL]
    to: [METHOD, MODULE]
    ownership: file-owned
    write: delete-create
    properties: []
    joern: { verdict: adopt_renamed, joern_name: CONTAINS, divergence_class: semantic, reason: "Was IN_METHOD; broadened to MODULE for top-level calls. Not merged into DECLARES: 'declared inside' and 'called inside' diverge at inline callbacks." }
    doc: "Which method or module body contains the call. Enables callers_of without a CFG."

  - type: IMPORTS
    from: [IMPORT]
    to: [SYMBOL]
    ownership: file-owned
    write: delete-create
    properties:
      - { name: status, type: string, cardinality: one, enum: resolution_status, golden: include, doc: "Identical enum object to CALLS.status." }
    joern: { verdict: adopt_as_is, joern_name: IMPORTS, divergence_class: none, hidden: true, reason: "Per imported name; wildcard/namespace imports point at the MODULE's SYMBOL." }

  - type: INHERITS_FROM
    from: [TYPE_DECL]
    to: [SYMBOL]
    ownership: file-owned
    write: delete-create
    properties:
      - { name: relation, type: string, cardinality: one, enum: inherits_relation, golden: include }
    joern: { verdict: adopt_as_is, joern_name: INHERITS_FROM, divergence_class: semantic, reason: "Merges EXTENDS+IMPLEMENTS (DL-6). Deliberately points at SYMBOL, not TYPE_DECL: a direct :CPG->:CPG cross-file edge is exactly what SYMBOL indirection prevents, and the cascade traverses inheritance into changed SYMBOLs. The one-hop TYPE_DECL->TYPE_DECL view is provided by TARGETS." }
    doc: "Python duck-typed Protocol conformance has no edge here: an acknowledged v1 limitation."

  - type: MEMBER_OF
    from: [FILE, METHOD, TYPE_DECL]
    to: [COMMUNITY]
    ownership: overlay
    write: overlay-job
    properties:
      - { name: run_id, type: string, cardinality: one, golden: redact }
    joern: { verdict: extend, divergence_class: gap-fill }

  - type: ALIAS_OF
    from: [SYMBOL]
    to: [SYMBOL]
    ownership: identity
    write: merge-on-key
    properties: []
    joern: { verdict: adopt_as_is, joern_name: ALIAS_OF, divergence_class: semantic, reason: "Models TS barrel re-exports and Python __init__.py re-export chains as a traversal. Required input to TAGGED_BY and TARGETS resolution." }

  - type: TAGGED_BY
    from: [SYMBOL, MEMBER, CALL]
    to: [TAG]
    ownership: identity
    write: merge-on-key
    properties: []
    joern: { verdict: adopt_as_is, joern_name: TAGGED_BY, divergence_class: semantic, reason: "Primary anchor SYMBOL (a fact about callee identity, inherited via CALLS). Secondary MEMBER. CALL-level tags reserved narrowly for per-call-site sanitizer/verified-safe annotations (the taint door)." }

  - type: TARGETS
    from: [CALL, IMPORT, TYPE_DECL]
    to: [METHOD, TYPE_DECL]
    ownership: overlay
    write: overlay-job
    properties:
      - { name: computed_at, type: string, cardinality: one, golden: redact }
      - { name: run_id,      type: string, cardinality: one, golden: redact }
    joern: { verdict: extend, joern_name: CALL, divergence_class: semantic, reason: "One-hop shortcut past CALL -> SYMBOL <- DEFINES, materialized ONLY when status=resolved, through ALIAS_OF* to the canonical SYMBOL. Must be a pure projection of the same resolver result that set CALLS.status, never an independent resolver. Never inside the per-file replace." }

  - type: DEPENDS_ON
    from: [FILE]
    to: [FILE]
    ownership: overlay
    write: overlay-job
    properties:
      - { name: computed_at, type: string, cardinality: one, golden: redact }
      - { name: run_id,      type: string, cardinality: one, golden: redact }
    joern: { verdict: extend, divergence_class: gap-fill, reason: "File-granularity rollup from the same overlay job as TARGETS (one job, two materializations) so import-cycle detection has a materialized file graph." }

  - type: REACHING_DEF
    from: [MEMBER, PARAM]
    to: [CALL]
    ownership: file-owned
    write: delete-create
    properties:
      - { name: variable, type: string, cardinality: one, golden: include, doc: "Name of the binding whose definition reaches the call-site use." }
    joern: { verdict: extend, joern_name: REACHING_DEF, divergence_class: semantic, reason: "Sparse structural-tier data flow (DL-13). Joern's spans expression-tier nodes; ours endpoints at definitions and call sites. Intra-file, both endpoints file-owned, so no SYMBOL indirection. Last match wins over source-ordered module bindings." }

  - type: SOURCE_FILE
    from: [MODULE]
    to: [FILE]
    ownership: file-owned
    write: delete-create
    properties: []
    joern: { verdict: adopt_as_is, joern_name: SOURCE_FILE, divergence_class: semantic, reason: "Re-adopted 2026-09-13, reversing the spec's earlier rejection. `file` stays a property on every :CPG node for the indexed delete; this edge is independent of that. Narrowed from Joern's one-per-AST-node to exactly one per file from the MODULE root. Restores connectivity: previously the only join between tiers was MODULE.file == FILE.path." }
    doc: "Written by the indexer alongside the filesystem tier, not by extraction."

reserved_edges:
  - type: EVAL_TYPE
    shape: "CALL -> SYMBOL {relation: receiver-type}"
    producer: none-yet
    admitted_at: U8
    gate: "re-run of spike S3 shows the headless resolver reaches >= 95% of the language-server ceiling for receiver-type sites"
    decision: DQ-09
    doc: "Receiver type inference accounts for 59.3% of host-produced call edges. Reserved now so admission needs no schema change; TypeScript symmetrically held until U9's spike reports."

# ---------------------------------------------------------------------------------------------
# Reserved names (three tiers, kept apart deliberately)
# ---------------------------------------------------------------------------------------------
reserved_names:
  permanent_unclaimed:
    - "CONTAINS   # Joern's METHOD -[:CONTAINS]-> BLOCK|CONTROL_STRUCTURE|CALL|RETURN meaning; adopted as-is if/when the CFG tier ships; never reused"
  deferred_tier_joern_spelling:
    nodes: [CONTROL_STRUCTURE, BLOCK, RETURN, JUMP_TARGET, JUMP_LABEL, IDENTIFIER, LITERAL, FIELD_IDENTIFIER, LOCAL, METHOD_REF, TYPE_REF, ARRAY_INITIALIZER, COMMENT, FINDING, KEY_VALUE_PAIR, TAG_NODE_PAIR]
    edges: [CFG, CDG, DOMINATE, POST_DOMINATE, CONDITION, CATCH_BODY, DO_BODY, FALSE_BODY, FINALLY_BODY, FOR_BODY, FOR_INIT, FOR_UPDATE, TRUE_BODY, TRY_BODY]
    doc: "A test (U10) asserts none of these is emitted. Reserving the exact Joern spelling is how 'not foreclosed' stays concrete."
  v2_candidates_not_rejected:
    nodes: [TYPE_PARAMETER, TYPE_ARGUMENT]
    edges: [BINDS, EVAL_TYPE]
    doc: "v1 folds generics into type_text. No Type System lens participated in the ontology debate; revisit with one when a concrete agent workflow needs generics-aware queries (DL-10)."
# END GENERATED

# ---------------------------------------------------------------------------------------------
# Rejected from Joern, grouped by the reasoning that rejected them
# ---------------------------------------------------------------------------------------------
rejected_from_joern:
  alignment_decision: "Option (b): align names to Joern where they overlap; keep the sparse-tier and SCIP divergences; document every divergence with a specific reason (VD-37). We ship 11 of Joern's 68 published names unchanged or lightly renamed and account for the other 57 below. Joern's VOCABULARY is portable; its MECHANISMS (global load-time linker, BINDING dispatch, Shortcuts layer) are not, and are structurally incompatible with a sub-second single-file replace under concurrent readers."
  groups:
    - reason: per-token / per-usage-site cardinality (a multiplicative tax on node count for zero query benefit a property does not already give)
      names: [MODIFIER, METHOD_RETURN, ANNOTATION, ANNOTATION_LITERAL, ANNOTATION_PARAMETER, ANNOTATION_PARAMETER_ASSIGN]
      folds: "MODIFIER -> MEMBER.visibility / METHOD.exported,async; METHOD_RETURN -> return type text; ANNOTATION family -> CALL{kind:decorator} -> SYMBOL"
    - reason: structural incompatibility with per-file incremental replace (triangulated by three independent lenses)
      names: [NAMESPACE, NAMESPACE_BLOCK, TYPE]
    - reason: Joern's linker mechanism, rejected as a mechanism not a name (vtable-style dispatch needing whole-type-hierarchy computation)
      names: [BINDING, BINDS, BINDS_TO]
    - reason: redundant with a benchmark-load-bearing property (`file` is a property on every :CPG node; the 13x indexed delete depends on it) — NOTE SOURCE_FILE was later re-adopted as ONE edge per file from MODULE, which does not disturb the property
      names: []
    - reason: unused without its counterpart
      names: [PARAMETER_LINK, METHOD_PARAMETER_OUT]
    - reason: folded into existing CALL properties (args and receiver are properties, not child nodes)
      names: [ARGUMENT, RECEIVER]
    - reason: no identified need (revisit only with a concrete use case)
      names: [CONFIG_FILE, CLOSURE_BINDING, DEPENDENCY, TEMPLATE_DOM, IS_CALL_FOR_IMPORT, CAPTURE, CAPTURED_BY]
    - reason: Scala type-hierarchy scaffolding with no Cypher shape; our shared :CPG label serves the same query
      names: [AST_NODE, CALL_REPR, CFG_NODE, DECLARATION, EXPRESSION]
  known_limitations:
    - "Python's implicit/duck-typed Protocol conformance has no edge under INHERITS_FROM."
    - "No Type System lens reviewed the TYPE_PARAMETER/TYPE_ARGUMENT deferral; it is the converged judgment of adjacent lenses."
    - "The vendored Joern spec JSON has 29 edge types; one debate transcript said 30 (JUMP_ARGUMENT). Treated as unverified, not claimed."
    - "IMPORT/IMPORTS are cited as 'matches Joern's implementation', never 'matches the Joern spec'."

# ---------------------------------------------------------------------------------------------
# Corrections to numbers the earlier spec carried
# ---------------------------------------------------------------------------------------------
corrections:
  - was: "~450 structural nodes / ~3,000 expression nodes per 300-line file"
    now: "measured 108–112 structural / 602–796 expression per 300 LOC (two independent replicas); the RATIO (~6x) was sound, the absolutes were ~4x too high"
    rule: "never re-quote the absolutes (06-measurements.yaml never_requote)"

# ---------------------------------------------------------------------------------------------
# Evolution policy (P-C, F-3)
# ---------------------------------------------------------------------------------------------
evolution_policy:
  principle: "Protection is about re-opening settled arguments; evolution is about adding what we have learned. The nodes and edges are the bones and are not in question. The properties attached to them for intelligence and analytics are expected to grow."
  rules:
    - change: add a property to an existing node or edge type
      cost: free; open a PR. Bump meta.version only if the property is required (cardinality one).
    - change: add a node label or edge type
      cost: free with one paragraph in 02-decisions.yaml stating what question the graph can now answer that it could not before. Bump meta.version.
    - change: rename or remove anything, or change a property's meaning, or move a name between tiers
      cost: requires the reopening test — state the premise that died, cite evidence dated after the original decision, state what else breaks, state the cost of keeping vs changing. Comparable costs means keep.
    - change: any of the above
      also: the conformance tests are generated from the schema (U1), so adding a property regenerates tests rather than invalidating them.
  signal: "If node or edge TYPES are being added often, the ontology was wrong; that triggers a review, not more additions."
  syntactic_sugar_note: "Not every language construct is yet comprehended by the current topology (decorators, tuple unpacking, __all__, TS export default, multi-declarator const). These land as properties or as documented gaps, not as new node types, unless a reopening test says otherwise."
