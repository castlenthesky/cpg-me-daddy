# 04 — Graph schema (the vocabulary), as data
#
# This is the single source of truth for the graph vocabulary until milestone U1 ports the
# schema registry into `packages/model/src/schema/` as code. From U1 onward the region marked
# `# BEGIN GENERATED` … `# END GENERATED` is regenerated by `tools/schema-doc` and CI fails on
# drift; everything outside that region is hand-maintained rationale.
#
# Transcribed 2026-09-17 from the archived registry
#   archive/m0-calls-symbols-20260916:packages/engine/src/schema/{nodes,edges,enums,types}.ts
# with the additions required by decisions DQ-01, DQ-06, F-1 (revision_id on every :CPG node and
# on FILE; `seq` lives on the delta envelope only) and ND-5 (schema version 3).
#
# Ids referenced: decisions in 02-decisions.yaml, lessons in 10-lessons.yaml.

meta:
  version: 3                 # 2 on the archive tag; 3 adds the required `revision_id` property (ND-5)
  version_history:
    - { version: 0, note: placeholder }
    - { version: 1, note: "M0.0 transcription of the R6-approved schema (2026-09-12)" }
    - { version: 2, note: "sparse REACHING_DEF pulled into v1 (DL-13, 2026-09-12); SOURCE_FILE re-adopted (2026-09-13)" }
    - { version: 3, note: "revision_id required on every :CPG node and on FILE (P-B, F-1); pending U1" }
  counts:
    node_labels: 14
    edge_types: 15           # 14 from the approved spec + SOURCE_FILE (re-adopted 2026-09-13); see note below
    edge_types_reserved: 1   # EVAL_TYPE, admitted at U8 (DQ-09)
  count_note: >
    Earlier documents disagree on "14 or 15 edge types". Both were right at different dates: the
    approved spec listed 14; the archived registry that the CI gate reads lists 15 because
    SOURCE_FILE (MODULE -> FILE) was re-adopted to make the filesystem tier and the code tier one
    connected graph. This file carries 15. EVAL_TYPE is additionally reserved, not counted.
  migration_policy: >
    The graph is a cache (PR3). There is no migration path, only rebuild: on start, the engine reads
    META_DATA.schema_version and on mismatch drops and re-indexes. Any change to a label, edge type,
    required property or enum value set bumps `meta.version`.
  shared_co_label: >
    Every code-tier node also carries the label :CPG (cpg_co_label: true below). Indexes exist on
    CPG.id and CPG.file. DIRECTORY, FILE, SYMBOL, TAG, COMMUNITY and META_DATA are NOT :CPG.

# ---------------------------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------------------------
id_rule:
  form: "path:kind:qualifiedScopePath[:ordinal|:bodyHash]"
  decision: [VD-31, AM-1, DQ-02]
  path_form: workspace-relative, POSIX separators, no leading "./" (DQ-02). Absolute paths never appear in ids.
  never_in_an_id:
    - { what: "the file's content hash", why: "it would change every id in the file on every save and break every inbound cross-file edge" }
    - { what: "line or column ranges", why: "positions are properties for navigation, never identity" }
    - { what: "property values", why: "identity is path, kind and lexical scope only" }
  ordinal_rule: >
    CALL ordinals are parent-scope-relative (counted within the enclosing METHOD or MODULE), not
    file-relative, so inserting an unrelated statement above two identical calls in one method
    changes neither id. This is a required golden test (U6a), not prose.
  body_hash_rule: >
    `:bodyHash` is appended only for anonymous items (arrows, lambdas) and overload disambiguation,
    so that inserting one anonymous node does not churn every later sibling.
  measured_stability: "move within file, insert lines above, reformat -> 0 id changes; rename -> exactly 1 delete + 1 create (AM-1)"
  statement_level_reservation: >
    The `:ordinal` slot admits intra-declaration ordinals. U1 lands a test that mints and round-trips
    a synthetic statement-level id so the CFG tier is provably not foreclosed (ND-10 in 02-decisions.yaml).
  examples:
    FILE:      "file:src/users.ts"
    MODULE:    "file:src/users.ts:MODULE:$root"
    TYPE_DECL: "file:src/users.ts:TYPE_DECL:UserService"
    METHOD:    "file:src/users.ts:METHOD:UserService.findById"
    CALL:      "file:src/users.ts:CALL:UserService.findById:0"
    SYMBOL:    "`src/users.ts`/UserService#findById().   (SCIP descriptor, not this rule; see SYMBOL.fqn)"
  revision_vs_id: >
    The same sha256 of the file's bytes appears twice with opposite requirements: as `revision_id`
    (a PROPERTY that must change whenever the file changes, so staleness is detectable) and never in
    the id (which must stay stable so inbound edges survive). Same hash, opposite jobs, so it goes in
    the property and never in the id (DQ-02 note, DQ-06).

# ---------------------------------------------------------------------------------------------
# Enums (declared once, referenced by identity; CALLS.status and IMPORTS.status are the SAME array)
# ---------------------------------------------------------------------------------------------
enums:
  node_status:
    values: [ready, indexing, stale, error]
    doc: "Lifecycle status on every :CPG node and on FILE (VD-21, PR8). Over-budget cascades mark dependents `stale` with `stale_reason: <file id>`."
  resolution_status:
    values: [resolved, ambiguous, external, unresolved, dynamic]
    shared_by: [CALLS.status, IMPORTS.status]
    definitions:
      resolved:   target found and unambiguous
      ambiguous:  multiple statically plausible candidates (overload sets, duplicate or star imports, unresolved re-export fan-out)
      external:   target resolves to a dependency outside the indexed workspace
      unresolved: no static candidate found
      dynamic:    target determined by a runtime dispatch mechanism the frontend cannot follow (eval, getattr/__getattr__/__call__, Function(), computed member access obj[key](), computed require / dynamic import)
    doc: "The bare `resolved` booleans that once lived on CALL/IMPORT nodes are dropped. One signal, one place."
  inherits_relation: { values: [extends, implements] }
  type_decl_kind:    { values: [class, interface, enum, type_alias, protocol, dataclass] }
  method_kind:       { values: [function, method, constructor, getter, setter, lambda_named] }
  call_kind:         { values: [call, new, decorator, await] }

# ---------------------------------------------------------------------------------------------
# Ownership classes and write mechanisms
# ---------------------------------------------------------------------------------------------
ownership_classes:
  file-owned:
    members: [MODULE, TYPE_DECL, METHOD, PARAM, MEMBER, CALL, IMPORT, UNKNOWN, DECLARES, HAS_PARAM, DEFINES, CALLS, IN_SCOPE, IMPORTS, INHERITS_FROM, REACHING_DEF, SOURCE_FILE]
    write: delete-create
    rule: "DELETE (never DETACH DELETE) + CREATE on every save of the owning file. Safe because nothing outside that file writes them. Scope delete is `MATCH (n:CPG {file:$file}) DELETE n` — the indexed-delete shape measured 13x faster than a label-less delete (M-FALKOR-13x)."
    lessons: [L-03, L-38]
  identity:
    members: [SYMBOL, ALIAS_OF, TAG, TAGGED_BY]
    write: merge-on-key
    keys: { SYMBOL: fqn, TAG: name }
    rule: "MERGE on key. The cross-file-shared anchor other files' edges point into; deleting it on the defining file's save would sever every inbound edge from files that were not touched. Properties are pruned of null/undefined before SET so a caller's save cannot null out the definer's SYMBOL properties."
    lessons: [L-03, L-38, L-46]
  overlay:
    members: [COMMUNITY, MEMBER_OF, TARGETS, DEPENDS_ON]
    write: overlay-job
    rule: "Written only by the async periodic overlay job; carry computed_at/run_id; never inside a per-file replace transaction. Any edge landing on a :CPG node from outside that node's own replace transaction is an overlay, explicitly stale-tolerant, never a correctness dependency of the write path."
    rebuild_trigger: "periodic tick + computed_at, plus a manual `refresh now` (CLI or MCP tool). Rejected: recompute on every save of either endpoint's file (DL-8)."
  filesystem:
    members: [DIRECTORY, FILE, HAS_ENTRY]
    write: "merge-on-path (HAS_ENTRY: move-rename-only)"
    rule: "MERGE on path; mutated on move/rename or content-hash change; never deleted and recreated on an ordinary save."
  graph-singleton:
    members: [META_DATA]
    write: merge-on-graph
    rule: "Key []. Updated in place. Never carries `file`, never per-file replaced."

golden_policy:
  doc: >
    Which properties participate in golden-file comparison. `include` compares; `redact` replaces
    with a placeholder; `exclude` drops. resolvedBy and confidence are EXCLUDED (DQ-09 amendment):
    an invariant edge SET with host-variant golden-included properties would still yield per-host
    goldens, and producer-invariance requires exactly one golden set.
  excluded: [CALLS.resolvedBy, CALLS.confidence]
  redacted: [FILE.version, FILE.indexed_at, COMMUNITY.run_id, COMMUNITY.computed_at, MEMBER_OF.run_id, TARGETS.computed_at, TARGETS.run_id, DEPENDS_ON.computed_at, DEPENDS_ON.run_id, META_DATA.engine_version, META_DATA.created_at]

# ---------------------------------------------------------------------------------------------
# Cross-cutting property added by this plan (P-B / F-1 / ND-5)
# ---------------------------------------------------------------------------------------------
revision_property:
  name: revision_id
  type: string
  cardinality: one
  golden: exclude          # it is the file's sha256 and changes with every edit of the fixture
  carried_by: every node with cpg_co_label true, plus FILE (where it is the same value as content_hash)
  minted_by: WATCH stage (the walker on a cold index, the watcher live); every downstream stage carries it, never recomputes it
  not_on: [edges, SYMBOL, TAG, COMMUNITY, META_DATA, DIRECTORY]
  reconciliation_rule: >
    For every :CPG node n: n.revision_id == FILE{path: n.file}.revision_id, else n is stale.
    For every file on disk admitted by the walker: a FILE node exists. Duplicate ids fail the count
    reconciliation. This single query is check `revision-reconciliation` in `cpg verify` (08-verification.md).
  seq_is_separate: >
    `seq` is a monotonic per-workspace counter on the DELTA ENVELOPE only, never stored on a node
    (F-1). revision_id answers "is this node derived from the current bytes of its file?"; seq
    answers "did I receive deltas in order and miss none?". Six counters once shared these names
    across five granularities (CS-4); there are now exactly two, with one allocator each.

# BEGIN GENERATED (hand-maintained until U1; regenerated from packages/model/src/schema from U1)
# ---------------------------------------------------------------------------------------------
# Node labels (14)
# ---------------------------------------------------------------------------------------------
nodes:
  - label: DIRECTORY
    cpg_co_label: false
    has_file_property: false
    ownership: filesystem
    write: merge-on-key
    key: [path]
    properties:
      - { name: path,   type: string, cardinality: one, golden: include, doc: "Workspace-relative path." }
      - { name: name,   type: string, cardinality: one, golden: include, doc: "Basename." }
      - { name: status, type: string, cardinality: one, enum: node_status, golden: include, doc: "Lifecycle status (VD-21/PR8)." }
    joern: { verdict: extend, divergence_class: gap-fill, reason: "Joern's FileSystem layer is overlay-only and has no directory-tree node; this fills a gap." }
    doc: "One node per workspace directory. Never :CPG."

  - label: FILE
    cpg_co_label: false
    has_file_property: false
    ownership: filesystem
    write: merge-on-key
    key: [path]
    properties:
      - { name: path,           type: string, cardinality: one,       golden: include, doc: "Workspace-relative path; also the id suffix `file:<path>`." }
      - { name: name,           type: string, cardinality: one,       golden: include, doc: "Basename." }
      - { name: language,       type: string, cardinality: one,       golden: include, doc: "Grammar id, or null when no grammar claims the extension." }
      - { name: content_hash,   type: string, cardinality: one,       golden: exclude, doc: "sha256 of the raw bytes (hash the Buffer, not the decoded string: CRLF->LF IS a change). Equal to revision_id." }
      - { name: revision_id,    type: string, cardinality: one,       golden: exclude, doc: "P-B fingerprint. Same value as content_hash; named so every tier speaks one word." }
      - { name: interface_hash, type: string, cardinality: zeroOrOne, golden: include, doc: "Hash of the exported-declaration surface (names, kinds, signatures, re-exports). Gates cascades (ND-9)." }
      - { name: status,         type: string, cardinality: one,       enum: node_status, golden: include, doc: "Brackets the per-file replace transaction." }
      - { name: version,        type: int,    cardinality: one,       golden: redact,  doc: "Monotonic per-file version, bumped every replace. NOTE the archived indexer pinned this at 1 (MERGE + SET += resets it); U5 must implement a real read-modify-write bump." }
      - { name: indexed_at,     type: string, cardinality: zeroOrOne, golden: redact }
      - { name: loc,            type: int,    cardinality: zeroOrOne, golden: include }
    joern: { verdict: adopt_as_is, joern_name: FILE, divergence_class: none }
    doc: "One node per indexed file. Never :CPG. Id is stable across saves."

  - label: MODULE
    cpg_co_label: true
    has_file_property: true
    ownership: file-owned
    write: delete-create
    key: [id]
    properties:
      - { name: name,        type: string, cardinality: one, golden: include }
      - { name: file,        type: string, cardinality: one, golden: include, doc: "Owning FILE.path." }
      - { name: revision_id, type: string, cardinality: one, golden: exclude }
      - { name: range,       type: string, cardinality: one, golden: include, doc: "startLine:startCol-endLine:endCol, lines 1-based, cols 0-based. Navigation only, never identity." }
      - { name: status,      type: string, cardinality: one, enum: node_status, golden: include }
    joern: { verdict: extend, divergence_class: gap-fill, reason: "Supersedes rejected NAMESPACE_BLOCK, which required a cross-file-merged vertex, structurally incompatible with per-file replace. One per file; nested TS namespaces/declared modules become nested MODULE." }
    doc: "The file-scoped module root. Free functions and top-level statements hang off this."

  - label: TYPE_DECL
    cpg_co_label: true
    has_file_property: true
    ownership: file-owned
    write: delete-create
    key: [id]
    properties:
      - { name: name,           type: string, cardinality: one,       golden: include }
      - { name: kind,           type: string, cardinality: one,       enum: type_decl_kind, golden: include }
      - { name: file,           type: string, cardinality: one,       golden: include }
      - { name: revision_id,    type: string, cardinality: one,       golden: exclude }
      - { name: range,          type: string, cardinality: one,       golden: include }
      - { name: exported,       type: bool,   cardinality: one,       golden: include }
      - { name: docstring_head, type: string, cardinality: zeroOrOne, golden: include }
      - { name: status,         type: string, cardinality: one,       enum: node_status, golden: include }
      - { name: structural,     type: bool,   cardinality: one,       golden: include, doc: "R6 addition." }
    joern: { verdict: adopt_as_is, joern_name: TYPE_DECL, divergence_class: none }
    doc: "class | interface | enum | type_alias | protocol | dataclass."

  - label: METHOD
    cpg_co_label: true
    has_file_property: true
    ownership: file-owned
    write: delete-create
    key: [id]
    properties:
      - { name: name,                  type: string, cardinality: one,       golden: include }
      - { name: kind,                  type: string, cardinality: one,       enum: method_kind, golden: include }
      - { name: signature,             type: string, cardinality: one,       golden: include }
      - { name: params_count,          type: int,    cardinality: one,       golden: include }
      - { name: file,                  type: string, cardinality: one,       golden: include }
      - { name: revision_id,           type: string, cardinality: one,       golden: exclude }
      - { name: range,                 type: string, cardinality: one,       golden: include }
      - { name: exported,              type: bool,   cardinality: one,       golden: include }
      - { name: async,                 type: bool,   cardinality: one,       golden: include }
      - { name: docstring_head,        type: string, cardinality: zeroOrOne, golden: include }
      - { name: status,                type: string, cardinality: one,       enum: node_status, golden: include }
      - { name: cyclomatic_complexity, type: int,    cardinality: zeroOrOne, golden: include, doc: "R6 addition." }
      - { name: max_nesting_depth,     type: int,    cardinality: zeroOrOne, golden: include, doc: "R6 addition." }
      - { name: loc,                   type: int,    cardinality: zeroOrOne, golden: include, doc: "R6 addition." }
      - { name: visibility,            type: string, cardinality: zeroOrOne, golden: include, doc: "R6 addition." }
      - { name: generator,             type: bool,   cardinality: zeroOrOne, golden: include, doc: "R6 addition." }
    joern: { verdict: adopt_as_is, joern_name: METHOD, divergence_class: none, reason: "Free functions and methods share the label; the parent DECLARES edge disambiguates." }
    doc: "function | method | constructor | getter | setter | lambda_named."

  - label: PARAM
    cpg_co_label: true
    has_file_property: true
    ownership: file-owned
    write: delete-create
    key: [id]
    properties:
      - { name: name,        type: string, cardinality: one,       golden: include }
      - { name: ordinal,     type: int,    cardinality: one,       golden: include, doc: "Position within its METHOD's parameter list." }
      - { name: type_text,   type: string, cardinality: zeroOrOne, golden: include, doc: "Generics folded into text for v1 (DL-10)." }
      - { name: default,     type: string, cardinality: zeroOrOne, golden: include }
      - { name: file,        type: string, cardinality: one,       golden: include }
      - { name: revision_id, type: string, cardinality: one,       golden: exclude }
    joern: { verdict: adopt_renamed, joern_name: METHOD_PARAMETER_IN, divergence_class: name-only, reason: "Renaming would import half of Joern's IN/OUT pair with no OUT present. METHOD_PARAMETER_OUT is a legitimate omission (no by-ref out-params in TS/Python)." }
    doc: "A formal parameter. IN-only."

  - label: MEMBER
    cpg_co_label: true
    has_file_property: true
    ownership: file-owned
    write: delete-create
    key: [id]
    properties:
      - { name: name,        type: string, cardinality: one,       golden: include }
      - { name: type_text,   type: string, cardinality: zeroOrOne, golden: include }
      - { name: file,        type: string, cardinality: one,       golden: include }
      - { name: revision_id, type: string, cardinality: one,       golden: exclude }
      - { name: range,       type: string, cardinality: one,       golden: include }
      - { name: visibility,  type: string, cardinality: zeroOrOne, golden: include }
    joern: { verdict: adopt_as_is, joern_name: MEMBER, divergence_class: none }
    doc: "Class field / dataclass attribute / module-level constant."

  - label: CALL
    cpg_co_label: true
    has_file_property: true
    ownership: file-owned
    write: delete-create
    key: [id]
    properties:
      - { name: callee_name,   type: string, cardinality: one,       golden: include }
      - { name: receiver_text, type: string, cardinality: zeroOrOne, golden: include }
      - { name: args_count,    type: int,    cardinality: one,       golden: include }
      - { name: file,          type: string, cardinality: one,       golden: include }
      - { name: revision_id,   type: string, cardinality: one,       golden: exclude }
      - { name: range,         type: string, cardinality: one,       golden: include }
      - { name: kind,          type: string, cardinality: one,       enum: call_kind, golden: include }
      - { name: status,        type: string, cardinality: one,       enum: node_status, golden: include }
    joern: { verdict: adopt_as_is, joern_name: CALL, divergence_class: none, reason: "Args, receiver and literals fold into properties, never child nodes (PR1). The CALLS *edge* is renamed from Joern's edge-typed CALL; that rename is recorded on the edge." }
    doc: "A call/new/decorator/await site. Ids use a parent-scope-relative ordinal (see id_rule)."

  - label: IMPORT
    cpg_co_label: true
    has_file_property: true
    ownership: file-owned
    write: delete-create
    key: [id]
    properties:
      - { name: source_text,    type: string,   cardinality: one,       golden: include }
