story_template:
  fields: [id, title, epic, acceptance (2–6 checkable bullets), port_from (archive coordinates), decisions (ids), contracts (ids), measurements (ids), lessons (ids), notes]
  definition_of_done:
    - the acceptance bullets are green locally, then in CI
    - the gate the story contributes to is named in the PR description
    - any number the story changes is updated in 06-measurements.yaml in the same PR
    - any decision the story reverses is a new ND-n entry with reopen evidence, never an edit
    - stubs are labelled REAL / PASSTHROUGH / SEAT in code comments
    - if the story ports archived code, the NUL-byte and bun-test hazards in 11-salvage.yaml were checked
