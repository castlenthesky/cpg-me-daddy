# 07 — Milestones, epics, features, stories
#
# Hierarchy (owner decision, 2026-09-17):
#   milestone = one delivery unit U0..U10 (order endorsed by every reviewer; not reopenable without a new measurement)
#   epic      = a cross-cutting workstream that spans milestones (E-*)
#   feature   = one PR-sized deliverable inside a milestone (Un.m); the original spine named 16 PRs across 10 units,
#               sliced here into 24 features so no PR exceeds ~500 reviewable lines (GR3)
#   story     = a 0.5–2 day task with acceptance criteria (Un.m.k); the unit of work a developer picks up
#
# Every milestone has a GATE: machine assertions that must be green AND a human-visible artifact the owner
# looks at. The gate is `cpg verify` exiting 0 plus the named tests; the artifact is a picture or a short
# table, never the proof. Every milestone names what it LOCKS IN (things that get expensive to change after)
# and what it ROLLS BACK TO (each unit reverts to the previous unit's green state).
#
# Sizes: S <= 2 days · M 3–5 days · L 6–10 days (one developer). Stories reference: decisions (02),
# schema (04), contracts (05), measurements (06), lessons (10), salvage coordinates (11).
#
# Working rules that apply to every story (00-charter §11): gate ships with the code; 200–500 reviewable
# lines per PR; run the gate locally before pushing; REAL/PASSTHROUGH/SEAT labels on every stub; START SIMPLE.
# Review agents must be explicitly told to use the code-review skill (L-42).

summary:
  units: 10          # U1..U10 (U0 is the completed foundation)
  prs_in_original_spine: 16
  features: 24      # PR-sized; the 16-PR spine sliced finer, order unchanged
  stories: 53
  order_locked: true
  first_human_artifact: U2 (the developer's own repository rendered, unit two)
  first_cross_file_edge: U6 (IMPORTS)
  freshness_proven: U7
  headless_calls: U8

epics:
  - id: E-GATE
    name: CI gates and dependency rules
    spans: [U0, U1, U2, U3, U5, U6, U10]
    goal: "Every invariant that can be checked mechanically is checked in CI and has been SEEN TO FAIL on a planted violation. A rule nobody has seen fail is not a gate (L-31)."
    delivers: [check-deps two-tier rule + host-surface allowlist + NUL rule, runtime purity proof with anti-vacuity, statementCount === 1, sparsity <= 1.5, schema drift check, archive-coordinate resolver, retired-path citation refusal, registered-tool count]
  - id: E-LAYOUT
    name: packages/ vs apps/ and composition roots
    spans: [U0, U2, U3, U10]
    goal: "packages/** is host-free and has no composition roots; each apps/* owns one root and one host SDK (DQ-08)."
  - id: E-SCHEMA
    name: schema as code, evolving
    spans: [U1, U6, U8, U10]
    goal: "The 14 labels / 15 edge types live as data under CI; properties grow additively; the outline's schema region regenerates from code (P-C, F-3)."
  - id: E-FRESH
    name: the freshness clock and revision reconciliation
    spans: [U1, U4, U5, U7]
    goal: "seq and revision_id are the only two counters; T0->T3 is measured per enabled consumer set; every node reconciles to its file (P-B, DQ-05, F-1)."
  - id: E-VERIFY
    name: cpg verify and the resolver verification harness
    spans: [U2, U6, U8, U9]
    goal: "Code decides. Six checks, four states. The parse-and-resolve layer is the most heavily instrumented part of the system: golden corpus, precision/recall vs an oracle, per-language ceilings, latency distributions, degradation as a first-class number (DQ-04, DQ-06)."
  - id: E-STORE
    name: the FalkorDB consumer
    spans: [U5, U7, U10]
    goal: "One atomic statement per file from the first line; the store is a consumer like any other; agents can query it with Cypher from U5 (DQ-10, F-2)."
  - id: E-RESOLVE
    name: headless resolution
    spans: [U6, U8, U9]
    goal: "Exactly one resolver chain runs under plain node; a language server is a subprocess, never an import; precision 0 disagreements; recall reported against a measured ceiling (DQ-09)."
  - id: E-HOST
    name: the VS Code consumer
    spans: [U0, U3]
    goal: "The extension is the producer launched with the panel consumer enabled, plus three adapters; zero new engine code, enforced (P-A, C-EXT)."
  - id: E-RETIRE
    name: retiring the old documentation
    spans: [post-outline follow-up, then every milestone boundary]
    goal: "The retired documentation and the deliberation corpus live only on the docs/archive branch; this outline is self-contained (12-retirement.md); the 21-question battery re-runs at each milestone boundary."

