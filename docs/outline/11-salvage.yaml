# 11 — Salvage inventory
#
# Code on the archive tags worth porting, with exact coordinates. Read with `git show <tag>:<path>`.
# LOC are measured (`git show … | wc -l`), not estimates. Verdicts: PORT = lift verbatim (re-point imports);
# ADAPT = keep the named idea, change the named thing; DELETE = do not port (listed so nobody re-discovers it).
# `unit` is the milestone whose stories port it. `hazards` are things that cost real time before.
#
# Tag shorthand: M = archive/master-20260916 · D = archive/discovery-20260916 · Z = archive/m0-calls-symbols-20260916 · R = archive/research-sweep-20260916

hazards_global:
  - "Two archived schema sources are NOT normative and must not be ported as such: the archived design folder's schema JSON is the vendored Joern specification (18 layers, 39 concrete + 5 abstract nodes, 29 edges, 43 properties) that 04-schema.yaml's Joern table accounts for name by name, and the archived storage design's schema is the pre-2026-09-11 lineage (no SYMBOL, no DIRECTORY/MODULE, keeps CONTAINS and expression-tier nodes). Only the schema module on the m0-calls-symbols tag (rows below) and 04-schema.yaml are current. The approved spec text says 14 edge types; the code says 15 because SOURCE_FILE was re-adopted after the spec was written."
  - "Four archived files contain literal NUL bytes and are BINARY to git/grep: D:src/dev/resolveHarness.ts (3), D:packages/graph-visualizer/src/visualizer.ts (2), D:packages/cpg-generator/src/subgraph.ts (2), D:packages/graph-visualizer/src/layout.ts (1). Use `grep -a`; strip the bytes on port (write the separator as String.fromCharCode(0)); check-deps rejects NULs."
  - "Every test on M/Z is written for `bun test`; porting to vitest is real work (~4,900 LOC of engine tests, ~1,000 need a database)."
  - "D has ZERO test files anywhere; its verification was a 442-line hand-run script."
  - "Z is byte-identical to M except extract/, identity/, indexer/ and +12/+24 lines in schema/. packages/cli is byte-identical on M and Z."

