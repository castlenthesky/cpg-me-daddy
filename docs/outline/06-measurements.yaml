may_no_longer_argue:
  # settled only within the stated boundary
  - "1. Single-file save latency does not threaten 2 s (one file, zero cascade, <= ~500k nodes, this machine, loopback DB)."
  - "2. Cascade is zero because the feature is ABSENT, not because the design avoids it. Verdict 1 is conditional on that absence."
  - "3. The DB write dominates the save budget (66–82% at p50) before the atomic rewrite."
  - "4. Tree-sitter is not a cost. Parser choice may not be argued on latency."
  - "5. FalkorDB is not the bottleneck; the write shape is (~6x available). Boundary: <= 500k nodes, loopback, arm64 Docker."
  - "6. Structural sparsity is met with 3.5–4x headroom (0.361 / 0.429 vs 1.5)."
  - "7. 'Collect everything now, prune later' is REJECTED (5.55x / 5.88x; the <2x band is unreachable)."
  - "8. The corpus anchor's absolutes (~450 / ~3000 @300 LOC) are wrong by ~4x; the ratio is sound."
  - "9. Host-invariance is NOT nearly free in resolution quality (31.0% / 32.6% of achievable edges); a headless resolver is a funded, gated step."
  - "10. That step is not 'reimplement Pylance': ~313 lines of basedpyright-langserver over stdio reached the full host answer set with zero vscode import."
  - "11. The whole resolution gap is one capability: receiver type inference (59.3%); imports are at 100% of ceiling."
  - "12. The headless resolver is never wrong where it answers (0/305). Boundary: Python, one fixture."
  - "13. The visual channel cannot verify correctness (17.9% self-noise, best signal 1.35x). It is a liveness check."
  - "14. Four non-visual checks are required, not optional; a freshness SLA with no staleness assertion is unfalsifiable."
  - "15. layoutPayload is non-deterministic despite documenting itself as deterministic; golden-image diffing is impossible until a seed is threaded."
  - "16. FalkorDB v4.20.4 semantics are as tabulated (RO_QUERY set, TIMEOUT syntax and 30000/60000 defaults, full rollback with ~1.7x overshoot, atomic replace p50 ≈3–8 ms, 51x over many-small, no settling window). Boundary: this image tag."
  - "17. The unit ORDER U0..U10 (real data at U2, cross-file edges at U6) — endorsed by every reviewer."

