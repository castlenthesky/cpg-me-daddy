# 05 — The nine seams, as data
#
# Every boundary in the pipeline is a contract: types, invariants, what an implementation may not do,
# and an executable conformance suite that every implementation runs unchanged. The suites exist today
# in the deliberation corpus (retired to the docs/archive branch; ~874 assertions across nine files
# named C-<NAME>.conformance.test.ts) and are ported into the tree by the milestone that creates each package.
#
# This file transcribes the contracts AS AMENDED by the decisions in 02-decisions.yaml. Where a decision
# changed a contract, the `amended_by` block says what changed and why; the archived spec is history.
# TypeScript blocks are the normative shapes. `invariants` carry the archived numbering so the ported
# suites' test names still line up.
#
# Enforcement classes: C = compile-time (types or tools/check-deps.mjs) · T = conformance test ·
# R = runtime assert in the shipped build.

shared_vocabulary:
  resolution_status: [resolved, ambiguous, external, unresolved, dynamic]   # PROTECTED; reaches the database
  status_rank: { unresolved: 0, dynamic: 1, external: 2, ambiguous: 3, resolved: 4 }   # rank <= 1 is OPEN (chain continues); >= 2 is an ANSWER (chain stops)
  resolution_reason:   # closed enum; the dimension the unresolved-rate metric groups by; additive
    - no-definition
    - receiver-unknown
    - name-not-exported
    - module-not-found
    - reexport-depth
    - module-binding
    - wildcard
    - truncated-subgraph
    - provider-error
    - builtin
    - self
    - not-warm
    - no-resolver
    - timeout
    - cancelled
    - backend-unavailable
    - unsupported-language
    - unsupported-kind
  ref_kind: [call, import, receiver, receiver-type]
  verify_check_ids:    # ONE shared enum (DQ-06 unified C-CLI's and C-EXT's two sets)
    - "filesystem-reconciliation     # S4/C1: |files on disk| == |FILE nodes|, per directory, offenders named"
    - "identity-invariants           # S4/C2: every CALLS/IMPORTS target has a DEFINES edge or a recorded non-resolved status; no VIRTUAL_ROOT id"
    - "id-uniqueness                 # S4/C3a: node ids unique in the payload/store"
    - "render-reconciliation         # S4/C3b: renderedNodeCount === payload.nodes.length; `unavailable` when no renderer consumer is enabled (ND-8)"
    - "revision-reconciliation       # S4/C4 via P-B: every :CPG node's revision_id == its FILE's revision_id"
    - "resolution-health             # CS-5: ResolveReport.degradedBatches == 0, backend not degraded, unresolvedRate per kind within threshold"
  verify_check_states: [pass, fail, stale, unavailable]   # worst-of ordering: fail > stale > unavailable > pass; --strict treats unavailable as fail
  paths:
    WorkspacePath: "workspace-relative, POSIX separators, no leading ./ — the ONLY path form inside the graph, ids, deltas, store (DQ-02)"
    AbsolutePath: "native separators; exists only inside FilesystemProbe and SourceOpener; converted at the boundary with startsWith + slice, never String.replace (L-10)"

contracts:

  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-MODEL
    name: the graph vocabulary (transport)
    package: "@cpg/model"
    status: partly real on develop (13 exports, 17 tests); amended by DQ-01/F-1 at U1
    purpose: >
      The zero-dependency thin waist every producer and consumer agrees on. It transports; it does not
      validate against the schema (that is packages/model/src/schema, U1), does not render, and declares
      zero label constants: node.type and edge.type are free strings so adding a label never recompiles
      a consumer. Consumers derive-and-fallback on an unknown type, never switch exhaustively.
    types: |
      export interface SourceRange { readonly startRow: number; readonly startColumn: number; readonly endRow: number; readonly endColumn: number; }  // 0-based rows, UTF-16 columns (= vscode.Position)
      export interface NodeLocation { readonly filePath: WorkspacePath; readonly range: SourceRange; readonly nameRange?: SourceRange; }
      export interface GraphNode { readonly id: string; readonly type: string; readonly name?: string; readonly data?: Readonly<Record<string, unknown>>; }
      export interface GraphEdge { readonly source: string; readonly target: string; readonly type?: string; readonly data?: Readonly<Record<string, unknown>>; }
      export interface EdgeResolution { readonly status: string; readonly resolvedBy: string; readonly confidence?: number; readonly reason?: string; }
      export interface GraphPayload { readonly seq: number; readonly nodes: readonly GraphNode[]; readonly edges: readonly GraphEdge[]; }
      /** The delta ENVELOPE (F-1). seq is per-workspace, allocated by SINK. revision_id is the owning file's content hash and is ALSO on every node in addedNodes. */
      export interface GraphDelta {
        readonly seq: number;
        readonly file: WorkspacePath;
        readonly revision_id: string;
        readonly producer: 'filesystem' | 'code';          // the owner tier, for the discriminated merge
        readonly addedNodes: readonly GraphNode[];
        readonly addedEdges: readonly GraphEdge[];
        readonly removedNodeIds: readonly string[];         // removing a node removes every incident edge; edges are never enumerated for removal
      }
      export type Read<T> = { state: 'present'; value: T } | { state: 'absent' } | { state: 'malformed'; defect: ModelDefect };
      export function readNodeLocation(node: GraphNode): Read<NodeLocation>;
      export function readNodeResolution(node: GraphNode): Read<EdgeResolution>;
      export function readEdgeResolution(edge: GraphEdge): Read<EdgeResolution>;
      export type ModelDefectCode = 'empty-id' | 'id-contains-separator' | 'duplicate-node-id' | 'dangling-edge' | 'malformed-location' | 'malformed-resolution' | 'non-monotonic-seq';
      export function validatePayload(payload: GraphPayload): readonly ModelDefect[];
      export type DeltaApplyResult = { outcome: 'applied'; payload: GraphPayload } | { outcome: 'already-applied'; payload: GraphPayload } | { outcome: 'gap'; expected: number; got: number };
      /** Owner-discriminated MERGE (DQ-01c): a re-added id is merged by producer tier — the filesystem tier's fields and the code tier's fields on one node never destroy each other; it is neither concat nor whole-node replace. */
      export function applyGraphDelta(payload: GraphPayload, delta: GraphDelta): DeltaApplyResult;
      export type HostToWebview = { type: 'graph'; payload: GraphPayload } | { type: 'graph-delta'; delta: GraphDelta };
      export type WebviewToHost = { type: 'ready' } | { type: 'reveal'; nodeId: string } | { type: 'resync'; haveSeq: number };
    amended_by:
      - decision: DQ-01
        was: "C-MODEL proposal: GraphPayload.revision/GraphDelta.baseRevision+revision (a range), edgeId(), removedEdgeIds, composeDeltas() with a composition law, whole-node replace on re-add"
        now: "no revision algebra, no edgeId, no removedEdgeIds, no composeDeltas (none has a consumer among the nine); GraphDelta carries seq + file + revision_id + producer; merge is owner-discriminated"
        why: "7 of 8 failing adversarial probes were against the machinery removed; the one that matters (two producers, one id — L-01) is fixed by ownership, not by a merge policy. Coalescing of bursts happens in WATCH's merge table over CHANGES, not over deltas."
      - decision: F-1
        was: "one monotone `revision` counter doing two jobs"
        now: "`seq` (order/gap detection, envelope only) and `revision_id` (staleness, on nodes)"
      - decision: DQ-02
        was: "NodeLocation.filePath: absolute path"
        now: "WorkspacePath"
    invariants:
      - { id: I-1,  class: C, text: "@cpg/model imports nothing at runtime; no file under packages/** imports vscode (check-deps)" }
      - { id: I-3,  class: R, text: "no id contains U+0000" }
      - { id: I-4,  class: T+R, text: "node ids unique within a payload (S4/C3 required check)" }
      - { id: I-5,  class: T, text: "the merge is an upsert discriminated by producer; removals apply before additions" }
      - { id: I-7,  class: T, text: "output order deterministic: survivors keep relative order, updated nodes keep their index, new nodes append in delta order" }
      - { id: I-8,  class: T, text: "removing a node removes every incident edge without the producer enumerating them" }
      - { id: I-9,  class: T, text: "a dangling edge is RETAINED as data, reported by validatePayload, skipped at draw time, live again when its node arrives (pass-one output of the two-pass design)" }
      - { id: I-10, class: T+R, text: "applyGraphDelta applies iff delta.seq === payload.seq + 1; already-applied iff delta.seq <= payload.seq; gap otherwise; a gap receiver logs both numbers and requests a full snapshot" }
      - { id: I-11, class: C+T, text: "every function is pure: readonly everywhere, no Math.random, no Date.now, no I/O" }
      - { id: I-13, class: C+T, text: "an unknown type string round-trips with zero defects; zero label constants declared here" }
      - { id: I-14, class: T, text: "absent and malformed are distinguishable at every accessor (Read<T>)" }
      - { id: I-15, class: X, text: "a per-file delta's removedNodeIds contains only that file's file-owned ids, never a SYMBOL (enforced by the schema's ownership class in packages/model/src/schema and by the store)" }
    may_not:
      - switch exhaustively on node.type or edge.type; derive-and-fallback (an unknown label renders grey)
      - re-derive a node's kind from its name or id (L-48, L-01)
      - "concatenate on merge (the shipped hazard: 699 payload nodes render as 658)"
      - return early on an empty or edge-only delta (every cross-file edge arrives edge-only)
      - call Math.random or Date.now; mutate an argument
      - put a content hash in a node id
      - store presentation (colour, size, position, hidden) in data
      - add a schema-aware helper here (isCallNode, a label union) — that is the schema module
      - add a dependency
    conformance_suite: "verifyModelContract(name, impl) — 70 tests on the archive; the shipped characterization test 'DUPLICATES a re-added node id' is INVERTED in the same commit that lands the merge (U1)"
    resolves: [CS-4 (six counters -> two), CS-1 (path form), L-01, L-26]
    open_questions_closed:
      - "OQ-1 one seq scalar or a vector? -> one scalar, one allocator (SINK); producers serialise (ND-1 keeps one process)"
      - "OQ-2 deltas or full payload to the renderer? -> deltas; postMessage cost of large payloads is a U3 spike"

  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-WATCH
    name: the input seam (WatchBackend + session)
    package: "@cpg/watch"
    status: specified; 56-test suite green on the archive against the reference coalesce/flushBatch/session
    purpose: >
      Two files and one rule. Layer A (contract.ts, zero imports) is the backend seam that parcel, the
      fake, and a host implement. Layer B (coalesce, session) is written once and is backend-agnostic: the
      merge table, the debounce and the ordering live in B, never in a backend. B mints revision_id
      (DQ-03: "it should be the watcher's job") and emits ChangeBatch with workspace-relative paths.
    types: |
      export type ChangeKind = 'created' | 'changed' | 'deleted' | 'moved';
      export type EntryKind = 'file' | 'directory' | 'unknown';
      export interface RawWatchEvent { readonly kind: ChangeKind; readonly path: string /* ABSOLUTE, under root */; readonly entry: EntryKind; readonly fromPath?: string; readonly observedAt: number /* T1 */; }
      export interface WatchCapabilities { readonly id: string; readonly directoryEvents: 'all' | 'delete-only' | 'none'; readonly moveEvents: 'native' | 'host-only' | 'none'; readonly reportsErrors: boolean; readonly reportsOverflow: boolean; readonly honoursIgnore: 'advisory' | 'none'; readonly pathCase: 'sensitive' | 'insensitive'; }
      export type WatchErrorCode = 'root-missing' | 'permission' | 'overflow' | 'watch-limit' | 'backend-crashed' | 'unsupported';
      export interface WatchError { readonly code: WatchErrorCode; readonly message: string; readonly fatal: boolean; readonly rescanRequired: boolean; readonly path?: string; readonly cause?: unknown; }
      export interface WatchBackend { readonly capabilities: WatchCapabilities; subscribe(root: string, onEvents: (events: readonly RawWatchEvent[]) => void, options?: { ignore?: readonly string[]; onError?: (e: WatchError) => void }): Promise<WatchSubscription>; }
      export interface WatchSubscription { readonly capabilities: WatchCapabilities; close(): Promise<void>; }
      export interface NormalizedChange { readonly kind: ChangeKind; readonly entry: EntryKind; readonly path: WorkspacePath; readonly fromPath?: WorkspacePath; readonly observedAt: number; readonly revision_id?: string /* sha256 of bytes; present for file created/changed */; readonly sizeBytes?: number; }
      export type BatchCause = 'initial' | 'live' | 'rescan';
      export interface ChangeBatch { readonly seq: number /* per session, from 0, no gaps */; readonly cause: BatchCause; readonly changes: readonly NormalizedChange[]; readonly clock: { firstEventAt: number /* T1 */; settledAt: number /* T2 */ }; }
      export interface WatchSink { onBatch(batch: ChangeBatch): Promise<void>; }   // awaited; rejection means NOT delivered
      export interface WatchSessionOptions { readonly root: string; readonly backend: WatchBackend; readonly sink: WatchSink; readonly trailingMs?: number /* 100 */; readonly ceilingMs?: number /* 500 */; readonly timers?: TimerApi; readonly onDegraded?: (paths: readonly string[], error: WatchError) => void; }
      export function coalesce(pending: ReadonlyMap<string, PendingChange>, incoming: NormalizedChange): readonly CoalesceOp[];   // pure; 20 cells
      export function flushBatch(pending: ReadonlyMap<string, PendingChange>): readonly NormalizedChange[];                      // total order: moved < deleted < changed < created; deletes children-first, creates parents-first
    merge_table:
      note: "existing (rows) x incoming (columns) at the destination key. Every cell has one test. Deletes are ABSORBING (R2). created x changed -> created is the D1 fix (kind-blind last-write-wins dropped file creations)."
      rows:
        absent:   { created: created, changed: changed, deleted: deleted, moved: moved }
        created:  { created: created, changed: created, deleted: deleted, moved: created }
        changed:  { created: changed, changed: changed, deleted: deleted, moved: moved }
        deleted:  { created: changed, changed: changed, deleted: deleted, moved: changed }
        moved_P:  { created: "moved{from:P}", changed: "moved{from:P}", deleted: "deleted + set P=deleted", moved: "moved{from:new} + set P=deleted" }
      source_key_rules: "a moved resolves its source key first: absent->keep; created->drop from, degrade to created at dest; changed->drop from, stays moved; deleted->keep delete, degrade to created; moved{from:O}->compose to moved{from:O}; missing fromPath->degrade to created"
      supersedes: "C-CLI's duplicate table (created x deleted -> drop) — CS-10 resolved in favour of this table; there is exactly one merge table in the system"
    budget_boundary:
      T0_T1: "~74 ms macOS FSEvents (measured twice within 5%); outside our code; may not be benchmarked against"
      T1_T2: "trailingMs (100) / ceilingMs (500): policy, declared, dialable; the only knob that moves the human clock without touching the pipeline; a declared maxWaitMs cap means a burst cannot delay indefinitely (DQ-05)"
      T2_T3: "the pipeline clock, handed to SINK/STORE"
      rule: "all three intervals separately reportable (clock.firstEventAt, clock.settledAt, SINK's T3); a single mixed number is how the 2 s claim becomes unfalsifiable"
    invariants:
      - { id: INV-3,  class: C, text: "no file in packages/watch imports vscode, a parser, a store, or node:fs (hashing is B's one read, via the injected FilesystemProbe)" }
      - { id: INV-4,  class: T+R, text: "every emitted raw path is absolute and strictly under root; toRelativePosix throws 'path escapes root'" }
      - { id: INV-5,  class: T, text: "a file creation while subscribed is delivered at least once" }
      - { id: INV-6,  class: T, text: "a backend does not coalesce: create-then-change yields >= 2 raw events" }
      - { id: INV-9,  class: T, text: "directoryEvents:'all' implies a directory create is actually observable (kills the dead branch of L-07)" }
      - { id: INV-10, class: T, text: "reportsErrors:true implies an injected error surfaces; false implies onError is never called ('void onError;' is a conformance failure)" }
      - { id: INV-14, class: T, text: "coalesce is pure" }
      - { id: INV-15, class: T, text: "the merge table is total: 20 cells, one test each" }
      - { id: INV-16, class: T, text: "batch order moved < deleted < changed < created; deletes children-first, creates parents-first (master's typeRank, restored)" }
      - { id: INV-17, class: T, text: "batch order is total: identical output under input permutation" }
      - { id: INV-19, class: T, text: "changed on an unknown path is an UPSERT for a consumer, not a no-op (second half of the D1 fix)" }
      - { id: INV-20, class: T, text: "seq starts at 0, monotonic, no gaps" }
      - { id: INV-21, class: T, text: "at most one batch in flight; delivery strictly seq-ordered (SerialQueue)" }
      - { id: INV-22, class: T, text: "a rejecting sink calls onDegraded with the affected paths; never a log line alone (L-08)" }
      - { id: INV-23, class: T+R, text: "paths leaving the seam are workspace-relative POSIX via startsWith + slice (L-10)" }
      - { id: INV-25, class: T, text: "a WatchError with rescanRequired obliges a full rescan; surfaced, never swallowed" }
      - { id: INV-26, class: T, text: "NEW (DQ-03): every file created/changed carries revision_id = sha256(bytes), hashed once here; downstream carries it, never recomputes" }
    guarantees: [at-least-once after subscribe resolves, per-path FIFO, absolute paths under root from backends, silence after close, static honest capabilities, in-memory known state advances ONLY after confirmed delivery]
    not_guaranteed: [cross-path ordering, exactly-once (duplicates expected; a backend must NOT dedupe), completeness under load (overflow arrives as an error or as nothing), moves (may arrive as deleted+created), directory events, that the path still exists, anything before subscribe resolves]
    may_not:
      - "a backend: debounce, batch, coalesce, dedupe, reorder, drop, read contents, hash, lstat, touch a store/parser/renderer, accept and discard onError, claim a capability it lacks, synthesize a moved, emit a path outside root, deliver after close, throw synchronously from subscribe, eagerly import @parcel/watcher (dynamic import only), run alongside the VS Code watcher in the extension host"
      - "layer B: put domain policy in the generic batcher, be a barrel that is also an implementation, advance known state before confirmed delivery, grow pause()/resume() with no caller"
    conformance_suite: "verifyWatchBackendContract (12) · verifyCoalesceContract (26) · verifyBatchOrderContract (4) · verifyWatchSessionContract (14); the suite carries the normative reference coalesce/flushBatch/createWatchSession — lift them verbatim into the package"
    port_from:
      - "archive/research-sweep-20260916:packages/engine/src/watch/{sink,queue,backend,events,normalize,parcel-backend,debounce}.ts + 667 LOC of tests"
      - "archive/discovery-20260916:packages/file-watcher/src/changes.ts"
    resolves: [CS-10, L-14, L-07, L-15, L-31 (D1 kind-blind batching)]
    open_questions:
      - { id: OQ-1, kind: spike, text: "VS Code host directory events: 'none' + ancestor rescan, or onDidCreateFiles too?", disposition: "under P-A the host is not a producer input; only the parcel backend matters; ancestor rescan (discovery's WorkspaceGraphIndex.applyChange) is the fallback" }
      - { id: OQ-2, kind: spike, text: "does @parcel/watcher surface overflow at all?", disposition: "U4 spike; if not, a periodic reconcile walk is a funded story" }
      - { id: OQ-3, kind: debate, text: "teardown policy: flush, persist, or marker?", disposition: "close() drops; the next session's initial walk is the marker (43 s at 1,802 files is the cost; revisit if it hurts)" }
      - { id: OQ-5, kind: spike, text: "rename pairing by content hash only misses rename+edit", disposition: "accepted for v1; inode pairing deferred" }
      - { id: OQ-6, kind: spike, text: "case-insensitive volumes: fold the pending-map key?", disposition: "U4 30-minute spike on macOS" }
      - { id: OQ-7, kind: human, text: "human clock or pipeline clock?", disposition: "ANSWERED: human clock (DQ-05)" }
      - { id: OQ-8, kind: human, text: "directory move in scope?", disposition: "v1: arrives as N deletes + N creates (ids under the subtree churn); directory-move relocation deferred with a trigger" }

  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-PARSE
    name: parser / language registry
    package: "@cpg/parse"
    status: specified; suite exports verifyParseContract (30) + verifyGrammarDirResolution; runs when a harness exists (U6a)
    purpose: >
      Grammar acquisition and provenance, the parse call, tree lifetime, language registration. Text in,
      live tree out. Never opens a path, never names a graph label, never writes to disk by default.
      Latency is not a design input here (tree-sitter is 1.45–9.48 ms p50); tree LIFETIME is a
      memory-safety contract (~1.6 MB per cached 1000-line tree; the wasm heap never shrinks).
    types: |
      export interface SyntaxPoint { readonly row: number; readonly column: number; }   // 0-based row, UTF-16 column
      export interface SyntaxNode { readonly type: string; readonly startPosition: SyntaxPoint; readonly endPosition: SyntaxPoint; readonly startIndex: number; readonly endIndex: number; readonly namedChildren: readonly SyntaxNode[]; childForFieldName(name: string): SyntaxNode | null; readonly text: string /* NEVER truncated */; }
      export type LanguageId = string;  export type DocumentKey = WorkspacePath;
      export interface GrammarRef { readonly wasmFile: string; readonly packageName: string; }
      export interface LanguageRegistration { readonly id: LanguageId; readonly grammar: GrammarRef; readonly rootNodeType: string; readonly extensions: readonly string[]; }
      export interface LanguageRegistry { register(r: LanguageRegistration): RegisterOutcome; freeze(): void; readonly frozen: boolean; get(id): LanguageRegistration | undefined; languageForExtension(ext): LanguageId | undefined; languageForPath(path): LanguageId | undefined; ids(): readonly LanguageId[]; }
      export interface GrammarSource { load(ref: GrammarRef): Promise<GrammarBytesOutcome>; describe(): string; }   // the ONLY byte channel; never throws
      export type GrammarDirResolver = (req: { packageName: string; explicit?: string; env?: Record<string, string | undefined>; resolvePackageJson(pkg: string): string }) => GrammarDirOutcome;  // explicit > CPG_GRAMMAR_DIR > package anchor
      export interface GrammarProvenance { readonly language: LanguageId; readonly packageName: string; readonly packageVersion?: string; readonly wasmFile: string; readonly origin: string; readonly bytesSha256: string; readonly abiVersion: number; readonly abiSupported: { minCompatible: number; languageVersion: number }; }
      export interface ParseRequest { readonly key: DocumentKey; readonly text: string; readonly language?: LanguageId; }
      export type ParseError = { code: 'unsupported-language' | 'grammar-unavailable' | 'grammar-rejected' | 'abi-unreadable' | 'abi-out-of-range' | 'runtime-unavailable' | 'no-tree' | 'disposed'; message: string; /* + per-code fields */ };
      export type ParseOutcome = { ok: true; handle: ParseHandle } | { ok: false; error: ParseError };   // a SYNTAX ERROR is ok:true with hasError:true
      export interface ParseHandle { readonly key: DocumentKey; readonly language: LanguageId; readonly root: SyntaxNode; readonly rootType: string; readonly hasError: boolean; readonly rootTypeMismatch: boolean; readonly released: boolean; diagnostics(): { errorNodeCount: number; missingNodeCount: number; errorSpanRatio: number }; release(): void; }
      export interface TreeCachePolicy { readonly maxRetainedTrees: number; }   // finite; unbounded is unrepresentable
      export interface ParseService { ensureReady(ids: readonly LanguageId[]): Promise<readonly ParseError[]>; parse(req: ParseRequest): Promise<ParseOutcome>; retain(key): void; releaseDocument(key): void; provenance(): readonly GrammarProvenance[]; stats(): ParserStats; dispose(): { leakedHandles: number; cachedTreesReleased: number }; }
    invariants:
      - { id: I1,  class: C, text: "no vscode import" }
      - { id: I2,  class: C+T, text: "imports no graph vocabulary, extractor, resolver, renderer, store; only runtime dep is the parser binding" }
      - { id: I5,  class: T, text: "routing by extension exactly: .tsx->tsx, .ts/.mts/.cts->typescript, .js/.jsx/.mjs/.cjs->javascript, .py->python; case-insensitive; Makefile->undefined" }
      - { id: I6,  class: T, text: "no aliasing, no default grammar; unregistered => unsupported-language" }
      - { id: I10, class: T, text: "grammar discovery consults no __dirname, repo root, or cwd" }
      - { id: I11, class: T, text: "locator precedence explicit > CPG_GRAMMAR_DIR > package anchor, reported in `via`" }
      - { id: I13, class: T+R, text: "reading the ABI range before init throws AbiNotReadyError; unreadable is an error, never a skipped check" }
      - { id: I15, class: T, text: "a failed init/load is not memoised; a fixed cause succeeds next time" }
      - { id: I16, class: T, text: "a successful load is memoised by promise: N parses => 1 source read; concurrent first use shares one in-flight load" }
      - { id: I19, class: T, text: "source text never comes from disk: a key with no file on disk parses" }
      - { id: I20, class: T, text: "stats().debugDumpsWritten === 0 by default" }
      - { id: I21, class: T, text: "leaf text is never truncated (the 40-char SNIPPET_MAX_LENGTH defect blocked the TS import extractor)" }
      - { id: I22, class: T, text: "a syntax error is a successful parse: ok, hasError, walkable root" }
      - { id: I23, class: T, text: "misrouted source is flagged (hasError and/or rootTypeMismatch), never silently accepted (.tsx at the TS grammar yields an ERROR tree, not a warning)" }
      - { id: I24, class: T+R, text: "handle lifetime: parse +1 live; release -1; double release no-op; root after release throws HandleReleasedError" }
      - { id: I25, class: T, text: "cachedTrees <= maxRetainedTrees; an evicted tree is released (tree.delete()), not leaked" }
      - { id: I26, class: T, text: "nothing is cached for a non-retained key" }
      - { id: I31, class: T, text: "if incremental reparse is ever used, the reparsed tree's S-expression equals a fresh parse (a wrong edit yields a wrong tree with no error)" }
      - { id: I33, class: T, text: "same (text, language, bytesSha256) => identical tree; deterministic" }
      - { id: I34, class: T, text: "provenance() has one entry per loaded grammar with a non-empty bytesSha256" }
    may_not:
      - "read source from disk or accept a path for text"
      - "write anything by default"
      - "compute a path from __dirname/repo root/cwd"
      - "truncate node text"
      - "eagerly copy the tree to plain JS"
      - "alias grammars or fall back to a default"
      - "sniff shebangs"
      - "read ABI constants before init"
      - "memoise a failure"
      - "cache a non-retained key or hold an unbounded cache"
      - "throw for an expected condition (two throws exist: HandleReleasedError and AbiNotReadyError, both caller bugs)"
      - "degrade a failure into an empty/ERROR tree"
      - "name a graph label/edge/id/symbol/delta/store concept"
      - "add incremental reparse on latency grounds"
      - "export a barrel with implementation"
      - "require the monorepo/bundler/VS Code to run"
