  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-EXTRACT
    name: AST to graph elements, per file
    package: "@cpg/extract"
    status: specified; suite exports verifyExtractContract (~30 activate with a harness) + verifySealContract; typechecks clean
    purpose: >
      Parse tree in, graph elements out, per file, zero cross-file knowledge. The producer boundary of the
      two-pass design. Salience (what gets a node) is decided in exactly one place, the LanguageAdapter's
      classify(node, container), kept as a frozen table per grammar, compiled in, never configuration:
      sparse-by-design is literal — no node for a thing means the adapter returned undefined for it.
    types: |
      export type FileOwnedLabel = Exclude<NodeLabel, 'DIRECTORY' | 'FILE' | 'SYMBOL' | 'COMMUNITY' | 'TAG' | 'META_DATA'>;   // MODULE | TYPE_DECL | METHOD | PARAM | MEMBER | CALL | IMPORT | UNKNOWN — an extractor that names another label does not compile
      export type Tier = 'structural' | 'expression';
      export interface ExtractRequest { readonly path: WorkspacePath; readonly grammarId: GrammarId; readonly root: SyntaxNode; readonly revision_id: string /* travels through; NEVER enters an id */; readonly lineCount: number; readonly tiers?: { expression?: boolean /* default FALSE */ }; readonly budget?: { maxNodes?: number; maxDepth?: number /* no hidden default */ }; }
      export interface NodeElement { readonly label: FileOwnedLabel; readonly id: string; readonly file: WorkspacePath; readonly revision_id: string; readonly tier: Tier; readonly range: SourceRange; readonly nameRange?: SourceRange; readonly properties: Readonly<Record<string, PropertyValue>>; }
      export interface SymbolElement { readonly fqn: string; readonly origin: 'local' | 'external' | 'builtin'; readonly language: string; readonly properties: Readonly<Record<string, PropertyValue>>; }   // separate channel: a per-file replace never sweeps a symbol another file points at
      export type EndpointRef = { by: 'id'; label: FileOwnedLabel; key: string } | { by: 'fqn'; label: 'SYMBOL'; key: string };
      export interface EdgeElement { readonly type: EdgeType; readonly from: EndpointRef; readonly to: EndpointRef; readonly properties: Readonly<Record<string, PropertyValue>>; }
      export interface RefSite { readonly id: string /* unique per BOUND NAME */; readonly nodeId: string /* several sites may share one CALL/IMPORT */; readonly filePath: WorkspacePath; readonly kind: RefKind; readonly position: { row: number; column: number } /* the EXACT token a definition provider must be asked about */; readonly nameParts: readonly string[]; readonly importBinding?: { module: string; relativeDepth: number; imported?: string; local: string }; readonly declined?: ResolutionReason; }
      export interface ExtractedFile { readonly path: WorkspacePath; readonly grammarId: GrammarId; readonly revision_id: string; readonly nodes: readonly NodeElement[]; readonly symbols: readonly SymbolElement[]; readonly edges: readonly EdgeElement[]; readonly refSites: readonly RefSite[]; readonly stats: { astNodesVisited: number; structuralNodes: number; expressionNodes: number; lineCount: number }; readonly elementDigest: string /* pure function of the four arrays */; readonly interfaceHash: string /* NEW (ND-9): normalized exported surface */; }
      export type ExtractOutcome = { kind: 'ok'; file: ExtractedFile } | { kind: 'truncated'; file: ExtractedFile; truncation: { limit: 'maxNodes' | 'maxDepth'; limitValue: number; droppedAtNodeType: string; droppedRange: SourceRange } } | { kind: 'failed'; error: { code: 'root-type-mismatch' | 'grammar-unsupported' | 'tier-disabled' | 'budget-invalid' | 'path-not-relative' | 'adapter-missing' | 'internal'; message: string; path: string } };
      export type Disposition = { state: 'emits'; fromNodeTypes: readonly string[] } | { state: 'not-mine'; owner: 'filesystem-tier' | 'resolve-pass' | 'analysis-pass' | 'meta' } | { state: 'declared-not-emitted'; reason: string; trackingId: string };
      export interface CoverageManifest { readonly contractVersion: string; readonly grammarId: GrammarId; readonly nodes: Readonly<Record<NodeLabel, Disposition>> /* TOTAL over 14 */; readonly edges: Readonly<Record<EdgeType, Disposition>> /* TOTAL over 15 */; }
      export interface Extractor { readonly contractVersion: string; readonly grammars: readonly GrammarId[]; coverage(grammarId): CoverageManifest; extract(req: ExtractRequest): ExtractOutcome; /* SYNCHRONOUS and pure */ }
      export interface LanguageAdapter { readonly grammarId: GrammarId; readonly language: string; readonly moduleRootType: string; moduleName(path): string; classify(node: SyntaxNode, container: 'MODULE' | 'TYPE_DECL'): DeclarationInfo | undefined; classifyExpression?(node): ExpressionVerdict | undefined; localBindings?(regionRoot): readonly string[] | undefined; coverage(): CoverageManifest; }
      declare const SEALED: unique symbol;
      export interface ExtractedFileSet { readonly [SEALED]: true; readonly files: ReadonlyMap<WorkspacePath, ExtractedFile>; readonly refSites: readonly RefSite[] /* (path, siteId) order */; }
      export function sealExtractedFiles(files: Iterable<ExtractedFile>): { kind: 'ok'; set: ExtractedFileSet } | { kind: 'failed'; duplicatePaths: readonly string[] };
      export type ResolvePassEntry = (set: ExtractedFileSet) => unknown;   // "resolve while still walking" does not typecheck
    amended_by:
      - decision: DQ-02/DQ-06
        was: "contentDigest"
        now: "revision_id on the request, on every NodeElement, and on ExtractedFile (P-B)"
      - decision: ND-9
        was: "nothing bounded cascade"
        now: "ExtractedFile.interfaceHash (normalized exported-declaration surface) is emitted here so U7 can gate the cascade"
      - decision: ND-10 / motion M3
        note: "the extractor emits a `tier` discriminator so a future expression pass is additive; U1's identity test proves a statement-level ordinal id round-trips"
    invariants:
      - { id: I2,  class: T, text: "extract performs no I/O (Module._load trap; a native-ESM runtime must fail LOUDLY if the trap cannot install — Q4)" }
      - { id: I3,  class: T, text: "deterministic: same request => byte-identical output including array order" }
      - { id: I4,  class: T, text: "extract never throws; every failure is an ExtractOutcome" }
      - { id: I5,  class: R+T, text: "every NodeElement.file === request.path" }
      - { id: I6,  class: R+T, text: "every node id starts `${path}:` and contains no substring of revision_id; ids are stable across edits that do not touch the construct" }
      - { id: I7,  class: R+T, text: "node ids unique within the file; symbol fqns unique within the file" }
      - { id: I8,  class: C+T, text: "no SYMBOL/FILE/DIRECTORY/COMMUNITY/TAG/META_DATA in nodes" }
      - { id: I9,  class: R+T, text: "every edge endpoint resolves within this file's nodes (by id) or symbols (by fqn)" }
      - { id: I10, class: R+T, text: "no edge endpoint names another file's path; cross-file travels through SYMBOL only (L-03)" }
      - { id: I11, class: R+T, text: "CALLS/IMPORTS carry status; resolved only for a same-file target; external only from the adapter's builtin table; no bare-name SYMBOL is minted for what was not attributed" }
      - { id: I12, class: R+T, text: "every ref site that produced no edge carries a ResolutionReason; receiver sites are emitted even though v1 answers none (declined receiver-unknown) so the 59.3% gap is COUNTED" }
      - { id: I13, class: C+T, text: "CoverageManifest is total over 14 labels and 15 edge types; silence is unrepresentable (the IMPORT-declared-never-emitted defect: 118 statements uncounted)" }
      - { id: I14, class: T, text: "coverage is honest both ways against the fixture corpus" }
      - { id: I15, class: T, text: "structural density <= 1.5 nodes/LOC (measured 0.361/0.429; per-file vs corpus-level is Q6)" }
      - { id: I16, class: T, text: "expression tier OFF by default; requesting it either fails tier-disabled or actually emits it — accepted-and-silently-does-nothing is forbidden" }
      - { id: I17, class: T, text: "a budget hit yields kind:'truncated' with a report, never a short 'ok'; no hidden default cap" }
      - { id: I18, class: T, text: "elementDigest is a pure function of the four arrays; does NOT change when only revision_id does" }
      - { id: I19, class: R+T, text: "no emitted string contains U+0000" }
      - { id: I20, class: T, text: "ref position is the LAST name segment of a callee chain and the IMPORTED name (not the alias) for an import" }
      - { id: I21, class: T, text: "intra-file attribution is order-independent: Pass A completes the file before Pass B" }
      - { id: I23, class: T, text: "rows 0-based; columns UTF-16 code units (emoji fixture)" }
      - { id: I25, class: T, text: "an unsupported grammar FAILS; never an empty result" }
    may_not: [import vscode, do any I/O, resolve anything cross-file, match a name across the workspace (the stem-map and findSymbolInWorkspace patterns are banned by name), swallow a failure, truncate silently, return empty for an unknown grammar, be non-deterministic, put a content hash in an id, key salience on a wasm filename or a flat nodeType->label map, expose salience as configuration, mint a SYMBOL in the nodes channel or one nothing targets, ask a definition provider at the receiver token, emit a raw NUL byte, turn the expression tier on by default, deep-import another package's dist, be verified only by a hand-run script, rely on the picture]
    conformance_suite: "verifyExtractContract(harness{name, createExtractor, parse, digest}) — runs identically against hand-built fake SyntaxNodes (no wasm) and the real backend; verifySealContract; fixtures src/main.py + src/main.ts with named hazards (alias import, relative import, dotted call, forward reference, emoji column)"
    port_from:
      - "archive/m0-calls-symbols-20260916:packages/engine/src/extract/{walk,adapter,python,typescript,delta,index,registry}.ts + builtins/"
      - "archive/m0-calls-symbols-20260916:packages/engine/src/identity/{node-id,symbol-id}.ts + tests + id-diff support"
      - "archive/discovery-20260916:packages/cpg-generator/src/{refSites,imports,subgraph}.ts (ADAPT: refRange/receiverRange rules; separate symbols channel)"
    resolves: [CS-8 (elementDigest dropped at every seam — now revision_id is the staleness anchor and elementDigest stays the content anchor), L-20, L-44, L-26]
    open_questions:
      - { id: Q1, kind: debate, text: "may the extractor mint UNKNOWN for an unclassifiable construct?", disposition: "yes, sparingly, tagged needs_triage; it keeps counts reconcilable (DL-11)" }
      - { id: Q3, kind: debate, text: "which of IN_SCOPE/REACHING_DEF/INHERITS_FROM/MEMBER_OF are per-file-emittable?", disposition: "IN_SCOPE and REACHING_DEF per-file (m0 walker emits them); INHERITS_FROM per-file with a SYMBOL endpoint; MEMBER_OF is overlay (not-mine)" }
      - { id: Q5, kind: spike, text: "TS ref positions/import shapes same as Python?", disposition: "U6b assumes yes; U9's spike measures resolution" }
      - { id: Q6, kind: human, text: "1.5 n/LOC per file or corpus-level?", disposition: "corpus-level assert + per-file WARNING (a generated file must not train people to disable the test)" }
      - { id: Q7, kind: debate, text: "does elementDigest cover refSites?", disposition: "yes (purity over all four arrays), because a decline-reason change is a resolver-visible change" }
      - { id: Q8, kind: debate, text: "where is SOURCE_FILE (MODULE->FILE) minted?", disposition: "by the engine's indexer alongside the filesystem tier, as the archived source-file.ts does; not by extract (FILE is not a FileOwnedLabel)" }

  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-RESOLVE
    name: the resolver seam
    package: "@cpg/resolve"
    status: specified; suite 44 tests green against the reference, 2 proven to fail against a broken chain; runs with real resolvers from U6c
    purpose: >
      Turns unanswered RefSites into Resolutions, batch per file, location-not-symbol, through a chain of
      links that can only raise an answer's rank, never lower it. Emits ResolveReport, which is the
      resolver's staleness assertion. Owns applyResolutions(set, batches) -> edges (DQ-03 fold).
    types: |
      export interface RefPosition { readonly row: number; readonly column: number; }
      export interface DefinitionSite { readonly filePath: WorkspacePath; readonly position: RefPosition; }
      export interface Resolution { readonly refId: string; readonly status: ResolutionStatus; readonly definition?: DefinitionSite /* iff resolved|ambiguous; NEVER for external */; readonly target?: { fqn: string; filePath?: WorkspacePath } /* an fqn READ from DefinitionLookup; target wins over definition */; readonly resolvedBy: string; readonly confidence: number /* [0,1]; 0 when rank <= 1 */; readonly reason?: ResolutionReason; }
      export function unresolved(ref: RefSite, resolvedBy: string, reason: ResolutionReason): Resolution;
      export interface DefinitionLookup { symbolAt(filePath, row, column): string | undefined; symbolNamed(filePath, name): string | undefined /* caller must ALREADY have picked a file */; hasSymbol(fqn): boolean; isIndexed(filePath): boolean; }
      export interface ResolverCapabilities { readonly extensions: readonly string[]; readonly kinds: readonly RefKind[]; readonly host: 'headless' | 'host-accelerator'; readonly maxConcurrentFiles: number; }
      export type BackendState = 'stopped' | 'starting' | 'warming' | 'ready' | 'degraded';
      export interface ResolveBudget { readonly perSiteMs: number /* 250 */; readonly perFileMs: number /* 500, re-cut by the harness */; readonly warmupMs: number /* 4000 */; }
      export interface ResolveBatch { readonly resolutions: readonly Resolution[] /* exactly one per input ref, in order */; readonly diagnostics: { resolverId: string; filePath: WorkspacePath; siteCount: number; backend: BackendState; degraded: boolean; elapsedMs: number; timedOutSites: number }; }
      export interface Resolver { readonly id: string; readonly precision: 'syntactic' | 'checker' | 'index'; readonly capabilities: ResolverCapabilities; open(ws: { rootPath: string; definitions: DefinitionLookup }): Promise<void>; fileChanged(filePath, text: string | null): Promise<void>; resolve(filePath, refs: readonly RefSite[], ctx?: { token?: { isCancellationRequested: boolean }; budget?: ResolveBudget }): Promise<ResolveBatch>; status(): { resolverId: string; state: BackendState; restarts: number; lastError?: ResolverError }; close(): Promise<void>; }
      export interface ProcessHost { spawn(command: string, args: readonly string[], options?: { cwd?: string }): SubprocessHandle; }   // the injected process seam; a resolver spawns nothing except through it
      export interface ResolveReport { readonly siteCount: Record<RefKind, number>; readonly statusCount: Record<RefKind, Partial<Record<ResolutionStatus, number>>>; readonly reasonCount: Partial<Record<ResolutionReason, number>>; readonly byResolver: Record<string, number>; readonly unresolvedRate: Partial<Record<RefKind, number>> /* SEPARATE denominators for call/import vs receiver/receiver-type */; readonly degradedBatches: number; readonly backendRestarts: number; readonly edgeCount: number; readonly droppedNoSymbol: number; }
      /** DQ-03 fold: the resolve stage owns turning answers into edges. */
      export function applyResolutions(set: ExtractedFileSet, batches: readonly ResolveBatch[]): { edges: readonly EdgeElement[]; report: ResolveReport };
    invariants:
      - { id: INV-1,  class: T, text: "resolutions.length === refs.length, same order, same refIds; never short/long/reordered" }
      - { id: INV-2,  class: T+R, text: "a resolver answers rank >= 2 only for a kind in its declared capabilities.kinds" }
      - { id: INV-4,  class: T+R, text: "CAPABILITY PARITY: for every host-accelerator link and every kind it answers, some headless link in the SAME chain declares that kind; violation throws capability-parity at construction (the mechanism behind DQ-09)" }
      - { id: INV-9,  class: T, text: "resolved/ambiguous/external STOP a site; unresolved/dynamic fall through; among equal-rank open answers the LAST wins so an exhausted chain still says why" }
      - { id: INV-10, class: T, text: "NO DOWNGRADE: a weaker link may upgrade, never lower (incl. dynamic -> unresolved)" }
      - { id: INV-13, class: T+R, text: "every target.fqn satisfies definitions.hasSymbol at return time; a resolver never invents an fqn" }
      - { id: INV-14, class: T, text: "a resolver that INSPECTED a site does not answer with a non-inspecting reason (no-resolver means 'I never looked')" }
      - { id: INV-6,  class: T+R, text: "resolve() before open() rejects workspace-not-open; never an all-unresolved answer" }
      - { id: INV-8,  class: T, text: "resolve() rejects ONLY for lifecycle misuse; every analysis failure is a Resolution with a reason" }
      - { id: INV-18, class: C+T, text: "spawns nothing except through ProcessHost" }
      - { id: INV-19, class: T, text: "perFileMs honoured: overrun sites are unresolved/timeout, timedOutSites > 0, degraded true" }
      - { id: INV-20, class: T, text: "an already-cancelled token yields a FULL array of cancelled answers; cancellation checked between internal batches" }
      - { id: INV-22, class: T, text: "run-to-run stable on a warm backend (0/305 disagreements measured)" }
      - { id: INV-23, class: T+R, text: "exhausted restart budget => permanently degraded, lastError set, every site backend-unavailable, degraded true; never silently healthy again" }
      - { id: INV-21, class: C+T, text: "call/import and receiver/receiver-type never share a denominator" }
      - { id: INV-25, class: T, text: "degradedBatches is counted (the freshness SLA's staleness signal for this stage)" }
      - { id: INV-26, class: T, text: "answered-but-edgeless is droppedNoSymbol, never folded into unresolved" }
    guarantees: [open() exactly once before resolve(), per-file batches, all intra-file parallelism inside the resolver (measured cap 12 in flight; re-measure per backend), resolution is a THIRD pass after every file is parsed, fileChanged happens-before any resolve that could observe it, input order preserved]
    not_guaranteed: [ordering between files (maxConcurrentFiles:1 means serialize me), warm-vs-cold equality, cross-file invalidation (that is cascade, ND-9)]
    may_not: [import vscode when host is headless, spawn/open a socket/read config except through injected seams, do synchronous I/O, resolve by bare name across the workspace, return external for a definition inside an indexed file (external is FINAL and would block a weaker link's builtin classification — the subtlest rule), swallow an error, report no-resolver after inspecting, report a definition equal to the reference position (reason self), report a path in any form other than the walker's literal string (macOS /tmp -> /private/tmp fails SILENTLY), report no-definition while starting/warming (that is not-warm; the headless client waits on the server's initialized notification, 4 s budget still applies), cache positions without honouring fileChanged, let a crash be silent, fall back invisibly, downgrade, emit a new RefKind or ResolutionStatus, mint/rename/renumber a symbol, assume RefSite.id === nodeId, be verified by a hand-run script]
    caller_obligations_now_invariants:
      - "only call and import resolutions are written onto the reference node's data.resolution; a receiver resolution never overwrites a call's status (rule 17 -> INV in applyResolutions)"
      - "a receiver resolution whose definition.filePath !== site.filePath is DISCARDED; EVAL_TYPE (to a SYMBOL) is the cross-file answer for a receiver (rule 18 -> INV in applyResolutions)"
    default_chains:
      v1_python_cli: "chain(basedpyright[headless,checker] > python-path[headless,syntactic] > null)   — basedpyright lands at U8; until then chain(python-path > null)"
      vscode_optional: "chain(vscode-definition[host-accelerator] > basedpyright > python-path > null) — admissible ONLY because basedpyright declares the same kinds (INV-4)"
      note: "python-path stays behind the checker permanently: a checker resolves `from my_module import x` only if the directory is on its search path; a flat src/ with no config measured 52.4% of ceiling from python-path alone, higher than the configured fixture"
    the_nine_host_independent_behaviors_a_headless_lsp_driver_replicates:
      - readiness gate (wait on initialized + progress tokens; 4 s budget still applies)
      - concurrency cap (12 measured; re-measure)
      - cancellation between batches
      - name-token vs declaration-extent selection (LSP Location | Location[] | LocationLink[]; prefer targetSelectionRange)
      - self-edge suppression, indexed-only filtering, and unresolved-not-external for out-of-index definitions
      - dedupe + ambiguous with confidence 0.5
      - path canonicalization to the walker's exact string form
      - never throw; every failure is a Resolution with a reason
      - no position cache until fileChanged carries content
    conformance_suite: "verifyResolverContract(name, make) + verifyChainContract; 44 tests; INV-10c and INV-4 verified to fail against a deliberately broken chain"
    port_from:
      - "archive/discovery-20260916:packages/cpg-generator/src/{resolve,chain,nullResolver,pythonPath}.ts (218/80/36/259 LOC)"
      - "archive/discovery-20260916:src/dev/fakeResolver.ts (FixtureResolver, as a test double)"
      - "archive/discovery-20260916:src/resolve/vscodeDefinitionResolver.ts (ADAPT: the nine behaviors; host-only optional link)"
      - "archive/discovery-20260916:packages/file-watcher/src/resolvePass.ts (ADAPT: third-pass ordering, edges-only-never-symbols)"
    resolves:
      - "CS-5 (ResolveReport now has a consumer: verify's resolution-health)"
      - "CS-7 (sizing uses measured 0.5585 sites/LOC and 2.4788 ms/site)"
      - "motion M1 (position A' capability parity)"
    open_questions:
      - { id: Q1, kind: spike, text: "TypeScript is entirely unmeasured", disposition: "U9 opens with the spike; nothing TS-resolution is promised before it" }
      - { id: Q2, kind: human, text: "capability parity (A') instead of a frozen edge set (A)?", disposition: "ANSWERED: A' via DQ-09 (EVAL_TYPE reserved, admitted with the headless producer at >=95% of ceiling)" }
      - { id: Q3, kind: spike, text: "perFileMs = 500 is derived, not measured as a designed pipeline", disposition: "the harness (E-VERIFY) measures a pipelined per-save loop at U6c/U8 and re-cuts it" }
      - { id: Q4, kind: debate, text: "who emits dynamic?", disposition: "keep in the enum (PROTECTED); adapters emit it for eval/getattr/computed access from U6" }
      - { id: Q6, kind: human, text: "restart budget?", disposition: "3, then permanent degraded" }
      - { id: Q7, kind: debate, text: "ProcessHost in @cpg/resolve or shared?", disposition: "in @cpg/resolve until a second caller exists (L-43)" }
      - { id: Q8, kind: debate, text: "the ceiling is capped by the graph model: 17 of 21 remaining LSP misses are parameter/with bindings that mint no node", disposition: "recorded for the schema evolution backlog (P-C): PARAM already exists; `with` bindings are a property or a documented gap" }

  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-SINK
    name: the output seam (GraphSink + delivery)
    package: "@cpg/sink"
    status: specified; 46 tests green on the archive against the reference MemoryStore + createSinkDelivery
    purpose: >
      One producer fans numbered envelopes out to N sinks with at-least-once delivery, per-sink
      serialization, bounded retry, and telemetry. ONE interface with TWO declared durability modes
      (durable stores vs ephemeral renderers) so the producer never branches per sink. Owns the seq
      allocator (F-1). Async from day one.
    types: |
      export type DeliverableDelta = GraphDelta & ({ addedNodes: readonly [GraphNode, ...GraphNode[]] } | { addedEdges: readonly [GraphEdge, ...GraphEdge[]] } | { removedNodeIds: readonly [string, ...string[]] });   // the all-empty delta is UNREPRESENTABLE; the edge-only arm is first-class
      export function makeDelta(parts: Partial<GraphDelta>): DeliverableDelta | undefined;   // undefined = nothing changed = never delivered
      export type SnapshotCause = 'initial' | 'catch-up' | 'resync';  export type DeltaCause = 'live' | 'cascade' | 'bulk';
      export interface SinkCapabilities { readonly durability: 'durable' | 'ephemeral'; readonly resyncBySnapshot: boolean; readonly deadlineMs: number; readonly maxQueueDepth: number; }
      export interface SinkState { readonly highWaterSeq: number /* -1 fresh */; readonly nodeCount: number; readonly edgeCount: number; readonly digest: string /* order-independent */; readonly nodeIds?: readonly string[] /* if present, COMPLETE */; }
      export interface GraphSink { readonly id: string; readonly capabilities: SinkCapabilities; onSnapshot(payload: GraphPayload, meta: { seq: number; cause: SnapshotCause; files?: readonly string[] }): Promise<void>; onDelta(delta: DeliverableDelta, meta: { seq: number; cause: DeltaCause; files?: readonly string[] }): Promise<void>; inspect(): Promise<SinkState>; dispose(): Promise<void>; }
      export type SinkFailureKind = 'transient' | 'overloaded' | 'out-of-order' | 'malformed' | 'permanent';
      export type SinkError = Error & { name: 'SinkError'; kind: SinkFailureKind; sinkId: string; seq: number; retryAfterMs?: number; cause?: unknown };
      export function classifyFailure(v: unknown): SinkFailureKind;   // unrecognised => transient (retrying is safe; dropping is not)
      export function assertDeltaWellFormed(delta: GraphDelta, priorNodeIds: ReadonlySet<string>, sinkId: string, seq: number): void;   // throws malformed
      export type Envelope = { kind: 'snapshot'; seq; cause: SnapshotCause; payload: GraphPayload; files? } | { kind: 'delta'; seq; cause: DeltaCause; delta: DeliverableDelta; files? };
      export interface DeliveryOutcome { readonly sinkId: string; readonly seq: number; readonly attempts: number; readonly durationMs: number; readonly status: 'confirmed' | 'degraded'; readonly failure?: SinkFailureKind; }
      export interface SinkDelivery { readonly confirmedSeq: number /* min over DURABLE sinks */; readonly renderedSeq: number /* NEW (DQ-05): min over EPHEMERAL sinks, so the picture leg is measurable */; readonly needsResnapshot: readonly string[]; deliver(envelope: Envelope): Promise<{ seq: number; outcomes: readonly DeliveryOutcome[]; confirmedSeq: number; renderedSeq: number }>; dispose(): Promise<void>; }
      export function createSinkDelivery(sinks: readonly GraphSink[], o?: { maxAttempts?: 5; baseDelayMs?: 200; maxDelayMs?: 5000; sleep?; now?; telemetry?: Partial<{ onDelivered(o: DeliveryOutcome): void; onSlow(o): void; onDegraded(d: { sinkId; seq; files; reason; needsResnapshot }): void }> }): SinkDelivery;
    amended_by:
      - decision: DQ-01
        was: "INV-17: an id in addedNodes that already exists and is not in removedNodeIds => malformed (update = remove + add)"
        now: "a re-added id is a MERGE discriminated by delta.producer (filesystem vs code tier); malformed only if the SAME producer re-adds without removal"
      - decision: DQ-05 / F-1
        was: "confirmedSeq over durable sinks only; the visual leg had no measurement point"
        now: "renderedSeq added over ephemeral sinks; both reported; one allocator here"
    invariants:
      - { id: INV-3,  class: C+R+T, text: "the all-empty delta is unrepresentable" }
      - { id: INV-4,  class: T+R, text: "an EDGE-ONLY delta is a valid first-class delivery and MUST be applied (the visualizer.ts:290 early-return defect; every cross-file edge has this shape)" }
      - { id: INV-5,  class: T+R, text: "at-least-once: seq <= highWaterSeq resolves as a no-op; apply is idempotent" }
      - { id: INV-6,  class: R+T, text: "seq > highWaterSeq + 1 => reject out-of-order; never apply across a gap" }
      - { id: INV-7,  class: T, text: "removedNodeIds removes every incident edge" }
      - { id: INV-8,  class: R+T, text: "at most one delivery in flight per sink, in seq order" }
      - { id: INV-9,  class: T, text: "a sink NEVER throws synchronously (a sync throw bypasses the driver's retry, L-19)" }
      - { id: INV-10, class: T, text: "all-or-nothing: a rejected delivery leaves state byte-identical" }
      - { id: INV-11, class: T, text: "a sink never mutates the payload/delta (shared across the fan-out)" }
      - { id: INV-12, class: T, text: "when onDelta resolves the effect is visible in inspect(); no settling window (FalkorDB measured p50 0.425 ms next round trip, 190/190)" }
      - { id: INV-13, class: C+T, text: "unrecognised rejection => transient; only permanent/malformed/out-of-order short-circuit retries" }
      - { id: INV-15, class: T, text: "digest is order-independent over nodes/edges and content-sensitive" }
      - { id: INV-18, class: R+T, text: "every addedEdge endpoint present post-apply, else malformed" }
      - { id: INV-19, class: T, text: "known state advances ONLY on confirmed delivery to every durable sink (confirmedSeq)" }
      - { id: INV-20, class: T, text: "retry is bounded exponential backoff min(base*2^(n-1), max), maxAttempts then degrade; retryAfterMs overrides" }
      - { id: INV-21, class: T, text: "exhausted retries produce onDegraded naming the affected files, never a bare log line" }
      - { id: INV-22, class: T, text: "a sink exceeding deadlineMs fires onSlow and does not stall other sinks; fan-out is parallel" }
      - { id: INV-24, class: T, text: "every delivery emits onDelivered with attempts and durationMs — the instrument the 2 s SLA is measured with" }
    durability_table:
      durable:   { permanent_failure: "confirmedSeq does NOT advance; redeliver or go degraded", repair: "replay from confirmedSeq+1", cost_of_a_missed_delta: "permanent divergence from disk", resyncBySnapshot: "false by default (a 43 s cold snapshot is outside any SLA) — Q1" }
      ephemeral: { permanent_failure: "confirmedSeq advances; renderedSeq does not", repair: "one onSnapshot cause:resync", cost_of_a_missed_delta: "a stale picture until the next snapshot", resyncBySnapshot: "true" }
    may_not: [return early on an empty-looking delta, silently drop, apply partially, reorder or apply n+1 before n, block the producer (no sync I/O, no unbounded queue, no await on another sink), throw synchronously, mutate or retain the delivered object, treat a same-producer re-add as an update, accept a dangling edge, resolve before the write is visible, invent its own retry loop, call back into the producer, import vscode (a WebviewSink takes an injected postMessage-shaped function), reinterpret cause, truncate nodeIds, be the place the vocabulary lives]
    producer_may_not: "call onDelta with something makeDelta would return undefined for; nothing-changed is a non-event"
    conformance_suite: "verifyGraphSinkContract(name, makeSink) + verifySinkDeliveryContract(name, make); 46 tests; injected sleep/now so D2 asserts the backoff sequence exactly"
    port_from:
      - "archive/research-sweep-20260916:packages/engine/src/watch/{sink,queue}.ts (the WatchSink/SerialQueue/withRetry ideas)"
      - "the reference createMemoryGraphSink/createSinkDelivery in the archived suite"
    resolves: [CS-4 (confirmedSeq/renderedSeq measurement points), the edge-only-delta defect, L-31 (retry-does-not-advance-known-state)]
    open_questions:
      - { id: Q1, kind: debate, text: "collapse-to-snapshot for a durable sink?", disposition: "durable sinks default resyncBySnapshot:false and degrade instead" }
      - { id: Q3, kind: debate, text: "does a cascade delta get its own seq?", disposition: "yes, its own seq with cause:cascade and the originating files listed, so cascade cost is measurable (U7)" }
      - { id: Q5, kind: spike, text: "named digest algorithm?", disposition: "FNV-1a over a sorted projection, named in the schema module at U1 so two processes can compare" }
      - { id: Q6, kind: spike, text: "does a WebviewSink satisfy INV-12 without an ack?", disposition: "the host's merged snapshot IS the visual cache (C-EXT §3.2); renderedSeq is stamped from the webview's render-report, measured at U3" }
      - { id: Q7, kind: human, text: "initial/catch-up/resync — three causes or two?", disposition: "keep three" }
      - { id: Q8, kind: human, text: "files on the envelope required?", disposition: "required for live and cascade, optional for bulk" }

  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-STORE
    name: the store thin waist
    package: "@cpg/store"
    status: specified; 49 tests green on the archive against reference MemoryStore + CypherPlanner
    purpose: >
      One interface, two tiers (MemoryStore always; FalkorStore from U5), both on the hot write path. A
      replace-file is exactly ONE statement. Every destructive write is scoped by a closed union and
      emitted by one function. Owns toWriteOp(file) (DQ-03 fold) and the reconciliation reads verify uses.
    types: |
      export type OwnershipClass = 'file-owned' | 'identity' | 'overlay' | 'filesystem' | 'graph-singleton';
      export type WriteMechanism = 'delete-create' | 'merge-on-key' | 'overlay-job' | 'move-rename-only';
      export interface NodeRow { readonly label: NodeLabel; readonly key: string /* id | fqn | path | name per label */; readonly properties: Properties; }
      export interface EdgeRow { readonly type: EdgeType; readonly fromLabel: NodeLabel; readonly fromKey: string; readonly toLabel: NodeLabel; readonly toKey: string; readonly properties: Properties; }
      /** L-02: a delete predicate is not free text. This union is the ONLY scoping vocabulary; planScopeDelete is the ONLY emitter. */
      export type DeleteScope = { kind: 'file'; file: WorkspacePath } | { kind: 'subtree'; directory: WorkspacePath /* segment-boundary match: /ws/app must not match /ws/application */ } | { kind: 'whole-graph'; confirm: 'I_AM_DROPPING_THE_ENTIRE_GRAPH'; reason: string };
      export type WriteOp =
        | { kind: 'replace-file'; file: WorkspacePath; seq: number; revision_id: string; nodes: readonly NodeRow[]; edges: readonly EdgeRow[] }   // ONE atomic statement
        | { kind: 'delete-file'; file: WorkspacePath; seq: number }
        | { kind: 'merge-filesystem'; directories: readonly NodeRow[]; files: readonly NodeRow[]; links: readonly EdgeRow[] /* HAS_ENTRY */; moves: readonly { from: WorkspacePath; to: WorkspacePath; kind: 'file' | 'directory' }[]; removals: readonly WorkspacePath[] }
        | { kind: 'merge-singleton'; metadata: Properties };
      /** DQ-03 fold: the store builds the write from the extracted file + its resolved edges; a delta cannot construct it (CS-3). */
      export function toWriteOp(file: ExtractedFile, edges: readonly EdgeElement[], seq: number): WriteOp & { kind: 'replace-file' };
      export interface OverlayBatch { readonly job: string; readonly nodes: readonly NodeRow[] /* COMMUNITY */; readonly edges: readonly EdgeRow[] /* MEMBER_OF | TARGETS | DEPENDS_ON */; }
      export interface OverlayWriter { write(batch: OverlayBatch): Promise<WriteReceipt>; close(): Promise<void>; }   // a SEPARATE handle; overlay is unreachable from write()
      export type NotApplied = { reason: 'stale-seq'; current: number } | { reason: 'revision-unchanged'; revision_id: string };
      export interface WriteReceipt { readonly applied: boolean; readonly notApplied?: NotApplied; readonly nodesWritten: number /* from the server's reply */; readonly edgesWritten: number; readonly nodesDeleted: number; readonly statementCount: number /* MUST be 1 for replace-file/delete-file */; readonly durationMs: number; readonly degraded?: readonly string[]; }
      export interface FileState { readonly file: WorkspacePath; readonly seq: number; readonly revision_id: string; readonly nodeCount: number; }
      export interface GraphStore {
        open(): Promise<void>; close(): Promise<void>;
        write(op: WriteOp): Promise<WriteReceipt>;
        overlayWriter(job: string): OverlayWriter;
        fileStates(): Promise<readonly FileState[]>;                 // filesystem-reconciliation, revision-reconciliation
        nodeKeys(label: NodeLabel): Promise<readonly string[]>;      // id-uniqueness
        stats(): Promise<{ nodeCount: number; edgeCount: number; beyondMeasuredScale: boolean }>;
        readFile(file: WorkspacePath): Promise<{ nodes: readonly NodeRow[]; edges: readonly EdgeRow[] }>;   // golden diffing
        staleNodes(): Promise<readonly { id: string; file: WorkspacePath; node_revision: string; file_revision: string }[]>;   // NEW (P-B): the reconciliation query
        auditLog(): readonly { at: number; scope: DeleteScope; nodesDeleted: number; calledBy: string }[];
        readonly capabilities: { tier: 'memory' | 'falkordb'; dialect: 'none' | 'cypher'; allowDropGraph: boolean /* default false */; softLimitNodes: number /* 500_000 */; maxRowsPerStatement: number };
      }
      export interface CypherStatement { readonly cypher: string; readonly params: Readonly<Record<string, unknown>>; readonly timeoutMs: number /* trailing TIMEOUT <ms>; NEVER CYPHER timeout= */; readonly readOnly: boolean; }
      export interface WritePlanner { plan(op: WriteOp): { statements: readonly CypherStatement[]; destructive: DeleteScope | undefined }; planOverlay(b: OverlayBatch): WritePlan; planScopeDelete(scope: DeleteScope): CypherStatement; readonly allowedLabels: readonly NodeLabel[]; readonly allowedEdgeTypes: readonly EdgeType[]; }
      export type StoreErrorCode = 'STORE_NOT_OPEN' | 'SCHEMA_INVALID' | 'OWNERSHIP_VIOLATION' | 'WRITE_SHAPE_VIOLATION' | 'UNSAFE_DELETE_REFUSED' | 'STRUCTURAL_TOKEN_REJECTED' | 'CAPACITY' | 'TIMEOUT' | 'CONNECTION_LOST' | 'BACKEND';
    amended_by:
      - decision: DQ-02
        was: "FilePath: absolute, POSIX, normalised"
        now: "WorkspacePath (relative). Closes CS-1: the scope delete now matches the rows the nodes carry."
      - decision: F-1 / CS-4
        was: "Revision = number, monotone per file, a THIRD counter"
        now: "WriteOp carries the envelope seq (ordering; stale-seq is a reported no-op) and revision_id (content; revision-unchanged is a reported no-op). FILE.version remains an informational per-file replace counter bumped by the store (read-modify-write, not MERGE+SET which pinned it at 1)."
      - decision: DQ-03
        was: "a DeliverableDelta cannot construct a WriteOp (four of six fields underivable — CS-3)"
        now: "toWriteOp(file, edges, seq) is required here"
      - decision: DQ-06 / P-B
        now: "staleNodes() added: the revision reconciliation is an indexed query the store answers"
    invariants:
      - { id: INV-3,  class: T+R, text: "replace-file and delete-file are exactly ONE statement (statementCount === 1); CI asserts it (DQ-10)" }
      - { id: INV-4,  class: T+R, text: "never chunked; above maxRowsPerStatement throw CAPACITY" }
      - { id: INV-5,  class: T, text: "no statement contains DETACH DELETE (it severs other files' inbound edges)" }
      - { id: INV-6,  class: T, text: "every DELETE comes from planScopeDelete with a bound scope parameter; no other statement contains the token DELETE (L-02 made executable)" }
      - { id: INV-7,  class: T+R, text: "whole-graph requires allowDropGraph and the literal confirm token" }
      - { id: INV-8,  class: T, text: "every destructive write appends one AuditEntry" }
      - { id: INV-9,  class: T, text: "no row value in cypher text; structural tokens from the allowlist (L-09; adversarial payloads in the suite)" }
      - { id: INV-10, class: C+R, text: "overlay rows unreachable from write(); rejected if smuggled (OWNERSHIP_VIOLATION)" }
      - { id: INV-11, class: T, text: "merge-on-key never nulls an existing property: null/undefined pruned before SET (a caller that only CALLS must not blank the definer's SYMBOL)" }
      - { id: INV-12, class: T, text: "a replace-file for A never mutates a node whose file !== A, except identity nodes which it may only MERGE (L-03)" }
      - { id: INV-13, class: T+R, text: "seq monotone per file: a write at seq <= current is applied:false stale-seq, never silent" }
      - { id: INV-14, class: T, text: "revision_id written is the revision_id read back by fileStates()" }
      - { id: INV-15, class: T, text: "read-your-writes on the same handle with no settling loop" }
      - { id: INV-17, class: T+R, text: "readOnly statements are GRAPH.RO_QUERY; a read never creates a graph key (GRAPH.QUERY on a missing key silently creates it)" }
      - { id: INV-18, class: T, text: "every statement carries timeoutMs as trailing TIMEOUT <ms>; CYPHER timeout= appears nowhere (accepted and silently inert)" }
      - { id: INV-19, class: T, text: "client socket timeout for a write >= 2 * timeoutMs (writes overshoot ~1.7x on rollback)" }
      - { id: INV-20, class: T, text: "a failed atomic write leaves the prior subgraph exactly as it was (torn-batch test, DQ-10)" }
      - { id: INV-21, class: T, text: "beyondMeasuredScale flips at 500k nodes with one degradation notice (above 500k is unmeasured)" }
      - { id: INV-22, class: T, text: "edge endpoint matches use :CPG{id} or the label's declared key, never a bare kind label; every two-MATCH edge statement has a WITH barrier (700 ms -> 1 ms planner trap)" }
      - { id: INV-24, class: T, text: "MemoryStore and FalkorStore pass the identical suite" }
    guarantees: [per-file total order, per-op atomicity, read-your-writes, monotone seq per file, audit completeness, identity survives file writes]
    not_guaranteed: [multi-file transaction (a cascade of N files is N atomic writes — deliberate; the cascade budget is a scheduling problem above this seam), cross-file ordering, retry (a retried CREATE double-applies; replace-file is idempotent by construction), delivery to observers (C-SINK's job), snapshot isolation (a reader sees either side of an atomic replace, never a torn half; rare 50–120 ms commit stalls known), ordering between tiers]
    may_not: [issue more than one statement for replace/delete, chunk, use DETACH DELETE, emit a DELETE outside planScopeDelete or accept a delete predicate as text, drop the graph without the token, write overlay inside a replace, interpolate values into query text (the archived serializeValue is a Cypher-injection surface), accept an unallowlisted label/type, read config from the host (the old store called vscode.workspace.getConfiguration inside connect()), type the driver as any, expose query(cypher):any or per-entity CRUD, fall back silently, mutate the WriteOp, SET null onto merge-on-key, match endpoints on a bare label or omit the WITH barrier, use CYPHER timeout=, set a write socket timeout below 2x, report applied:true for a write that did not reach the backend, report counts it did not compute, add a plugin registry (two tiers is the second caller; there is no third)]
    conformance_suite: "verifyGraphStoreContract(makeHarness) + verifyWritePlannerContract(makePlanner); 49 tests; one test per named defect (wildcard delete fixed twice, non-atomic writeDelta, torn write, DETACH DELETE, unpruned MERGE, injection, FILE.version pinned at 1, many-small, overlay-in-replace, GRAPH.QUERY key creation, CYPHER timeout=, unreported mutation, >500k)"
    port_from:
      - "archive/master-20260916:packages/engine/src/store/{store,cypher,bootstrap,falkordb-store,open,falkordb.config}.ts + tests (cypher.ts 633 LOC is the highest-value artifact in the salvage)"
      - "archive/master-20260916:packages/falkordb-service/** (remote+docker; spawned deferred)"
      - "archive/master-20260916:docker/falkordb{,.dev}.yml"
      - "archive/master-20260916:packages/engine/test/support/{falkordb,schema-conformance,invariants}.ts"
    resolves: [CS-1, CS-3, L-02, L-03, L-09, L-18]
    open_questions:
      - { id: Q1, kind: spike, text: "MemoryStore whole graph or bounded window? memory at 488k nodes unmeasured", disposition: "whole graph in v1; measure at U7 with the scale fixture" }
      - { id: Q2, kind: spike, text: "behaviour above ~500k nodes", disposition: "U7 scale fixture; the one place the comfortable verdict could flip (DQ-10 reopen trigger)" }
      - { id: Q3, kind: debate, text: "composite two-tier store: one GraphStore or two handles?", disposition: "two sinks under SinkDelivery (MemoryStore and FalkorStore are both GraphSinks); no composite store object" }
      - { id: Q6, kind: human, text: "does whole-graph ship in v1?", disposition: "no; `cpg index --rebuild` drops and recreates the graph KEY (bootstrap path), which is the schema-version-mismatch path anyway" }
      - { id: Q7, kind: debate, text: "who allocates the per-file ordering?", disposition: "ANSWERED: SINK allocates seq (F-1); the store checks monotonicity per file" }
      - { id: Q8, kind: debate, text: "are the reconciliation reads part of this contract?", disposition: "yes; a store that cannot answer them makes the SLA unfalsifiable" }

  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-CLI
    name: the CLI <-> engine thin waist
    package: "apps/cli (+ the CpgEngine port in @cpg/engine)"
    status: specified; 50-test suite (verifyCliContract) typechecks; activates when apps/cli exists (U2a)
    purpose: >
      Everything between process.argv and the first engine call, and between the last engine return and
      process.stdout. The CLI sees exactly one port, CpgEngine; it never constructs a store, parser or
      Cypher. Machine output on stdout as one versioned document (or NDJSON); everything diagnostic on
      stderr. Format is never inferred from a TTY.
    types: |
      export const EXIT = { OK: 0, FAILED: 1, USAGE: 2, VERIFY_FAILED: 3, INTERRUPTED: 130 } as const;   // 3: the tool worked, the graph did not pass (verify/doctor only)
      export type Verb = 'index' | 'watch' | 'query' | 'verify' | 'inspect' | 'doctor' | 'config' | 'schema';
      export const RESERVED_VERBS = ['mcp', 'status'];   // exit 2 "not built yet", distinguishable from "unknown command"
      export interface Io { out(line): void; err(line): void; status(line): void /* in-place progress on stderr; no-op unless isTty.err */; readonly env; readonly stdin: { readText(): Promise<string>; isTty: boolean }; readonly isTty: { out: boolean; err: boolean }; readonly now: () => number; }
      export type ConfigLayer = 'flag' | 'env' | 'file' | 'manifest' | 'default';   // index in CONFIG_PRECEDENCE is the rank
      export type CliError = { kind: 'usage'; verb?; message; hint? } | { kind: 'config'; key; layer; message } | { kind: 'workspace'; path; message } | { kind: 'stdin'; expected: 'json-document' | 'ndjson'; message; hint? } | { kind: 'engine-unavailable'; endpoint; message } | { kind: 'engine-timeout'; budgetMs; elapsedMs } | { kind: 'engine-rejected'; message; query? } | { kind: 'concurrent-session'; graph; holder } | { kind: 'verification'; failures: readonly CheckResult[] } | { kind: 'interrupted'; committed; pending };
      export function exitCodeFor(error: CliError): ExitCode;   // total; the ONLY exit-code decision site
      export interface CommandSpec { readonly verb: Verb; readonly summary: string; readonly positionals: readonly PositionalSpec[]; readonly flags: readonly FlagSpec[] /* single source of truth */; readonly stdin: 'none' | 'optional-document' | 'required-document'; readonly stdout: 'document' | 'ndjson' | 'none'; }
      export function renderUsage(spec: CommandSpec): string;   // the ONLY producer of usage text
      export const RESERVED_TEST_PORT = 6381;  export const DEFAULT_STORE_PORT = 6382;
      export interface Provenanced<T> { readonly value: T; readonly layer: ConfigLayer; readonly source: string; }
      export interface ResolvedConfig { root: Provenanced<string>; include; exclude; maxFileSizeBytes; consumers: Provenanced<{ inspect: boolean; store: 'memory' | 'falkor'; vscode: boolean }>; store: { host; port; graph; mode: Provenanced<'remote' | 'docker'> }; queryTimeoutMs; resolve: { perFileMs; perSiteMs }; watch: { trailingMs; ceilingMs; bulkThresholdFiles }; }
      export function resolveConfig(layers: readonly { layer: ConfigLayer; source: string; values: Record<string, unknown> }[]): ResolvedConfig;   // pure
      export interface Document<K extends string, B> { readonly v: 1; readonly kind: K; readonly tool: string /* cpg@<semver> from the manifest */; readonly producedAt: string; readonly body: B; }
      export type CpgDocument = Document<'cpg.index.report', IndexReport> | Document<'cpg.verify.report', VerifyReport> | Document<'cpg.query.result', QueryResult> | Document<'cpg.config.resolved', ResolvedConfig> | Document<'cpg.doctor.report', DoctorReport> | Document<'cpg.graph.payload', GraphPayload> | Document<'cpg.schema', unknown>;
      export interface IndexReport { root; walk: { filesSeen; filesIndexed; filesExcluded; filesUnsupported; filesTooLarge; filesFailed } /* seen === sum */; files: readonly { path: WorkspacePath; revision_id: string /* sha256:<hex>, REQUIRED */; nodes; edges }[] /* sorted by path */; nodesWritten; edgesWritten; durationMs; dryRun; interrupted; warnings; target: StoreTarget | null; consumers: readonly string[] /* the enabled set, always printed with any timing */; }
      export interface CheckResult { readonly id: VerifyCheckId; readonly state: 'pass' | 'fail' | 'stale' | 'unavailable'; readonly observed: number; readonly expected: number; readonly localisedTo: readonly string[]; readonly detail?: string; readonly asOfSeq: number; }
      export interface VerifyReport { readonly state: CheckState /* worst of */; readonly checks: readonly CheckResult[] /* all six, once each, in enum order */; readonly consumers: readonly string[]; readonly durationMs: number; }
      export type WatchEvent = { kind: 'ready'; seq; at; root; report } | { kind: 'batch'; seq; at; changes: readonly NormalizedChange[]; write: { nodesWritten; edgesWritten; statementCount }; latencyMs: { t0_t1; t1_t2; t2_t3; total } /* the rank-3 clock, three intervals */ } | { kind: 'warning'; seq; at; message } | { kind: 'error'; seq; at; error: CliError } | { kind: 'closed'; seq; at; reason: 'signal' | 'error' | 'eof' };
      export interface CpgEngine { readonly identity: { name; version; languages }; connect(target: StoreTarget, opts: { readOnly: boolean }): Promise<EngineSession>; index(req: { config; session: EngineSession | null /* null iff --dry-run */; resumeFrom: readonly IndexedFile[] | null }, onProgress, signal: AbortSignal): Promise<IndexReport>; watch(req, onEvent: (e: WatchEvent) => void, signal): Promise<void>; read(session, cypher, timeoutMs): Promise<QueryResult> /* ALWAYS read-only */; verify(session, config, expected: IndexReport | null): Promise<VerifyReport>; inspect(session, config): Promise<GraphPayload>; doctor(config, env): Promise<DoctorReport>; schema(): unknown; }
      export function run(argv: readonly string[], io: Io, opts?: { signal?: AbortSignal; engine?: CpgEngine }): Promise<ExitCode>;   // main.ts is a shebang wrapper that assigns process.exitCode and nothing else
    amended_by:
      - decision: DQ-06
        was: "REQUIRED_CHECKS: fs-count-reconciliation, identity-invariants, id-uniqueness (ids unique AND rendered === payload), content-digests — the CLI could not compute its own mandatory set (CS-9)"
        now: "the six shared verify_check_ids above with four states; render-reconciliation is unavailable without a renderer consumer; --strict fails on unavailable"
      - decision: CS-10
        was: "a second merge table (created x deleted -> drop)"
        now: "deleted; C-WATCH's table is the only one"
      - decision: P-A
        now: "IndexReport and VerifyReport carry `consumers`, the enabled set, so no timing is ever quoted without the configuration that produced it"
    invariants:
      - { id: I-2,  class: C+T, text: "the CLI package never imports a store, parser or Cypher builder; it sees only CpgEngine" }
      - { id: I-3,  class: T, text: "no source file calls process.exit()" }
      - { id: I-4,  class: T, text: "process.argv read in exactly one file; process.env in exactly one" }
      - { id: I-6,  class: T, text: "the declared bin is EXECUTED by the suite: built artifact spawned, --version exits 0 (the archived bin was never once run)" }
      - { id: I-7,  class: T, text: "usage is derived: flags(verb) and the --tokens in usage(verb) are the same set both ways" }
      - { id: I-8,  class: T+R, text: "--format=json stdout is exactly one JSON value; ndjson every line parses" }
      - { id: I-9,  class: T, text: "output shape never depends on isTty" }
      - { id: I-10, class: T, text: "progress, warnings, timings, row-count line go to stderr" }
      - { id: I-12, class: T, text: "a malformed flag is exit 2 with NO connection attempted; a failed connect is exit 1" }
      - { id: I-13, class: T, text: "version banner from the manifest, never a literal" }
      - { id: I-14, class: T, text: "no flag default or source literal is an absolute path" }
      - { id: I-16, class: C+T, text: "nothing user-facing defaults to port 6381 (the integration harness)" }
      - { id: I-17, class: T+R, text: "reads use RO_QUERY; a missing key errors, never created" }
      - { id: I-18, class: T, text: "the CLI never string-matches a store error (the store adapter behind the port converts 'Query timed out' to engine-timeout)" }
      - { id: I-19, class: T+R, text: "every disk side effect is off by default" }
      - { id: I-20, class: R+T, text: "filesSeen === indexed + excluded + unsupported + tooLarge + failed" }
