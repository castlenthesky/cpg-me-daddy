  # ───────────────────────────────────────────────────────────────────────────────────────────────────
  - id: C-EXT
    name: engine <-> VS Code host protocol
    package: "apps/vscode (GraphHost is plain node; three adapters touch vscode)"
    status: specified; 39 tests green on the archive against ReferenceGraphHost (zero vscode)
    purpose: >
      The extension is a host that supplies implementations; the engine is injected with them and never
      names VS Code. Exactly three adapters touch the vscode API: SourceOpener, FilesystemProbe,
      WebviewTransport. GraphHost merges every delta into an authoritative snapshot (the visual cache),
      posts only the delta, and answers `ready` with a full snapshot. The graph is a WebviewPanel with a
      serializer (AM-2), never shown without its verification banner beside it.
    types: |
      export const CPG_PROTOCOL_VERSION = 1 as const;  export const VIRTUAL_ROOT_ID = '__root__';   // the id a layout must never mint
      export type Seq = number;  export type Epoch = number;   // seq is engine-assigned; epoch is host-assigned and bumps on every cause:'initial' snapshot
      export interface GraphSink { onSnapshot(payload: GraphPayload, meta: { seq: Seq; cause: 'initial' | 'catch-up' }): Promise<void>; onDelta(delta: GraphDelta, meta: { seq: Seq; cause: 'live' | 'cascade' | 'bulk' }): Promise<void>; }   // resolves on MERGE, never on paint
      export interface ThemeSnapshot { kind: 'light' | 'dark' | 'high-contrast-light' | 'high-contrast-dark'; nodeColors: Record<string, string>; defaultNodeColor: string; }
      export type HostToWebviewMessage = { type: 'theme'; protocol: 1; epoch; theme } | { type: 'graph'; protocol: 1; epoch; seq; payload } | { type: 'graph-delta'; protocol: 1; epoch; seq; delta } | { type: 'verification'; protocol: 1; epoch; seq; report: VerificationReport };
      export type WebviewToHostMessage = { type: 'ready'; protocol: number } | { type: 'reveal'; nodeId: string } | { type: 'resync'; epoch; seq; reason: 'gap' | 'stale-epoch' | 'render-error' } | { type: 'render-report'; epoch; seq; report: { payloadNodeCount; renderedNodeCount; renderedEdgeCount; droppedNodeIds: string[] /* capped sample */; frameMs } };
      export interface VerificationReport { epoch; seq; checks: CheckResult[] /* all six, enum order */; state: CheckState; }
      export type RevealOutcome = { ok: true; filePath; target: 'nameRange' | 'range' | 'whole-file' } | { ok: false; reason: 'unknown-node'; nodeId } | { ok: false; reason: 'no-location'; nodeId } | { ok: false; reason: 'open-failed'; nodeId; filePath; error: SerializedError };
      export type ProtocolFault = { kind: 'unknown-message'; received } | { kind: 'bad-epoch'; expected; received } | { kind: 'seq-gap'; expected; received } | { kind: 'post-failed'; seq; error };
      export interface WebviewTransport { post(m: HostToWebviewMessage): void /* LOSSY by contract */; onMessage(h): Disposable; readonly cspSource: string; }
      export interface SourceOpener { open(r: { filePath: WorkspacePath; selection?: SourceRange; frame?: SourceRange }): Promise<void>; }
      export interface FilesystemProbe { listFiles(): Promise<WorkspacePath[]>; digest(filePath: WorkspacePath): Promise<string | undefined>; }   // async; vscode.workspace.fs so remote filesystems work (L-11)
      export interface GraphHost extends GraphSink { attach(t: WebviewTransport): void; detach(): void; snapshot(): GraphPayload; seq(): Seq; epoch(): Epoch; reveal(nodeId): Promise<RevealOutcome>; setTheme(t): void; verify(fs: FilesystemProbe): Promise<VerificationReport>; faults(): readonly ProtocolFault[]; dispose(): void; }
      export function graphShellHtml(o: { scriptUri; cspSource; nonce; containerId? }): string;   // default-src 'none'; connect-src 'none'; nonce-only scripts; no literal colours; reserves #cpg-verification
    amended_by:
      - decision: DQ-06
        was: "CheckId = fs-count | identity | render-count | digest; CheckState = pass | fail | stale | unavailable"
        now: "the six shared verify_check_ids; the four states are adopted system-wide (this contract supplied them)"
      - decision: F-1
        was: "OQ-1: should C-EXT's seq and C-MODEL's revision be one number?"
        now: "yes: seq is the one ordering number; revision_id is the content fingerprint; no third counter"
    invariants:
      - { id: I-2,  class: T, text: "nothing posted before the webview sends ready" }
      - { id: I-3,  class: T, text: "ready is answered with exactly one full graph snapshot of merged state, never a delta replay" }
      - { id: I-4,  class: T, text: "theme precedes the first graph on any connection; a theme change re-posts theme alone" }
      - { id: I-6,  class: T, text: "an edge-only delta is delivered" }
      - { id: I-8,  class: T, text: "the host's merged payload is applyGraphDelta(payload, delta) — one shared merge, no private copy" }
      - { id: I-10, class: R, text: "duplicate ids are a FAILING render-reconciliation, never accepted" }
      - { id: I-11, class: T, text: "onDelta resolves once the merged payload is updated and never awaits the webview (a pane cannot stall the clock)" }
      - { id: I-12, class: R, text: "seq strictly increasing per epoch; a gap is a recorded seq-gap fault" }
      - { id: I-13, class: T, text: "cause:initial replaces the payload and bumps epoch; catch-up does not" }
      - { id: I-15, class: T, text: "reveal resolves against the host payload; nameRange wins over range; a FILE node opens whole" }
      - { id: I-16, class: C+T, text: "every reveal returns a discriminated RevealOutcome; none throws or returns void (the old host logged 'cannot reveal unknown node' and returned)" }
      - { id: I-17, class: T, text: "any location-shaped field on an inbound reveal is ignored; the payload is the single source of truth" }
      - { id: I-18, class: T, text: "a VerificationReport always carries all six checks stamped asOfSeq/asOfEpoch (snapshotted BEFORE the first await)" }
      - { id: I-19, class: R, text: "render-reconciliation is unavailable with no render-report and stale when the report's seq lags — never pass" }
      - { id: I-22, class: T, text: "every completed verify() is pushed to the webview as a verification message" }
      - { id: I-27, class: T, text: "shell CSP: default-src 'none' + connect-src 'none', nonce-only scripts, no unsafe-eval, no remote origin, everything bundled" }
      - { id: I-28, class: T, text: "no literal colour in the shell; --vscode-* vars or ThemeSnapshot (the archived CSS hard-coded rgba(30,30,30,0.85))" }
    three_surfaces_for_verification:
      - "vscode.StatusBarItem (one glyph, worst state + failing count)"
      - "vscode.DiagnosticCollection('cpg') (the only surface that localises to a file the human can open)"
      - "the webview's #cpg-verification banner"
    guarantees: [total order per epoch host-side, onDelta resolves on merge not paint, at-least-once toward the webview and exactly-once host-side, reconnect is always a full snapshot (no replay buffer), reveal is fire-and-forget from the webview]
    not_guaranteed: [that a post reaches the webview, that a render-report ever arrives (hence unavailable), any relation between observedAtMs and the engine clock, multiplexing (attach replaces)]
    may_not: [import vscode from packages/**, drop an edge-only delta, derive a delta by re-reading the store and diffing (O(whole graph) per save in the archived provider), re-send the full payload on a delta, type the webview boundary loosely, trust a webview location, treat no render-report as healthy, report pass at a stale seq, present the graph as verification, call Math.random in the layout while claiming determinism (thread the seed), mint __root__ into the payload, dedupe silently in the renderer, use sync fs, widen localResourceRoots, load anything over the network from the webview, hard-code a colour, use a WebviewViewProvider for the editor area, use a log string as the event channel, deep-import dist, add a second graph surface before the first has a second caller]
    conformance_suite: "verifyExtHostContract(makeHost) 34 tests in groups A–F + verifyShellContract 5; E4 (identical counts/ids/edges but one stale revision: everything passes except revision-reconciliation) is the load-bearing test"
    port_from:
      - "archive/discovery-20260916:src/views/graphViewProvider.ts (PORT: ready handshake, merge-locally-post-delta, id-only reveal)"
      - "archive/discovery-20260916:src/webview/graphApp.ts + tsconfig"
      - "archive/discovery-20260916:esbuild.js (30 LOC)"
      - "archive/discovery-20260916:packages/graph-visualizer/src/{shell,layout,nodeTypes,relationshipTypes,legend}.ts (PORT) + visualizer.ts (ADAPT: split the 756-line class; fix the edge-only early return; strip NUL bytes; thread a seed)"
    resolves: [CS-6 (the purity proof is now a runtime trap with an anti-vacuity check at U2, not a clause here), the edge-only-delta drop, the 699-render-as-658 dedupe]
    open_questions:
      - { id: OQ-2, kind: debate, text: "does the extension own the engine process or attach to a daemon?", disposition: "owns it in-process (ND-1); the seam is message-shaped so a daemon is a later transport change" }
      - { id: OQ-3, kind: spike, text: "delta size above which to coalesce or snapshot? postMessage cost of a 500k-node payload", disposition: "U3 spike" }
      - { id: OQ-5, kind: human, text: "how often does verify() run?", disposition: "debounce 500 ms after the last delta + on demand (cpg.verify command) + always before a gate screenshot" }
      - { id: OQ-6, kind: human, text: "editor cursor -> highlight node?", disposition: "not before a second caller (L-43)" }
      - { id: OQ-7, kind: debate, text: "is the browser inspector a second WebviewTransport?", disposition: "yes: apps/inspector implements WebviewTransport over a local WebSocket/static server, so it gets the six checks for free (ND-3)" }

# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# Cross-seam defects found in specification (R2), each with the fix and the milestone that lands it.
# These existed only in the deliberation corpus; DQ-07 required them transcribed before archiving.
# ─────────────────────────────────────────────────────────────────────────────────────────────────────
cross_seam_defects:
  - id: CS-1
    defect: "The path form was declared three incompatible ways (store: absolute; extract: relative never absolute; model: absolute-and-identical-to-the-relative-id)."
    consequence: "The store's scope-delete matched zero rows, reported applied:true, and the CREATE half re-inserted: every save silently doubled a file's node count while all four checks stayed green."
    fix: "WorkspacePath everywhere inside the graph; AbsolutePath only in FilesystemProbe and SourceOpener (DQ-02)."
    lands_in: U1
  - id: CS-2
    defect: "The graph projector had no contract: thirteen responsibilities named by some contract as somebody else's, including reading the file bytes (WATCH and PARSE each forbid themselves)."
    consequence: "The 677-line FileWatcher.ts both lineages died of, arranged so nobody drew a boundary around it."
    fix: "The stage-ownership table (03-architecture §4); toWriteOp in STORE; applyResolutions in RESOLVE; the engine reads bytes once and hands text to PARSE; WATCH mints revision_id (DQ-03)."
    lands_in: U1 (table), U2–U6 (implementations)
  - id: CS-3
    defect: "A DeliverableDelta could not construct a WriteOp{replace-file}: four of six fields underivable."
    consequence: "The ~6x atomic write had no specified producer."
    fix: "toWriteOp(file: ExtractedFile, edges, seq) required in C-STORE."
    lands_in: U5
  - id: CS-4
    defect: "Six counters named seq/revision across five granularities; confirmedSeq defined over durable sinks only, so the visual tier was excluded by construction."
    consequence: "Rank 3's two-tier claim had no measurement point."
    fix: "Exactly two numbers: seq (envelope, SINK allocates) and revision_id (nodes, WATCH mints); renderedSeq added (F-1, DQ-05)."
    lands_in: U1, U4
  - id: CS-5
    defect: "A resolver degradation reached no screen: ResolveReport had no consumer in any of the nine; C-CLI forbade a fifth check."
    consequence: "59.3% of edges absent, four checks green, exit 0."
    fix: "resolution-health is a verify check fed from ResolveReport (DQ-06)."
    lands_in: U6c
  - id: CS-6
    defect: "The behavioural purity proof passed against a violating implementation (vite-node bypasses Module._load; a trap installed inside it(...) observes nothing)."
    consequence: "Three documents cited it as THE proof grep is not needed."
    fix: "The runtime purity proof runs under plain node (not vitest), installs the trap before any import, and includes an anti-vacuity check that plants a vscode import and asserts the trap fires (U2c)."
    lands_in: U2c
  - id: CS-7
    defect: "The budget was 9.2x optimistic on its only remaining term: 0.2 sites/LOC and 17 perfect waves, against measured 0.5585 sites/LOC and 2.4788 ms/site."
    consequence: "A 1,068-LOC Python save costs ~1,674 ms against 2,000, not ~405; the limit is ~725 ref sites, not ~11 files."
    fix: "Measured inputs replace derived ones everywhere (06-measurements); the resolver harness measures the designed pipeline (DQ-04); perFileMs is re-cut by the harness."
    lands_in: U6c, U8
  - id: CS-8
    defect: "elementDigest existed in one contract and was dropped at every seam; all three mandated C4 checks compared a file's bytes to a file's bytes."
    consequence: "An ERROR-tree parse, a truncated outcome and a partial resolve all passed with the graph wrong."
    fix: "revision_id is the staleness anchor on every node (P-B); elementDigest remains the content anchor for goldens; resolution-health catches the partial resolve."
    lands_in: U1, U6
  - id: CS-9
    defect: "cpg verify could not exit 0 (id-uniqueness included a rendered count the CLI cannot compute) and the spine never scheduled it."
    consequence: "The rank-1 surface could not compute its own mandatory check set."
    fix: "id-uniqueness split from render-reconciliation; the latter is unavailable without a renderer (ND-8); cpg verify is a named deliverable of U2a."
    lands_in: U2a
  - id: CS-10
    defect: "Two normative merge tables contradicted on the cell one of them argued about (created x deleted: drop vs deleted)."
    consequence: "A spurious created then a real deleted inside one window annihilated; the deleted file's subgraph stayed in FalkorDB forever."
    fix: "One merge table (C-WATCH's); deletes are absorbing; C-CLI's copy deleted."
    lands_in: U4
  - id: CS-11
    defect: "The rename relink had no owner, and C-EXT's identity check passed on a stale resolved resolution."
    fix: "Rename = deleted + created at the change level (ids under the path churn; accepted v1); identity-invariants checks the target EXISTS, not merely that a resolution is recorded."
    lands_in: U4, U2a
  - id: CS-12
    defect: "No test compared two contracts' declarations to one another (the mechanical reason CS-1, CS-4 and an uncompilable import survived review)."
    fix: "contracts-agree.test.ts: one compile-time file asserting mutual assignability across the shared types (RefSite, Resolution, GraphDelta, NormalizedChange, CheckResult, WorkspacePath)."
    lands_in: U1
