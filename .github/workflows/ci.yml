name: CI

# Exists because six rules and three acceptance criteria in the prior corpus said
# "CI asserts it" while no CI existed. A gate nobody runs is not a gate.
#
# The three checks are deliberately the three that encode a decision:
#   check:deps  the two-tier rule (DQ-08) - packages/** runs under plain node
#               with no host SDK; each apps/* imports only its own. Enforced
#               here, not in review.
#   tsc -b      the build, including project references.
#   vitest run  the test spine, added in the same slice as the seams it tests.

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ordered cheapest-first so a dependency-direction violation fails in
      # seconds rather than after a full build.
      - name: Dependency direction (two-tier rule)
        run: npm run check:deps

      - name: Build
        run: npm run compile

      - name: Tests
        run: npm run test

  # Proves the dependency gate can actually fail. A rule nobody has seen fail is
  # not a gate, so this job introduces a real violation and asserts a non-zero
  # exit. If check-deps is ever silently neutered, this job goes green-to-red.
  gate-fails-when-violated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The three violations U0.2.2 names, one per tier rule. Each is planted
      # alone, must make the gate exit non-zero, and is removed before the next.
      # tools/check-deps.test.mjs covers the rest of the rules on fixtures.
      - name: Each tier violation must fail the gate
        run: |
          plant() {
            mkdir -p "$(dirname "$1")"
            printf '%s\n' "$2" > "$1"
            if npm run check:deps --silent; then
              echo "::error::check-deps PASSED on $1 ($2) - the gate is not enforcing"
              exit 1
            fi
            echo "check-deps correctly rejected $1"
            rm "$1"
          }
          plant packages/model/src/__ci_probe.ts "import * as vscode from 'vscode';"
          plant apps/vscode/src/__ci_probe.ts "import { Server } from '@modelcontextprotocol/sdk';"
          plant apps/cli/src/__ci_probe.ts "import { x } from '@cpg/model/dist/x';"
          npm run check:deps --silent
