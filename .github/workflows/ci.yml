name: CI

# CI runs the same commands as a laptop, a git hook and an agent: `bun run check` is THE gate.
# Nothing here re-implements a check; jobs only choose where each command runs.

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes the old run; pushes to develop/master always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Tooling telemetry is off everywhere (same as tools/check.mjs).
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Full history: check:coords resolves archive coordinates on other branches' commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node version comes from .node-version, the single source also hashed by turbo.
      # Bun version comes from package.json "packageManager".
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # `bun install` runs lefthook's postinstall, which skips itself when CI=true (set by Actions),
      # so no hooks are installed on the runner.
      - run: bun install --frozen-lockfile

      # U3's machine gate (BMO-18; controller decision 26): a feat/u3.* PR changes nothing under
      # packages/**. Pull requests only: Actions sets GITHUB_HEAD_REF and GITHUB_BASE_REF there.
      - run: bun run check:unit-diff
        if: ${{ github.event_name == 'pull_request' }}

      # Turbo local cache only (no remote cache). The sha suffix makes every run save a fresh
      # entry; restore-keys then fall back to the newest cache for the same lockfile.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-

      - run: bun run check

      # coverage/** is a turbo output of //#test:coverage, so it exists on a cache hit too: no
      # second test run is needed. Ubuntu only: one copy is enough.
      - uses: actions/upload-artifact@v7
        if: ${{ runner.os == 'Linux' }}
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  # Proves the gates can actually fail. A rule nobody has seen fail is not a gate: this job
  # plants real violations (tools/prove-gates.mjs) and asserts each gate exits non-zero, so a
  # silently neutered gate turns CI red instead of staying quietly green.
  gates:
    runs-on: ubuntu-latest
    steps:
      # Full history: check:coords resolves archive coordinates on other branches' commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The Stryker case is slow: skipped here (and logged by name), run weekly by mutation.yml.
      - run: bun run check:gates
        env:
          PROVE_GATES_SKIP_SLOW: '1'

  # The graph inside VS Code (U3.1.2, BMO-56; controller decisions 33 and 42): @vscode/test-cli on two
  # pinned versions, the oldest that engines.vscode promises and a current one. Not in `bun run check`,
  # because it downloads VS Code and wants a display.
  vscode-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pin: [current, oldest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # CPG_HOST_DISPLAY=1 uses the display there is: here, the virtual one xvfb-run makes.
      - run: xvfb-run -a bun run test:vscode-host --label ${{ matrix.pin }}
        env:
          CPG_HOST_DISPLAY: '1'
