name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Standing gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Typecheck (tsc --build)
        run: bun run typecheck

      - name: Unit tests (bun test)
        run: bun run test:unit

      - name: Schema conformance (bun run test:schema)
        run: bun run test:schema

  integration:
    name: Integration (FalkorDB, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Deliberately `docker compose` rather than a `services:` container.
      # A service container would run CI against a FalkorDB the harness cannot
      # prove it owns: the provenance nonce in tools/falkordb-up.ts is stamped
      # through `docker exec` on the container compose started, and that is the
      # one check a foreign server on the port cannot fake. Using the same
      # compose file as developers also means CI and local runs share one pinned
      # image and one set of FALKORDB_ARGS, so the config fingerprint the
      # harness asserts is generated from the same source of truth.
      - name: Start FalkorDB (pinned, provenance-verified)
        run: bun run db:up

      - name: Integration tests (bun test + graph invariants)
        run: bun run test:integration

      - name: FalkorDB logs on failure
        if: failure()
        run: docker compose -f docker/falkordb.yml logs --tail 200

      - name: Stop FalkorDB
        if: always()
        run: bun run db:down
