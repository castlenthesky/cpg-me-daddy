units:
  foundation:
    - id: F1
      name: Monorepo skeleton + CI
      delivers: >
        packages/engine (pure TS, zero vscode imports), packages/cli, packages/vscode. npm workspaces,
        tsconfig project references. oxlint + oxfmt + lefthook; bun test for engine unit and integration;
        @vscode/test-cli for the host (R5 packaging recommendation). Resolve the duplicate bun.lock /
        package-lock.json — pick one, delete the other. Retire eslint.config.mjs and typescript-eslint.
        Stand up .github/workflows/ci.yml: lint, format check, typecheck, unit tests on ubuntu + macos.
      gate: >
        CI green on a trivial passing test in each package; `lefthook install` wires pre-commit and the hook
        is proven to fire on a deliberately misformatted commit. A no-restricted-imports rule fails the build
        if anything under packages/engine imports vscode — add a deliberately-violating file, watch the build
        go red, then remove it. A rule nobody has seen fail is not a gate.
      status: done
      verified_2026-09-12: "lint, format:check, typecheck, test:unit all green on master@4f5fca2."

    - id: F2
      name: FalkorDB test harness + invariant suite
      delivers: >
        Port ast-demo/bench/src/client.ts (RESP wrapper over GRAPH.QUERY / GRAPH.RO_QUERY) to
        packages/engine/src/store/client.ts. Test helper giving each test an isolated graph key against a
        pinned falkordb/falkordb:v4.20.4 — docker-compose locally (port and FALKORDB_ARGS copied from
        bench/docker-compose.yml, including TIMEOUT_DEFAULT/CACHE_SIZE/NODE_CREATION_BUFFER and port 6380 so
        it never touches a dev instance), GitHub Actions service container in CI. Port globalInvariants() to
        assertGraphInvariants().
      gate: >
        An integration test connects, writes a handful of nodes, reads them back, asserts invariants, and
        tears its graph down — green on Linux (CI) and macOS (local). Two tests running concurrently must not
        see each other's data.
      derisks: [SF3]
      status: done
      verified_2026-09-12: >
        db:up + test:integration + db:down green on master@4f5fca2 (12 pass, live FalkorDB v4.20.4 on
        127.0.0.1:6381).

    - id: F3
      name: FalkorDB acquisition
      spike: SP11
      delivers: >
        ServerManager interface with Spawned / Remote / Docker implementations (README design rule 8).
        Spawned downloads the pinned version to ~/.cache/cpg/falkordb/<version>/ (honouring CPG_CACHE_DIR),
        verifies SHA-256 from a manifest pinned in the package, launches it (X14).
      gate: >
        Test downloads (or reuses cache), verifies checksum, spawns on an ephemeral port, PINGs, shuts down
        cleanly. A tampered-checksum test asserts the launch is REFUSED. macOS Gatekeeper path exercised
        locally. Offline produces the clear error X14(4) describes, not a silent hang.
      status: done
      verified_2026-09-12: >
        Unit + integration coverage for acquire/cache/checksum/download/manifest/redis present, incl. a
        tampered-checksum-refuses-launch test. Merged into falkordb-service (see note below).

    - id: F4
      name: Grammar loading
      spike: SP1
      delivers: >
        web-tree-sitter 0.27.0 (wasm) with typescript, tsx, javascript, python grammars. Assert
        Language.version in [MIN_COMPATIBLE, LANGUAGE_VERSION] at load. Keep the parser behind a small
        ParserBackend interface so native could be added to the headless daemon later.
      gate: >
        All four grammars load and parse a smoke file to a non-error root. The ABI assertion fails loudly on a
        deliberately mismatched grammar — test that failure mode, don't assume it. Day-one fallback if
        building our own .wasm in CI slips: vendor @vscode/tree-sitter-wasm@0.3.1.
      rationale_wasm_over_native: >
        Native IS faster — R4 measured 2.7 ms vs 4.2 ms on a 1000-line TS file (~1.6x). It buys nothing: the
        whole tree-sitter share of a save is ~6 ms cold / ~2 ms warm against a 2000 ms budget, and the
        FalkorDB write dominates. Native costs: a MEASURED hard segfault at require('tree-sitter')
        (0.25.1 darwin-arm64 prebuild) under Node 20.20.2 — a VSIX cannot tolerate crash-on-load depending on
        the user's Node; nine platform-specific VSIXs instead of one universal build; a stale peer-dep chain
        (tree-sitter-typescript@0.23.2 peer-depends on tree-sitter@^0.21, needs --legacy-peer-deps); and
        cursor walks are SLOWER natively (every gotoFirstChild() crosses N-API). VS Code itself ships
        tree-sitter as wasm. Real wasm hazards are ABI and memory, both gated here and in M1.3.
      replaces: "the repo's current native tree-sitter ^0.21.0 dependency"
      status: done
      verified_2026-09-12: "abi.test.ts and web-tree-sitter-backend.test.ts assert the mismatch-fails-loudly case; green on master@4f5fca2."

  note_2026-09-12_master_integration_gap: >
    F1-F4 were each implemented and PR-merged (github PRs #1-#5), but PRs #2-#5 were stacked on the
    previous feature branch instead of on master (F4 -> F1's branch, F2 -> F4's branch, F3 -> F2's
    branch, the falkordb-service refactor -> F3's branch). Only F1 and F4 had actually reached master
    (via PR #1 and #6); F2, F3, and the refactor existed only on refactor-falkordb-service-package.
    Fixed today by merging that branch's tip (c60f943) into master (merge commit 4f5fca2, pushed to
    origin/master) after re-running all four standing gates plus the live-FalkorDB integration suite
    green on the merged result. The "done" statuses below reflect master post-merge, not the PR view.

  m0_milestone_exit: "Snapshot diff is empty and a human has signed off on it. (00-vision.yaml M0)"

  m0:
    - id: M0.0
      name: Schema specification + spec-alignment decision
      manual_gate: true
      delivers: >
        A written schema spec committed to this planning corpus, stating for every node label and edge type
        whether it IS the Joern name, is a DELIBERATE divergence (with the reason), or is ours because Joern
        has no equivalent. Plus the id rule, the status enum, and the property set per label. Backed by a
        machine-readable schema definition that becomes the single source of truth for both the cpg://schema
        MCP resource and the golden serializer.
      why_first: >
        The graph shape must be pinned before anything can be tested against it. Golden snapshots,
        assertGraphInvariants(), cpg://schema and every extractor test encode the node/edge vocabulary.
        Choosing it late means rewriting all of them. This is also the visionary's stated motive: having the
        graph shape figured out ahead of time determines what specs the tests should assert.
      context: "See survey_findings SF4 and SF5."
      tension: >
        Some divergence from Joern is load-bearing: the SYMBOL indirection is what makes per-file replace safe
        (D5), and the sparse structural tier is principle PR1 — Joern's CPG is dense and expression-level,
        which is precisely what PR1 rejects. Some is drift, and drift is the thing to catch: a renamed label
        buys nothing and costs interoperability. This unit separates the two, deliberately, once.
      options_to_weigh:
        - "(a) Adopt Joern's CPG spec wholesale as the schema."
        - "(b) Align node/edge NAMES to Joern where they overlap, keep the sparse + SCIP deviations, document every divergence."
        - "(c) Define our own schema referencing both."
      decision_inputs_pending_RESOLVED_2026-09-12: >
        Originally: "Deliberately unresolved until research lands: whether Joern's spec is portable
        outside its Scala/overflowdb engine or tied to it in practice; whether alignment buys anything
        CONCRETE (importable queries, existing analyses, a test corpus, an importer/exporter) or is
        purely nominal; and whether any published conformance suite or golden-output fixture set exists
        that we could run as a test gate — that would be the highest-value find." All three were
        already answered by research/R6-ontology-debate-synthesis.md before this unit started (the
        "research in flight" framing was stale, not the research itself): portable in data model, not
        in linker/dispatch semantics; alignment buys a bounded but real set of things (differential-
        export oracle, readability, a hand-mined not machine-reusable test-case catalogue), not an
        importable query language or analysis suite; no Joern conformance suite exists, but SCIP's
        `reprolang` does — which is the "highest-value find," and it points away from Joern. Full
        answer: 50-schema.md §1.
      gate: >
        A machine-readable schema definition plus `bun run test:schema` asserting that every node and edge
        written by the engine is declared in it and carries its required properties — an undeclared label
        fails the build. MANUAL: the visionary signs off on the divergence table, each deviation one they'd
        defend to someone who knows Joern.
      blocks: [M0.4a, M0.4b, "every golden-snapshot gate after it", "cpg://schema in M2"]
      does_not_block: [F1, F2, F3, F4]
      status: done
      verified_2026-09-12: >
        Machine half, fully green: packages/engine/src/schema/ declares all 14 R6-approved node labels
        and 14 edge types (13 plus the M0.0d REACHING_DEF amendment) with Joern alignment, ownership
        class and write mechanism; bun run test:schema green (validator + live conformance against
        127.0.0.1:6381 + exhaustiveness + spec-doc freshness, 51 tests); lint/format/typecheck/
        test:unit/test:integration all green on the branch. Negative controls run and reverted: an
        undeclared label, a file property on SYMBOL, an overlay edge inside a per-file replace, and a
        hand-edited divergence-table row were each confirmed to fail the gate before being reverted.
      manual_gate_signed_2026-09-12: >
        GR5 satisfied. The visionary read the generated divergence table (50-schema.md §5: 28 declared
        names — 10 unchallenged, 3 name-only renames, 5 gap-fill additions, 9 semantic extensions, and
        SYMBOL's one structural-incompatibility divergence — plus §10's 51-name Joern rejection list)
        and signed it without requesting changes, including the one deliberate divergence from R6's
        literal text (INHERITS_FROM -> SYMBOL, not TYPE_DECL, confirmed with the user during planning).
        Resolves the contradiction_found_2026-09-12 note this file previously carried: the read had not
        happened when 50-schema.md's header first claimed "approved" in commit 324e40e; it has now.

    - id: M0.1
      name: Config loading, manifest discovery, cpg doctor
      delivers: "cpg.config.yaml schema; precedence CLI > env (CPG_*) > file > manifest discovery > defaults; manifest discovery (package.json workspaces, pyproject/uv, tsconfig references/paths); .gitignore merge. (X11, GE-FR1, GE-FR2, GE-UC9)"
      gate: "Precedence unit tests per layer; `cpg doctor` golden output; a zero-config fixture resolves to sane defaults."
      status: in_progress
      promoted_thin_subset_2026-09-12: >
        Per DL14, only enough of this unit to resolve includes/excludes and a DB target is needed
        ahead of M0.11-lite. Full precedence layering and `cpg doctor` are not on that path and can
        land as this unit's remaining scope afterward.
      verified_2026-09-13: >
        The thin subset landed (commit 9c46bcf, "M0.1-thin — config, DB target, and a store
        factory"): packages/engine/src/config/workspace-config.ts's defineCpgConfig resolves
