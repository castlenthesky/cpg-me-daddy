# Delivery plan — the M0–M4 ladder cut into verifiable units of work
# Parent: 00-vision.yaml. Converts the agreed milestone ladder into PR-sized units, each gated on
# executable verification that lands in the same PR.
# IDs: F# (foundation), M0.#, M1.# (sliced), M2/M3/M4 (outlined).
# Status vocabulary: draft | agreed | rejected | deferred
# Unit status (units.* below, first set 2026-09-12): not_started | in_progress | blocked | done.
# "done" means merged to master with its gate verified green there, not just PR-merged into a
# stacked feature branch — see the F1-F4 status note below for why that distinction mattered.

meta:
  session_date: 2026-09-11
  parent: ./00-vision.yaml
  siblings: [10-graph-engine.yaml, 20-visualization.yaml, 30-mcp-server.yaml, 40-research.yaml, 50-schema.md]
  scope_summary: >
    The milestone ladder in 00-vision.yaml describes OUTCOMES ("Live graph", "Agent wedge"), not units of
    work. Each rung is months of code and cannot be reviewed, tested, or merged as a single change. This file
    converts it into discrete units of functional code, each one a single unit of logic a human can review in
    one sitting, gated on executable verification, and ordered so its dependencies are already merged.
  decisions_taken_this_session:
    - { id: DL1, text: "Correctness fixture lives IN-REPO under test/fixtures/, not the external ast-demo.", source: survey_findings.SF1 }
    - { id: DL2, text: "Foundation + M0 + M1 are sliced PR-by-PR; M2-M4 are named with exit criteria and sliced later.", rationale: "Downstream unit boundaries are guesses until the engine's real shape exists." }
    - { id: DL3, text: "GitHub Actions CI is stood up in the first unit, so every subsequent unit has somewhere to be gated.", note: "Repo has no .github/workflows today." }
    - { id: DL4, text: "Adopt the packages/engine + packages/cli + packages/vscode layout now (R5 recommendation). Resolves 40-research.yaml open_after_research item 3." }
    - { id: DL5, text: "Lint/format/hooks are oxlint + oxfmt + lefthook, replacing eslint + typescript-eslint." }
    - { id: DL6, text: "INHERITS_FROM{relation: extends|implements} adopted, merging EXTENDS/IMPLEMENTS into one edge.", source: "R6-ontology-debate-synthesis.md Next Steps #1, visionary sign-off 2026-09-11" }
    - { id: DL7, text: "Per-file replace write mechanism is split by node class, not one global choice: file-owned structural nodes (MODULE/TYPE_DECL/METHOD/PARAM/MEMBER/CALL/IMPORT) are DELETE+CREATE per save; SYMBOL nodes are MERGE-on-fqn (upsert), since they are the cross-file-shared anchor other files' edges point into.", source: "R6-ontology-debate-synthesis.md Next Steps #2, visionary sign-off 2026-09-11", note: "Formalizes the shape already sketched informally in M1.2's delivers line." }
    - { id: DL8, text: "TARGETS/DEPENDS_ON rebuild trigger is periodic + computed_at (same contract as COMMUNITY), plus a manual refresh escape hatch. Rejected: recompute on every save of either endpoint's file.", source: "R6-ontology-debate-synthesis.md Next Steps #3, visionary sign-off 2026-09-11" }
    - { id: DL9, text: "REJECT CONFIG_FILE, CLOSURE_BINDING, DEPENDENCY, TEMPLATE_DOM (the four Joern node types the ontology debate never addressed) for v1. No identified need.", source: "R6-ontology-debate-synthesis.md Next Steps #4, visionary sign-off 2026-09-11" }
    - { id: DL10, text: "TYPE_PARAMETER/TYPE_ARGUMENT/BINDS/EVAL_TYPE (generics-aware graph traversal) deferred to v2, not rejected outright. v1 keeps folding generic type info into a type_text string property.", source: "R6-ontology-debate-synthesis.md Next Steps #5, visionary sign-off 2026-09-11", tracked_in: v2_backlog }
    - { id: DL11, text: "FILE.status=error and UNKNOWN nodes are unified with CALL.status=unresolved/IMPORT.status=unresolved into one triage surface via a shared needs_triage TAG (TAGGED_BY) — no new mechanism, reuses the TAG node already in v1 scope.", source: "R6-ontology-debate-synthesis.md Next Steps #6, visionary sign-off 2026-09-11" }
    - { id: DL12, text: "M0.0 schema alignment: option (b) — align node/edge names to Joern where they overlap, keep the sparse-tier and SCIP divergences, document every divergence with a specific reason. Spec at 50-schema.md. One deliberate divergence from R6's literal edge table: INHERITS_FROM points TYPE_DECL -> SYMBOL, not TYPE_DECL -> TYPE_DECL, preserving per-file-replace safety (D5) and GE-FR7's cascade traversal.", source: "M0.0 / research/R6-ontology-debate-synthesis.md §1, user-confirmed 2026-09-12" }
    - { id: DL13, text: "Sparse REACHING_DEF (MEMBER|PARAM -> CALL, variable property) is in v1 — structural-tier data flow. CFG and remaining PDG (CDG/DOMINATE) stay deferred; expression-tier nodes (LOCAL/IDENTIFIER/LITERAL) stay rejected. Amends D23/R6's blanket PDG deferral for this edge alone.", source: "visionary amendment 2026-09-12 (hello-world CPG golden)", note: "Aligns with D10's 'structural-tier data flow'. Schema version bumped to 2." }
    - id: DL14
      text: >
        Critical-path resequencing, 2026-09-12: the near-term target is a queryable STATIC graph
        (`cpg index` + `cpg query` against a cpg-owned FalkorDB instance), not the full M1
        (incremental)/M2 (daemon + MCP) agent wedge that D13 specifies as v1 acceptance. Neither
        M1's watcher/cascade machinery nor M2's daemon lifecycle/MCP shim is needed to judge
        whether the graph is a quality representation of the code — a one-shot index answers that,
        and it de-risks M0.11's manual sign-off, which requires reading the graph by hand
        regardless.
      rationale: "Stated priority: start getting real data into the graph as quality representations of our code, by the shortest honest route."
      consequence: >
        M0.4 (split into M0.4a/M0.4b below), a thin M0.1/M0.2, and a new M0.11-lite checkpoint are
        promoted ahead of M0.7/M0.9/M0.10 as a walking skeleton. M0.7/M0.9 fold in the minimal
        SYMBOL/fqn minting M0.10 would otherwise own exclusively (see those units' amendment
        notes). M1/M2/M3 remain fully specified below but are explicitly NOT on this near-term
        path — see units_named under m2_outline/m3_outline for what stays deferred.
      source: "visionary session 2026-09-12; plan recorded at ~/.claude/plans/what-is-our-critical-typed-kazoo.md"
    - id: DL15
      text: >
        Reverses M0.0's own SOURCE_FILE REJECT verdict (50-schema.md §10): ship it, named
        SOURCE_FILE to align with Joern, direction MODULE -> FILE, one edge per file from the
        MODULE root. The original rejection ("redundant with an existing, benchmark-load-bearing
        property") conflated keeping the `file` property with not also having an edge; they are
        independent, and the property is untouched. Without the edge, `cpg index` against this
        repo produced a graph with two disconnected components — the filesystem tier and the
        `:CPG` tier joined only by the string equality `MODULE.file == FILE.path` — which is what
        "the AST layer is disconnected" (the report that started this unit) actually was.
      rationale: >
        Wanted for later graph data science (whole-graph traversal, visualization) that a
        property-only join can't serve directly. Narrowed from Joern's real per-AST-node shape to
        one per file — everything else in the file is already reachable via DECLARES, so a denser
        edge would be the density PR1 rejects.
      source: "visionary decision 2026-09-13; plan recorded at ~/.claude/plans/our-current-graph-builds-precious-fern.md"

