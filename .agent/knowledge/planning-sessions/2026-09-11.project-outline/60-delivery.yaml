v2_backlog:
  # Explicitly deferred beyond the M0-M4 v1 ladder — not rejected, not forgotten. Revisit each only when
  # its trigger condition is met; pulling one in early is scope creep against DL2's sliced-later principle.
  - id: V2.1
    name: Type System pass — TYPE_PARAMETER, TYPE_ARGUMENT, BINDS, EVAL_TYPE
    text: >
      Give generics first-class graph representation (TYPE_ARGUMENT nodes, a BINDS-equivalent edge for
      parameterized instantiation) instead of folding them into a type_text string property. Enables
      graph-native queries like "every instantiation of Repository<T> with T=Order" that string matching
      cannot answer.
    why_deferred: >
      No Type System lens was included in the R6 ontology debate (Graph Analytics flagged this gap in
      Round 1); the current REJECT verdict on these types is adjacent-lens consensus, not a considered
      type-system judgment (Standards flagged this itself). None of the M2 agent-wedge tools
      (find_symbol, callers_of, impact_of_change, etc.) require generics-aware traversal to function.
    trigger: "A concrete agent workflow needs generics-aware graph queries, or scale/eval work in M4 surfaces a real gap that a type_text substring match cannot cover."
    depends_on: "A dedicated Type System lens pass, not just folding these into the existing schema ad hoc."
    source: "R6-ontology-debate-synthesis.md Next Steps #5, visionary decision 2026-09-11 (DL10)"
    status: deferred

