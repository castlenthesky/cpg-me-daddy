    - id: M0.4a
      name: "Graph store: schema bootstrap"
      supersedes: "the bootstrap half of the original single M0.4 (split 2026-09-12, DL14 — the combined unit ran to ~900 lines with its gate against GR3's 200–500)"
      delivers: >
        `bootstrapSchema()` in packages/engine/src/store/: creates the indexes declared in
        SCHEMA_INDEXES via plain `CREATE INDEX FOR (n:Label) ON (n.prop)` Cypher (index creation
        is NOT idempotent — reads `CALL db.indexes()` first and creates only what's missing).
        FIXES a real bug found in review: SCHEMA_INDEXES is currently missing a `SYMBOL(fqn)`
        entry, and FalkorDB refuses a UNIQUE constraint without a supporting exact-match index on
        the same properties — the declared constraint cannot be created until this is added.
        Then the UNIQUE SYMBOL.fqn constraint — NOT Cypher on FalkorDB; it is the Redis command
        `GRAPH.CONSTRAINT CREATE <graph> UNIQUE NODE SYMBOL PROPERTIES 1 fqn` via
        `AdminService.raw()` (falkordb-service's documented escape hatch for driver commands the
        typed client doesn't model), whose reply is the literal string `PENDING` — bootstrap polls
        `CALL db.constraints()` to OPERATIONAL/FAILED (bounded, ~5s) rather than treating PENDING
        as done. Then a META_DATA singleton write + read-compare against CPG_SCHEMA.version
        (50-schema.md §8's "read-compare-rebuild logic", owned here per that spec but omitted from
        this file's delivers until now). Flips
        packages/engine/test/support/schema-conformance.ts's `requireIndexes` flag on — it exists
        today for exactly this: "M0.4 flips this on once the bootstrap creates the declared
        indexes/constraints. Off here."
      gate: >
        Bootstrap run twice is a no-op the second time and reports zero created; `db.indexes()`
        and `db.constraints()` match the declared sets; the constraint reaches OPERATIONAL; a
        duplicate SYMBOL.fqn insert is rejected BY THE SERVER, not by a test — the tripwire the
        constraint exists for actually firing, which nothing in this repo has demonstrated yet;
        assertSchemaConformance(g, {requireIndexes: true}) and assertGraphInvariants(g) both green.
      depends_on: [M0.0]
      constraint: "Must not import `falkordb` directly — writes go through GraphService, the constraint command through AdminService.raw; falkordb-service stays the only place that knows the driver exists."
      status: done
      note: >
        Verified against this repo's OWN benchmark record
        (.agent/knowledge/planning-sessions/2026-09-11.database-research/benchmark-results/structural-1e6.json),
        which already ran all four index DDL statements plus the constraint against
        falkordb/falkordb:v4.20.4 and recorded the PENDING reply — so the mechanism above is
        proven on this exact pinned image, not speculative. Still to verify live once db:up runs
        again: `CREATE RANGE INDEX`'s explicit-kind form (the untyped form is proven; treat
        SchemaIndexSpec.kind as documentation until a second kind exists), and the exact
        `db.constraints()` column set.
      verified_2026-09-12: >
        Both to-verify items above confirmed live against 127.0.0.1:6381: `db.constraints()`
        columns are `type, label, properties, entitytype, status` (matching what
        `checkBootstrap` already reads); `db.indexes()` was found to return ONE MERGED ROW PER
        LABEL, not one row per declared index — a second bug beyond the SYMBOL(fqn) gap this
        unit already knew about. `checkBootstrap`'s matcher compared `row.properties` by exact
        array equality against each single-property SCHEMA_INDEXES entry, so a label with two
        declared indexes (CPG.id, CPG.file) would have reported BOTH missing even after a
        correct bootstrap — `requireIndexes: true` could never have passed. Fixed to per-label
        property containment; regression-tested in test/unit/store/bootstrap.test.ts against a
        synthetic merged row. `bootstrapSchema()` implemented against narrower structural
        interfaces (`BootstrapGraph`/`BootstrapAdmin`) than the literal `FalkorService` signature
        above, so DB-free tests can pass plain fakes. `.oxlintrc.json`'s `falkordb` restriction
        proven red with a deliberately-violating file, then reverted, per F1's gate-must-be-seen-
        to-fail rule. Gate green: lint/format:check/typecheck/test:unit/test:schema, plus
        test:integration (24 tests) including the live duplicate-SYMBOL.fqn-rejected-by-the-
        server case and a requireIndexes:true before/after flip across bootstrapSchema.

    - id: M0.4b
      name: "Graph store: IGraphStore seam + DiffGraph writer"
      delivers: >
        packages/engine/src/store/{store.ts, cypher.ts, falkordb-store.ts, index.ts}. `IGraphStore`
        (bootstrap/writeDelta/deleteFile/readMetadata/close — deliberately no read()/explain():
        FalkorService.graph already is the read surface, and widening the seam now is how it
        stops being one). `cypher.ts` is a PURE function `planDelta(delta, opts): CypherOp[]` with
        no client, so the whole batching/grouping strategy is unit-testable DB-free and the
        integration gate can EXPLAIN the exact strings the writer sends. Batched parameterized
        `UNWIND $rows` writer, grouped per node KIND — not per raw label array; the label array is
        a pure function of kind via `nodeSpec()`, so grouping by kind is equivalent and caps at 14
        groups — and per resolved edge match-shape (type + endpoint match-label + key-property,
        which collapses e.g. DEFINES's five source labels into one query instead of five). Edge
        endpoints MATCH on the indexed key — `:CPG {id: ...}` (never the kind label, which would
        be a label scan — the single easiest way to fail this unit's own gate while looking more
        precise, not less) or `:SYMBOL {fqn: ...}` — with a `WITH s, row` barrier between the two
        MATCHes (this repo's own benchmark measured this as the fix for a 700ms → 1ms planner
        trap). Per-kind write dispatch driven by `nodeSpec()`'s own `write` field: delete-create
        for structural, file-owned kinds vs merge-on-key with a client-side-pruned `SET n += row`
        for SYMBOL and other identity nodes — pruning null/undefined keys before the SET is
        load-bearing, not cosmetic: an unpruned caller-side write would silently null out a
        definer's SYMBOL properties on every save of the calling file. Idempotence via a
        `MATCH (n:CPG {file:$file}) DELETE n` scope delete (not DETACH DELETE, which destroys
        inbound cross-file edges — named in 50-schema.md as the exact bug this design avoids)
        issued before re-create, NOT via MERGE-everything (which would pass "idempotent" while
        contradicting DL7). Batch size default 5000 rows/query (this repo's benchmark pushed
        ~3k nodes/~10k edges in one query with no limit hit; chunk the rows array, not the query
        list — M1.7 bulk mode is where a lower value might matter, not here).
      gate: >
        Write a ~1k-node synthetic GraphDelta — `GraphDelta` from schema/validate.ts IS the
        "DiffGraph type"; no second type is introduced, correcting this file's prior wording —
        assert counts; EXPLAIN of each generated op contains "Node By Index Scan" (the actual
        FalkorDB operator name; corrects this file's prior "INDEX SCAN" wording) on CPG.id /
        CPG.file / SYMBOL.fqn AND contains NEITHER "All Node Scan" NOR "Label Scan" — assert the
        negative, because a plan can contain both and the positive alone is satisfiable by a bad
        plan; re-write yields identical counts; a cross-file-CALLS-survives-a-rewrite-of-the-
        defining-file case (the one case a DETACH-DELETE-shaped writer would pass "idempotent"
        while silently breaking); ends by asserting assertGraphInvariants() and
        assertSchemaConformance({requireIndexes: true}).
      depends_on: [M0.0, M0.4a]
      status: done
      note: >
        Depends on M0.4a because its EXPLAIN assertions require the indexes that unit creates —
        a real prerequisite, not a slice boundary invented to fit GR3's budget. The legacy
        src/services/storage/FalkorDBStore.ts was evaluated as a port candidate and rejected: it
        imports vscode directly (hard engine-purity violation), opens its own connection,
        string-interpolates values into Cypher instead of parameterizing, matches every node
        label-less (the exact All-Node-Scan shape this gate forbids), uses DETACH DELETE, and
        indexes properties — METHOD.fullName, IDENTIFIER.name — that don't exist in the v1
        schema. Not portable; useful only as a named negative reference in the PR description.
      verified_2026-09-12: >
        Two corrections to this unit's own text, found while implementing and verifying its gate
        live against 127.0.0.1:6381:
        (1) "EXPLAIN of each generated op contains 'Node By Index Scan'" is not universally true —
        a delete-create node op (`UNWIND $rows AS row CREATE (n:CPG:LABEL) SET n = row`) has no
        scan at all (`Update / Create / Unwind`), since there is nothing indexed to look up. The
        assertion is per-op-kind: `edge`/`node-merge`/`scope-delete` must show
        "Node By Index Scan"; every op must show neither "All Node Scan" nor "Label Scan"; `edge`
        additionally shows "Project" (the WITH barrier); `node-create` shows no scan at all.
        (2) The "DETACH DELETE destroys inbound cross-file edges" framing is about the MATCH
        clause's label scope, not the DELETE keyword: verified live that `MATCH (n:CPG
        {file:$file}) DELETE n` and the identical match with `DETACH DELETE n` behave IDENTICALLY
        — both remove exactly the matched node's own relationships and leave a shared SYMBOL and
        a cross-file CALLS edge into it untouched. The real hazard is an over-broad or label-less
        MATCH (the legacy FalkorDBStore.ts shape named above), not this keyword alone.
        `planDelta` still emits plain DELETE per the original spec. Also implemented beyond the
        delivers text: edges dispatch on `edgeSpec().write` the same way nodes dispatch on
        `nodeSpec().write` (CREATE for delete-create edges, MERGE for merge-on-key edges like
        ALIAS_OF/TAGGED_BY) — not explicit in this unit's original delivers line, but the schema
        module already declares a `write` field per edge type, and MERGE is needed there to avoid
        accumulating duplicate relationships on a re-resolve pass between two nodes neither of
        which is necessarily scope-deleted together. Gate green: lint/format:check/typecheck/
        test:unit (278 tests, +23 from this unit)/test:schema, plus test:integration (30 tests,
        +6) including a ~1k-node delta with EXPLAIN asserted per op kind, a cross-file-CALLS-
        survives-a-rewrite-of-the-defining-file case, and two negative controls (a kind-labeled
        endpoint plans as a Label Scan; a missing WITH barrier plans as a Cartesian Product) run
        live and pasted into the PR.

