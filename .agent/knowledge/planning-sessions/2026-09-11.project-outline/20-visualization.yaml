# Pillar P2 — Visualization (VS Code pane)
# Decomposition of the in-IDE graph view. Ships AFTER the MCP pillar (D7) and is the trust/debug surface.
# Parent: 00-vision.yaml. IDs prefixed VZ-. Status vocabulary as in 10-graph-engine.yaml.

meta:
  pillar: P2
  session_date: 2026-09-11
  scope_summary: >
    A webview pane that renders query-scoped views of the graph (PR6, X7), follows the user's editor
    position (V3), live-updates from engine events (V1), and makes engine state legible (PR8). Whole-graph
    rendering is an anti-goal. Taint and DB-write traces (V4) are north star; pathing (V5) is v1.
  ordering_note: >
    Agent-first (D7) means P2 is built against a working engine and MCP. Its first job is to let the
    human verify what the agent sees — so the pane and the MCP tools should share the same query layer,
    and every pane view should be reproducible as an MCP call and vice versa.

actors:
  - { id: A1, name: Developer, text: "Editing in VS Code; wants orientation, impact, and confidence the graph is right." }
  - { id: A2, name: Graph author / maintainer, text: "Auditing parser output on ast-demo; needs raw node/edge detail and status." }
  - { id: A3, name: Engine, text: "Emits events (GE-FR17); answers scoped queries." }

design_principles:
  - { id: VZ-P1, text: "Every view is a query: focus set + hops + filters. No view without a focus. Saveable and copyable as the equivalent MCP call.", source: X7 }
  - { id: VZ-P2, text: "Render budget: ≤ 300 nodes on screen by default; beyond that, collapse by DIRECTORY/MODULE/COMMUNITY and let the user expand.", status: draft }
  - { id: VZ-P3, text: "Status is visible: indexing / stale / error nodes are visually distinct; a coverage bar is always present.", source: PR8 }
  - { id: VZ-P4, text: "Two-way navigation: click node → open file at range; move cursor → focus follows (toggleable).", source: V3 }
  - { id: VZ-P5, text: "Pane never queries the whole graph; it subscribes to events and re-runs only the current view's query.", source: README survey (MATCH (n) RETURN n anti-pattern) }

use_cases:
  - id: VZ-UC1
    title: You-are-here breadcrumb focus
    actor: A1
    trigger: active editor / cursor position changes
    narrative: >
      Pane resolves cursor → METHOD/TYPE_DECL/MODULE/FILE (via ranges) and renders that node with 1 hop:
      its declaring parent chain (breadcrumb), its callees, callers, and imports. Mirrors VS Code's own
      breadcrumb but with edges. Follow-mode can be pinned off so the user can explore without the view
      jumping.
    requirements: [VZ-FR1, VZ-FR2, VZ-FR3]
    priority: must
    status: draft

  - id: VZ-UC2
    title: Neighbourhood exploration
    actor: A1
    narrative: >
      From any node: expand callers, callees, importers, imports, subclasses, members, N hops at a time.
      Collapse by directory/module/community when over budget (VZ-P2). Filter chips: edge types, node
      kinds, languages, status, community, exported-only.
    requirements: [VZ-FR3, VZ-FR4, VZ-FR5]
    priority: must
    status: draft

  - id: VZ-UC3
    title: Impact view — what depends on this?
    actor: A1
    narrative: >
      Select a METHOD/TYPE_DECL/FILE → render transitive dependents via IMPORTS/CALLS/EXTENDS edges with
      depth slider, coloured by distance, grouped by directory. Same query as MCP impact_of_change (X5).
    requirements: [VZ-FR4, VZ-FR6]
    priority: must
    status: draft

  - id: VZ-UC4
    title: Path between two points
    actor: A1
    narrative: >
      Pick A and B (from pane or from editor context menu "Set as path start/end"). Render shortest paths
      and up to K alternatives over the chosen edge types. Same query as MCP path_between (V5).
    requirements: [VZ-FR6, VZ-FR7]
    priority: should
    status: draft

  - id: VZ-UC5
    title: Community and hotspot overview
    actor: A1
    narrative: >
      Collapsed view: one node per COMMUNITY sized by member count, edges weighted by cross-community
      calls/imports; hotspot list by centrality. Click a community to expand its members. Shows run_id age.
      This is the human-facing side of D15 — communities with deterministic label hints, no LLM labels.
    requirements: [VZ-FR8]
    priority: should
    status: draft

  - id: VZ-UC6
    title: Engine state and coverage
    actor: A1/A2
    narrative: >
      Persistent status strip: coverage %, files indexing/stale/error, active cascade with count, last
      update time, DB health, engine version. Click → status detail. During first launch shows progress.
      Bulk mode (GE-UC6) shows as a progress bar, not a flood of updates.
    requirements: [VZ-FR9]
    priority: must
    status: draft

  - id: VZ-UC7
    title: Node / edge inspector for graph audit
    actor: A2
    narrative: >
      Select any node/edge → all properties, ids, status, version, source range, equivalent Cypher to
      fetch it. Essential for validating adapters on ast-demo (D18) — this is the human oracle for the
      golden snapshots.
    requirements: [VZ-FR10]
    priority: must
    status: draft

  - id: VZ-UC8
    title: Live update without flicker
    actor: A3
    narrative: >
      On file.updated / cascade.* events, re-run the current view query only if the event touches nodes
      in view or their 1-hop frontier; animate diffs (added/removed/changed) instead of re-laying out.
    requirements: [VZ-FR11]
    priority: must
    status: draft

  - id: VZ-UC9
    title: Save and share a view
    actor: A1
    narrative: >
      Any view can be saved (focus + hops + filters) into cpg.config.yaml `views:` or copied as the
      equivalent MCP tool call / Cypher so an agent can be pointed at exactly what the human is looking at.
    requirements: [VZ-FR12]
    priority: could
    status: draft

  - id: VZ-UC10
    title: Query History — see exactly what the agent saw
    actor: A1
    narrative: >
      Optional panel listing every reader query (tool name or raw Cypher, arguments, duration, partial
      flag, which shim/agent). Selecting an entry replays it as a view: the exact nodes and relationships
      that were returned, highlighted against the current graph so drift since the query is visible too.
      Lets a human learn the graph by watching a good agent, and audit a bad one. Off by default; toggle in
      settings. Naming TBD: "Query History" | "Agent Logs" | "Learn from the agent".
    requirements: [VZ-FR14, GE-FR21, MC-FR14]
    priority: should
    status: agreed   # 2026-09-11 (VZ-Q4)

requirements:
  functional:
    - { id: VZ-FR1,  text: "Resolve editor (file, line, col) → innermost :CPG node by range via one indexed query.", status: draft }
    - { id: VZ-FR2,  text: "Follow-cursor mode, toggleable, debounced (≥ 250 ms) so scrolling does not thrash.", status: draft }
    - { id: VZ-FR3,  text: "Expand/collapse by edge type and hop count; all expansions are incremental queries, never full graph loads.", status: draft }
    - { id: VZ-FR4,  text: "Filter chips: node kind, edge type, language, status, exported-only, community, directory prefix.", status: draft }
    - { id: VZ-FR5,  text: "Over-budget collapsing (VZ-P2) by DIRECTORY, then MODULE, then COMMUNITY; user can raise the budget.", status: draft }
    - { id: VZ-FR6,  text: "Impact and path views reuse the same query functions the MCP server uses (shared query library).", status: draft }
    - { id: VZ-FR7,  text: "Editor context-menu commands: Focus in graph, Set path start, Set path end, Show impact.", status: draft }
    - { id: VZ-FR8,  text: "Community overview uses COMMUNITY/MEMBER_OF from the latest run_id and shows its age.", status: draft }
    - { id: VZ-FR9,  text: "Status strip bound to GE-FR13 status document and GE-FR17 events.", status: draft }
    - { id: VZ-FR10, text: "Inspector shows every property, both ids, status/version, and copyable Cypher for the selection.", status: draft }
    - { id: VZ-FR11, text: "Event-driven partial refresh with diff animation; no full re-layout on single-file updates.", status: draft }
    - { id: VZ-FR12, text: "Views serialisable to/from a small JSON schema; export as MCP call and as Cypher.", status: draft }
    - { id: VZ-FR13, text: "Pane works when the engine is remote/attached (not spawned by this VS Code); read-only over the same IPC as the MCP shim.", status: draft }
    - { id: VZ-FR14, text: "Query History panel (VZ-UC10): list, filter by agent/tool/time, replay an entry as a view showing exactly the returned node/edge ids, with a drift indicator for nodes changed since. Off by default.", status: agreed }
    - { id: VZ-FR15, text: "Ship as separate VS Code views (Graph, Inspector, Status, Query History) in one view container; every view is relocatable to sidebar, panel, secondary sidebar, or editor area. The Graph view also opens as an editor tab via command.", status: agreed }
  non_functional:
    - { id: VZ-NFR1, text: "Initial render of a 1-hop breadcrumb view ≤ 300 ms after cursor settles.", status: draft }
    - { id: VZ-NFR2, text: "Handles a 300-node view at 60 fps on integrated graphics; degrades to static layout above budget.", status: draft }
    - { id: VZ-NFR3, text: "Respects VS Code theme (light/dark/high-contrast) and reduced-motion.", status: draft }
    - { id: VZ-NFR4, text: "No network requests from the webview (PR7); rendering library bundled.", status: draft }

open_questions:
  - id: VZ-Q1
    q: "Rendering stack — force-directed canvas (sigma.js / graphology, MIT) vs hierarchical/layered (ELK, dagre) vs both by view type?"
    recommendation: "graphology + sigma for neighbourhood/community views (WebGL, scales); ELK layered layout for impact/path views where direction matters. Both MIT."
    status: open
  - id: VZ-Q2
    q: "Where does the pane live — sidebar view container (current), editor tab (more room), or both?"
    answer: "Both. Each pane is a separate view users can relocate wherever they please (VS Code view drag/drop). See VZ-FR15."
    status: answered   # 2026-09-11
  - id: VZ-Q3
    q: "Should the pane expose a raw Cypher box for humans (mirrors MCP raw tool)?"
    recommendation: "Yes, behind an 'advanced' toggle; results render as a view or a table."
    status: open
  - id: VZ-Q4
    q: "Does the human need to see what an agent queried (an MCP query log in the pane) to build trust in agent-first workflows?"
    answer: >
      Yes, as an optional feature. Working name candidates: "Query History", "Agent Logs", "Learn from the
      agent". Each entry shows the exact nodes and relationships the query returned. See VZ-UC10, GE-FR21.
    status: answered   # 2026-09-11

north_star_views: [taint trace from source to sinks (V4), DB-write trace from an endpoint, layer-violation overlay (D16), commit-to-commit graph diff (X2)]
out_of_scope_v1: [taint/DB-write traces, layer overlays, graph editing from the pane, multi-workspace views]
