# Pillar P3 — MCP server
# Decomposition of the agent-facing surface. This is the v1 wedge (D7).
# Parent: 00-vision.yaml. IDs prefixed MC-. Status vocabulary as in 10-graph-engine.yaml.

meta:
  pillar: P3
  session_date: 2026-09-11
  scope_summary: >
    A read-only (D15) MCP server, stdio first (D19), implemented as a thin shim that attaches to the shared
    headless engine (X13). Offers opinionated high-level tools plus raw Cypher (X4), always answers even
    during indexing (D22) with explicit status on every node (PR8), and is host-agnostic by design (D19).
    Its acceptance test is the seeded-bug eval (D13).

actors:
  - { id: A1, name: Coding agent, text: "Any MCP-capable host: Claude Code, Cursor, Copilot, Codex, custom. Spawns the shim via stdio." }
  - { id: A2, name: MCP shim, text: "`cpg mcp`. Discovers the engine via .cpg/engine.json, starts it if absent, forwards tool calls to a read-only DB connection and the engine status endpoint." }
  - { id: A3, name: Engine, text: "P1. Source of truth for graph, status, analytics." }
  - { id: A4, name: Eval harness, text: "Drives an agent through seeded-bug tasks with and without the MCP, scores detection + mitigation (X10)." }

design_principles:
  - { id: MC-P1, text: "Tools are questions a developer asks, not database operations. Raw Cypher is the escape hatch, not the front door.", source: X4 }
  - { id: MC-P2, text: "Every result is token-budgeted: compact by default, paginated, with `truncated: true` and a cursor rather than silent cut-off.", status: draft }
  - { id: MC-P3, text: "Every node in every result carries `status` and FILE `version`; results whose path crosses a stale/indexing node say so at the top level (`partial: true`, `stale_nodes: [...]`).", source: D21 }
  - { id: MC-P4, text: "Never block, never refuse for freshness reasons. Offer wait_for_ready as an explicit choice.", source: D22 }
  - { id: MC-P5, text: "Read-only in v1. The shim connects with RO_QUERY only; raw Cypher tool rejects write clauses before sending.", source: D15 }
  - { id: MC-P6, text: "Self-describing: a schema resource and tool descriptions good enough that an agent with no prior knowledge writes correct queries on the first try.", status: draft }
  - { id: MC-P7, text: "Host-agnostic: no host-specific extensions; validate against ≥ 2 hosts in CI anyway.", source: D19 }
  - { id: MC-P8, text: "Local only. Shim and engine communicate over loopback/unix socket; no network egress.", source: PR7 }

# ------------------------------------------------------------------------------------------------------
tools:
  status: draft
  # Ordered by expected agent value. Each has: purpose, inputs, output shape, backing query, v1 priority.
  navigation:
    - id: find_symbol
      purpose: "Locate declarations by name/fqn/kind/file glob. The entry point for almost every task."
      inputs: { query: "string (name, partial, or fqn)", kind: "optional enum", file_glob: "optional", exported_only: "optional bool", limit: "default 20" }
      output: "[{id, fqn, kind, file, range, signature, exported, status}]"
      backing: "index on SYMBOL.fqn + :CPG name property; fuzzy via CONTAINS/STARTS WITH"
      priority: must
    - id: get_symbol
      purpose: "Everything about one symbol: declaration, signature, docstring head, params, members, parent chain, defining file status."
      inputs: { id_or_fqn: "string", include_source: "optional bool (returns the declaration's source text via the engine, not the DB)" }
      priority: must
    - id: file_outline
      purpose: "Structure of one file: modules, types, methods, imports, with ranges. Replaces an agent reading a 2k-line file to find one function."
      inputs: { path: "string", depth: "default 2" }
      priority: must
    - id: list_files
      purpose: "Files/directories under a root with language, loc, status, community — the filesystem layer."
      inputs: { root: "optional", glob: "optional", status: "optional filter", limit/cursor: "" }
      priority: must
  relationships:
    - id: callers_of
      purpose: "Who calls this symbol, with call sites (file, range) and enclosing method."
      inputs: { id_or_fqn: "", depth: "default 1, max 5", include_unresolved_by_name: "optional bool — CALLs with matching callee_name but resolved:false, flagged as low confidence" }
      backing: "(:CALL)-[:CALLS]->(:SYMBOL) then CALL-[:IN_METHOD]->METHOD"
      priority: must
    - id: callees_of
      purpose: "What this method calls, resolved and unresolved, with confidence."
      priority: must
    - id: importers_of
      purpose: "Files/modules importing this symbol or module."
      priority: must
    - id: imports_of
      purpose: "What a file imports, resolved to symbols where possible."
      priority: must
    - id: type_hierarchy
      purpose: "Supertypes and subtypes via EXTENDS/IMPLEMENTS."
      priority: should
  analysis:
    - id: impact_of_change
      purpose: "Transitive dependents of a symbol or file through IMPORTS/CALLS/EXTENDS, grouped by distance and directory. The pre-edit question (X5). Also answers 'what tests touch this?' when test dirs are known."
      inputs: { id_or_fqn_or_path: "", depth: "default 3, max 8", edge_types: "optional subset", group_by: "distance|directory|community" }
      output: "{root, total, by_distance: [...], truncated, partial, stale_nodes}"
      priority: must
    - id: path_between
      purpose: "Shortest and K alternative paths between two nodes over chosen edge types (V5)."
      inputs: { from: "", to: "", edge_types: "", k: "default 3", max_length: "default 10" }
      priority: must
    - id: communities
      purpose: "List communities from the latest analytics run with size, cohesion, label_hint, top members; or members of one community. The agent may summarise a label itself (D15)."
      inputs: { community_id: "optional", limit: "" }
      output_note: "Includes run_id and computed_at so the agent knows the age."
      priority: should
    - id: hotspots
      purpose: "Top-N by centrality metric (pagerank | betweenness | in_degree | out_degree) over the call or import projection — god classes, choke points."
      inputs: { metric: "", projection: "call|import", limit: "default 20", scope: "optional directory/community" }
      priority: should
    - id: cycles
      purpose: "Import cycles (and optionally call cycles) within a scope. Needs no labels, so it stays v1 even though layer violations do not (D16)."
      priority: should
    - id: unresolved
      purpose: "Unresolved CALL/IMPORT nodes in a scope with counts by reason — tells the agent (and us) where the graph is blind. Doubles as an adapter-quality metric (GE-Q2)."
      priority: should
  state:
    - id: graph_status
      purpose: "Coverage %, counts by status, active cascades and stale counts, last update, schema/engine/DB versions, analytics run age. The first call a careful agent makes."
      backing: "GE-FR13 status document"
      priority: must
    - id: wait_for_ready
      purpose: "Block up to `timeout_ms` (default 2000, max 10000) until the given files/symbols are status=ready, or return the current statuses. The explicit alternative to polling."
      inputs: { paths_or_ids: "[]", timeout_ms: "" }
      priority: must
  escape_hatch:
    - id: query_cypher
      purpose: "Read-only Cypher against the graph. For questions the tools above cannot express."
      inputs: { cypher: "", params: "optional map", limit: "default 200" }
      guards: ["reject CREATE/MERGE/SET/DELETE/REMOVE/CALL db.* before sending", "RO_QUERY", "statement timeout (default 5 s)", "row + byte cap with truncated flag"]
      priority: must

resources:
  - { id: cpg://schema, purpose: "Node labels, properties, edge types, id rules, status enum — generated from the live graph plus the v1_schema doc (10-graph-engine.yaml). Includes 5–10 example Cypher queries.", priority: must }
  - { id: cpg://status, purpose: "Same as graph_status, as a resource for hosts that prefetch resources.", priority: should }
  - { id: cpg://config, purpose: "Effective configuration (include/exclude roots, languages, analytics settings) so the agent knows what is NOT indexed.", priority: should }
  - { id: cpg://communities/latest, purpose: "Summary of the latest community run.", priority: could }

prompts:
  - { id: orient, purpose: "Suggested first steps for an agent new to this repo: graph_status → communities → hotspots → file_outline of entry points.", priority: could }
  - { id: pre_edit_check, purpose: "Given a symbol the agent intends to change: impact_of_change + callers_of + unresolved in scope, formatted as a checklist.", priority: could }

# ------------------------------------------------------------------------------------------------------
use_cases:
  - id: MC-UC1
    title: Agent orients in an unfamiliar repo
    actor: A1
    narrative: "graph_status → list_files(root) → communities → hotspots → file_outline on the hottest files. Replaces ls -R and grep sweeps with four calls."
    requirements: [MC-FR1, MC-FR2, MC-FR6]
    priority: must
  - id: MC-UC2
    title: Agent checks blast radius before editing
    actor: A1
    narrative: "find_symbol → impact_of_change(depth 3) → callers_of. Agent lists dependents in its plan and edits them in the same change. Directly targets seeded bugs of type 'signature change breaks a distant caller'."
    requirements: [MC-FR3, MC-FR4]
    priority: must
    references: [X5]
  - id: MC-UC3
    title: Agent verifies its edit landed in the graph
    actor: A1
    narrative: "After writing a file: wait_for_ready([path]) → callers_of on the changed symbol confirms dependents were re-resolved. Closes the loop between agent edit and graph state (D17, D21)."
    requirements: [MC-FR5]
    priority: must
  - id: MC-UC4
    title: Agent traces a path between two points
    actor: A1
    narrative: "path_between(handler, repositoryMethod) over CALLS/IMPORTS — the v1 ancestor of taint tracing (V5, D10)."
    requirements: [MC-FR3]
    priority: must
  - id: MC-UC5
    title: Agent finds structural smells without labels
    actor: A1
    narrative: "cycles + hotspots + unresolved. God classes and import cycles need no layer model, so they ship in v1 (M3 note)."
    requirements: [MC-FR6]
    priority: should
  - id: MC-UC6
    title: Agent asks something the tools don't cover
    actor: A1
    narrative: "Reads cpg://schema, writes Cypher, calls query_cypher. Guards keep it read-only and bounded."
    requirements: [MC-FR7, MC-FR8]
    priority: must
  - id: MC-UC7
    title: Agent works while the graph is still indexing
    actor: A1
    narrative: "graph_status reports 40 % coverage; find_symbol returns hits with status=indexing flagged; agent proceeds on ready parts or calls wait_for_ready. Never a refusal (D22)."
    requirements: [MC-FR2, MC-FR5, MC-FR9]
    priority: must
  - id: MC-UC8
    title: Shim starts with no engine running
    actor: A2
    narrative: "Host spawns `cpg mcp` in a terminal-only session. Shim finds no .cpg/engine.json → starts the engine (which downloads the DB if needed, X14) → serves graph_status showing first-launch progress immediately."
    requirements: [MC-FR10, MC-FR11]
    priority: must
    references: [X13, D8]
  - id: MC-UC9
    title: Eval — seeded bug found and fixed with the graph
    actor: A4
    narrative: >
      Harness gives an agent a bug report from the catalogue (X10). Runs with MCP and without. Scores:
      detected (names the right symbol/file), mitigated (fix passes the fixture's tests), tool calls used,
      tokens. Target: > 95 % detection+mitigation with MCP on ast-demo (D13).
    requirements: [MC-FR12]
    priority: must

# ------------------------------------------------------------------------------------------------------
requirements:
  functional:
    - { id: MC-FR1,  text: "All `must` tools and cpg://schema implemented and described well enough that a cold agent uses them correctly (measured in eval by first-call error rate).", status: draft }
    - { id: MC-FR2,  text: "Every result includes per-node status and top-level partial/stale indicators (MC-P3).", status: draft }
    - { id: MC-FR3,  text: "impact_of_change and path_between share query code with the pane (VZ-FR6).", status: draft }
    - { id: MC-FR4,  text: "Depth-bounded traversals with hard caps; over-cap returns truncated:true plus a cursor or a narrowing suggestion.", status: draft }
    - { id: MC-FR5,  text: "wait_for_ready implemented against FILE.status/version, bounded by timeout, never longer than 10 s.", status: draft }
    - { id: MC-FR6,  text: "Analytics tools return run_id and computed_at; if no run exists yet they say so rather than erroring.", status: draft }
    - { id: MC-FR7,  text: "query_cypher: static write-clause rejection + RO_QUERY + statement timeout + row/byte cap.", status: draft }
    - { id: MC-FR8,  text: "cpg://schema generated from the live graph (labels, props, edge types actually present) merged with documented id rules and examples.", status: draft }
    - { id: MC-FR9,  text: "During first launch tools answer over the partial graph; graph_status shows coverage and ETA.", status: draft }
    - { id: MC-FR10, text: "Shim discovery/attach via .cpg/engine.json; starts the engine if absent; clear error if the workspace has no cpg config and cannot be inferred.", status: draft }
    - { id: MC-FR11, text: "N concurrent shims (one per agent) against one engine; shim is stateless apart from its DB connection.", status: draft }
    - { id: MC-FR12, text: "Eval harness in-repo: bug catalogue (yaml), runner, scoring, report. Runs in CI against ast-demo on every adapter/schema/tool change.", status: draft }
    - { id: MC-FR13, text: "Host registration snippets generated by `cpg mcp --print-config <host>` for common hosts, without host-specific server behaviour (MC-P7).", status: draft }
    - { id: MC-FR14, text: "Query log: shim reports every tool call and raw query to the engine with args, duration, partial flag, agent/shim id, and the returned node/edge ids (bounded) so the pane's Query History (VZ-UC10) can replay exactly what the agent saw. Optional, off by default, local only.", status: agreed }
  non_functional:
    - { id: MC-NFR1, text: "Tool p95 ≤ 150 ms for navigation/relationship tools on the scale fixture; ≤ 1 s for impact depth 3 and path_between.", status: draft }
    - { id: MC-NFR2, text: "Default result payload ≤ ~4k tokens; hard cap configurable.", status: draft }
    - { id: MC-NFR3, text: "Shim cold start (engine already running) ≤ 500 ms to first tool response.", status: draft }
    - { id: MC-NFR4, text: "No network egress from the shim (PR7).", status: draft }
    - { id: MC-NFR5, text: "Works unchanged under ≥ 2 MCP hosts in CI (e.g. Claude Code and one other).", status: draft }

# ------------------------------------------------------------------------------------------------------
open_questions:
  - id: MC-Q1
    q: "Should get_symbol / file_outline return source text or only ranges?"
    answer: "Ranges by default; include_source opt-in per call."
    status: agreed   # 2026-09-11
  - id: MC-Q2
    q: "Result format?"
    answer: "JSON with stable keys; optional `format: text` for a compact table. Eval decides which agents use better."
    status: agreed   # 2026-09-11
  - id: MC-Q3
    q: "Ship raw query_cypher in v1?"
    answer: "Yes (D1), listed last and described as the fallback; measure its share of calls in eval."
    status: agreed   # 2026-09-11
  - id: MC-Q4
    q: "Seeded-bug catalogue — which bug classes for v1?"
    answer: >
      Deferred. First milestone is a CLEAN, hand-audited graph of ast-demo (golden snapshot, GE-NFR7).
      Seeding comes after. Candidate classes kept for that time: signature change with a distant unfixed
      caller; import cycle causing runtime undefined; dead code path still exported; wrong-layer import
      (via cycles/hotspots, no labels needed); duplicate implementation across communities; misrouted call
      (same name, wrong module).
    status: deferred   # 2026-09-11
  - id: MC-Q5
    q: "Streamable HTTP (X8) — v1.x or defer?"
    answer: "Defer entirely until a user needs a remote agent; stdio covers every current host on the same machine."
    status: agreed   # 2026-09-11

north_star_tools: [taint_trace(source → sinks), db_writes_from(entry point), layer_violations, graph_diff(commit_a, commit_b), annotate/label writes (X9)]
out_of_scope_v1: [any write tool, HTTP transport, taint, layer rules, multi-workspace federation, auth (loopback + stdio only)]
