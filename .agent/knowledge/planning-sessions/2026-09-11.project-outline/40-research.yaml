# ------------------------------------------------------------------------------------------------------
# Findings that CHANGE a decision or design rule already recorded.
amendments:
  - id: AM1
    source: R4
    changes: "README design rule 1 / PR5 — node id scheme"
    was: "${fileHash}:${kind}:${scopePath}:${ordinal}"
    now: "${path}:${kind}:${qualifiedScopePath}[:${ordinal}|:${bodyHash}]  (no file content hash; ordinal/body-hash only for anonymous items)"
    why: "Including the file's content hash changes every node id in the file on every save, defeating stable identity. rustc DefPath / SCIP descriptor pattern instead. Measured: move/insert-above/reformat → 0 id changes."
    status: agreed-by-evidence   # visionary to confirm
  - id: AM2
    source: R5
    changes: "VZ-FR15 — relocatable views"
    was: "every view relocatable to sidebar, panel, secondary sidebar, or editor area"
    now: "webview views relocate between primary sidebar, panel, secondary sidebar only; editor area requires a separate WebviewPanel opened by command (with serializer). Both surfaces render one extension-side store."
    why: "VS Code cannot place webview views in the editor area; viewsWelcome does not render in webviews either (first-run UI is self-rendered in the Status view)."
    status: agreed-by-evidence
  - id: AM3
    source: R3
    changes: "30-mcp-server.yaml tool catalogue (19 tools)"
    now: "≤ 12 tools exposed in v1. Cursor silently drops tools beyond ~40 active across all servers; OpenAI advises < 20; VS Code caps 128/request. Fold should-priority analytics (communities, hotspots, cycles, unresolved, type_hierarchy) into fewer tools or v1.x."
    status: agreed-by-evidence
  - id: AM4
    source: R2
    changes: "X3 — SCIP as pluggable live resolver"
    now: "SCIP indexers (scip-typescript, scip-python) are whole-project only and will not become single-file incremental. Role = golden oracle + cold-start/CI precision pass. Live precise upgrade path = TypeScript compiler API in-daemon (Program reuse) for TS; headless basedpyright over LSP for Python (watch Pyrefly). stack-graphs is archived (2025-09)."
    status: agreed-by-evidence
  - id: AM5
    source: R2
    changes: "10-graph-engine.yaml SYMBOL.fqn"
    now: "Adopt SCIP DESCRIPTOR grammar (e.g. src/`users.ts`/UserService#findById().) as SYMBOL.fqn; store scheme/manager/package/version as separate SYMBOL properties. Not the full SCIP string verbatim — different resolvers would otherwise disagree on the same symbol."
    status: agreed-by-evidence
  - id: AM6
    source: R3
    changes: "MCP protocol assumptions"
    now: "MCP spec 2026-07-28 removed initialize/sessions (stateless, _meta on every request, server/discover). No host ships a modern client yet → shim must be dual-era via @modelcontextprotocol/server v2 serveStdio. HTTP+SSE formally deprecated."
    status: agreed-by-evidence
  - id: AM7
    source: R4
    changes: "GE-FR5 — cached tree-sitter trees"
    now: "Cache trees only for open documents + LRU(100); full-parse everything else. Full parse of a 1000-line TS file is 4.2 ms; a cached tree costs ~1.6 MB RSS and the wasm heap never shrinks."
    status: agreed-by-evidence

# ------------------------------------------------------------------------------------------------------
# Findings that CONFIRM a decision (with the evidence that settles it).
confirmations:
  - { source: R1, confirms: "D8/GE-Q4 — filesystem watcher is source of truth; VS Code events are hints", evidence: "onDidCreate/Delete/RenameFiles documented as NOT fired for on-disk changes by other apps; files.watcherExclude defaults exclude almost nothing." }
  - { source: R1, confirms: "X2/GE-UC6 — bulk mode for git operations", evidence: "Nx, Turborepo, Watchman all special-case .git/index / index.lock; parcel batches storms into one callback." }
  - { source: R2, confirms: "D26 — adapter-native first, resolver seam now", evidence: "Only the type-checker family is file-incremental for cross-file resolution; Kythe/Glean/Joern/CodeQL are not." }
  - { source: R2, confirms: "X12 — interface-hash gating", evidence: "TypeScript BuilderState hashes per-file .d.ts and cascades via referencedMap only while hashes keep changing; Pyre/Flow recheck importers only on exported-signature change." }
  - { source: R3, confirms: "D19 — stdio first; X13 — thin shim; MC-P5 — RO_QUERY", evidence: "RO_QUERY rejects write clauses; spec allows unix-socket transports to reuse stdio NDJSON framing so the shim relays nearly verbatim." }
  - { source: R4, confirms: "PR2 — tree-sitter is not the bottleneck", evidence: "Whole tree-sitter share of a save ≈ 2–6 ms of the 2000 ms budget; DB write dominates." }
  - { source: R5, confirms: "D8 — detached CLI-owned daemon; X14 — runtime binary download; VZ-Q2 — separate views", evidence: "vscode-languageclient supports detached + attach-to-running; no Marketplace policy forbids runtime downloads; MCP server definition provider API finalized in VS Code 1.101." }

# ------------------------------------------------------------------------------------------------------
# Concrete choices the reports recommend. Adopted as defaults for the architecture phase unless overridden.
adopted_defaults:
  watcher:
    library: "@parcel/watcher 2.6.0 (same engine as VS Code); fallback @parcel/watcher-wasm → chokidar 5"
    excludes: "hard-coded set ∪ .gitignore chain passed as native ignore globs; separate non-recursive watch on .git/HEAD, .git/index, .git/index.lock, .git/refs/**"
    debounce: "100 ms trailing per path, 500 ms ceiling; delete→create coalesces to change"
    no_op_filter: "hash equal to stored → drop"
    zero_byte_guard: "size 0 and previously non-empty → re-read after 100 ms (VS Code saves are truncate-then-write)"
    rename_pairing: "within a batch, pair delete/create by ino+dev, else content hash"
    bulk_mode_entry: "≥ 200 paths OR ≥ 50 dirs OR .git/index.lock present OR HEAD changed < 2 s ago OR ≥ 500 events/s"
    bulk_mode_exit: "750 ms quiet AND index.lock gone (cap 10 s) → one ordered transaction"
    reconciliation: "mtime+size walk (hash on mismatch) on watcher error/restart and every 10 min idle; getEventsSince(snapshot) on daemon start"
    linux: "read max_user_watches at start; warn within 20 %; degrade subtree to polling on ENOSPC"
  parsing:
    binding: "web-tree-sitter 0.27.0 (wasm) for daemon AND VSIX; native rejected (segfault under Node 20 measured, 6-platform prebuild matrix, no meaningful speed win)"
    grammars: "typescript (.ts/.mts/.cts), tsx (.tsx), javascript (.js/.jsx/.mjs/.cjs), python (.py) — TS grammar rejects JSX, TSX grammar rejects <T>x"
    abi: "assert Language.version ∈ [MIN_COMPATIBLE, LANGUAGE_VERSION] at startup; build .wasm in CI with pinned tree-sitter-cli; day-one fallback @vscode/tree-sitter-wasm 0.3.1"
    extraction: ".scm queries compiled once (1.4 ms/file) over the full file; getChangedRanges() only as early exit"
    tree_cache: "open documents + LRU(100), delete() on eviction"
    node_ids: "path:kind:qualifiedScopePath[:ordinal|:bodyHash] (AM1)"
    interface_hash: "normalised exported-declaration surface incl. resolved re-export targets (transitive for barrels); propagate while dependents' own hashes change (TypeScript updateShapeSignature queue)"
  resolution:
    interface: "per-file batch Resolver { open, fileChanged, defineSymbols, exportsOf → {exports, hash, globalScope}, resolve(RefSite[]) → Resolution[], dependentsOf?, close }; ChainResolver([checker?, adapterNative]) highest precision wins"
    edge_props: "CALLS carries status ∈ {resolved, ambiguous, external, unresolved, dynamic}, reason, confidence, resolvedBy — unresolved rate is one Cypher GROUP BY"
    fqn: "SCIP descriptor grammar (AM5); SCIP SymbolRole bits on occurrences; no `local N` symbols in graph"
    oracle: "scip-typescript + scip-python run once over 3–5 OSS repos → precision/recall per RefSite.kind in CI"
    v1_target: "≥ 90 % call sites resolved at ≥ 95 % precision on typed TS; Python reported separately"
    upgrade_path: "TS compiler API in-daemon (Program reuse, lazy checker); Python headless basedpyright for unresolved sites only"
  mcp:
    sdk: "@modelcontextprotocol/server ^2 + core, zod 4, serveStdio (dual-era)"
    stdio_hygiene: "only transport writes stdout; console.* → stderr; one JSON object per line; exit 0 within 500 ms of stdin EOF; never process.exit on engine errors (Claude Code does not restart dead stdio servers)"
    workspace: "explicit --workspace arg (CPG_WORKSPACE, CLAUDE_PROJECT_DIR, then cwd); only VS Code and Claude Code spawn in workspace root"
    handshake: "answer discover/initialize/tools/list from a static manifest before engine attach (Codex 10 s startup timeout)"
    tools_v1: "≤ 12: find_symbol, symbol_details, callers_of, callees_of, impact_of_change, path_between, file_outline, graph_status, wait_for_ready, cypher_readonly, + schema resource (AM3)"
    payload: "annotations {readOnlyHint, idempotentHint, openWorldHint:false}; outputSchema + structuredContent + compact Markdown text; limit default 20 max 200; response_format concise|detailed; node {id, kind, name, file, range, status}; default cap ~8k tokens"
    discovery: "8-step attach/start algorithm in R3 §Recommendation: engine.json {pid, startTime, version, ipc, workspaceRoot}; stale if pid dead / startTime mismatch / connect fails 500 ms; O_EXCL engine.lock; spawn detached; unix socket ${XDG_RUNTIME_DIR||/tmp}/cpg/<wsHash>.sock (≤ 80 chars, macOS 104-byte limit)"
    cypher_guards: "static write-clause reject + RO_QUERY + per-query TIMEOUT + TIMEOUT_MAX/RESULTSET_SIZE/QUERY_MEM_CAPACITY + shim token cap"
    host_config: "`cpg mcp install --host <claude-code|cursor|vscode|codex|windsurf|jetbrains>` generates snippets; VS Code also via registerMcpServerDefinitionProvider"
  vscode_host:
    process_model: "detached CLI-owned daemon; extension = attach-or-spawn client (spawn detached:true, stdio:'ignore' only if nothing listening); never kill on deactivate; idle timeout ~30 min; lockfile against two-window race; gate on workspace.isTrusted"
    binary: "runtime download to ~/.cache/cpg/falkordb/<version>/ (CPG_CACHE_DIR override), SHA-256 manifest pinned in engine package, proxy from http.proxy/HTTPS_PROXY, offline → clear error + cpg.falkordb.path / remote; universal VSIX; copy ZLS's verify + cached-index pattern, not clangd's"
    views: "one container with 4 webview views (graph, inspector, status, queryHistory) + cpg.graphEditor WebviewPanel with serializer; single extension-side store; retainContextWhenHidden only for Graph (AM2)"
    breadcrumb: "onDidChangeTextEditorSelection + onDidChangeActiveTextEditor, 150 ms debounce (mirrors built-in breadcrumbs); executeDocumentSymbolProvider as fallback"
    mcp_registration: "registerMcpServerDefinitionProvider in activate() with args ['mcp'], cwd workspaceFolder.uri; plus 'Copy MCP config' command for non-Copilot agents"
    packaging: "packages/engine (pure TS, zero vscode imports), packages/cli, packages/vscode; esbuild dual entry; wasm via file loader; activation workspaceContains:**/cpg.config.yaml + onStartupFinished; engine tests in plain Vitest/Mocha, host via @vscode/test-cli"

