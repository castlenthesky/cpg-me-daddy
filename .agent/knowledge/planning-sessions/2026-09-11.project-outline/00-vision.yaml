# cpg-me-daddy — Product vision (living document)
# Source: discovery interview 2026-09-11 between the visionary (Brian) and product lead (Claude).
# This is the top-level record. Per-pillar decompositions live in sibling files as discovery progresses:
#   10-graph-engine.yaml, 20-visualization.yaml, 30-mcp-server.yaml
# Status vocabulary: stated (visionary said it, not yet interrogated) | proposed (product lead raised it,
# awaiting response) | agreed | rejected | deferred

meta:
  session_date: 2026-09-11
  mode: greenfield rewrite; existing code is reference only
  prior_context: ./README.md   # alignment Q&A, code survey, design rules, DB decision (FalkorDB)
  last_updated: 2026-09-11

product:
  working_name: cpg-me-daddy
  form_factor: VS Code extension (single install)
  one_liner: >
    Install one extension and get a live, incrementally-updated Code Property Graph of your codebase,
    a way to see it inside the IDE, and an MCP server that lets coding agents interrogate it.
  thesis: >
    Agents and humans both make better changes when they can see structure (call graph, import graph,
    data flow, architectural layers) instead of re-deriving it from raw text. Existing tools re-index
    the whole codebase and handle incremental updates badly; this one updates on every save with
    near-live latency, so the graph an agent reads is always current.
  goals:
    - enhance code quality (detect architectural smells, layer violations, god classes, cycles)
    - enhance agent understanding of code (structured, queryable context via MCP)

pillars:
  - id: P1
    name: Graph engine
    summary: Sparse CPG built from the workspace, persisted in a Cypher graph DB, updated incrementally on save.
    status: stated
  - id: P2
    name: Visualization
    summary: IDE pane rendering scoped views of the graph, filtered to what the user needs right now.
    status: stated
  - id: P3
    name: MCP server
    summary: Read-side tooling for coding agents — raw Cypher plus higher-level analytics and pathing tools.
    status: stated

principles:
  - id: PR1
    name: Sparse by design
    text: >
      The graph is NOT the full AST. No nodes for punctuation, every identifier, or every literal. Only
      the nodes/edges needed to make analysis effective (structural tier by default; expression tier
      opt-in). See README design rule 3.
    status: stated
  - id: PR2
    name: Speed is the product
    text: >
      Day-to-day edits must land in the graph near-instantly. Never re-parse the whole codebase for a
      one-line change. Full rebuild is a fallback, not the path.
    status: stated
  - id: PR3
    name: The graph is a cache
    text: Fully rebuildable from source. Per-file content hash is the source of truth for staleness.
    status: stated
  - id: PR4
    name: Concurrent read/write
    text: >
      Extension is the writer (and runs analytics). MCP server is a reader that may query while writes
      land. Readers must never silently see torn state — stale/in-progress must be visible (invalidate
      on save, revalidate when processed) so an agent can wait and retry.
    status: stated
  - id: PR5
    name: Deterministic identity
    text: >
      Files and symbols are identified by content/structure, not position. A file move is a relocation,
      not a rebuild. Enables catch-up after offline edits. See README design rule 1.
    status: stated
  - id: PR6
    name: Show what matters, when it matters
    text: >
      Visualization is only useful to the degree it shows the user what they need to know right now.
      Whole-graph rendering is an anti-goal; filtered, use-case-driven views are the goal.
    status: stated
  - id: PR7
    name: Privacy and local compute
    text: >
      Source code, the graph, and every query stay on the user's machine. No telemetry, no remote calls,
      no cloud dependency unless the user explicitly opts in. The engine, DB, and MCP server all run
      locally by default.
    status: agreed
  - id: PR8
    name: State is always explicit
    text: >
      Every node and every result carries its freshness. Nodes under construction, stale, or errored are
      identifiable by property so an agent reading a path or a neighbourhood knows which parts to trust
      and which to retry. Never block a reader; never hand back ambiguous state.
    status: agreed

lifecycle:
  first_launch:
    status: stated
    steps:
      - Traverse workspace folders/files (respecting watch/exclude lists) → write filesystem layer (directory/file structure).
      - Parse each file → modules, classes, functions, imports → symbol, call, and import layers.
      - Build remaining CPG layers (CFG, structural-tier data flow) in passes.
      - Emit ready event → visualization and MCP become live.
  on_save:
    status: stated
    steps:
      - Trigger from VS Code save event and/or filesystem watcher (mechanics TBD — research item R1).
      - Mark file INVALID / in-progress in the graph.
      - Diff previous tree vs new tree (tree-sitter incremental; LSP as a possible semantic oracle).
      - Compute per-file DiffGraph → replace the file's subgraph.
      - Cascade: re-evaluate dependents whose view of this file changed (exports, import signature) until propagation stops.
      - Refresh affected analytics projections.
      - Mark file READY; emit update event → visualization refreshes.
  catch_up:
    status: stated
    text: >
      On (re)activation, compare stored content hashes vs disk; replay changes for files edited while the
      extension was off (IDE closed, extension disabled, edits outside the IDE). Detect renames/moves by
      content hash → relocate instead of rebuild.

feature_seeds:
  # Explicitly called out by the visionary. Decomposed further in per-pillar files.
  graph_engine:
    - { id: G1, text: "Watch folders and exclude folders (whitelist/blacklist) so caches, build artifacts, and tool side-effects don't trigger updates.", status: stated }
    - { id: G2, text: "Content hashing per file for change detection and catch-up.", status: stated }
    - { id: G3, text: "Incremental per-file diff via tree-sitter (and/or LSP).", status: stated }
    - { id: G4, text: "Cascading re-evaluation of downstream dependents on save.", status: stated }
    - { id: G5, text: "Move/rename detection → relocation, not rebuild.", status: stated }
    - { id: G6, text: "Invalidate-on-save / revalidate-on-ready status markers readable by MCP.", status: stated }
    - { id: G7, text: "Analytics (community detection, centrality, pathing) computed off the hot path but kept fresh.", status: stated }
  visualization:
    - { id: V1, text: "Graph pane inside the IDE, live-updating from graph change events.", status: stated }
    - { id: V2, text: "Filtering by layer, taint trace, DB writes, centrality, community.", status: stated }
    - { id: V3, text: "Breadcrumb / you-are-here: highlight current file → class → method in the graph as the user navigates.", status: stated }
    - { id: V4, text: "Trace from a user input (e.g. API endpoint) to all resulting DB writes.", status: stated }
    - { id: V5, text: "Path/dependency exploration between two arbitrary points (file A → outcome B).", status: stated }
  mcp:
    - { id: M1, text: "Raw Cypher query tool (read-only).", status: stated }
    - { id: M2, text: "Analytics tools — community detection, centrality, pathing — precomputed, fast to return.", status: stated }
    - { id: M3, text: "Architectural smell detection — layer violations (API importing DB directly), god classes, centrality thresholds.", status: deferred, note: "Layer violations north star (D16). God-class / centrality hotspots can stay v1 — they need no labels." }
    - { id: M4, text: "Taint tracing / pathing tools for agents.", status: split, note: "Pathing (path_between, callers/callees) is v1. Taint is north star (D10)." }

# Raised by the product lead during the interview. Awaiting visionary response.
proposals:
  - id: X1
    name: Headless core, VS Code as one host
    text: >
      Agents frequently run where VS Code is not open (terminal CLI agents, CI, another machine). If the
      engine and MCP server only live inside the extension host, those agents have no graph. Proposal:
      the engine (indexer, watcher, DB lifecycle, MCP server) is a standalone process/CLI; the VS Code
      extension is a thin host that spawns or attaches to it and adds UI. The same binary can run in CI
      to fail a PR on new layer violations.
    status: agreed   # 2026-09-11
  - id: X2
    name: Git awareness as a first-class event source
    text: >
      Branch switch / pull / rebase changes hundreds of files at once — a stampede for the watcher. Treat
      git operations as a distinct event (debounce → bulk catch-up via hash diff). Also unlocks "graph
      diff between two commits": what did this PR add to the call graph, new cycles, new layer
      violations, centrality shifts. Strong agent and human review use case.
    status: proposed
  - id: X3
    name: Semantic resolution needs more than tree-sitter
    text: >
      tree-sitter gives syntax, not name resolution. Cross-file call/import resolution for TS/Python needs
      a type-aware oracle. Options: the VS Code language server via executeDefinitionProvider (only works
      inside VS Code — conflicts with X1), or SCIP indexers (scip-typescript, scip-python) which run
      headless and emit precise symbols matching the SYMBOL model already chosen. Recommendation:
      tree-sitter for structure and incremental diff; SCIP/LSP as a pluggable resolver.
    status: proposed
  - id: X4
    name: High-level MCP tools over raw Cypher
    text: >
      Agents write poor Cypher against unfamiliar schemas. Ship opinionated tools first (find_symbol,
      callers_of, callees_of, impact_of_change, path_between, layer_violations, hotspots, wait_for_ready)
      plus a schema resource; keep raw Cypher as the escape hatch.
    status: proposed
  - id: X5
    name: Impact analysis as the killer agent tool
    text: >
      Before an agent edits symbol X, "who depends on X, transitively, through which layers, and what
      will break" is the highest-value question. This is the cascade logic (G4) exposed as a query.
    status: proposed
  - id: X6
    name: Architecture rules are declared, then verified
    text: >
      Layer rules (router→controller→service→repository→db) cannot be reliably inferred from community
      detection alone. Proposal: user declares layers (glob → layer, allowed edges) in a config file;
      analytics verify and flag violations; community detection suggests a starting manifest and
      surfaces drift.
    status: superseded   # Visionary chose inference-led (Q6): community detection → agent applies labels via MCP. Verification of rules still open (Q10).
  - id: X7
    name: Visualization is always query-scoped
    text: >
      A 10^5-node graph is unrenderable and useless. Every view is "focus node(s) + N hops + filter".
      The breadcrumb (V3) is the default focus. Views should be saveable/shareable as queries.
    status: proposed
  - id: X8
    name: MCP transport and security
    text: >
      A separate-process agent implies streamable HTTP transport on localhost, not stdio. Needs a bearer
      token, loopback-only bind, and opt-in for remote. Multiple agents may connect concurrently.
    status: proposed
  - id: X9
    name: Annotation layer — durable, agent-writable, outside the cache
    text: >
      Q6's answer (agents apply layer labels via MCP) means two principles bend: PR3 (graph is a
      rebuildable cache) and PR4 (MCP is a reader). Annotations are not derivable from source, so a
      rebuild would erase them. Proposal: a distinct annotation layer (LAYER / RULE / NOTE nodes, not
      :CPG, attached via SYMBOL or path patterns so per-file replace cannot touch them), persisted to a
      committed file in the repo (e.g. .cpg/annotations.yaml) and re-applied on every rebuild. MCP gets
      exactly one write surface: annotations. Human-editable, diffable in PRs, shareable across the team.
    status: deferred   # Q9: v1 has no persisted labels. Revisit with layer rules (north star).
  - id: X10
    name: Reference app + eval harness
    text: >
      ast-demo (19 ts / 6 py files) cannot validate speed or the seeded-bug metric. Proposal: (1) a
      purpose-built reference app — layered TS + Python (router→controller→service→repository→db),
      realistic size (~5–20k LOC), with a catalogue of seeded bugs each tagged with the graph query that
      reveals it (cross-layer import, dead code path, unhandled caller after signature change, circular
      dependency, god class); (2) a large public repo pinned by commit for perf benchmarks (TS: e.g.
      vscode or excalidraw; Py: e.g. django or fastapi); (3) an eval runner that gives an agent a bug
      report, with and without the MCP, and scores detection + mitigation. The eval harness becomes the
      v1 acceptance test.
    status: revised   # Q12
    revision: >
      Visionary wants ast-demo to stay small and auditable. Resolution — two fixtures with different jobs:
      (1) ast-demo = CORRECTNESS oracle: small TS + Py hello-world with clean layers, golden graph snapshots
      checked into the repo, every node/edge hand-auditable, seeded-bug catalogue for the > 95 % eval.
      (2) SCALE fixture = perf only, not audited by hand: a pinned large public repo (or a generator that
      clones ast-demo's patterns N times) used to prove the 2 s / 5 s save budget and the 10 min first launch.
      Neither fixture is asked to do the other's job.
  - id: X11
    name: Workspace-root config file, manifests for discovery only
    text: >
      Tool blocks in package.json / pyproject.toml break down in monorepos (dozens of manifests, no
      single owner of workspace-level settings) and cannot hold layer rules or annotations. Proposal:
      one config file at the workspace root (cpg.config.yaml or .cpg/config.yaml) is the source of
      truth for include/exclude roots, language toggles, exclusions, server settings, and analytics
      thresholds. Manifests are read for DISCOVERY: package.json workspaces, pyproject/uv workspaces,
      tsconfig paths and project references seed include roots and module-resolution aliases; .gitignore
      seeds excludes. Zero-config default works; the file exists to override.
    status: recommended   # Q15 — visionary asked for a recommendation; awaiting acceptance
    recommendation:
      committed_config: cpg.config.yaml           # workspace root; visible like tsconfig.json / eslint.config
      generated_state: .cpg/                      # gitignored automatically (engine writes .cpg/.gitignore with "*")
      generated_state_contents: [data/ (FalkorDB persistence), cache/ (tree-sitter trees, file hashes), engine.lock, engine.json (port, pid, version)]
      format: YAML                                # comments, human-editable, matches the planning docs
      precedence: CLI flags > env (CPG_*) > cpg.config.yaml > manifest discovery > built-in defaults
      vscode_settings: >
        Only host-level UI preferences live in VS Code settings (pane layout, auto-open). Anything that
        changes what the engine indexes lives in cpg.config.yaml so headless and IDE behaviour are identical.
      sketch: |
        version: 1
        include: [apps/*, packages/*, services/*]          # default: discovered from manifests, else "."
        exclude: [**/node_modules, **/dist, **/__pycache__, **/.venv]   # merged with .gitignore
        languages: { typescript: true, python: true }
        watch: { debounce_ms: 150, bulk_threshold_files: 50 }   # >threshold → bulk/catch-up mode
        engine: { db: { mode: spawned | remote, host, port }, log_level: info }
        analytics: { communities: true, centrality: true, refresh: on_idle }
        mcp: { transport: stdio, expose_raw_cypher: true }
  - id: X12
    name: Interface-hash gating keeps the cascade bounded
    text: >
      The cascade (G4) is unbounded in theory: edit a base type imported by 500 files and every dependent
      re-evaluates. In practice most saves change a function body, not the file's exported interface.
      Mechanism: each file carries two hashes — content hash (any change) and INTERFACE hash (exported
      symbols, their kinds, signatures, and re-exports). On save, if the interface hash is unchanged, the
      cascade is zero files — dependents' edges point at SYMBOL nodes that did not move. Only an interface
      change triggers dependent re-evaluation, and only for dependents that import the changed symbols
      (not the whole file). When the remaining cascade still exceeds the budget, the saved file is READY,
      dependents are marked STALE with a visible count, and the background drains them. This is what makes
      a 2 s file+cascade budget realistic without pretending the pathological case doesn't exist.
    status: proposed
  - id: X13
    name: stdio MCP shim in front of a shared headless engine
    text: >
      stdio (Q13) means each agent host spawns the MCP server as a child process. Combined with the headless
      engine (D8), the MCP server becomes a thin stdio shim: `cpg mcp` starts, discovers the running engine
      via .cpg/engine.json (or starts one if absent), and forwards tool calls to the engine / read-only DB
      connection. N agents = N shims, one engine, one graph. Streamable HTTP (X8) becomes a later opt-in for
      remote agents rather than the v1 path. Registration: hosts get a one-line config
      (`command: npx cpg mcp` or the VSIX-bundled binary); the VS Code extension can additionally register
      itself as an MCP server provider for Copilot.
    status: proposed
  - id: X14
    name: Distribution — conventional pattern for extensions that need a native server
    text: >
      Convention among VS Code extensions that depend on a native binary (rust-analyzer, clangd, Go, many
      LSP clients): ship the extension's own code inside the VSIX, and download the native server on first
      activation to a user-level cache, pinned by version and verified by checksum, with a setting to point
      at a system-installed or remote instance instead. Recommendation for this project:
      (1) Engine = TypeScript npm package with a CLI (`cpg index | watch | mcp | status`), installable with
          npx / npm -g for headless and CI use. The VSIX bundles the same engine JS via esbuild so the
          extension has zero install steps.
      (2) FalkorDB = downloaded on first run to ~/.cache/cpg/falkordb/<version>/ (XDG-style, shared across
          workspaces), pinned version + sha256, with cpg.config.yaml `engine.db.mode` = spawned | remote |
          docker. Not bundled in the VSIX: it would multiply platform-specific VSIX targets and bloat every
          install, and SSPL redistribution questions are avoided by downloading from the vendor at runtime.
      (3) Windows until native FalkorDB builds exist: remote | docker modes only, with a clear activation
          message.
      (4) Offline: if the download fails, the engine runs in "no-DB" mode that still validates config and
          reports the problem through MCP status rather than failing silently.
    status: recommended

open_questions:
  # Round 1 (answered 2026-09-11)
  - id: Q1
    q: Who is the primary user for v1 — the human looking at the visual, or the agent hitting MCP?
    answer: Agent-first. MCP is the wedge; visualization is the trust/debug surface.
    status: answered
  - id: Q2
    q: Language scope for v1, and what is the concrete dogfood / benchmark repo?
    answer: >
      TypeScript and Python. Dogfood repo is /Users/brianhenson/projects/demos/ast-demo.
      Product-lead note: ast-demo is 19 .ts + 6 .py files, mostly the FalkorDB bench harness — too small
      to validate the 2 s budget or the seeded-bug eval. See X10.
    status: answered
  - id: Q3
    q: Is end-to-end taint tracing a v1 must-have or a north star?
    answer: North star. Not v1. v1 ships call graph, import graph, symbol resolution, structural-tier data flow only.
    status: answered
  - id: Q4
    q: Where does the engine live when VS Code is closed?
    answer: Headless engine (X1 agreed). Agents in a terminal get a graph without the IDE open.
    status: answered
  - id: Q5
    q: Staleness budget after save?
    answer: Save-to-ready ≤ 2 s hard ceiling; lower is better. Open sub-question Q11 on whether the 2 s includes the dependent cascade.
    status: answered
  - id: Q6
    q: Where do architectural rules come from?
    answer: >
      Inferred. Community detection identifies clusters; an LLM/agent may then apply layer labels via MCP
      if it chooses. Product-lead note: this gives MCP a write surface and creates non-rebuildable state.
      See X9 and Q9/Q10.
    status: answered
  - id: Q7
    q: What does success look like in numbers?
    answer: >
      (a) An agent can query a QUALITY graph of the dogfood repo. (b) Save-to-ready < 2 s.
      (c) Seed the dogfood repo with bugs that are hard to detect/trace without a graph; an agent with the
      MCP detects and mitigates them reliably (> 95 %).
    status: answered
  - id: Q8
    q: Multi-root workspaces and monorepos — graph granularity?
    answer: One graph per workspace. Visionary floated tool blocks in package.json / pyproject.toml for include-folder config and asked for alternatives. See X11.
    status: answered

  # Round 2 (answered 2026-09-11)
  - id: Q9
    q: Does MCP get a write surface for annotations / labels?
    answer: >
      Not in v1. v1 detects communities and exposes their members; an agent may generalize a label from the
      members at query time. No persisted labels, so MCP stays read-only and PR3/PR4 hold. Persisted
      annotation layer (X9) deferred to north star.
    status: answered
  - id: Q10
    q: Who declares allowed-edge rules and where do violations surface?
    answer: Deferred. Community labeling and import-violation detection are north-star features, not v1. Scope in a later iteration.
    status: answered
  - id: Q11
    q: Does the 2 s budget include the cascade to dependents?
    answer: >
      Yes — saved file plus cascade. If benchmarks show 2 s is not achievable, bump to 5 s. Never more than
      5 s for file + cascade. Product-lead note: cascade is unbounded in theory; see X12 for the mechanism
      that keeps it bounded in practice, and Q16 for the pathological case.
    status: answered
  - id: Q12
    q: Grow ast-demo or build a reference app?
    answer: >
      Grow ast-demo, but keep it a small "hello world" whose graph a human can audit line by line. Do not
      sprawl it. Product-lead note: correctness and performance need different fixtures; see X10 revision.
    status: answered
  - id: Q13
    q: Which agent hosts are first-class targets?
    answer: >
      None specifically — MCP is the universal standard; design the MCP well and every host works. Assume
      STDIO transport first. Product-lead note: stdio + headless engine (D8) implies a thin stdio shim
      process per agent that connects to the shared engine/DB; see X13.
    status: answered
  - id: Q14
    q: First-launch budget?
    answer: No more than 10 minutes. (Repo size for that budget not stated; product lead assumes ~100k LOC. Partial availability during indexing not stated — see Q17.)
    status: answered
  - id: Q15
    q: Config source?
    answer: Visionary asked for a recommendation. See X11 (revised) — cpg.config.yaml at workspace root, .cpg/ for generated state.
    status: answered

  # Round 3 (answered 2026-09-11)
  - id: Q16
    q: Pathological cascade handling (X12)?
    answer: >
      Agreed. Agents must always be ABLE to query. State must be explicit in results, including pathing:
      nodes under construction carry a property/attribute that identifies them unambiguously.
    status: answered
  - id: Q17
    q: MCP during first launch?
    answer: Partial graph with status. Never refuse.
    status: answered
  - id: Q18
    q: v1 CPG layers?
    answer: >
      Filesystem, symbols, types, imports, calls, and sparse structural-tier data flow
      (REACHING_DEF: MEMBER|PARAM -> CALL). CFG and the rest of PDG (CDG/DOMINATE) deferred;
      expression-tier nodes stay deferred. Amended 2026-09-12 — see D23.
    status: answered
  - id: Q19
    q: Distribution of engine and DB binary?
    answer: No preference; follow standard/conventional behaviour for VS Code extensions and plugins. Product lead recommendation in X14.
    status: answered
  - id: Q20
    q: Privacy default?
    answer: Privacy and local compute are a design principle (PR7).
    status: answered

  # Round 4 — decomposition-level questions live in the per-pillar files (10-, 20-, 30-*.yaml).

risks:
  - { id: RK1, severity: low,    text: "Interprocedural data flow (taint) is an order of magnitude harder than call/import graphs. Mitigated: moved to north star (D10). Residual risk: v1 schema must not preclude adding it." }
  - { id: RK6, severity: low,    text: "Agent-written annotations are non-rebuildable state in a graph defined as a cache (PR3). Mitigated: no persisted labels in v1 (D15). Re-raise with X9 when layer rules are scoped." }
  - { id: RK9, severity: high,   text: "Cascade budget (D17) is unbounded without interface-hash gating (X12). Must be designed in from day one, not retrofitted." }
  - { id: RK7, severity: medium, text: "Dogfood repo too small to expose perf or resolution problems before real users do. Mitigation: X10." }
  - { id: RK8, severity: medium, text: "Community detection on a call/import graph rarely maps 1:1 to human architectural layers; agent labels may be confidently wrong. Needs a human-visible review path." }
  - { id: RK2, severity: high,   text: "Name resolution quality determines cross-file edge quality; tree-sitter alone yields many unresolved calls." }
  - { id: RK3, severity: medium, text: "Watcher stampedes (git checkout, npm install, codegen) overwhelm the incremental pipeline without a bulk mode." }
  - { id: RK4, severity: medium, text: "FalkorDB platform coverage (Windows) and SSPL licensing for a FOSS repo. Tracked in README follow-ons." }
  - { id: RK5, severity: medium, text: "Whole-graph visualization becomes a demo toy rather than a daily tool if not query-scoped." }

research_items:
  - { id: R1, text: "VS Code save hooks (onDidSaveTextDocument) vs FileSystemWatcher vs chokidar — coverage of external edits, rename events, bulk operations." }
  - { id: R2, text: "SCIP indexers (scip-typescript, scip-python) — incremental capability, speed, license, output size." }
  - { id: R3, text: "MCP streamable HTTP transport, auth patterns, multi-client behaviour in the current SDK." }
  - { id: R4, text: "tree-sitter incremental reparse (tree.edit) performance at file sizes seen in the target repo." }
  - { id: R5, text: "VS Code extension mechanics: spawning/attaching a long-lived daemon, registering an MCP server definition provider, relocatable views, platform-specific binary download conventions." }

decisions:
  # Carried forward from README so this file stands alone.
  - { id: D1, text: "Cypher is a hard requirement.", source: README }
  - { id: D2, text: "FalkorDB primary store; LadybugDB fallback with a defined trigger.", source: README }
  - { id: D3, text: "macOS + Linux now, Windows eventually.", source: README }
  - { id: D4, text: "Structural tier by default, expression tier opt-in.", source: README }
  - { id: D5, text: "SYMBOL indirection so per-file replace never breaks cross-file edges.", source: README }
  - { id: D6, text: "Analytics run on projections (call/import/type graphs), not the raw CPG.", source: README }
  # Added 2026-09-11, discovery round 1
  - { id: D7,  text: "Agent-first. The MCP server is the v1 wedge; visualization is the trust/debug surface and ships after.", source: Q1 }
  - { id: D8,  text: "Headless engine (indexer, watcher, DB lifecycle, MCP server) as a standalone process/CLI; the VS Code extension is a thin host.", source: Q4/X1 }
  - { id: D9,  text: "v1 languages: TypeScript and Python.", source: Q2 }
  - { id: D10, text: "Taint tracing (interprocedural data flow) is north star, not v1. v1 = symbols, imports, calls, structural-tier data flow.", source: Q3 }
  - { id: D11, text: "Save-to-ready ≤ 2 s hard ceiling. Scope of 'ready' (file only vs cascade) pending Q11.", source: Q5 }
  - { id: D12, text: "Architectural layers are inferred (community detection) and labeled by agents/LLM via MCP, not declared up front.", source: Q6 }
  - { id: D13, text: "v1 acceptance: quality graph of dogfood repo + save-to-ready < 2 s + agent finds/mitigates seeded bugs > 95 % using the MCP.", source: Q7 }
  - { id: D14, text: "One graph per workspace.", source: Q8 }
  # Added 2026-09-11, discovery round 2
  - { id: D15, text: "v1 analytics: community detection exposes clusters and members; no persisted labels. MCP remains read-only in v1.", source: Q9 }
  - { id: D16, text: "Layer labeling, allowed-edge rules, and import-violation detection are north star, not v1.", source: Q10 }
  - { id: D17, text: "Save-to-ready budget covers saved file + cascade: target 2 s, hard ceiling 5 s.", source: Q11 }
  - { id: D18, text: "ast-demo grows only as far as it stays a hand-auditable hello-world graph. Perf uses a separate scale fixture.", source: Q12 }
  - { id: D19, text: "No host-specific agent targets. Design to the MCP spec; stdio transport first.", source: Q13 }
  - { id: D20, text: "First launch ≤ 10 min (assumed at ~100k LOC).", source: Q14 }
  # Added 2026-09-11, discovery round 3
  - { id: D21, text: "Readers are never blocked. Over-budget cascades mark dependents STALE; every node carries an explicit status property.", source: Q16 }
  - { id: D22, text: "MCP serves a partial graph with coverage status during first launch.", source: Q17 }
  - { id: D23, text: "v1 graph layers: filesystem, symbols, types, imports, calls, sparse REACHING_DEF (MEMBER|PARAM -> CALL). CFG and remaining PDG (CDG/DOMINATE) deferred; expression-tier nodes deferred. Amended 2026-09-12 — sparse data flow is in v1 (aligns with D10); full Joern PDG is not.", source: Q18 }
  - { id: D24, text: "Distribution follows extension convention: engine bundled in VSIX and published to npm; FalkorDB downloaded on first run, pinned + checksummed (X14).", source: Q19 }
  - { id: D25, text: "Privacy and local compute are design principles (PR7).", source: Q20 }
  # Added 2026-09-11, decomposition round
  - { id: D26, text: "Resolution: adapter-native first; unresolved rate on ast-demo is a tracked metric; resolver seam designed now for later type-checker/SCIP plug-in.", source: GE-Q2 }
  - { id: D27, text: "Seeded-bug catalogue deferred until ast-demo has a clean, hand-audited golden graph.", source: MC-Q4 }
  - { id: D28, text: "TypeScript adapter covers the whole family (.ts/.tsx/.js/.jsx/.mts/.cts/.mjs/.cjs); SFCs deferred.", source: GE-Q1 }
  - { id: D29, text: "Query History (optional, off by default): humans can replay exactly which nodes/edges each agent query returned.", source: VZ-Q4 }
  - { id: D30, text: "Visualization ships as separate relocatable VS Code views; Graph view also opens as an editor tab.", source: VZ-Q2 }
  # Research-driven (2026-09-11, see 40-research.yaml). Marked agreed-by-evidence; visionary may override.
  - { id: D31, text: "Node ids: path:kind:qualifiedScopePath[:ordinal|:bodyHash]; NO file content hash in ids. Supersedes README design rule 1's id formula.", source: R4/AM1 }
  - { id: D32, text: "web-tree-sitter (wasm) for daemon and VSIX; grammars typescript/tsx/javascript/python; trees cached only for open docs + LRU.", source: R4 }
  - { id: D33, text: "@parcel/watcher as the daemon's watcher; VS Code events are hints only.", source: R1 }
  - { id: D34, text: "SYMBOL.fqn uses SCIP descriptor grammar with scheme/package/version as properties; SCIP indexers are the golden oracle, TS compiler API is the live precise upgrade path.", source: R2/AM4/AM5 }
  - { id: D35, text: "MCP shim is dual-era (SDK v2 serveStdio), takes --workspace explicitly, answers handshake before engine attach, exposes ≤ 12 tools.", source: R3/AM3/AM6 }
  - { id: D36, text: "Detached CLI-owned daemon; extension attaches or spawns, never kills; FalkorDB downloaded with pinned SHA-256 manifest to a user cache; universal VSIX.", source: R5 }
  - { id: D37, text: "Schema alignment (M0.0): option (b) — align names to Joern where they overlap, keep the sparse-tier and SCIP divergences, document every divergence. Spec at 50-schema.md. Supersedes README design rules 1, 2 (in part) and 3 (in part), and 10-graph-engine.yaml's v1_schema draft.", source: "M0.0 / research/R6-ontology-debate-synthesis.md" }

milestones:
  # Agreed 2026-09-11.
  - id: M0
    name: Clean graph
    text: "Headless engine indexes ast-demo (TS family + Py) into the v1 schema; golden snapshot checked in; every node/edge hand-audited via the Inspector or CLI dump. No incremental, no MCP yet."
    exit: "Snapshot diff is empty and a human has signed off on it."
  - id: M1
    name: Live graph
    text: "Watcher + incremental save + interface-hash cascade + catch-up + bulk mode. Status properties everywhere."
    exit: "Body edit → ready < 2 s with zero cascade; interface edit → dependents re-resolved; offline edits caught up on restart."
  - id: M2
    name: Agent wedge
    text: "stdio MCP shim with all `must` tools, cpg://schema, graph_status, wait_for_ready, guarded raw Cypher."
    exit: "An agent orients, checks impact, edits, and verifies the graph updated (MC-UC1–3) on ast-demo with no human help."
  - id: M3
    name: Trust surface
    text: "VS Code host: breadcrumb focus, neighbourhood, impact, path, inspector, status strip, Query History."
    exit: "A human can see what the agent saw and confirm it was right."
  - id: M4
    name: Scale and eval
    text: "Scale fixture; first-launch ≤ 10 min; save p95 ≤ 2 s; seeded-bug catalogue and eval harness; > 95 %."
    exit: "D13 and D17/D20 met on the fixtures."

