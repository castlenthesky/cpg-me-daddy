# Standing gates, fired before a commit exists rather than after a push (F1).
# Install with `lefthook install` (the root `prepare` script does this on `bun install`).

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: bunx oxlint {staged_files}

    # Whole-repo, not just {staged_files}: a staged-only check can only ever
    # see the files in *this* commit's diff, so a file already mis-formatted
    # before it landed (oxfmt rules changed since, or a commit went in via
    # --no-verify) would pass every future pre-commit untouched and only
    # surface in CI. Delegates to the root script (same one CI runs) rather
    # than repeating the command.
    - name: format check
      run: bun run format:check

pre-push:
  parallel: false
  jobs:
    # Both delegate to the root scripts rather than repeating their commands.
    # The unit-test job used to list the package paths itself, which silently
    # stopped covering a package the moment a fourth one was added.
    - name: typecheck
      run: bun run typecheck

    - name: unit tests
      run: bun run test:unit

    - name: schema gate
      run: bun run test:schema
