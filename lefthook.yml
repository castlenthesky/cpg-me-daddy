# Standing gates, fired before a commit exists rather than after a push (F1).
# Install with `lefthook install` (the root `prepare` script does this on `bun install`).

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: bunx oxlint {staged_files}

    - name: oxfmt
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,yml,yaml,css}"
      run: bunx oxfmt --check --no-error-on-unmatched-pattern {staged_files}

pre-push:
  parallel: false
  jobs:
    # All delegate to the root scripts rather than repeating their commands.
    # The unit-test job used to list the package paths itself, which silently
    # stopped covering a package the moment a fourth one was added.
    #
    # format check runs whole-repo here (not just {staged_files}, unlike
    # pre-commit's oxfmt job) because pre-commit can only ever see the files
    # in *this* push's diff — a file that was already mis-formatted when it
    # landed (oxfmt rules changed since, or a commit went in via --no-verify)
    # would pass every future pre-commit untouched and only surface in CI.
    # This is that same whole-repo check, just moved a step earlier.
    - name: format check
      run: bun run format:check

    - name: typecheck
      run: bun run typecheck

    - name: unit tests
      run: bun run test:unit

    - name: schema gate
      run: bun run test:schema
